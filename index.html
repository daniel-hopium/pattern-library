  };
  ul.addEventListener('click',e=>{
    const del=e.target.closest('[data-del]'),yes=e.target.closest('[data-yes]'),no=e.target.closest('[data-no]');
    if(del&&bad){const i=+del.dataset.del;del.parentElement.innerHTML=`<span class="du-ask">${tx('Wirklich?','Are you sure?')}</span><button type="button" class="btn btn-danger du-sm" data-yes="${i}">${tx('Ja','Yes')}</button><button type="button" class="btn btn-ghost du-sm" data-no>${tx('Nein','No')}</button>`;$('[data-yes]',ul).focus()}
    else if(del){const i=+del.dataset.del,[gone]=items.splice(i,1);draw();
      toast({msg:tx(`„${gone}“ gelöscht.`,`“${gone}” deleted.`),action:{label:tx('Rückgängig','Undo'),fn:()=>{items.splice(i,0,gone);draw()}}})}
    else if(yes){items.splice(+yes.dataset.yes,1);draw()}
    else if(no)draw();
  });
  draw();
}

const duLorem=()=>tx(['Bestellungen bis 14 Uhr verlassen unser Lager am selben Werktag.','Die Zustellung dauert innerhalb Österreichs ein bis zwei Werktage, nach Deutschland zwei bis drei.','Ab 50 Euro Bestellwert ist der Versand kostenlos, darunter kostet er 4,90 Euro.','Rücksendungen sind innerhalb von 30 Tagen kostenlos. Das Etikett liegt dem Paket bei.','Die Erstattung geht auf das ursprüngliche Zahlungsmittel, meist innerhalb von fünf Werktagen.','Bei Fragen erreichst du den Kundendienst werktags von 8 bis 18 Uhr.'],['Orders placed by 2 p.m. leave our warehouse the same business day.','Delivery within Austria takes one to two business days, to Germany two to three.','Shipping is free on orders of €50 or more; below that it costs €4.90.','Returns are free within 30 days. The return label is included in the package.','Refunds go back to the original payment method, usually within five business days.','If you have questions, our customer service team is available weekdays from 8 a.m. to 6 p.m.']).map(t=>`<p>${t}</p>`).join('');
/* Jedes Paar: bad/good sind HTML mit {p} als eindeutigem Präfix, init(el) macht sie lebendig */
const DUELS=[
{id:'radio-label',grp:0,topic:tx('Radio-Buttons','Radio buttons'),title:tx('Radio-Button: Der Text gehört zur Klickfläche','Radio button: the text belongs to the click area'),lesson:'forms',
 try:tx('Klick auf das Wort „Express“ statt auf den kleinen Kreis.','Click the word “Express” instead of the small circle.'),
 bad:`<fieldset class="du-fs"><legend>${tx('Versand','Shipping')}</legend><div class="du-plain"><input type="radio" name="{p}" checked><span>${tx('Standard, 3–5 Tage','Standard, 3–5 days')}</span></div><div class="du-plain"><input type="radio" name="{p}"><span>${tx('Express, morgen da','Express, arrives tomorrow')}</span></div></fieldset>`,
 good:`<fieldset class="du-fs"><legend>${tx('Versand','Shipping')}</legend><label class="du-choice"><input type="radio" name="{p}" checked>${tx('Standard, 3–5 Tage','Standard, 3–5 days')}</label><label class="du-choice"><input type="radio" name="{p}">${tx('Express, morgen da','Express, arrives tomorrow')}</label></fieldset>`,
 why:tx('Ein <code>&lt;label&gt;</code> macht den Text zur Klickfläche: Aus einem 14-px-Kreis wird eine ganze Zeile. Screenreader lesen den Text als Namen des Radios vor. Hover-Hintergrund und <code>cursor: pointer</code> zeigen, dass die ganze Zeile reagiert.','A <code>&lt;label&gt;</code> turns the text into click area: a 14 px circle becomes a whole row. Screen readers announce the text as the radio’s name. A hover background and <code>cursor: pointer</code> show that the whole row responds.')},
{id:'placeholder',grp:0,topic:tx('Eingabefelder','Input fields'),title:tx('Der Platzhalter ist kein Label','A placeholder is not a label'),lesson:'forms',
 try:tx('Tipp in beide Felder etwas ein. Weißt du danach noch, welches Feld welches war?','Type something into both fields. Do you still know which field was which?'),
 bad:`<div class="du-stack"><input class="input du-ph" placeholder="IBAN" aria-label="IBAN"><input class="input du-ph" placeholder="BIC" aria-label="BIC"></div>`,
 good:`<div class="du-stack"><div class="field"><label for="{p}-i">IBAN</label><input class="input" id="{p}-i" aria-describedby="{p}-h"><p class="hint" id="{p}-h">${tx('AT und 18 Ziffern, Leerzeichen egal','AT plus 18 digits, spaces don’t matter')}</p></div><div class="field"><label for="{p}-b">BIC <span class="opt">optional</span></label><input class="input" id="{p}-b"></div></div>`,
 why:tx('Der Platzhalter verschwindet mit dem ersten Buchstaben – genau dann, wenn man prüfen will, ob man im richtigen Feld ist. Meist ist er auch zu hell für 4,5 : 1 und wirkt, als wäre das Feld schon ausgefüllt.','The placeholder disappears with the first character – exactly when you want to check whether you’re in the right field. It’s usually too light for 4.5:1, too, and makes the field look already filled in.')},
{id:'validation',grp:0,topic:tx('Validierung','Validation'),title:tx('Fehler nicht beim ersten Tastendruck zeigen','Don’t show errors on the first keystroke'),lesson:'forms',
 try:tx('Tipp langsam eine E-Mail-Adresse ein und verlass dann das Feld mit Tab.','Slowly type an email address, then leave the field with Tab.'),
 bad:`<div class="field"><label for="{p}">${tx('E-Mail','Email')}</label><input class="input" id="{p}" type="email" autocomplete="off"><p class="du-red" hidden>${tx('Ungültige E-Mail-Adresse!','Invalid email address!')}</p></div>`,
 good:`<div class="field"><label for="{p}">${tx('E-Mail','Email')}</label><input class="input" id="{p}" type="email" autocomplete="off" aria-describedby="{p}-e"><p class="err" id="{p}-e" hidden></p></div>`,
 init:{bad(el){const i=$('input',el),e=$('.du-red',el);i.addEventListener('input',()=>{e.hidden=!i.value||duValid(i.value)})},
  good(el){const i=$('input',el),e=$('.err',el);
   const show=()=>{const v=i.value.trim();if(!v||duValid(v)){e.hidden=true;i.removeAttribute('aria-invalid');return}
     e.innerHTML=ic('alert')+(v.includes('@')?tx('Nach dem @ fehlt noch die Domain, etwa firma.at.','The domain after the @ is missing, e.g. company.com.'):tx('Es fehlt das @, etwa name@firma.at.','The @ is missing, e.g. name@company.com.'));e.hidden=false;i.setAttribute('aria-invalid','true')};
   i.addEventListener('blur',show);i.addEventListener('input',()=>{if(!e.hidden)show()})}},
 why:tx('„Früh loben, spät tadeln“: Fehler erst zeigen, wenn jemand das Feld verlässt – einen behobenen Fehler aber sofort wegnehmen. Wer beim ersten Buchstaben angemeckert wird, ist noch gar nicht fertig. Und die Meldung sagt, was fehlt.','“Praise early, scold late”: show an error only once someone leaves the field – but remove a fixed error right away. Anyone scolded at the first character isn’t even done typing yet. And the message says what’s missing.')},
{id:'few-options',grp:0,topic:tx('Auswahl','Selection'),title:tx('Zwei, drei Optionen nicht im Dropdown verstecken','Don’t hide two or three options in a dropdown'),lesson:'forms',
 try:tx('Wähl in beiden eine Zahlungsart und zähl die Klicks.','Pick a payment method in both and count the clicks.'),
 bad:`<div class="field"><label for="{p}">${tx('Zahlungsart','Payment method')}</label><select id="{p}"><option>${tx('Bitte wählen …','Please select …')}</option><option>${tx('Rechnung','Invoice')}</option><option>${tx('Kreditkarte','Credit card')}</option></select></div>`,
 good:`<fieldset class="seg"><legend>${tx('Zahlungsart','Payment method')}</legend><div class="seg-opts"><label><input type="radio" name="{p}">${tx('Rechnung','Invoice')}</label><label><input type="radio" name="{p}">${tx('Kreditkarte','Credit card')}</label></div></fieldset>`,
 why:tx('Ein Dropdown versteckt die Optionen hinter einem Klick und braucht einen zweiten zum Wählen. Bis etwa fünf Optionen sind sichtbare Radios oder ein Segmented Control schneller – und man sieht auf einen Blick, was es gibt.','A dropdown hides the options behind one click and needs a second one to choose. Up to about five options, visible radios or a segmented control are faster – and you see at a glance what’s available.')},
{id:'custom-checkbox',grp:0,topic:tx('Eigene Checkbox','Custom checkbox'),title:tx('Eigene Checkbox: das Input nie mit display: none verstecken','Custom checkbox: never hide the input with display: none'),lesson:'focus',
 try:tx('Spring mit Tab zu den Checkboxen und drück die Leertaste.','Tab to the checkboxes and press the space bar.'),
 bad:`<label class="du-cbx"><input type="checkbox" class="du-hide-bad"><span class="du-box" aria-hidden="true"></span>${tx('Newsletter abonnieren','Subscribe to newsletter')}</label>`,
 good:`<label class="du-cbx"><input type="checkbox" class="du-hide-good"><span class="du-box" aria-hidden="true"></span>${tx('Newsletter abonnieren','Subscribe to newsletter')}</label>`,
 why:tx('<code>display: none</code> nimmt das Input aus der Tab-Reihenfolge und aus dem Accessibility Tree – mit der Maus geht es, mit Tastatur und Screenreader nicht. Richtig: das Input nur optisch verstecken (oder <code>appearance: none</code> und selbst gestalten) und den Fokusring an die eigene Box hängen.','<code>display: none</code> removes the input from the tab order and from the accessibility tree – it works with a mouse, but not with a keyboard or screen reader. The right way: hide the input only visually (or use <code>appearance: none</code> and style it yourself) and attach the focus ring to your own box.')},
{id:'field-width',grp:0,topic:tx('Adressformular','Address form'),title:tx('Die Feldbreite verrät die erwartete Länge','Field width hints at the expected length'),lesson:'forms',
 try:tx('Nur hinschauen: Wo erkennst du schneller, was wohin gehört?','Just look: where can you tell faster what goes where?'),
 bad:`<div class="du-stack"><div class="field"><label for="{p}-1">${tx('Straße','Street')}</label><input class="input" id="{p}-1"></div><div class="field"><label for="{p}-2">${tx('Hausnummer','House number')}</label><input class="input" id="{p}-2"></div><div class="field"><label for="{p}-3">${tx('PLZ','ZIP code')}</label><input class="input" id="{p}-3"></div><div class="field"><label for="{p}-4">${tx('Ort','City')}</label><input class="input" id="{p}-4"></div></div>`,
 good:`<div class="du-stack"><div class="du-row2"><div class="field du-grow"><label for="{p}-1">${tx('Straße','Street')}</label><input class="input" id="{p}-1" autocomplete="address-line1"></div><div class="field du-w5"><label for="{p}-2">${tx('Nr.','No.')}</label><input class="input" id="{p}-2"></div></div><div class="du-row2"><div class="field du-w6"><label for="{p}-3">${tx('PLZ','ZIP')}</label><input class="input" id="{p}-3" inputmode="numeric" autocomplete="postal-code"></div><div class="field du-grow"><label for="{p}-4">${tx('Ort','City')}</label><input class="input" id="{p}-4" autocomplete="address-level2"></div></div></div>`,
 why:tx('Die Breite ist ein stiller Hinweis: Ein kurzes Feld sagt „hier kommt wenig hin“. Vier gleich breite Felder zwingen dazu, jedes Label zu lesen – und brauchen doppelt so viel Höhe. Aber nie so schmal, dass die Eingabe abgeschnitten wird.','Width is a silent hint: a short field says “only a little goes here.” Four fields of equal width force you to read every label – and take twice the height. But never make a field so narrow that the input gets cut off.')},

{id:'clickable-card',grp:1,topic:tx('Klickbare Karte','Clickable card'),title:tx('Was klickbar ist, sieht klickbar aus','What’s clickable looks clickable'),lesson:'buttons',
 try:tx('Fahr mit der Maus über beide Karten, klick drauf – oder spring mit Tab hin.','Hover over both cards, click them – or reach them with Tab.'),
 bad:`<div class="du-card-bad"><b>${tx('Projekt Alpha','Project Alpha')}</b><span>${tx('3 offene Aufgaben','3 open tasks')}</span></div>`,
 good:`<button type="button" class="du-card-good"><b>${tx('Projekt Alpha','Project Alpha')}</b><span>${tx('3 offene Aufgaben','3 open tasks')}</span></button>`,
 init:{bad(el){$('.du-card-bad',el).addEventListener('click',()=>toast({msg:tx('Projekt Alpha geöffnet – hättest du gewusst, dass das geht?','Project Alpha opened – would you have known that works?'),duration:3000}))},
  good(el){$('.du-card-good',el).addEventListener('click',()=>toast({msg:tx('Projekt Alpha geöffnet.','Project Alpha opened.'),duration:3000}))}},
 why:tx('Affordance heißt: Ein Element zeigt, was man damit tun kann. Hover-Zustand, Zeiger und Fokusring sind die Signale fürs Klicken. Die schlechte Karte reagiert zwar, verrät es aber nicht – und mit der Tastatur kommt man gar nicht hin.','Affordance means an element shows what you can do with it. Hover state, pointer and focus ring are the signals for clicking. The bad card does respond, but it doesn’t tell you – and you can’t reach it with the keyboard at all.'),
 note:tx('Streitfall <code>cursor: pointer</code>: Browser geben die Hand nur Links. Viele Design-Systeme setzen sie auch auf Buttons, native Apps von Apple und Microsoft nicht. Beides ist vertretbar. Falsch ist nur, wenn Klickbares gar kein Signal gibt – oder Nicht-Klickbares eine Hand zeigt.','The <code>cursor: pointer</code> debate: browsers show the hand only on links. Many design systems also put it on buttons; native apps from Apple and Microsoft don’t. Both are defensible. It’s only wrong when something clickable gives no signal at all – or something non-clickable shows a hand.')},
{id:'disabled-button',grp:1,topic:tx('Absende-Button','Submit button'),title:tx('Kein grauer Button ohne Grund','No grayed-out button without a reason'),lesson:'buttons',
 try:tx('Tipp „Al“ ein und versuch abzuschicken.','Type “Al” and try to submit.'),
 bad:`<div class="du-stack"><div class="field"><label for="{p}">${tx('Benutzername','Username')}</label><input class="input" id="{p}" autocomplete="off"></div><div><button type="button" class="btn du-dis" disabled>${tx('Registrieren','Sign up')}</button></div></div>`,
 good:`<div class="du-stack"><div class="field"><label for="{p}">${tx('Benutzername','Username')}</label><input class="input" id="{p}" autocomplete="off" aria-describedby="{p}-e"><p class="err" id="{p}-e" hidden></p></div><div><button type="button" class="btn btn-primary">${tx('Registrieren','Sign up')}</button></div></div>`,
 init:{bad(el){const i=$('input',el),b=$('button',el);i.addEventListener('input',()=>{b.disabled=i.value.trim().length<3})},
  good(el){const i=$('input',el),e=$('.err',el);
   $('button',el).addEventListener('click',()=>{const n=i.value.trim().length;
     if(n<3){e.innerHTML=ic('alert')+tx(`Mindestens 3 Zeichen – bisher ${n}.`,`At least 3 characters – so far ${n}.`);e.hidden=false;i.setAttribute('aria-invalid','true');i.focus()}
     else{e.hidden=true;i.removeAttribute('aria-invalid');toast({msg:tx('Registriert.','Signed up.'),type:'success',duration:2500})}});
   i.addEventListener('input',()=>{if(!e.hidden&&i.value.trim().length>=3){e.hidden=true;i.removeAttribute('aria-invalid')}})}},
 why:tx('Ein grauer Button sagt „geht nicht“, aber nicht warum. Aktiv lassen und beim Klick zeigen, was fehlt, führt direkt zur Lösung. Dazu kommt: <code>disabled</code> ist nicht fokussierbar, Screenreader-Nutzer finden ihn oft gar nicht, und das Grau hat selten genug Kontrast.','A grayed-out button says “not possible,” but not why. Keeping it active and showing what’s missing on click leads straight to the fix. On top of that, <code>disabled</code> isn’t focusable, screen reader users often don’t find it at all, and the gray rarely has enough contrast.')},
{id:'double-submit',grp:1,topic:tx('Bestell-Button','Order button'),title:tx('Ein Doppelklick bestellt doppelt','A double click orders twice'),lesson:'loading',
 try:tx('Doppelklick auf „Bestellen“.','Double-click “Place order”.'),
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Bestellen','Place order')}</button><span class="du-out" role="status"></span></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary du-keep"><span class="du-lbl">${tx('Bestellen','Place order')}</span><span class="du-spin" hidden></span></button><span class="du-out" role="status"></span></div>`,
 init:{bad(el){let n=0;const o=$('.du-out',el);$('button',el).addEventListener('click',()=>{n++;setTimeout(()=>{o.textContent=n===1?tx('1 Bestellung ausgelöst.','1 order placed.'):tx(`${n} Bestellungen ausgelöst – ${n}-mal abgebucht.`,`${n} orders placed – charged ${n} times.`)},700)})},
  good(el){let busy=false;const b=$('button',el),l=$('.du-lbl',el),s=$('.du-spin',el),o=$('.du-out',el);
   b.addEventListener('click',()=>{if(busy)return;busy=true;b.setAttribute('aria-disabled','true');l.style.visibility='hidden';s.hidden=false;o.textContent=tx('Wird bestellt …','Placing order …');
     setTimeout(()=>{l.style.visibility='';s.hidden=true;o.textContent=tx('Genau 1 Bestellung ausgelöst.','Exactly 1 order placed.');
       setTimeout(()=>{busy=false;b.removeAttribute('aria-disabled')},1500)},1200)})}},
 why:tx('Netzwerk dauert. Wer nichts sieht, klickt noch einmal. Den Button sofort in einen Ladezustand setzen und weitere Klicks ignorieren – und im Backend trotzdem mit einem Idempotency Key absichern, denn Nutzer finden immer einen Weg.','Networks take time. If nothing happens, people click again. Put the button into a loading state immediately and ignore further clicks – and still protect the backend with an idempotency key, because users always find a way.')},
{id:'loading-width',grp:1,topic:tx('Speichern-Button','Save button'),title:tx('Ladezustand ohne springende Breite','Loading state without jumping width'),lesson:'loading',
 try:tx('Klick auf „Speichern“ und schau, wo „Abbrechen“ danach steht.','Click “Save” and watch where “Cancel” ends up.'),
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button><button type="button" class="btn btn-secondary">${tx('Abbrechen','Cancel')}</button></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary du-keep"><span class="du-lbl">${tx('Speichern','Save')}</span><span class="du-spin" hidden></span></button><button type="button" class="btn btn-secondary">${tx('Abbrechen','Cancel')}</button><span class="sr-only" role="status"></span></div>`,
 init:{bad(el){const [b,c]=$$('button',el);b.addEventListener('click',()=>{b.textContent=tx('Wird gespeichert, bitte warten …','Saving, please wait …');setTimeout(()=>{b.textContent=tx('Speichern','Save')},1600)});
   c.addEventListener('click',()=>toast({msg:tx('Abgebrochen – deine Änderung ist weg.','Canceled – your change is gone.'),type:'error',duration:3000}))},
  good(el){const [b,c]=$$('button',el),l=$('.du-lbl',el),s=$('.du-spin',el),st=$('[role=status]',el);
   b.addEventListener('click',()=>{if(b.getAttribute('aria-busy'))return;b.setAttribute('aria-busy','true');l.style.visibility='hidden';s.hidden=false;st.textContent=tx('Wird gespeichert','Saving');
     setTimeout(()=>{b.removeAttribute('aria-busy');l.style.visibility='';s.hidden=true;st.textContent=tx('Gespeichert','Saved')},1600)});
   c.addEventListener('click',()=>toast({msg:tx('Abgebrochen.','Canceled.'),duration:2500}))}},
 why:tx('Ändert sich die Breite, springt alles daneben – und der nächste Klick landet womöglich auf „Abbrechen“. Breite halten, Spinner in den Button, den Status für Screenreader separat ansagen.','If the width changes, everything next to it jumps – and the next click may land on “Cancel.” Keep the width, put the spinner inside the button, and announce the status to screen readers separately.')},
{id:'icon-hit',grp:1,topic:tx('Chip entfernen','Remove chip'),title:tx('Kleines Icon, große Klickfläche','Small icon, large hit area'),lesson:'touch-targets',
 try:tx('Entferne alle Städte über das ×. Am besten am Handy oder mit dem Touchpad.','Remove all cities using the ×. Ideally on your phone or with a touchpad.'),
 bad:`<div class="du-chips"></div>`,
 good:`<div class="du-chips"></div>`,
 init:{bad(el){duChips(el,false)},good(el){duChips(el,true)}},
 why:tx('Das Icon darf klein sein, die Klickfläche nicht. Padding vergrößert das Ziel, ohne die Optik zu ändern. WCAG 2.5.8 verlangt mindestens 24 × 24 px, bequem sind 44.','The icon may be small, the hit area may not. Padding enlarges the target without changing the look. WCAG 2.5.8 requires at least 24 × 24 px; 44 is comfortable.')},
{id:'button-labels',grp:1,topic:tx('Bestätigungsdialog','Confirmation dialog'),title:tx('Buttons sagen, was passiert','Buttons say what happens'),lesson:'buttons',
 try:tx('Lies nur die Buttons, nicht den Text darüber. Was passiert bei „Abbrechen“?','Read only the buttons, not the text above them. What does “Cancel” do?'),
 bad:`<div class="du-dlg"><p><b>${tx('Möchtest du wirklich abbrechen?','Do you really want to cancel?')}</b> ${tx('Nicht gespeicherte Änderungen gehen verloren.','Unsaved changes will be lost.')}</p><div class="btn-row du-end"><button type="button" class="btn btn-secondary">${tx('Abbrechen','Cancel')}</button><button type="button" class="btn btn-primary">OK</button></div></div>`,
 good:`<div class="du-dlg"><p><b>${tx('Änderungen verwerfen?','Discard changes?')}</b> ${tx('Drei Felder sind noch nicht gespeichert.','Three fields haven’t been saved yet.')}</p><div class="btn-row du-end"><button type="button" class="btn btn-secondary">${tx('Weiter bearbeiten','Keep editing')}</button><button type="button" class="btn btn-danger">${tx('Verwerfen','Discard')}</button></div></div>`,
 why:tx('„OK / Abbrechen“ zwingt dazu, die Frage zu lesen – und „Abbrechen“ kann hier beides heißen: den Dialog oder die Bearbeitung. Verben, die das Ergebnis beschreiben, versteht man auch beim Überfliegen.','“OK / Cancel” forces you to read the question – and “Cancel” can mean both things here: the dialog or the editing. Verbs that describe the outcome are understood even when skimming.')},

{id:'silent-save',grp:2,topic:tx('Speichern','Saving'),title:tx('Kein Klick ohne Rückmeldung','No click without feedback'),lesson:'toast',
 try:tx('Klick in beiden auf „Speichern“. Hat es geklappt?','Click “Save” in both. Did it work?'),
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button><span class="du-ok" role="status"></span></div>`,
 init:{good(el){const s=$('.du-ok',el);$('button',el).addEventListener('click',()=>{s.innerHTML=`${ic('check')} ${tx('Gespeichert um','Saved at')} ${duTime()}`})}},
 why:tx('Ohne Rückmeldung weiß niemand, ob es geklappt hat – also wird noch einmal geklickt oder die Seite neu geladen. Die Bestätigung gehört dorthin, wo man gerade hinschaut: direkt neben den Button.','Without feedback, nobody knows whether it worked – so they click again or reload the page. The confirmation belongs where people are looking: right next to the button.')},
{id:'confirm-undo',grp:2,topic:tx('Löschen','Deleting'),title:tx('Rückgängig schlägt Nachfrage','Undo beats confirmation'),lesson:'toast',
 try:tx('Lösch in beiden drei Einträge hintereinander.','Delete three items in a row in both.'),
 bad:`<ul class="du-rows"></ul>`,
 good:`<ul class="du-rows"></ul>`,
 init:{bad(el){duList(el,tx(['Einkaufsliste','Urlaubsfotos','Steuer 2025','Alte Notizen'],['Shopping list','Vacation photos','Taxes 2025','Old notes']),true)},good(el){duList(el,tx(['Einkaufsliste','Urlaubsfotos','Steuer 2025','Alte Notizen'],['Shopping list','Vacation photos','Taxes 2025','Old notes']),false)}},
 why:tx('Wer zehnmal „Wirklich?“ gefragt wird, klickt irgendwann blind auf „Ja“ – die Nachfrage schützt dann nicht mehr. Sofort löschen und ein paar Sekunden „Rückgängig“ anbieten ist schneller und sicherer. Nachfragen nur, wenn es wirklich endgültig ist.','Asked “Are you sure?” ten times, people eventually click “Yes” blindly – and the confirmation no longer protects anything. Deleting immediately and offering “Undo” for a few seconds is faster and safer. Only ask when it’s truly permanent.')},
{id:'error-place',grp:2,topic:tx('Formularfehler','Form errors'),title:tx('Fehler dort zeigen, wo sie sind','Show errors where they are'),lesson:'forms',
 try:tx('Schick beide Formulare leer ab.','Submit both forms empty.'),
 bad:`<form class="du-stack" novalidate><p class="du-banner" hidden>${tx('Das Formular enthält Fehler.','The form contains errors.')}</p><div class="field"><label for="{p}-a">${tx('Vorname','First name')}</label><input class="input" id="{p}-a"></div><div class="field"><label for="{p}-b">${tx('Telefon','Phone')}</label><input class="input" id="{p}-b"></div><div><button class="btn btn-primary">${tx('Absenden','Submit')}</button></div></form>`,
 good:`<form class="du-stack" novalidate><div class="field"><label for="{p}-a">${tx('Vorname','First name')}</label><input class="input" id="{p}-a" aria-describedby="{p}-ae" autocomplete="given-name"><p class="err" id="{p}-ae" hidden></p></div><div class="field"><label for="{p}-b">${tx('Telefon','Phone')}</label><input class="input" id="{p}-b" aria-describedby="{p}-be" type="tel" autocomplete="tel"><p class="err" id="{p}-be" hidden></p></div><div><button class="btn btn-primary">${tx('Absenden','Submit')}</button></div></form>`,
 init:{bad(el){const f=$('form',el);f.addEventListener('submit',e=>{e.preventDefault();$('.du-banner',el).hidden=$$('input',el).every(i=>i.value.trim())})},
  good(el){const f=$('form',el),msg=tx(['Bitte deinen Vornamen eingeben.','Bitte eine Telefonnummer eingeben, etwa 0664 123 45 67.'],['Please enter your first name.','Please enter a phone number, e.g. (555) 123-4567.']);
   f.addEventListener('submit',e=>{e.preventDefault();let first=null;
     $$('input',el).forEach((i,k)=>{const er=$('#'+i.getAttribute('aria-describedby'),el),bad=!i.value.trim();er.hidden=!bad;er.innerHTML=bad?ic('alert')+msg[k]:'';
       if(bad){i.setAttribute('aria-invalid','true');first??=i}else i.removeAttribute('aria-invalid')});
     if(first)first.focus();else toast({msg:tx('Abgeschickt.','Submitted.'),type:'success',duration:2500})})}},
 why:tx('Ein Banner oben sagt nur „irgendwo ist was falsch“ – suchen muss man selbst, und mit Screenreader findet man es kaum. Die Meldung gehört ans Feld, mit <code>aria-invalid</code> verknüpft, und der Fokus springt zum ersten Fehler.','A banner at the top only says “something is wrong somewhere” – you have to search yourself, and with a screen reader you’ll hardly find it. The message belongs at the field, linked with <code>aria-invalid</code>, and focus jumps to the first error.')},
{id:'hover-only',grp:2,topic:tx('Zeilen-Aktionen','Row actions'),title:tx('Aktionen nicht nur beim Hover zeigen','Don’t show actions only on hover'),lesson:'gestures',
 try:tx('Wie löschst du eine Zeile? Probier es dann nur mit Tab – oder am Handy.','How do you delete a row? Then try it with Tab only – or on your phone.'),
 bad:`<ul class="du-rows du-hov-bad"><li><span>${tx('Rechnung März','March invoice')}</span><button type="button" class="icon-btn" aria-label="${tx('Rechnung März löschen','Delete March invoice')}">${ic('trash')}</button></li><li><span>${tx('Rechnung April','April invoice')}</span><button type="button" class="icon-btn" aria-label="${tx('Rechnung April löschen','Delete April invoice')}">${ic('trash')}</button></li></ul>`,
 good:`<ul class="du-rows du-hov-good"><li><span>${tx('Rechnung März','March invoice')}</span><button type="button" class="icon-btn" aria-label="${tx('Rechnung März löschen','Delete March invoice')}">${ic('trash')}</button></li><li><span>${tx('Rechnung April','April invoice')}</span><button type="button" class="icon-btn" aria-label="${tx('Rechnung April löschen','Delete April invoice')}">${ic('trash')}</button></li></ul>`,
 init:{bad(el){el.addEventListener('click',e=>{if(e.target.closest('button'))toast({msg:tx('Gelöscht (Demo).','Deleted (demo).'),duration:2000})})},good(el){el.addEventListener('click',e=>{if(e.target.closest('button'))toast({msg:tx('Gelöscht (Demo).','Deleted (demo).'),duration:2000})})}},
 why:tx('Touch kennt kein Hover, die Tastatur auch nicht. Was nur beim Drüberfahren erscheint, gibt es für viele gar nicht – links fokussierst du mit Tab einen unsichtbaren Button. Mindestens <code>:focus-within</code> mitnehmen und bei <code>@media (hover: none)</code> immer zeigen.','Touch has no hover, and neither does the keyboard. What only appears on mouseover doesn’t exist for many people – on the left, Tab focuses an invisible button. At least include <code>:focus-within</code>, and always show the actions under <code>@media (hover: none)</code>.')},
{id:'destructive',grp:2,topic:tx('Speichern & Löschen','Save & delete'),title:tx('Löschen gehört nicht direkt neben Speichern','Delete doesn’t belong right next to Save'),lesson:'buttons',
 try:tx('Klick schnell den zweiten Button, ohne genau hinzusehen.','Quickly click the second button without looking closely.'),
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button><button type="button" class="btn btn-primary">${tx('Löschen','Delete')}</button></div>`,
 good:`<div class="du-split"><button type="button" class="btn btn-ghost du-danger">${tx('Projekt löschen …','Delete project …')}</button><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button></div>`,
 init:{bad(el){const [s,d]=$$('button',el);s.addEventListener('click',()=>toast({msg:tx('Gespeichert.','Saved.'),type:'success',duration:2000}));d.addEventListener('click',()=>toast({msg:tx('Projekt gelöscht. Ups.','Project deleted. Oops.'),type:'error',duration:3000}))},
  good(el){const [d,s]=$$('button',el);s.addEventListener('click',()=>toast({msg:tx('Gespeichert.','Saved.'),type:'success',duration:2000}));d.addEventListener('click',()=>toast({msg:tx('Hier käme jetzt eine Bestätigung – Löschen ist endgültig.','A confirmation would appear here now – deleting is permanent.'),duration:3000}))}},
 why:tx('Gleich aussehende Buttons nebeneinander werden verwechselt, besonders unter Zeitdruck. Die gefährliche Aktion bekommt eine andere Optik, Abstand und – wenn sie endgültig ist – eine Bestätigung. Die Auslassungspunkte im Text kündigen an, dass noch ein Schritt folgt.','Identical-looking buttons side by side get mixed up, especially under time pressure. The dangerous action gets a different look, some distance and – if it’s permanent – a confirmation. The ellipsis in the label signals that another step follows.')},
{id:'layout-shift',grp:2,topic:tx('Nachladender Inhalt','Late-loading content'),title:tx('Inhalt springt nicht unter dem Finger weg','Content doesn’t jump away under your finger'),lesson:'performance',
 try:tx('Klick auf „Artikel lesen“, sobald du ihn siehst. Mit „Nochmal“ startet es neu.','Click “Read article” as soon as you see it. “Replay” starts it over.'),
 bad:`<div class="du-feed"><div class="du-slot"></div><p class="du-lead">${tx('Neue Studie: Warum wir Buttons verfehlen.','New study: why we miss buttons.')}</p><button type="button" class="btn btn-secondary du-read">${tx('Artikel lesen','Read article')}</button></div><button type="button" class="linkbtn du-replay">${tx('Nochmal','Replay')}</button>`,
 good:`<div class="du-feed"><div class="du-slot du-slot-fix"><span class="hint">${tx('Anzeige wird geladen …','Loading ad …')}</span></div><p class="du-lead">${tx('Neue Studie: Warum wir Buttons verfehlen.','New study: why we miss buttons.')}</p><button type="button" class="btn btn-secondary du-read">${tx('Artikel lesen','Read article')}</button></div><button type="button" class="linkbtn du-replay">${tx('Nochmal','Replay')}</button>`,
 init:{bad(el){duShift(el)},good(el){duShift(el)}},
 why:tx('Lädt etwas über dem Inhalt nach, rutscht alles nach unten – der Klick trifft, was jetzt dort liegt. Das misst Google als Cumulative Layout Shift. Lösung: den Platz vorher reservieren, mit fester Höhe oder <code>aspect-ratio</code>.','If something loads in above the content, everything slides down – and the click hits whatever is there now. Google measures this as Cumulative Layout Shift. The fix: reserve the space in advance, with a fixed height or <code>aspect-ratio</code>.')},

{id:'line-length',grp:3,topic:tx('Fließtext','Body text'),title:tx('Zeilenlänge: 45 bis 75 Zeichen','Line length: 45 to 75 characters'),lesson:'typography',wide:true,
 try:tx('Lies beide Absätze. Bei welchem findest du leichter in die nächste Zeile?','Read both paragraphs. In which one is it easier to find the next line?'),
 bad:`<p class="du-long">${tx('Das Auge springt am Zeilenende zurück an den Anfang der nächsten Zeile. Ist die Zeile zu lang, verfehlt es sie und liest dieselbe Zeile noch einmal oder überspringt eine. Ist sie zu kurz, zerhackt sie den Satz und das Auge springt ständig. Seit dem Buchdruck gelten deshalb 45 bis 75 Zeichen pro Zeile als angenehm.','At the end of a line, the eye jumps back to the start of the next one. If the line is too long, it misses it and reads the same line again or skips one. If it’s too short, it chops up the sentence and the eye jumps constantly. That’s why, ever since the printing press, 45 to 75 characters per line have been considered comfortable.')}</p>`,
 good:`<p class="du-measure">${tx('Das Auge springt am Zeilenende zurück an den Anfang der nächsten Zeile. Ist die Zeile zu lang, verfehlt es sie und liest dieselbe Zeile noch einmal oder überspringt eine. Ist sie zu kurz, zerhackt sie den Satz und das Auge springt ständig. Seit dem Buchdruck gelten deshalb 45 bis 75 Zeichen pro Zeile als angenehm.','At the end of a line, the eye jumps back to the start of the next one. If the line is too long, it misses it and reads the same line again or skips one. If it’s too short, it chops up the sentence and the eye jumps constantly. That’s why, ever since the printing press, 45 to 75 characters per line have been considered comfortable.')}</p>`,
 why:tx('Im Web begrenzt <code>max-width: 65ch</code> die Zeile auf rund 65 Zeichen der aktuellen Schrift – egal wie breit der Bildschirm ist. Dazu eine Zeilenhöhe von etwa 1,5.','On the web, <code>max-width: 65ch</code> limits the line to about 65 characters of the current font – no matter how wide the screen is. Add a line height of about 1.5.')},
{id:'centered',grp:3,topic:tx('Textausrichtung','Text alignment'),title:tx('Lange Texte nicht zentrieren','Don’t center long text'),lesson:'typography',
 try:tx('Lies beide Absätze bis zum Ende.','Read both paragraphs to the end.'),
 bad:`<p class="du-center">${tx('Zentrierter Fließtext hat links und rechts einen unruhigen Rand. Das Auge findet den Anfang der nächsten Zeile nicht an derselben Stelle wieder, sondern muss ihn jedes Mal neu suchen.','Centered body text has a ragged edge on both the left and the right. The eye doesn’t find the start of the next line in the same place, but has to search for it every time.')}</p>`,
 good:`<p>${tx('Linksbündiger Text hat eine feste Kante, an der jede Zeile beginnt. Das Auge springt immer an dieselbe Stelle zurück. Zentrieren ist für eine kurze Überschrift in Ordnung, für Absätze nicht.','Left-aligned text has a fixed edge where every line starts. The eye always jumps back to the same spot. Centering is fine for a short heading, but not for paragraphs.')}</p>`,
 why:tx('Leserichtung braucht einen festen Startpunkt. Bei zentriertem Text beginnt jede Zeile woanders, das bremst ab der zweiten Zeile spürbar – bei Legasthenie noch mehr.','Reading needs a fixed starting point. With centered text, every line starts somewhere else, which noticeably slows you down from the second line on – even more so with dyslexia.')},
{id:'text-image',grp:3,topic:tx('Text auf Bild','Text on image'),title:tx('Text auf einem Bild braucht einen Schleier','Text on an image needs a scrim'),lesson:'contrast',
 try:tx('Kannst du Titel und Uhrzeit in beiden sofort lesen?','Can you read the title and time in both right away?'),
 bad:`<div class="du-img"><div class="du-img-txt"><b>${tx('Wanderung am Dachstein','Hike on the Dachstein')}</b><span>${tx('Samstag, 9 Uhr','Saturday, 9 a.m.')}</span></div></div>`,
 good:`<div class="du-img du-scrim"><div class="du-img-txt"><b>${tx('Wanderung am Dachstein','Hike on the Dachstein')}</b><span>${tx('Samstag, 9 Uhr','Saturday, 9 a.m.')}</span></div></div>`,
 why:tx('Ein Foto hat helle und dunkle Stellen – weißer Text ist irgendwo immer unlesbar, und der Kontrast ändert sich mit jedem Bild. Ein dunkler Verlauf hinter dem Text macht ihn unabhängig vom Motiv lesbar.','A photo has light and dark areas – white text is always unreadable somewhere, and the contrast changes with every image. A dark gradient behind the text makes it readable regardless of the subject.')},
{id:'all-caps',grp:3,topic:tx('Hinweistext','Notice text'),title:tx('Großbuchstaben nur für Kurzes','All caps only for short text'),lesson:'typography',
 try:tx('Lies beide Hinweise. Welcher ist schneller erfasst?','Read both notices. Which one do you take in faster?'),
 bad:`<p class="du-caps">${tx('WICHTIG: BITTE BRINGEN SIE ZUM TERMIN IHRE E-CARD, EINEN LICHTBILDAUSWEIS UND ALLE VORBEFUNDE DER LETZTEN ZWEI JAHRE MIT.','IMPORTANT: PLEASE BRING YOUR INSURANCE CARD, A PHOTO ID AND ALL MEDICAL RECORDS FROM THE LAST TWO YEARS TO YOUR APPOINTMENT.')}</p>`,
 good:`<p class="eyebrow" style="margin:0 0 4px">${tx('Wichtig','Important')}</p><p style="margin:0">${tx('Bitte bringen Sie zum Termin Ihre E-Card, einen Lichtbildausweis und alle Vorbefunde der letzten zwei Jahre mit.','Please bring your insurance card, a photo ID and all medical records from the last two years to your appointment.')}</p>`,
 why:tx('Wir lesen Wortbilder: Ober- und Unterlängen geben jedem Wort eine Form. In Großbuchstaben sind alle Wörter gleich hohe Blöcke, das Lesen wird langsamer – und es wirkt wie Schreien. Versalien für kurze Labels, und dann per <code>text-transform</code>, nicht im Quelltext.','We read word shapes: ascenders and descenders give every word a form. In all caps, every word is a block of the same height, reading slows down – and it feels like shouting. Use capitals for short labels, and then via <code>text-transform</code>, not in the source text.')},
{id:'truncation',grp:3,topic:tx('Dateiliste','File list'),title:tx('Nicht abschneiden, bis alles gleich aussieht','Don’t truncate until everything looks the same'),lesson:'tables',
 try:tx('Finde die Rechnung vom März.','Find the March invoice.'),
 bad:`<ul class="du-files du-trunc"><li>${tx('Rechnung_2026_Kunde_Maier_Jänner.pdf','Invoice_2026_Customer_Maier_January.pdf')}</li><li>${tx('Rechnung_2026_Kunde_Maier_Februar.pdf','Invoice_2026_Customer_Maier_February.pdf')}</li><li>${tx('Rechnung_2026_Kunde_Maier_März.pdf','Invoice_2026_Customer_Maier_March.pdf')}</li></ul>`,
 good:`<ul class="du-files"><li><span aria-hidden="true">${tx('Rechnung_2026_…_Jänner.pdf','Invoice_2026_…_January.pdf')}</span><span class="sr-only">${tx('Rechnung_2026_Kunde_Maier_Jänner.pdf','Invoice_2026_Customer_Maier_January.pdf')}</span></li><li><span aria-hidden="true">${tx('Rechnung_2026_…_Februar.pdf','Invoice_2026_…_February.pdf')}</span><span class="sr-only">${tx('Rechnung_2026_Kunde_Maier_Februar.pdf','Invoice_2026_Customer_Maier_February.pdf')}</span></li><li><span aria-hidden="true">${tx('Rechnung_2026_…_März.pdf','Invoice_2026_…_March.pdf')}</span><span class="sr-only">${tx('Rechnung_2026_Kunde_Maier_März.pdf','Invoice_2026_Customer_Maier_March.pdf')}</span></li></ul>`,
 why:tx('Bei Dateinamen, Pfaden und IDs steckt der Unterschied oft am Ende. Abschneiden am Ende macht sie ununterscheidbar. Besser umbrechen – oder in der Mitte kürzen und den vollen Namen für Screenreader und im Tooltip behalten.','With file names, paths and IDs, the difference is often at the end. Truncating at the end makes them indistinguishable. Better to wrap – or shorten in the middle and keep the full name for screen readers and in the tooltip.')},
{id:'icon-only',grp:3,topic:tx('Werkzeugleiste','Toolbar'),title:tx('Icons brauchen Text','Icons need text'),lesson:'navigation',
 try:tx('Was macht das zweite und das dritte Symbol?','What do the second and third icons do?'),
 bad:`<div class="du-tools">${['star','tag','copy','file','more'].map((n,i)=>`<button type="button" class="icon-btn" aria-label="${tx(['Favorit','Etikett','Duplizieren','Exportieren','Mehr'],['Favorite','Label','Duplicate','Export','More'])[i]}">${ic(n)}</button>`).join('')}</div>`,
 good:`<div class="du-tools">${['star','tag','copy','file','more'].map((n,i)=>`<button type="button" class="du-tool">${ic(n)}<span>${tx(['Favorit','Etikett','Duplizieren','Exportieren','Mehr'],['Favorite','Label','Duplicate','Export','More'])[i]}</span></button>`).join('')}</div>`,
 why:tx('Nur wenige Icons sind wirklich eindeutig: Suche, Schließen, vielleicht Drucken. Alles andere ist ein Ratespiel („Mystery Meat Navigation“). Ein kurzes Label darunter kostet etwas Platz und spart jedes Rätseln – und Sprachsteuerung braucht einen sichtbaren Namen.','Only a few icons are truly unambiguous: search, close, maybe print. Everything else is a guessing game (“mystery meat navigation”). A short label underneath costs a little space and saves all the guessing – and voice control needs a visible name.')},
/* Formulare */
{id:'password-toggle',grp:0,topic:tx('Passwortfeld','Password field'),title:tx('Passwort anzeigen lassen','Let people show the password'),lesson:'forms',
 try:tx('Tipp ein Passwort mit Sonderzeichen. Bist du sicher, dass es stimmt?','Type a password with special characters. Are you sure it’s right?'),
 bad:`<div class="field"><label for="{p}">${tx('Passwort','Password')}</label><input class="input" id="{p}" type="password" autocomplete="new-password"></div>`,
 good:`<div class="field"><label for="{p}">${tx('Passwort','Password')}</label><div class="du-pw"><input class="input" id="{p}" type="password" autocomplete="new-password"><button type="button" class="btn btn-secondary du-sm" aria-pressed="false" aria-controls="{p}">${tx('Anzeigen','Show')}</button></div></div>`,
 init:{good(el){const i=$('input',el),b=$('button',el);b.addEventListener('click',()=>{const on=i.type==='password';i.type=on?'text':'password';b.setAttribute('aria-pressed',String(on))})}},
 why:tx('Im Punktefeld sieht niemand seine Tippfehler – am Handy erst recht. Ein „Anzeigen“-Knopf spart Fehlversuche und macht das zweite Feld „Passwort wiederholen“ überflüssig.','In a field full of dots, nobody sees their typos – especially on a phone. A “Show” button saves failed attempts and makes a second “Repeat password” field unnecessary.')},
{id:'required-mark',grp:0,topic:tx('Pflichtfelder','Required fields'),title:tx('Sagen, was Pflicht ist – bevor jemand absendet','Say what’s required – before anyone submits'),lesson:'forms',
 try:tx('Füll nur den Namen aus und schick ab.','Fill in only the name and submit.'),
 bad:`<form class="du-stack" novalidate><p class="du-banner" hidden>${tx('Bitte alle Pflichtfelder ausfüllen.','Please fill in all required fields.')}</p><div class="field"><label for="{p}-a">Name</label><input class="input" id="{p}-a"></div><div class="field"><label for="{p}-b">${tx('E-Mail','Email')}</label><input class="input" id="{p}-b" type="email"></div><div class="field"><label for="{p}-c">${tx('Firma','Company')}</label><input class="input" id="{p}-c"></div><div><button class="btn btn-primary">${tx('Absenden','Submit')}</button></div></form>`,
 good:`<form class="du-stack" novalidate><p class="hint">${tx('Alle Felder sind Pflicht, außer sie sind als optional markiert.','All fields are required unless marked optional.')}</p><div class="field"><label for="{p}-a">Name</label><input class="input" id="{p}-a" aria-describedby="{p}-ae"><p class="err" id="{p}-ae" hidden></p></div><div class="field"><label for="{p}-b">${tx('E-Mail','Email')}</label><input class="input" id="{p}-b" type="email" aria-describedby="{p}-be"><p class="err" id="{p}-be" hidden></p></div><div class="field"><label for="{p}-c">${tx('Firma','Company')} <span class="opt">optional</span></label><input class="input" id="{p}-c"></div><div><button class="btn btn-primary">${tx('Absenden','Submit')}</button></div></form>`,
 init:{bad(el){$('form',el).addEventListener('submit',e=>{e.preventDefault();const ok=$$('input',el).every(i=>i.value.trim());$('.du-banner',el).hidden=ok;if(ok)toast({msg:tx('Abgeschickt.','Submitted.'),type:'success',duration:2500})})},
  good(el){duFieldErrors(el,tx(['Bitte deinen Namen eingeben.','Bitte eine E-Mail-Adresse eingeben, etwa name@firma.at.'],['Please enter your name.','Please enter an email address, e.g. name@company.com.']))}},
 why:tx('Wer nicht weiß, was Pflicht ist, füllt vorsichtshalber alles aus – oder erfährt es erst beim Absenden. Sind die meisten Felder Pflicht, markiert man die Ausnahmen mit „optional“: kürzer und eindeutiger als ein Sternchen, das erst erklärt werden muss.','If you don’t know what’s required, you fill in everything just in case – or find out only when you submit. If most fields are required, mark the exceptions as “optional”: shorter and clearer than an asterisk that has to be explained first.')},
{id:'date-input',grp:0,topic:tx('Geburtsdatum','Date of birth'),title:tx('Bekannte Daten tippen, nicht durch Listen scrollen','Type known dates, don’t scroll through lists'),lesson:'forms',
 try:tx('Gib den 27. März 1990 ein.','Enter March 27, 1990.'),
 bad:`<fieldset class="du-fs"><legend>${tx('Geburtsdatum','Date of birth')}</legend><div class="du-row2"><select aria-label="${tx('Tag','Day')}">${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select><select aria-label="${tx('Monat','Month')}">${tx(['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],['January','February','March','April','May','June','July','August','September','October','November','December']).map(m=>`<option>${m}</option>`).join('')}</select><select aria-label="${tx('Jahr','Year')}">${Array.from({length:127},(_,i)=>`<option>${2026-i}</option>`).join('')}</select></div></fieldset>`,
 good:`<fieldset class="du-fs"><legend>${tx('Geburtsdatum','Date of birth')}</legend><p class="hint" id="{p}-h" style="margin-bottom:8px">${tx('Zum Beispiel 27 3 1990','For example 27 3 1990')}</p><div class="du-row2"><div class="field du-w4"><label for="{p}-d">${tx('Tag','Day')}</label><input class="input" id="{p}-d" inputmode="numeric" autocomplete="bday-day" aria-describedby="{p}-h"></div><div class="field du-w4"><label for="{p}-m">${tx('Monat','Month')}</label><input class="input" id="{p}-m" inputmode="numeric" autocomplete="bday-month"></div><div class="field du-w6"><label for="{p}-y">${tx('Jahr','Year')}</label><input class="input" id="{p}-y" inputmode="numeric" autocomplete="bday-year"></div></div></fieldset>`,
 why:tx('Das eigene Geburtsdatum kennt man auswendig und tippt es in Sekunden – im Jahres-Dropdown scrollt man durch über hundert Einträge. Drei kurze Felder mit Beispiel sind am schnellsten. Für Termine in naher Zukunft ist dagegen ein Kalender gut.','You know your own birth date by heart and type it in seconds – in the year dropdown you scroll through more than a hundred entries. Three short fields with an example are fastest. For appointments in the near future, on the other hand, a calendar works well.')},
{id:'iban-split',grp:0,topic:tx('IBAN-Eingabe','IBAN input'),title:tx('Ein Feld statt Kästchen, die von selbst weiterspringen','One field instead of boxes that auto-advance'),lesson:'forms',
 try:tx('Kopier diese IBAN und füg sie in beide Varianten ein: AT61 1904 3002 3457 3201','Copy this IBAN and paste it into both versions: AT61 1904 3002 3457 3201'),
 bad:`<fieldset class="du-fs"><legend>IBAN</legend><div class="du-iban">${[1,2,3,4,5].map(n=>`<input class="input" maxlength="4" aria-label="${tx('IBAN Block','IBAN block')} ${n}" autocomplete="off">`).join('')}</div></fieldset>`,
 good:`<div class="field"><label for="{p}">IBAN</label><input class="input" id="{p}" autocomplete="off" spellcheck="false" aria-describedby="{p}-h"><p class="hint" id="{p}-h">${tx('Leerzeichen sind egal.','Spaces don’t matter.')}</p></div>`,
 init:{bad(el){const is=$$('input',el);is.forEach((inp,k)=>inp.addEventListener('input',()=>{if(inp.value.length>=4&&is[k+1])is[k+1].focus()}))},
  good(el){const i=$('input',el);i.addEventListener('blur',()=>{i.value=i.value.replace(/\s+/g,'').toUpperCase().replace(/(.{4})/g,'$1 ').trim()})}},
 why:tx('Aufgeteilte Kästchen brechen Einfügen und Autofill: Hier landen nur die ersten vier Zeichen. Wer sich vertippt und korrigiert, springt ungewollt weiter. Ein einziges Feld, das Leerzeichen erlaubt und danach sauber formatiert, ist robuster.','Split boxes break pasting and autofill: only the first four characters land here. If you mistype and correct it, you jump ahead unintentionally. A single field that allows spaces and formats cleanly afterward is more robust.')},
{id:'number-type',grp:0,topic:tx('Postleitzahl','ZIP code'),title:tx('type="number" nur für Mengen','type="number" only for quantities'),lesson:'forms',
 try:tx('Tipp 01067 ein und drück dann die Pfeiltaste nach oben.','Type 02134, then press the up arrow key.'),
 bad:`<div class="field"><label for="{p}">${tx('PLZ (Deutschland)','ZIP code (US)')}</label><input class="input input-short" id="{p}" type="number"></div><p class="du-out" role="status"></p>`,
 good:`<div class="field"><label for="{p}">${tx('PLZ (Deutschland)','ZIP code (US)')}</label><input class="input input-short" id="{p}" type="text" inputmode="numeric" autocomplete="postal-code"></div><p class="du-out" role="status"></p>`,
 init:{bad(el){const i=$('input',el),o=$('.du-out',el);i.addEventListener('input',()=>{o.textContent=i.value?`${tx('Gespeichert wird:','Value saved:')} ${i.valueAsNumber}`:''})},
  good(el){const i=$('input',el),o=$('.du-out',el);i.addEventListener('input',()=>{o.textContent=i.value?`${tx('Gespeichert wird:','Value saved:')} ${i.value}`:''})}},
 why:tx('<code>type="number"</code> ist für Mengen gedacht, nicht für Ziffernfolgen: Pfeiltasten und Mausrad verändern den Wert, führende Nullen verschwinden. Für PLZ, Kartennummern und Codes: <code>type="text"</code> mit <code>inputmode="numeric"</code> – die Zifferntastatur am Handy gibt es trotzdem.','<code>type="number"</code> is meant for quantities, not digit strings: arrow keys and the mouse wheel change the value, and leading zeros disappear. For ZIP codes, card numbers and codes, use <code>type="text"</code> with <code>inputmode="numeric"</code> – you still get the number pad on phones.')},
/* Buttons & Klicks */
{id:'primary-count',grp:1,topic:tx('Aktionsleiste','Action bar'),title:tx('Nur ein Primary Button pro Bereich','Only one primary button per area'),lesson:'buttons',
 try:tx('Welche Aktion ist die wichtigste? Entscheide in einer Sekunde.','Which action is the most important? Decide in one second.'),
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Vorschau','Preview')}</button><button type="button" class="btn btn-primary">${tx('Duplizieren','Duplicate')}</button><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button><button type="button" class="btn btn-primary">${tx('Teilen','Share')}</button></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button><button type="button" class="btn btn-secondary">${tx('Vorschau','Preview')}</button><button type="button" class="btn btn-ghost">${tx('Duplizieren','Duplicate')}</button><button type="button" class="btn btn-ghost">${tx('Teilen','Share')}</button></div>`,
 why:tx('Wenn alles laut ist, ist nichts wichtig. Ein Primary Button zeigt den Hauptweg, der Rest tritt als Secondary oder Ghost zurück und bleibt trotzdem erreichbar.','When everything is loud, nothing is important. One primary button shows the main path; the rest step back as secondary or ghost buttons and stay reachable anyway.')},
{id:'toggle-state',grp:1,topic:tx('Umschalter','Toggle'),title:tx('Ein Schalter zeigt seinen Zustand eindeutig','A switch shows its state clearly'),lesson:'buttons',
 try:tx('Klick beide zweimal. Ist die Einstellung jetzt an oder aus?','Click both twice. Is the setting on or off now?'),
 bad:`<button type="button" class="du-tog-bad">${tx('Benachrichtigungen','Notifications')}</button>`,
 good:`<button type="button" class="switch" role="switch" aria-checked="false"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('Benachrichtigungen','Notifications')}</span><span class="du-state" aria-hidden="true">${tx('Aus','Off')}</span></button>`,
 init:{bad(el){const b=$('button',el);b.addEventListener('click',()=>b.classList.toggle('on'))},
  good(el){const b=$('button',el);b.addEventListener('toggle',e=>{$('.du-state',el).textContent=e.detail?tx('An','On'):tx('Aus','Off')})}},
 why:tx('Ein Button, der nur leicht die Farbe wechselt, lässt offen: Zeigt er den Zustand oder das, was beim Klick passiert? Ein Switch mit „An/Aus“ und <code>role="switch"</code> macht den Zustand für Augen und Screenreader eindeutig.','A button that only slightly changes color leaves it open: does it show the state or what happens on click? A switch with “On/Off” and <code>role="switch"</code> makes the state clear to eyes and screen readers alike.')},
{id:'context-only',grp:1,topic:tx('Datei-Aktionen','File actions'),title:tx('Aktionen nicht nur im Rechtsklick verstecken','Don’t hide actions in the right-click menu only'),lesson:'gestures',
 try:tx('Lösche „Notizen.txt“. Wie kommst du an die Aktion?','Delete “Notes.txt”. How do you get to the action?'),
 bad:`<ul class="du-rows du-ctx-list">${tx(['Notizen.txt','Budget.xlsx'],['Notes.txt','Budget.xlsx']).map(n=>`<li><span>${n}</span><span class="du-ctx" hidden><button type="button" class="btn btn-danger du-sm">${tx('Löschen','Delete')}</button></span></li>`).join('')}</ul>`,
 good:`<ul class="du-rows du-ctx-list">${tx(['Notizen.txt','Budget.xlsx'],['Notes.txt','Budget.xlsx']).map(n=>`<li><span>${n}</span><span class="du-li-act"><span class="du-ctx" hidden><button type="button" class="btn btn-danger du-sm">${tx('Löschen','Delete')}</button></span><button type="button" class="icon-btn du-kebab" aria-expanded="false" aria-label="${tx('Aktionen für','Actions for')} ${n}">${ic('more')}</button></span></li>`).join('')}</ul>`,
 init:{bad(el){el.addEventListener('contextmenu',e=>{const li=e.target.closest('li');if(!li)return;e.preventDefault();$('.du-ctx',li).hidden=false});
   el.addEventListener('click',e=>{if(e.target.closest('.btn-danger')){e.target.closest('li').remove();toast({msg:tx('Gelöscht – aber nur, wer den Rechtsklick kannte.','Deleted – but only if you knew about the right-click.'),duration:3000})}})},
  good(el){el.addEventListener('click',e=>{const m=e.target.closest('.du-kebab');if(m){const c=$('.du-ctx',m.parentElement),open=c.hidden;c.hidden=!open;m.setAttribute('aria-expanded',String(open));if(open)$('button',c).focus();return}
   if(e.target.closest('.btn-danger')){e.target.closest('li').remove();toast({msg:tx('Gelöscht.','Deleted.'),duration:2500})}})}},
 why:tx('Rechtsklick und langes Drücken sind unsichtbar: Niemand weiß, dass es dort etwas gibt, und per Tastatur oder Screenreader kommt man gar nicht hin. Ein sichtbarer „Mehr“-Button öffnet dasselbe Menü für alle – ein Kontextmenü darf zusätzlich bleiben.','Right-click and long press are invisible: nobody knows there’s something there, and with a keyboard or screen reader you can’t reach it at all. A visible “More” button opens the same menu for everyone – a context menu can stay as an extra.')},
{id:'default-focus',grp:1,topic:tx('Löschdialog','Delete dialog'),title:tx('Im Löschdialog liegt der Fokus auf der sicheren Option','In a delete dialog, focus sits on the safe option'),lesson:'dialog',
 try:tx('Öffne den Dialog und drück sofort Enter.','Open the dialog and press Enter right away.'),
 bad:`<div class="du-dlgwrap"><button type="button" class="btn btn-secondary du-open">${tx('Datei löschen …','Delete file …')}</button></div>`,
 good:`<div class="du-dlgwrap"><button type="button" class="btn btn-secondary du-open">${tx('Datei löschen …','Delete file …')}</button></div>`,
 init:{bad(el){duDlg(el,false)},good(el){duDlg(el,true)}},
 why:tx('Der Fokus im Dialog bestimmt, was Enter auslöst. Wer schnell bestätigt, löscht sonst aus Versehen. Bei zerstörerischen Aktionen gehört der Fokus auf „Abbrechen“ oder auf den Dialog selbst – und die gefährliche Taste sieht auch gefährlich aus.','Focus in the dialog determines what Enter triggers. Otherwise, anyone confirming quickly deletes by accident. For destructive actions, focus belongs on “Cancel” or on the dialog itself – and the dangerous button looks dangerous, too.')},
/* Feedback */
{id:'progress-steps',grp:2,topic:tx('Lange Wartezeit','Long wait'),title:tx('Lange Vorgänge zeigen Fortschritt statt Spinner','Long tasks show progress, not a spinner'),lesson:'loading',
 try:tx('Starte in beiden den Export und warte.','Start the export in both and wait.'),
 bad:`<div class="du-stack"><div><button type="button" class="btn btn-primary">${tx('Export starten','Start export')}</button></div><p class="du-out" role="status"></p></div>`,
 good:`<div class="du-stack"><div class="btn-row"><button type="button" class="btn btn-primary">${tx('Export starten','Start export')}</button><button type="button" class="btn btn-ghost du-cancel" hidden>${tx('Abbrechen','Cancel')}</button></div><div class="bar" role="progressbar" aria-label="Export" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div><p class="du-out" role="status"></p></div>`,
 init:{bad(el){const o=$('.du-out',el);$('button',el).addEventListener('click',()=>{o.innerHTML=tx('<span class="du-spin du-spin-inline"></span> Bitte warten …','<span class="du-spin du-spin-inline"></span> Please wait…');setTimeout(()=>{o.textContent=tx('Fertig.','Done.')},6000)})},
  good(el){duProgress(el)}},
 why:tx('Ab etwa zehn Sekunden reicht ein Spinner nicht mehr: Man weiß nicht, ob es hängt. Ein Fortschrittsbalken mit benannten Schritten zeigt, dass etwas passiert und wie lange es noch dauert – und „Abbrechen“ gibt die Kontrolle zurück.','After about ten seconds a spinner is no longer enough: you can’t tell whether it’s stuck. A progress bar with named steps shows that something is happening and how long it will take – and “Cancel” gives control back.')},
{id:'error-tone',grp:2,topic:tx('Fehlermeldung','Error message'),title:tx('Fehlermeldungen sagen, was jetzt zu tun ist','Error messages say what to do next'),lesson:'errors-offline',
 try:tx('Stell dir vor, das passiert dir. Weißt du, was du jetzt tun sollst?','Imagine this happens to you. Do you know what to do now?'),
 bad:`<div class="du-errbox"><b>Error 0x80070057</b><p>Invalid operation. Upload failed (code 413).</p><button type="button" class="btn btn-secondary du-sm">OK</button></div>`,
 good:`<div class="du-errbox"><b>${ic('alert')} ${tx('Die Datei ist zu groß','The file is too large')}</b><p>${tx('„Urlaub.mov“ hat 240 MB, erlaubt sind 100 MB. Kürze das Video oder teile es als Link.','“Vacation.mov” is 240 MB, the limit is 100 MB. Trim the video or share it as a link.')}</p><div class="btn-row"><button type="button" class="btn btn-primary du-sm">${tx('Andere Datei wählen','Choose another file')}</button><button type="button" class="btn btn-ghost du-sm">${tx('Wie kürze ich ein Video?','How do I trim a video?')}</button></div><p class="du-code">Code 413</p></div>`,
 why:tx('Eine gute Fehlermeldung sagt, was passiert ist, warum – und was man jetzt tun kann, in der Sprache der Nutzer. Fehlercodes helfen dem Support, nicht dem Nutzer; sie dürfen klein darunter stehen.','A good error message says what happened, why – and what you can do now, in the user’s language. Error codes help support, not the user; they can sit in small print below.')},
{id:'optimistic',grp:2,topic:tx('Merken-Button','Save button'),title:tx('Sofort reagieren, im Hintergrund speichern','React instantly, save in the background'),lesson:'performance',
 try:tx('Klick auf „Merken“ – und gleich noch einmal, wenn nichts passiert.','Click “Save” – and click again right away if nothing happens.'),
 bad:`<button type="button" class="btn btn-secondary du-like" aria-pressed="false">${ic('heart')}<span>${tx('Merken','Save')}</span></button>`,
 good:`<button type="button" class="btn btn-secondary du-like" aria-pressed="false">${ic('heart')}<span>${tx('Merken','Save')}</span></button>`,
 init:{bad(el){const b=$('button',el);b.addEventListener('click',()=>{setTimeout(()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));$('span',b).textContent=on?tx('Gemerkt','Saved'):tx('Merken','Save')},1500)})},
  good(el){const b=$('button',el);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));$('span',b).textContent=on?tx('Gemerkt','Saved'):tx('Merken','Save')})}},
 why:tx('Bei Aktionen, die fast immer klappen, zeigt man das Ergebnis sofort und speichert im Hintergrund – „Optimistic UI“. Schlägt es doch fehl, wird zurückgesetzt und ein Hinweis gezeigt. Wer auf den Server wartet, klickt noch einmal und macht die Aktion wieder rückgängig.','For actions that almost always succeed, show the result immediately and save in the background – “optimistic UI”. If it does fail, roll back and show a notice. If you wait for the server, people click again and undo the action.')},
{id:'empty-state',grp:2,topic:tx('Leere Liste','Empty list'),title:tx('Ein leerer Zustand zeigt den ersten Schritt','An empty state shows the first step'),lesson:'empty-states',
 try:tx('Du bist neu in der App. Was machst du jetzt?','You’re new to the app. What do you do now?'),
 bad:`<p class="du-empty-bad">${tx('Keine Daten.','No data.')}</p>`,
 good:`<div class="du-empty">${ic('inbox')}<p class="le-title">${tx('Noch keine Projekte','No projects yet')}</p><p class="hint">${tx('Ein Projekt sammelt Aufgaben und Dateien an einem Ort.','A project keeps tasks and files in one place.')}</p><button type="button" class="btn btn-primary du-sm">${tx('Erstes Projekt anlegen','Create your first project')}</button></div>`,
 init:{good(el){$('button',el).addEventListener('click',()=>toast({msg:tx('Projekt angelegt.','Project created.'),type:'success',duration:2500}))}},
 why:tx('Ein leerer Zustand ist oft der erste Eindruck. „Keine Daten“ lässt offen, ob etwas kaputt ist. Besser: erklären, was hier erscheinen wird, und den ersten Schritt gleich anbieten.','An empty state is often the first impression. “No data” leaves open whether something is broken. Better: explain what will appear here and offer the first step right away.')},
/* Text & Layout */
{id:'contrast-low',grp:3,topic:tx('Grauer Text','Gray text'),title:tx('Hellgrau ist keine Textfarbe','Light gray is not a text color'),lesson:'contrast',
 try:tx('Lies beide Absätze – und stell dir vor, du sitzt in der Sonne.','Read both paragraphs – and imagine you’re sitting in the sun.'),
 bad:`<div class="du-paper" style="color:#B0B0B0"><b>${tx('Lieferung','Delivery')}</b><p>${tx('Voraussichtlich Mittwoch, 12. März. Kostenlose Rücksendung innerhalb von 30 Tagen.','Expected Wednesday, March 12. Free returns within 30 days.')}</p></div>`,
 good:`<div class="du-paper" style="color:#595959"><b style="color:#1B1B1B">${tx('Lieferung','Delivery')}</b><p>${tx('Voraussichtlich Mittwoch, 12. März. Kostenlose Rücksendung innerhalb von 30 Tagen.','Expected Wednesday, March 12. Free returns within 30 days.')}</p></div>`,
 why:tx('Hellgrau wirkt elegant, ist aber für viele unlesbar – bei Sonnenlicht, auf billigen Displays, mit nachlassender Sehkraft. Text braucht mindestens 4,5 : 1. <code>#B0B0B0</code> auf Weiß schafft nur etwa 2,2 : 1, <code>#595959</code> rund 7 : 1.','Light gray looks elegant but is unreadable for many people – in sunlight, on cheap displays, with declining eyesight. Text needs at least 4.5:1. <code>#B0B0B0</code> on white only reaches about 2.2:1, <code>#595959</code> around 7:1.')},
{id:'numbers-align',grp:3,topic:tx('Zahlenspalte','Number column'),title:tx('Zahlen rechtsbündig und mit Tabellenziffern','Numbers right-aligned with tabular figures'),lesson:'tables',
 try:tx('Welcher Betrag ist der größte? Wie schnell findest du ihn?','Which amount is the largest? How fast do you find it?'),
 bad:`<table class="du-num du-num-bad"><caption class="sr-only">${tx('Ausgaben','Expenses')}</caption><tbody>${tx('<tr><td>Miete</td><td>1.234,50 €</td></tr><tr><td>Strom</td><td>89,00 €</td></tr><tr><td>Urlaub</td><td>12.450,00 €</td></tr><tr><td>Streaming</td><td>5,99 €</td></tr>','<tr><td>Rent</td><td>€1,234.50</td></tr><tr><td>Electricity</td><td>€89.00</td></tr><tr><td>Vacation</td><td>€12,450.00</td></tr><tr><td>Streaming</td><td>€5.99</td></tr>')}</tbody></table>`,
 good:`<table class="du-num"><caption class="sr-only">${tx('Ausgaben','Expenses')}</caption><tbody>${tx('<tr><td>Miete</td><td>1.234,50 €</td></tr><tr><td>Strom</td><td>89,00 €</td></tr><tr><td>Urlaub</td><td>12.450,00 €</td></tr><tr><td>Streaming</td><td>5,99 €</td></tr>','<tr><td>Rent</td><td>€1,234.50</td></tr><tr><td>Electricity</td><td>€89.00</td></tr><tr><td>Vacation</td><td>€12,450.00</td></tr><tr><td>Streaming</td><td>€5.99</td></tr>')}</tbody></table>`,
 why:tx('Zahlen vergleicht man Stelle für Stelle. Rechtsbündig und mit Tabellenziffern (<code>font-variant-numeric: tabular-nums</code>) stehen Einer unter Einern – der größte Betrag springt ins Auge, ohne dass man liest.','You compare numbers digit by digit. Right-aligned and with tabular figures (<code>font-variant-numeric: tabular-nums</code>), ones sit under ones – the largest amount jumps out without you having to read.')},
{id:'hierarchy',grp:3,topic:tx('Produktkarte','Product card'),title:tx('Visuelle Hierarchie: das Wichtige zuerst','Visual hierarchy: what matters comes first'),lesson:'typography',
 try:tx('Was kostet der Schuh? Wie lange hast du gesucht?','How much is the boot? How long did you have to look?'),
 bad:`<div class="du-prod du-prod-bad"><p>${tx('Wanderschuh Alpin','Alpin Hiking Boot')}</p><p>${tx('Wasserdicht, Größen 36 bis 47, Vibram-Sohle','Waterproof, EU sizes 36 to 47, Vibram sole')}</p><p>${tx('149,00 €','€149.00')}</p><p><button type="button" class="linkbtn">${tx('In den Warenkorb','Add to cart')}</button></p></div>`,
 good:`<div class="du-prod"><p class="du-prod-t">${tx('Wanderschuh Alpin','Alpin Hiking Boot')}</p><p class="du-prod-d">${tx('Wasserdicht, Größen 36 bis 47, Vibram-Sohle','Waterproof, EU sizes 36 to 47, Vibram sole')}</p><p class="du-prod-p">${tx('149,00 €','€149.00')}</p><button type="button" class="btn btn-primary du-sm">${tx('In den Warenkorb','Add to cart')}</button></div>`,
 why:tx('Ohne Hierarchie muss man alles lesen, um das Wichtige zu finden. Größe, Gewicht und Farbe ordnen die Karte: Was ist es, was kostet es, was kann ich tun – in einer Sekunde erfasst.','Without hierarchy you have to read everything to find what matters. Size, weight and color organize the card: what is it, what does it cost, what can I do – grasped in a second.')},
{id:'proximity',grp:3,topic:tx('Formularabstände','Form spacing'),title:tx('Was zusammengehört, steht zusammen','What belongs together stays together'),lesson:'spacing',
 try:tx('Zu welchem Feld gehört „Telefon“ – ohne nachzudenken?','Which field does “Phone” belong to – without thinking?'),
 bad:`<div class="du-prox-bad"><label for="{p}-1">Name</label><input class="input" id="{p}-1"><label for="{p}-2">${tx('Telefon','Phone')}</label><input class="input" id="{p}-2"><label for="{p}-3">${tx('E-Mail','Email')}</label><input class="input" id="{p}-3"></div>`,
 good:`<div class="du-stack du-prox-good"><div class="field"><label for="{p}-1">Name</label><input class="input" id="{p}-1"></div><div class="field"><label for="{p}-2">${tx('Telefon','Phone')}</label><input class="input" id="{p}-2"></div><div class="field"><label for="{p}-3">${tx('E-Mail','Email')}</label><input class="input" id="{p}-3"></div></div>`,
 why:tx('Was nah beieinandersteht, gehört zusammen – das Gesetz der Nähe. Steht ein Label gleich weit von zwei Feldern entfernt, muss man raten. Kleiner Abstand innerhalb der Gruppe, großer zwischen den Gruppen.','What sits close together belongs together – the law of proximity. If a label is equally far from two fields, you have to guess. Small spacing within a group, large spacing between groups.')},
/* Navigation & Inhalte */
{id:'active-nav',grp:4,topic:tx('Tab-Leiste','Tab bar'),title:tx('Der aktive Tab ist unübersehbar','The active tab is impossible to miss'),lesson:'navigation',
 try:tx('Klick auf „Rechnungen“, schau kurz weg und sag dann, welcher Tab aktiv ist.','Click “Invoices”, look away for a moment, then say which tab is active.'),
 bad:`<div class="du-tabs du-tabs-bad">${tx(['Übersicht','Rechnungen','Einstellungen'],['Overview','Invoices','Settings']).map((t,i)=>`<button type="button"${i?'':' class="on"'}>${t}</button>`).join('')}</div><p class="du-panel">${tx('Inhalt: Übersicht','Content: Overview')}</p>`,
 good:`<div class="du-tabs du-tabs-good" role="tablist" aria-label="${tx('Bereiche','Sections')}">${tx(['Übersicht','Rechnungen','Einstellungen'],['Overview','Invoices','Settings']).map((t,i)=>`<button type="button" role="tab" id="{p}-t${i}" aria-controls="{p}-panel" aria-selected="${i?'false':'true'}" tabindex="${i?'-1':'0'}">${t}</button>`).join('')}</div><p class="du-panel" id="{p}-panel" role="tabpanel" aria-labelledby="{p}-t0">${tx('Inhalt: Übersicht','Content: Overview')}</p>`,
 init:{bad(el){el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('button',el).forEach(x=>x.classList.toggle('on',x===b));$('.du-panel',el).textContent=tx('Inhalt: ','Content: ')+b.textContent})},
  good(el){duTabs(el)}},
 why:tx('Man muss jederzeit sehen, wo man ist. Der aktive Tab braucht ein deutliches Signal – Farbe, Unterstrich und Gewicht zusammen, nicht nur ein Hauch Farbe – und für Screenreader <code>aria-selected</code>. Pfeiltasten wechseln zwischen den Tabs.','You always need to see where you are. The active tab needs a clear signal – color, underline and weight together, not just a hint of color – and <code>aria-selected</code> for screen readers. Arrow keys switch between tabs.')},
{id:'new-tab',grp:4,topic:tx('Externer Link','External link'),title:tx('Neue Tabs ankündigen – oder vermeiden','Announce new tabs – or avoid them'),lesson:'navigation',
 try:tx('Klick auf beide Links. Hättest du gewusst, was passiert?','Click both links. Would you have known what happens?'),
 bad:`<p style="margin:0">${tx('Mehr dazu in unserer <a href="https://example.org" target="_blank">Hilfe</a>.','More on this in our <a href="https://example.org" target="_blank">help</a>.')}</p>`,
 good:`<p style="margin:0">${tx('Mehr dazu im <a href="https://example.org" target="_blank">Hilfe-Center <span class="du-ext">(neuer Tab)</span></a>.','More on this in the <a href="https://example.org" target="_blank">Help Center <span class="du-ext">(new tab)</span></a>.')}</p>`,
 init:{bad(el){$('a',el).addEventListener('click',()=>toast({msg:tx('Unangekündigt neuer Tab – der Zurück-Button führt jetzt ins Leere.','Unannounced new tab – the Back button now leads nowhere.'),duration:3500}))},
  good(el){$('a',el).addEventListener('click',()=>toast({msg:tx('Neuer Tab – aber du wusstest es vorher.','New tab – but you knew beforehand.'),duration:3000}))}},
 why:tx('Ein unerwarteter neuer Tab bricht den Zurück-Button und verwirrt besonders am Handy und mit Screenreader. Am besten gar nicht in neuem Tab öffnen – und wenn doch, vorher im Linktext sagen.','An unexpected new tab breaks the Back button and is especially confusing on phones and with a screen reader. Best not to open a new tab at all – and if you do, say so in the link text beforehand.')},
{id:'accordion-header',grp:4,topic:'Accordion',title:tx('Die ganze Kopfzeile klappt auf, nicht nur der Pfeil','The whole header expands, not just the arrow'),lesson:'touch-targets',
 try:tx('Klapp „Wie kündige ich?“ auf – klick dabei auf den Text.','Expand “How do I cancel?” – by clicking the text.'),

 good:`<div class="du-stack" style="gap:6px">${tx(['Wie kündige ich?','Kann ich pausieren?'],['How do I cancel?','Can I pause?']).map(q=>`<details class="acc"><summary>${q}</summary><p class="du-acc-b">${tx('Unter Konto → Abo, jederzeit zum Monatsende.','Under Account → Subscription, anytime, effective at the end of the month.')}</p></details>`).join('')}</div>`,

{id:'carousel',grp:4,topic:tx('Karussell','Carousel'),title:tx('Karussells wechseln nicht von selbst','Carousels don’t advance on their own'),lesson:'motion',

 good:`<div class="du-car"><p class="du-slide" aria-live="polite"></p><div class="btn-row du-car-ctl"><button type="button" class="icon-btn du-prev" aria-label="${tx('Vorige Folie','Previous slide')}">${ic('back')}</button><span class="du-car-n"></span><button type="button" class="icon-btn du-next" aria-label="${tx('Nächste Folie','Next slide')}">${ic('fwd')}</button></div></div>`,

 why:tx('Automatisch wechselnde Karussells nehmen einem den Text weg, bevor man fertig ist – ohne Pause-Knopf verletzen sie <a href="#wcag-kriterien/2.2.2">WCAG 2.2.2</a>. Und kaum jemand sieht Folie 3: Wichtiges gehört nicht dorthin.','Auto-advancing carousels take the text away before you’re done – without a pause button they violate <a href="#wcag-kriterien/2.2.2">WCAG 2.2.2</a>. And hardly anyone sees slide 3: nothing important belongs there.')},
{id:'no-results',grp:4,topic:tx('Suche ohne Treffer','Search with no results'),title:tx('Keine Sackgasse bei null Treffern','No dead end at zero results'),lesson:'search-filter',

{id:'link-text',grp:4,topic:tx('Linktexte','Link text'),title:tx('Linktexte sagen, wohin es geht','Link text says where it leads'),lesson:'navigation',
 try:tx('Überflieg nur die Links. Wohin führen sie?','Skim only the links. Where do they lead?'),

 why:tx('Screenreader-Nutzer springen oft von Link zu Link oder lassen sich eine Linkliste geben – dreimal „hier“ sagt dann nichts. Auch beim Überfliegen landet der Blick zuerst auf Links. Der Linktext selbst soll sagen, wohin es geht (<a href="#wcag-kriterien/2.4.4">WCAG 2.4.4</a>).','Screen reader users often jump from link to link or pull up a list of links – three times “here” tells them nothing. When skimming, the eye lands on links first, too. The link text itself should say where it leads (<a href="#wcag-kriterien/2.4.4">WCAG 2.4.4</a>).')},
