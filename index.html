      const up=()=>{grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);sheet.style.transition='';sheet.style.transform='';if(dy>80)sheet.close()};
      grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
    });
    return()=>{document.removeEventListener('keydown',onKey);detail.removeEventListener('scroll',onScroll);if(isOpen())pop.hidePopover();$$('dialog[open]',root).forEach(d=>d.close())};
  },
  do:[`Das natives <code>popover</code>-Attribut für Menüs und kleine Auswahlen – Top Layer, Klick daneben und Esc schließen gratis.`,`Tooltips nur als Ergänzung: Alles Wichtige muss auch ohne Hover sichtbar sein.`,`Jedes Overlay mit Esc schließbar, Fokus danach zurück zum Auslöser.`],
  dont:[`Wichtige Infos nur im Tooltip – auf dem Handy unsichtbar.`,`Ein Popover, das ein Popover öffnet, das einen Dialog öffnet.`,`Drawer für die Hauptnavigation am Desktop, obwohl genug Platz da ist.`],
  why:`<p>Jedes Overlay verdeckt etwas. Je mehr es verdeckt und blockiert, desto höher die Kosten: Kontext geht verloren, der Arbeitsfluss bricht ab. Deshalb gilt: das schwächste Overlay, das den Zweck erfüllt.</p><p>Tooltips haben eigene Regeln (WCAG 1.4.13): Man muss sie mit Esc schließen können, ohne die Maus zu bewegen, man muss mit der Maus auf sie fahren können, und sie dürfen nicht von selbst verschwinden. Auf Touch-Geräten gibt es kein Hover – was nur im Tooltip steht, sieht dort niemand.</p><p>Das <code>popover</code>-Attribut in HTML bringt Popovers ohne Bibliothek: Top Layer, Klick daneben schließt, Esc schließt.</p>`,
  here:`Die App nutzt Toasts (blockieren nichts) und genau einen Modal-Dialog. Auf dem Handy hätte die Lektionsliste ein Drawer sein können – sie ist stattdessen eine eigene Ansicht, weil sie die Hauptnavigation ist und nicht versteckt werden soll.`
},
{
  id:'gestures',cat:'Bedienung',title:'Gesten & Mobile',
  short:'Jede Geste ist eine Abkürzung – nie der einzige Weg.',
  keys:'wischen swipe drag drop ziehen sortieren touch pointer geste mobil handy pull to refresh',
  refs:['WCAG 2.5.1 · A','WCAG 2.5.2 · A','WCAG 2.5.7 · AA'],
  rule:`Wischen, Ziehen und Mehrfinger-Gesten sind Abkürzungen für Geübte. Für jede gibt es eine <strong>sichtbare Alternative mit einfachem Tippen</strong>.`,
  numbers:[['1 Finger · 1 Tipp','muss für alles reichen (2.5.1)'],['Ziehen','braucht eine Alternative ohne Ziehen (2.5.7)'],['beim Loslassen','auslösen, nicht beim Drücken (2.5.2)'],['≥ 44 px','Griff-Fläche für Drag Handles']],
  demo:`
  <div>
    <h3>Wischen zum Löschen – mit Alternative</h3>
    <ul class="sw-list" id="sw-list"></ul>
    <p class="demo-note">Wisch eine Zeile nach links (mit der Maus: ziehen). Oder tipp auf ⋯ – das Ergebnis ist dasselbe, ganz ohne Geste.</p>
  </div>
  <div>
    <h3>Sortieren per Ziehen – oder per Knopf</h3>
    <ol class="dr-list" id="dr-list"></ol>
    <p class="demo-note">Zieh am Griff links oder nimm die Pfeile. Die Pfeile sind die Alternative, die WCAG 2.5.7 verlangt.</p>
  </div>
  <div>
    <h3>Auslösen beim Drücken oder beim Loslassen?</h3>
    <div class="btn-row"><button type="button" class="btn btn-secondary" id="pd-bad">Löst beim Drücken aus</button><button type="button" class="btn btn-secondary" id="pd-good">Löst beim Loslassen aus</button></div>
    <p class="demo-note" id="pd-log" aria-live="polite">Drück einen Button, halte die Maustaste und zieh dann weg, bevor du loslässt.</p>
  </div>`,
  init(root){
    const START=['Newsletter Oktober','Rechnung 2026-114','Einladung Team-Event','Paket ist unterwegs'];
    let items=[...START],open=-1;const list=$('#sw-list',root);
    const render=()=>{
      list.innerHTML=items.length?items.map((t,i)=>`<li class="sw-item${i===open?' open':''}"><div class="sw-actions"${i===open?'':' inert'}><button type="button" class="btn btn-danger sw-del" data-i="${i}">Löschen</button></div><div class="sw-row" data-i="${i}"><span>${esc(t)}</span><button type="button" class="icon-btn sw-more" data-i="${i}" aria-expanded="${i===open}" aria-label="Aktionen für „${esc(t)}“">${ic('more')}</button></div></li>`).join('')
        :`<li class="file-empty"><p><b>Posteingang leer.</b></p><button type="button" class="btn btn-ghost" id="sw-restore">Beispiele wiederherstellen</button></li>`;
    };
    render();
    list.addEventListener('click',e=>{
      if(e.target.closest('#sw-restore')){items=[...START];open=-1;render();$('.sw-more',list).focus();return}
      const m=e.target.closest('.sw-more');
      if(m){const i=+m.dataset.i;open=open===i?-1:i;render();$(open===i?`.sw-del[data-i="${i}"]`:`.sw-more[data-i="${i}"]`,list).focus();return}
      const d=e.target.closest('.sw-del');
      if(d){
        const i=+d.dataset.i,t=items.splice(i,1)[0];open=-1;render();
        (list.querySelectorAll('.sw-more')[Math.min(i,items.length-1)]||$('#sw-restore',list))?.focus();
        toast({msg:`„${t}“ gelöscht.`,action:{label:'Rückgängig',fn:()=>{items.splice(Math.min(i,items.length),0,t);render()}}});
      }
    });
    list.addEventListener('pointerdown',e=>{
      const row=e.target.closest('.sw-row');if(!row||e.target.closest('button'))return;
      const i=+row.dataset.i,base=i===open?-112:0,x0=e.clientX;let dx=0;
      row.setPointerCapture(e.pointerId);row.style.transition='none';
      const mv=ev=>{dx=ev.clientX-x0;row.style.transform=`translateX(${Math.max(-160,Math.min(0,base+dx))}px)`};
      const up=()=>{
        row.removeEventListener('pointermove',mv);row.removeEventListener('pointerup',up);row.removeEventListener('pointercancel',up);
        if(Math.abs(dx)<6){if(open===i)open=-1}else open=base+dx<-56?i:-1;
        render();
      };
      row.addEventListener('pointermove',mv);row.addEventListener('pointerup',up);row.addEventListener('pointercancel',up);
    });

    let order=['Aufwärmen','Kniebeugen','Liegestütze','Plank','Dehnen'];const dl=$('#dr-list',root);let dragCleanup=null;
    const renderD=()=>{dl.innerHTML=order.map((t,i)=>`<li class="dr-item" data-i="${i}"><span class="dr-grip" aria-hidden="true">${ic('grip')}</span><span class="dr-pos">${i+1}</span><span class="dr-name">${t}</span><button type="button" class="icon-btn" data-mv="-1" data-i="${i}" aria-label="„${t}“ nach oben" ${i===0?'disabled':''}>${ic('up')}</button><button type="button" class="icon-btn" data-mv="1" data-i="${i}" aria-label="„${t}“ nach unten" ${i===order.length-1?'disabled':''}>${ic('down')}</button></li>`).join('')};
    renderD();
    dl.addEventListener('click',e=>{
      const b=e.target.closest('[data-mv]');if(!b)return;
      const i=+b.dataset.i,d=+b.dataset.mv,j=i+d;[order[i],order[j]]=[order[j],order[i]];
      renderD();const same=$(`[data-i="${j}"][data-mv="${d}"]`,dl);
      (same&&!same.disabled?same:$(`[data-i="${j}"][data-mv="${-d}"]`,dl)).focus();
      announce(`${order[j]} ist jetzt an Position ${j+1} von ${order.length}.`);
    });
    dl.addEventListener('pointerdown',e=>{
      const g=e.target.closest('.dr-grip');if(!g)return;e.preventDefault();
      const li=g.closest('.dr-item');li.classList.add('dragging');
      const mv=ev=>{let before=null;for(const o of dl.children){if(o===li)continue;const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=o;break}}dl.insertBefore(li,before)};
      const up=()=>{dragCleanup();const t=order[+li.dataset.i];order=[...dl.children].map(x=>order[+x.dataset.i]);renderD();announce(`${t} ist jetzt an Position ${order.indexOf(t)+1} von ${order.length}.`)};
      dragCleanup=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);dragCleanup=null};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });

    const log=$('#pd-log',root),bad=$('#pd-bad',root),good=$('#pd-good',root);
    bad.addEventListener('pointerdown',()=>{log.textContent='Schon ausgelöst – beim Drücken. Wegziehen hilft jetzt nichts mehr.'});
    bad.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')log.textContent='Schon ausgelöst – beim Drücken der Taste.'});
    good.addEventListener('pointerdown',()=>{log.textContent='Gedrückt – noch ist nichts passiert. Jetzt loslassen oder wegziehen.'});
    good.addEventListener('pointerleave',e=>{if(e.buttons)log.textContent='Weggezogen – abgebrochen, nichts ist passiert.'});
    good.addEventListener('click',()=>{log.textContent='Ausgelöst beim Loslassen. Wer vorher wegzieht, bricht ab.'});
    return()=>{if(dragCleanup)dragCleanup()};
  },
  do:[`Jede Wischaktion auch über einen sichtbaren Button anbieten (⋯-Menü, Löschen-Icon).`,`Drag Handles mindestens 44 px groß, Sortieren zusätzlich mit Pfeilen oder „Nach oben“.`,`<code>touch-action</code> gezielt setzen, damit Wischen in der Zeile das senkrechte Scrollen nicht blockiert.`],
  dont:[`Wischen als einziger Weg zum Löschen.`,`Sortieren nur per Drag and Drop.`,`Auslösen schon beim Drücken (<code>pointerdown</code>) – kein Abbrechen möglich.`],
  why:`<p>Gesten sind unsichtbar. Niemand sieht einer Zeile an, dass man sie wischen kann. Dazu kommen Menschen, die mit einem Finger, einem Stift, einer Mundmaus oder per Sprachsteuerung bedienen: Für sie sind Wischen und Ziehen oft unmöglich.</p><p>WCAG 2.5.7 (neu in 2.2) verlangt deshalb für jede Ziehbewegung eine Alternative mit einfachen Klicks. WCAG 2.5.2 sorgt dafür, dass man es sich anders überlegen kann: Ausgelöst wird beim Loslassen, wer den Finger vorher wegzieht, bricht ab.</p>`,
  here:`Die App selbst braucht keine einzige Geste. Alles geht mit Tippen, Klicken oder der Tastatur – Gesten gibt es nur in den Demos, und jede hat eine Alternative.`
},
{

  numbers:[['3–5','Schritte in einem Stepper'],['1 Ziel','pro Schritt'],['Überspringen','muss bei jedem Onboarding gehen'],['3.3.7','schon Eingegebenes nicht erneut abfragen']],
  demo:`

      <div class="field"><label for="pd-name">Projektname</label><input class="input" id="pd-name" value="Herbstkampagne"></div>

  init(root){

    const d={name:'Lena Hofer',email:'lena@beispiel.at',street:'Herrengasse 16',city:'8010 Graz',same:true,bstreet:'',bcity:''};

  dont:[`Eine Tour mit fünf Sprechblasen, bevor man überhaupt etwas tun darf.`,`Alles auf einmal: 30 Felder auf einer Seite.`,`Dieselbe Adresse zweimal abfragen.`],
  why:`<p><strong>Progressive Disclosure</strong> heißt: zuerst das Wesentliche, Details auf Abruf. Das senkt die Einstiegshürde für Neue, ohne Profis etwas wegzunehmen – die erweiterten Optionen sind nur einen Klick entfernt.</p><p>Lange Formulare wirken in Schritten kleiner. Ein guter Stepper zeigt, wo man ist und wie viel noch kommt, und erlaubt Zurückgehen ohne Datenverlust. Die Prüfseite mit „Ändern“-Links fängt Fehler ab, bevor sie Folgen haben (WCAG 3.3.4).</p><p>Onboarding-Touren, die Sprechblasen über die Oberfläche legen, werden meist weggeklickt. Besser wirken gute Empty States und Hinweise genau dort, wo man sie gerade braucht.</p>`,

{

    all.addEventListener('change',()=>{if(all.checked)rows.forEach(r=>sel.add(r.nr));else sel.clear();render();announce(sel.size?$('#tb-count',root).textContent:'Auswahl aufgehoben')});
    $('#tb-paid',root).addEventListener('click',()=>{const n=sel.size;rows.forEach(r=>{if(sel.has(r.nr))r.s='Bezahlt'});sel.clear();render();all.focus();toast({msg:n===1?'1 Rechnung als bezahlt markiert.':`${n} Rechnungen als bezahlt markiert.`,type:'success'})});

  do:[`Eine echte <code>&lt;table&gt;</code> mit <code>&lt;th scope="col"&gt;</code> – Screenreader sagen dann den Spaltenkopf mit an.`,`Scrollbare Tabellen-Container mit <code>tabindex="0"</code>, damit man sie per Tastatur scrollen kann.`,`Bei Auswahl eine Leiste mit Mehrfachaktionen, „Alle auswählen“ mit Zwischenzustand.`],
  dont:[`Zahlen linksbündig mit Proportionalziffern.`,`Tabellen aus <code>div</code>-Elementen – Screenreader verlieren die Spaltenköpfe.`,`Infinite Scroll über einem Footer mit Impressum und Kontakt.`],
  why:`<p>Das Auge liest Zahlen spaltenweise. Nur wenn Einer unter Einern und Tausender unter Tausendern stehen, sieht man auf einen Blick, welcher Betrag größer ist. Dafür braucht es rechtsbündige Zahlen und gleich breite Ziffern – <code>font-variant-numeric: tabular-nums</code>, oder eine Monospace-Schrift, wenn die Schrift keine Tabellenziffern hat (wie hier).</p><p>Für Screenreader ist eine echte <code>&lt;table&gt;</code> Gold wert: Beim Wechsel in eine Zelle wird der Spaltenkopf mit angesagt („Betrag, € 12.480,50“). Nachgebaute Tabellen aus <code>div</code>s verlieren das. <code>aria-sort</code> sagt zusätzlich, nach welcher Spalte sortiert ist.</p>`,
  here:`Die Tabelle oben steckt in einem scrollbaren Bereich mit <code>tabindex="0"</code> und einem Namen – sonst könnten Tastaturnutzer ihn nicht scrollen. Alle Kennzahlen in den Lektionen stehen in JetBrains Mono, einer Schrift mit gleich breiten Ziffern.`
},
{
  id:'search-filter',cat:'Daten & Inhalte',title:'Suche & Filter',
  short:'Aktive Filter als Chips, Debounce beim Tippen, Zustand in der URL.',
  keys:'suche search filter chips facetten debounce autocomplete trefferzahl url zustand',
  refs:['WCAG 4.1.3 · AA','WCAG 3.2.2 · A','ARIA APG: Combobox'],
  rule:`Aktive Filter sind immer <strong>sichtbar und einzeln entfernbar</strong>. Die Trefferzahl wird angesagt, der Filterzustand steht in der URL, und null Treffer bieten einen Ausweg.`,
  numbers:[['~ 300 ms','Debounce beim Tippen'],['Chips','zeigen aktive Filter, × entfernt einzeln'],['Trefferzahl','über eine Live-Region angesagt'],['URL','Filter überleben Reload und Teilen']],
  demo:`
  <div class="sf">
    <div class="sf-filters" role="group" aria-label="Wege filtern">
      <div class="field"><label for="sf-q">Name oder Region</label><input class="input" type="search" id="sf-q" autocomplete="off" aria-describedby="sf-q-h"><p class="hint" id="sf-q-h">Probier „alm“.</p></div>
      <fieldset class="sf-fs"><legend>Schwierigkeit</legend>${['leicht','mittel','schwer'].map(x=>`<div class="check-row"><input type="checkbox" name="sf-d" value="${x}" id="sf-d-${x}"><label for="sf-d-${x}">${x[0].toUpperCase()+x.slice(1)}</label></div>`).join('')}</fieldset>
      <div class="field"><label for="sf-r">Region</label><select id="sf-r"><option value="">Alle Regionen</option>${['Kärnten','Salzburg','Steiermark','Tirol'].map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="check-row"><input type="checkbox" id="sf-loop"><label for="sf-loop">Nur Rundwege</label></div>
    </div>
    <div>
      <div class="chips" id="sf-chips" role="group" aria-label="Aktive Filter"></div>
      <p class="sf-count" id="sf-count" aria-live="polite"></p>
      <ul class="sf-list" id="sf-list" aria-label="Wanderwege"></ul>
    </div>
  </div>
  <p class="md-state" id="sf-debounce" style="margin:0"></p>
  <p class="demo-note" style="margin:0">So stünde der Zustand in der URL: <code id="sf-url">/wege</code></p>`,
  init(root){
    const T=[['Almrunde am Sattel','Steiermark','leicht',2.5,1],['Seeuferweg','Kärnten','leicht',1.5,1],['Gipfelsteig Hochkogel','Tirol','schwer',6,0],['Klammweg','Salzburg','mittel',3,0],['Zirbenweg','Tirol','leicht',2,0],['Wasserfallrunde','Salzburg','mittel',3.5,1],['Panoramaweg über dem Tal','Kärnten','mittel',4,0],['Hüttenweg zur Kaseralm','Steiermark','mittel',4.5,0],['Grat-Überschreitung','Tirol','schwer',7.5,0],['Moorlehrpfad','Salzburg','leicht',1,1],['Weinbergweg','Steiermark','leicht',2.5,1],['Kapellenrunde','Kärnten','leicht',1.5,1],['Jochsteig','Tirol','schwer',5.5,1],['Almweg am Bach','Steiermark','mittel',3,0]].map(([n,r,d,h,loop])=>({n,r,d,h,loop}));
    const q=$('#sf-q',root),reg=$('#sf-r',root),loop=$('#sf-loop',root),dbc=$('#sf-debounce',root);let keys=0,runs=0,term='',tm;
    const diffs=()=>$$('input[name="sf-d"]:checked',root).map(i=>i.value);
    const showDbc=()=>{dbc.textContent=`Tastendrücke: ${keys} · Suchen ausgeführt: ${runs}`};
    const apply=()=>{
      runs++;
      const t=norm(term.trim()),ds=diffs(),r=reg.value,lp=loop.checked;
      const res=T.filter(x=>(!t||norm(x.n+' '+x.r).includes(t))&&(!ds.length||ds.includes(x.d))&&(!r||x.r===r)&&(!lp||x.loop));
      const chips=[];
      if(term.trim())chips.push(['q',`„${term.trim()}“`]);
      ds.forEach(x=>chips.push(['d:'+x,x[0].toUpperCase()+x.slice(1)]));
      if(r)chips.push(['r',r]);if(lp)chips.push(['loop','Rundweg']);
      $('#sf-chips',root).innerHTML=chips.map(([k,l])=>`<button type="button" class="fchip" data-k="${esc(k)}" aria-label="Filter ${esc(l)} entfernen">${esc(l)}${ic('x')}</button>`).join('')+(chips.length>1?'<button type="button" class="btn btn-ghost" id="sf-reset">Alle zurücksetzen</button>':'');
      $('#sf-count',root).textContent=`${res.length} von ${T.length} Wegen`;
      $('#sf-list',root).innerHTML=res.length?res.map(x=>`<li><b>${esc(x.n)}</b><span>${x.r} · ${x.d} · ${String(x.h).replace('.',',')} h${x.loop?' · Rundweg':''}</span></li>`).join('')
        :`<li class="sf-empty"><b>Kein Weg passt zu diesen Filtern.</b><span>Entferne oben einen Filter oder <button type="button" class="linkbtn" id="sf-reset2">setz alle zurück</button>.</span></li>`;
      const p=new URLSearchParams();if(term.trim())p.set('q',term.trim());ds.forEach(x=>p.append('schwierigkeit',x));if(r)p.set('region',r);if(lp)p.set('rundweg','1');
      $('#sf-url',root).textContent='/wege'+(p.toString()?'?'+p:'');
      showDbc();
    };
    const reset=()=>{q.value='';term='';$$('input[name="sf-d"]',root).forEach(i=>i.checked=false);reg.value='';loop.checked=false;apply();q.focus()};
    q.addEventListener('input',()=>{keys++;showDbc();clearTimeout(tm);tm=setTimeout(()=>{term=q.value;apply()},300)});
    [...$$('input[name="sf-d"]',root),reg,loop].forEach(x=>x.addEventListener('change',apply));
    $('#sf-chips',root).addEventListener('click',e=>{
      if(e.target.closest('#sf-reset')){reset();return}
      const c=e.target.closest('.fchip');if(!c)return;
      const k=c.dataset.k,idx=$$('.fchip',root).indexOf(c);
      if(k==='q'){q.value='';term=''}else if(k.startsWith('d:'))$(`input[name="sf-d"][value="${k.slice(2)}"]`,root).checked=false;else if(k==='r')reg.value='';else if(k==='loop')loop.checked=false;
      apply();const cs=$$('.fchip',root);(cs[Math.min(idx,cs.length-1)]||q).focus();
    });
    $('#sf-list',root).addEventListener('click',e=>{if(e.target.closest('#sf-reset2'))reset()});
    apply();runs=0;showDbc();
    return()=>clearTimeout(tm);
  },
  do:[`Aktive Filter als Chips über den Ergebnissen, jeder mit ×, bei mehreren zusätzlich „Alle zurücksetzen“.`,`Beim Tippen entprellen (Debounce), Häkchen und Auswahlfelder sofort anwenden.`,`Filterzustand in die URL schreiben – mit <code>replaceState</code>, damit „Zurück“ nicht durch jeden Filterklick führt.`],
  dont:[`Aktive Filter unsichtbar in einem eingeklappten Panel.`,`Bei jedem Tastendruck neu suchen und neu ansagen.`,`„0 Ergebnisse“ ohne Hinweis, welcher Filter schuld ist.`],
  why:`<p>Filter ohne sichtbaren Zustand sind eine Falle: Man kommt später zurück, sieht nur drei Ergebnisse und hält den Rest für gelöscht. Chips machen jeden aktiven Filter sichtbar und einzeln entfernbar.</p><p><strong>Debouncing</strong> wartet mit der Suche, bis kurz nicht getippt wird. Der Zähler in der Demo zeigt den Effekt: viele Tastendrücke, wenige Suchen. Das schont Server und Akku, und der Screenreader sagt die Trefferzahl nicht nach jedem Buchstaben an.</p><p>Steht der Filterzustand in der URL, überlebt er Reload, Zurück-Button und Teilen („schau, alle leichten Rundwege in Tirol“).</p>`,
  here:`Die Lektionssuche links filtert sofort, sagt die Trefferzahl über eine Live-Region an und zeigt bei null Treffern einen Empty State mit Ausweg. Die Ansage wartet 450 ms, damit ein Screenreader nicht bei jedem Buchstaben redet.`
},
{
  id:'errors-offline',cat:'Feedback',title:'Fehler, Offline & Wiederherstellung',
  short:'Fehler dort zeigen, wo sie entstehen – und nichts geht verloren.',
  keys:'fehler error fehlermeldung offline netzwerk retry erneut versuchen auto save speichern banner',
  refs:['WCAG 3.3.1 · A','WCAG 3.3.3 · AA','WCAG 4.1.3 · AA'],
  rule:`Ein Fehler erscheint dort, wo er entstanden ist, und so laut, wie er ernst ist: im Feld, als Banner über dem Bereich oder als ganze Seite. Jede Meldung sagt, was passiert ist und was man jetzt tun kann – und <strong>nichts, was man schon hatte, geht verloren</strong>.`,
  numbers:[['3 Ebenen','Feld · Bereich · ganze Seite'],['was · warum · tun','Aufbau jeder Fehlermeldung'],['0','verlorene Eingaben durch einen Fehler'],['Auto-Save','statt „Ungespeicherte Änderungen!“']],
  demo:`
  <p style="margin:0">${sw('eo-off','Offline simulieren')}</p>
  <div class="eo-banner" id="eo-banner" hidden>${ic('wifioff')}<span><b>Du bist offline.</b> Änderungen werden auf diesem Gerät gesichert und übertragen, sobald die Verbindung zurück ist.</span></div>
  <div class="eo-grid">
    <section class="eo-card" aria-labelledby="eo-acc-h">
      <div class="eo-head"><h3 id="eo-acc-h">Kontostand</h3><button type="button" class="btn btn-secondary" id="eo-refresh"><span class="spinner" aria-hidden="true"></span>${ic('refresh','btn-ic')}Aktualisieren</button></div>
      <p class="eo-balance" id="eo-bal"></p><p class="hint" id="eo-stamp"></p>
      <div class="eo-inline" id="eo-err" hidden>${ic('alert')}<div><p id="eo-err-t"></p><button type="button" class="btn btn-secondary" id="eo-retry">Erneut versuchen</button></div></div>
    </section>
    <div class="eo-card"><div class="field"><label for="eo-note">Notiz zum Monat</label><textarea class="input eo-ta" id="eo-note" rows="4">Miete ist abgebucht, Versicherung kommt am 1.</textarea><p class="eo-save" id="eo-save">Alle Änderungen gespeichert.</p></div></div>
  </div>
  <p class="demo-note" style="margin:0">Schalte auf offline, tipp in die Notiz und klick auf „Aktualisieren“. Dann wieder online.</p>
  <div>
    <h3>Die drei Ebenen</h3>
    <ol class="anatomy">
      <li><b>Feld:</b> „Die Postleitzahl hat 4 oder 5 Ziffern.“ – direkt am Eingabefeld, siehe <a href="#forms">Formulare</a>.</li>
      <li><b>Bereich:</b> ein Banner über der betroffenen Karte, wie beim Kontostand oben. Der Rest der Seite funktioniert weiter.</li>
      <li><b>Seite:</b> nur wenn wirklich nichts geht – mit Grund und Ausweg, siehe die <a href="#gibt-es-nicht">404-Seite</a>.</li>

  </div>`,
  init(root){
    let off=false,pending=false,tm,sv,bal=2418.5,stamp=new Date(Date.now()-12*60000);
    const money=new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'}),hm=d=>d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
    const banner=$('#eo-banner',root),err=$('#eo-err',root),errT=$('#eo-err-t',root),save=$('#eo-save',root),ref=$('#eo-refresh',root);
    const show=()=>{$('#eo-bal',root).textContent=money.format(bal);$('#eo-stamp',root).textContent=`Stand: ${hm(stamp)} Uhr`};
    show();
    const refresh=()=>{
      if(off){err.hidden=false;errT.innerHTML='<b>Aktualisieren nicht möglich.</b> Keine Internetverbindung. Du siehst den letzten bekannten Stand.';announce('Aktualisieren nicht möglich. Keine Internetverbindung.');return}
      ref.classList.add('is-loading');ref.setAttribute('aria-busy','true');
      tm=setTimeout(()=>{ref.classList.remove('is-loading');ref.removeAttribute('aria-busy');bal=Math.round((bal+Math.random()*80-30)*100)/100;stamp=new Date();err.hidden=true;show();announce('Kontostand aktualisiert.')},800);

    $('#eo-note',root).addEventListener('input',()=>{
      clearTimeout(sv);save.textContent='Speichert …';save.className='eo-save';
      sv=setTimeout(()=>{if(off){pending=true;save.textContent='Auf diesem Gerät gesichert – wird übertragen, sobald du online bist.';save.className='eo-save warn'}else{save.textContent=`Gespeichert um ${new Date().toLocaleTimeString('de-AT')}.`;save.className='eo-save ok'}},700);
    });
    $('#eo-off',root).addEventListener('toggle',e=>{
      off=e.detail;banner.hidden=!off;

  do:[`Fehlermeldung = was ist passiert + warum (falls bekannt) + was kann ich tun. Fehlercode nur als Zusatz für den Support.`,`Bei Netzwerkfehlern die zuletzt geladenen Daten stehen lassen und mit Zeitstempel kennzeichnen.`,`Automatisch speichern und den Speicherstatus zeigen.`],
  dont:[`Ein Fehlercode als einzige Aussage.`,`Nach einem Fehler ist die Eingabe weg.`,`Leere Karte statt der zuletzt geladenen Daten.`],
  why:`<p>Fehler sind keine Ausnahme, sondern Alltag: Funklöcher, abgelaufene Karten, überlastete Server. Gute Oberflächen planen sie mit ein. Die wichtigste Regel: Nichts, was der Nutzer schon hat, verschwindet wegen eines Fehlers – weder eingegebener Text noch zuletzt geladene Daten.</p><p>Eine gute Fehlermeldung beantwortet drei Fragen: Was ist passiert? Warum? Was kann ich jetzt tun? Fehlercodes dürfen dabeistehen, aber nie als einzige Aussage.</p><p><strong>Auto-Save</strong> ersetzt die Warnung „Ungespeicherte Änderungen!“. Statt Nutzern das Speichern aufzubürden, speichert die App selbst und sagt, dass sie es getan hat.</p>`,
  here:`Die App speichert deinen Lernfortschritt im Browser. Klappt das nicht (privates Fenster, gesperrter Speicher), läuft sie trotzdem weiter – jeder Speicherzugriff ist abgesichert, und nichts, was du gerade brauchst, geht verloren.`
},
{
  id:'performance',cat:'Qualität',title:'Performance als UX: Core Web Vitals',
  short:'Hauptinhalt schnell da, Reaktion sofort, nichts springt.',
  keys:'performance geschwindigkeit core web vitals lcp inp cls layout shift ladezeit reaktion',
  refs:['Core Web Vitals','LCP · INP · CLS','web.dev'],
  rule:`Geschwindigkeit ist Teil des Designs. Drei Kennzahlen messen, was Nutzer erleben: Wie schnell ist der Hauptinhalt da (<strong>LCP</strong>), wie schnell reagiert die Seite (<strong>INP</strong>), und springt etwas (<strong>CLS</strong>)?`,
  numbers:[['LCP ≤ 2,5 s','Hauptinhalt sichtbar'],['INP ≤ 200 ms','Reaktion auf Eingaben'],['CLS ≤ 0,1','unerwartete Layout-Verschiebung'],['75. Perzentil','gemessen an echten Besuchen']],
  demo:`
  <div class="table-wrap"><table class="sem">
    <caption>Grenzwerte der Core Web Vitals</caption>
    <thead><tr><th scope="col">Kennzahl</th><th scope="col">Misst</th><th scope="col">Gut</th><th scope="col">Mittel</th><th scope="col">Schlecht</th></tr></thead>
    <tbody>
      <tr><th scope="row">LCP</th><td>Wann der größte sichtbare Inhalt da ist</td><td>≤ 2,5 s</td><td>≤ 4 s</td><td>&gt; 4 s</td></tr>
      <tr><th scope="row">INP</th><td>Wie schnell die Seite auf Klicks und Tippen reagiert</td><td>≤ 200 ms</td><td>≤ 500 ms</td><td>&gt; 500 ms</td></tr>
      <tr><th scope="row">CLS</th><td>Wie stark das Layout unerwartet springt</td><td>≤ 0,1</td><td>≤ 0,25</td><td>&gt; 0,25</td></tr>
    </tbody>
  </table></div>
  <div>
    <h3>CLS: Der springende Button</h3>
    <div class="es-controls"><button type="button" class="btn btn-primary" id="cls-load">Seite laden</button>${sw('cls-res','Platz für den Banner reservieren')}</div>
    <div class="cls-stage" id="cls-stage" style="margin-top:12px"><p class="hint" style="margin:0">Klick auf „Seite laden“ und dann sofort auf „In den Warenkorb“.</p></div>
    <p class="md-state" id="cls-out" aria-live="polite" style="margin:8px 0 0"></p>
  </div>
  <div>
    <h3>INP: Reagiert der Button sofort?</h3>
    <div class="inp-live"><span class="inp-spin" id="inp-spin" aria-hidden="true"></span><span>Lebenszeichen der Seite: <b id="inp-tick">0</b> Bilder gezeichnet</span></div>
    <div class="btn-row" style="margin-top:12px"><button type="button" class="btn btn-secondary" id="inp-bad">Filtern (blockiert 600 ms)</button><button type="button" class="btn btn-secondary" id="inp-good"><span class="spinner" aria-hidden="true"></span>Filtern mit Sofort-Feedback</button></div>
    <p class="md-state" id="inp-out" aria-live="polite" style="margin:8px 0 0"></p>
  </div>`,
  init(root){
    let reserve=false,tl,raf,n=0;
    $('#cls-res',root).addEventListener('toggle',e=>{reserve=e.detail});
    const stage=$('#cls-stage',root),out=$('#cls-out',root);
    $('#cls-load',root).addEventListener('click',()=>{
      clearTimeout(tl);
      stage.innerHTML=`<p class="cls-prod"><b>Wanderschuh „Grat“</b> · € 149,00</p><div class="cls-slot${reserve?' reserved':''}" id="cls-slot"></div><div class="btn-row"><button type="button" class="btn btn-primary" id="cls-buy">In den Warenkorb</button></div>`;
      out.textContent='Klick jetzt schnell auf „In den Warenkorb“ …';
      const y0=$('#cls-buy',root).getBoundingClientRect().top;
      tl=setTimeout(()=>{
        $('#cls-slot',root).innerHTML=`<div class="cls-ad"><button type="button" class="btn btn-secondary" id="cls-news">Newsletter abonnieren</button><span class="hint">10 % Rabatt auf die erste Bestellung</span></div>`;
        const dy=Math.round($('#cls-buy',root).getBoundingClientRect().top-y0);
        out.textContent=dy?`Der Button ist um ${dy} px nach unten gesprungen. An seiner Stelle sitzt jetzt „Newsletter abonnieren“.`:'Nichts ist gesprungen – der Platz war reserviert.';
      },1100);
    });
    stage.addEventListener('click',e=>{
      if(e.target.closest('#cls-buy'))out.textContent='In den Warenkorb gelegt.';
      if(e.target.closest('#cls-news'))out.textContent='Newsletter abonniert statt Schuh gekauft. Genau das misst CLS.';
    });
    const tick=$('#inp-tick',root),spin=$('#inp-spin',root),rm=reducedMotion();
    const loop=()=>{n++;tick.textContent=n;if(!rm)spin.style.transform=`rotate(${n*6}deg)`;raf=requestAnimationFrame(loop)};
    raf=requestAnimationFrame(loop);
    const io=$('#inp-out',root),busy=ms=>{const e=performance.now()+ms;while(performance.now()<e){}};
    $('#inp-bad',root).addEventListener('click',e=>{
      const b=e.currentTarget,t0=performance.now();busy(600);b.classList.add('flash');
      requestAnimationFrame(()=>{io.textContent=`Erste sichtbare Reaktion nach ${Math.round(performance.now()-t0)} ms. So lange war die Seite eingefroren – der Zähler stand still. INP: schlecht.`;setTimeout(()=>b.classList.remove('flash'),400)});
    });
    $('#inp-good',root).addEventListener('click',async e=>{
      const b=e.currentTarget;if(b.getAttribute('aria-busy'))return;
      const t0=performance.now();b.classList.add('is-loading');b.setAttribute('aria-busy','true');
      await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
      const first=Math.round(performance.now()-t0);
      for(let i=0;i<12;i++){busy(50);await new Promise(r=>setTimeout(r,0))}
      b.classList.remove('is-loading');b.removeAttribute('aria-busy');
      io.textContent=`Erste Reaktion nach ${first} ms, fertig nach ${Math.round(performance.now()-t0)} ms. Die Arbeit lief in 12 Häppchen, der Zähler lief weiter. INP: gut.`;
    });
    return()=>{clearTimeout(tl);cancelAnimationFrame(raf)};
  },
  do:[`Platz für Bilder, Banner und Werbung reservieren (<code>width</code>/<code>height</code> oder <code>aspect-ratio</code>).`,`Bei jeder Eingabe sofort sichtbar reagieren, lange Arbeit in kleine Stücke teilen.`,`Das wichtigste Bild früh laden, alles unterhalb des sichtbaren Bereichs später (<code>loading="lazy"</code>).`],
  dont:[`Bilder und Banner ohne reservierte Höhe.`,`Lange Berechnung im Klick-Handler, ohne zuerst Feedback zu zeigen.`,`Fünf Webfonts in je vier Schnitten.`],
  why:`<p>Nutzer erleben keine Millisekunden, sondern „die App hängt“, „der Button hat nicht reagiert“ oder „ich habe das Falsche angeklickt“. Genau diese drei Erlebnisse messen die Core Web Vitals.</p><p>Google misst sie an echten Besuchen und wertet das 75. Perzentil aus: Drei von vier Besuchen müssen im grünen Bereich liegen. Die Werte fließen auch ins Suchranking ein.</p><p>Der größte Hebel ist oft einfach: Platz reservieren (gegen CLS), sofort Feedback zeigen und Arbeit aufteilen (gegen schlechten INP), das wichtigste Bild zuerst laden (für LCP).</p>`,
  here:`Die ganze App ist eine Datei ohne Framework. Schriften laden mit <code>font-display: swap</code>: Der Text ist sofort lesbar, die Schrift kommt nach. Der Preis dafür: Beim Tausch kann der Text minimal springen.`
},
{
  id:'i18n',cat:'Qualität',title:'Internationalisierung (i18n)',
  short:'Längere Texte einplanen, Zahlen mit Intl formatieren, RTL mitdenken.',
  keys:'i18n l10n übersetzung sprache internationalisierung lokalisierung intl datum zahl währung rtl arabisch lang',
  refs:['WCAG 3.1.1 · A','WCAG 3.1.2 · AA','Intl API'],
  rule:`Texte, Zahlen, Daten und Leserichtung gehören nie fest ins Layout. Plane für <strong>längere Übersetzungen</strong>, formatiere mit der Intl-API und setze die Sprache im HTML (<code>lang</code>).`,
  numbers:[['+ 20–35 %','Deutsch gegenüber Englisch, kurze Labels oft mehr'],['Intl','Zahlen, Beträge, Datum je Sprache und Region'],['lang','Screenreader wählt die richtige Aussprache'],['inline-start','statt left – spiegelt sich bei RTL']],
  demo:`
  <fieldset class="seg"><legend>Sprache und Region</legend><div class="seg-opts">
    <label><input type="radio" name="i18n-loc" value="de-AT" checked>Deutsch (AT)</label>
    <label><input type="radio" name="i18n-loc" value="de-DE">Deutsch (DE)</label>
    <label><input type="radio" name="i18n-loc" value="en-US"><span lang="en">English (US)</span></label>
    <label><input type="radio" name="i18n-loc" value="fr-FR"><span lang="fr">Français</span></label>
    <label><input type="radio" name="i18n-loc" value="ar-EG"><span lang="ar">العربية</span></label>
  </div></fieldset>
  <dl class="i18n-out" id="i18n-out"></dl>
  <p class="demo-note" style="margin:0">Vergleich Österreich und Deutschland: „€ 1.234,50“ gegen „1.234,50 €“ und „Jänner“ gegen „Januar“ – dieselbe Sprache, andere Region.</p>
  <div>
    <h3>Leserichtung: links nach rechts – oder umgekehrt</h3>
    <div class="i18n-card" id="i18n-card"></div>
    <p class="demo-note">Wähl „العربية“: Die Karte spiegelt sich, weil sie <code>padding-inline-start</code> und <code>border-inline-start</code> statt <code>left</code> nutzt. Der Pfeil im Button dreht sich mit.</p>
  </div>
  <div>
    <h3>Textlänge</h3>
    <p style="margin:0 0 12px">${sw('i18n-fix','Feste Button-Breite wie im Englischen')}</p>
    <div class="xp" id="xp" inert><span class="xp-h">English</span><span class="xp-h">Deutsch</span>${[['Save','Speichern'],['Settings','Einstellungen'],['Download','Herunterladen'],['Undo','Rückgängig machen'],['Sign up','Registrieren']].map(([e,d])=>`<button class="btn btn-secondary xp-b" lang="en">${e}</button><button class="btn btn-secondary xp-b">${d}</button>`).join('')}</div>
  </div>`,
  init(root){
    const out=$('#i18n-out',root),card=$('#i18n-card',root);
    const TX={'de':['Nachricht von Lena','Treffen wir uns morgen um 10?','Antworten'],'en':['Message from Lena','Shall we meet tomorrow at 10?','Reply'],'fr':['Message de Lena','On se retrouve demain à 10 h ?','Répondre'],'ar':['رسالة من لينا','هل نلتقي غدًا في العاشرة؟','رد']};
    const upd=()=>{
      const loc=$('input[name="i18n-loc"]:checked',root).value,lang=loc.split('-')[0],cur={'en-US':'USD','ar-EG':'EGP'}[loc]||'EUR';
      const rtf=o=>new Intl.RelativeTimeFormat(loc,o);
      const rows=[
        ['Zahl','NumberFormat',new Intl.NumberFormat(loc).format(1234567.891)],
        ['Betrag',`currency: '${cur}'`,new Intl.NumberFormat(loc,{style:'currency',currency:cur}).format(1234.5)],
        ['Datum',"dateStyle: 'long'",new Intl.DateTimeFormat(loc,{dateStyle:'long'}).format(new Date(2027,0,15))],
        ['Relativ','RelativeTimeFormat',`${rtf({numeric:'auto'}).format(-1,'day')} · ${rtf().format(-3,'day')}`],
        ['Aufzählung','ListFormat',new Intl.ListFormat(loc,{type:'conjunction'}).format(['Lena','Tom','Aylin'])]
      ];
      out.innerHTML=rows.map(([k,c,v])=>`<div><dt>${k}</dt><dd class="i18n-v" lang="${loc}" dir="auto">${esc(v)}</dd><dd class="i18n-c"><code>${esc(c)}</code></dd></div>`).join('');
      const t=TX[lang];card.lang=loc;card.dir=lang==='ar'?'rtl':'ltr';
      card.innerHTML=`<span class="i18n-av" aria-hidden="true">L</span><div class="i18n-tx"><b>${t[0]}</b><span>${t[1]}</span></div><button type="button" class="btn btn-secondary i18n-reply">${t[2]}${ic('fwd','dir-ic')}</button>`;
    };
    $$('input[name="i18n-loc"]',root).forEach(r=>r.addEventListener('change',upd));
    $('#i18n-fix',root).addEventListener('toggle',e=>$('#xp',root).classList.toggle('fixed',e.detail));
    card.addEventListener('click',e=>{if(e.target.closest('.i18n-reply'))toast({msg:'Antwort-Feld geöffnet (Demo).',duration:2500})});
    upd();
  },
  do:[`Alle Texte in Übersetzungsdateien, Buttons und Spalten mit flexibler Breite.`,`Zahlen, Beträge und Daten immer über <code>Intl</code> formatieren, nie per String-Verkettung.`,`Logische CSS-Eigenschaften (<code>margin-inline-start</code>, <code>inset-inline-end</code>) statt <code>left</code>/<code>right</code>.`],
  dont:[`Buttons mit fester Breite, in die nur der englische Text passt.`,`Zahlen und Daten selbst zusammensetzen: „1,234.50 €“, „09/25/26“.`,`<code>left</code> und <code>right</code> statt <code>inline-start</code>/<code>-end</code> – in RTL steht alles falsch herum.`],
  why:`<p>i18n (internationalization: i + 18 Buchstaben + n) heißt, eine App so zu bauen, dass sie sich ohne Code-Änderung übersetzen lässt. l10n (localization) ist die eigentliche Anpassung an eine Sprache und Region.</p><p>Die typischen Brüche: Texte, die auf Deutsch nicht mehr in den Button passen, selbst zusammengebaute Zahlen und Daten, und Layouts mit <code>left</code>/<code>right</code>, die in arabischer oder hebräischer Schrift falsch herum stehen.</p><p>Das <code>lang</code>-Attribut sagt dem Screenreader, welche Aussprache er nehmen soll (WCAG 3.1.1). Ohne liest eine englische Stimme deutschen Text wie Kauderwelsch. Einzelne fremdsprachige Wörter bekommen ihr eigenes <code>lang</code> (3.1.2) – wie „العربية“ in der Auswahl oben.</p>`,
  here:`Beim Start setzt die App <code>lang="de"</code> auf das html-Element. Alle Beträge und Daten in den Demos laufen über <code>Intl</code> mit <code>de-AT</code> – darum steht dort „€ 149,00“ und nicht „149,00 €“.`
},
{
  id:'dark-patterns',cat:'Qualität',title:'Dark Patterns & faire Einwilligung',
  short:'Ablehnen so leicht wie Zustimmen – alles andere ist Manipulation.',
  keys:'dark patterns deceptive design cookie banner consent einwilligung dsgvo gdpr confirmshaming kündigung abo',
  refs:['DSGVO Art. 7','DSA Art. 25','EDPB-Leitlinien 03/2022'],
  rule:`Eine Oberfläche darf niemanden zu Entscheidungen drängen, die er so nicht treffen würde. <strong>Ablehnen ist so einfach wie Zustimmen</strong>, Kündigen so einfach wie Abschließen.`,
  numbers:[['1 Klick','Ablehnen so leicht wie Zustimmen'],['gleich stark','„Ablehnen“ und „Akzeptieren“ sehen gleich aus'],['0','vorangekreuzte Einwilligungen'],['Art. 7 (3)','Widerruf so einfach wie Einwilligung (DSGVO)']],
  demo:`
  <p class="dp-out" id="dp-out" aria-live="polite">Aufgabe: Lehne in beiden Bannern alle optionalen Cookies ab. Zähl mit, wie viele Klicks es braucht.</p>
  <div class="compare">
    <figure><figcaption class="tag tag-bad">${ic('xc')} Manipulativ</figcaption><div class="cb" id="dp-bad"></div></figure>
    <figure><figcaption class="tag tag-good">${ic('ok')} Fair</figcaption><div class="cb" id="dp-good"></div></figure>
  </div>
  <div>
    <h3>Weitere Muster, die du erkennen solltest</h3>
    <div class="table-wrap"><table class="sem">
      <thead><tr><th scope="col">Muster</th><th scope="col">Beispiel</th><th scope="col">Fair wäre</th></tr></thead>
      <tbody>
        <tr><th scope="row">Confirmshaming</th><td>„Nein danke, ich zahle lieber den vollen Preis.“</td><td>„Nein, danke.“</td></tr>
        <tr><th scope="row">Roach Motel</th><td>Abo in einem Klick, Kündigung nur per Brief</td><td>Kündigen so einfach wie abschließen (in DE: Kündigungsbutton, § 312k BGB)</td></tr>
        <tr><th scope="row">Vorangekreuzt</th><td>„Newsletter erhalten“ ist schon angehakt</td><td>Leere Checkbox, aktive Zustimmung</td></tr>
        <tr><th scope="row">Falsche Dringlichkeit</th><td>„Nur noch 1 Zimmer! 14 Personen sehen sich das an.“ ohne echte Grundlage</td><td>Echte Verfügbarkeit – oder gar nichts</td></tr>
        <tr><th scope="row">Sneak into Basket</th><td>Reiseversicherung liegt automatisch im Warenkorb</td><td>Zusatzleistung als Angebot, nicht vorausgewählt</td></tr>
      </tbody>
    </table></div>
  </div>`,
  init(root){
    const out=$('#dp-out',root),bad=$('#dp-bad',root),good=$('#dp-good',root);let bc=0,gc=0;
    const k=n=>n===1?'Klick':'Klicks';
    const renderBad=v=>{
      bad.innerHTML=v==='main'?`<p class="cb-t"><b>Wir respektieren deine Privatsphäre!</b></p><p class="cb-p">Wir und unsere 847 Partner verwenden Cookies, um dir das beste Erlebnis zu bieten.</p><button type="button" class="btn btn-primary cb-big" data-a="accept">Alle akzeptieren</button><button type="button" class="cb-weak" data-a="settings">Einstellungen</button>`
        :v==='settings'?`<p class="cb-t"><b>Deine Einstellungen</b></p>${['Statistik','Marketing','Personalisierung'].map(x=>`<div class="check-row"><input type="checkbox" id="dp-${x}" checked data-a="tick"><label for="dp-${x}">${x}</label></div>`).join('')}<button type="button" class="btn btn-primary cb-big" data-a="accept">Alle akzeptieren</button><button type="button" class="cb-weak" data-a="save">Auswahl speichern</button>`
        :`<p class="cb-t"><b>Erledigt.</b></p><button type="button" class="btn btn-ghost" data-a="reset">Banner zurücksetzen</button>`;
    };
    const renderGood=done=>{
      good.innerHTML=done?`<p class="cb-t"><b>Gespeichert.</b> Du kannst das jederzeit unter „Datenschutz“ ändern.</p><button type="button" class="btn btn-ghost" data-a="reset">Banner zurücksetzen</button>`
        :`<p class="cb-t"><b>Cookies auf dieser Seite</b></p><p class="cb-p">Notwendige Cookies sind immer aktiv. Statistik und Marketing nur mit deiner Zustimmung.</p><div class="btn-row"><button type="button" class="btn btn-secondary" data-a="reject">Alle ablehnen</button><button type="button" class="btn btn-secondary" data-a="accept">Alle akzeptieren</button></div><button type="button" class="btn btn-ghost" data-a="choose">Einzeln auswählen</button>`;
    };
    renderBad('main');renderGood(false);
    bad.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='reset'){bc=0;renderBad('main');$('button',bad).focus();return}
      bc++;
      if(a==='settings'){renderBad('settings');$('input',bad).focus()}
      if(a==='accept'){renderBad('done');$('button',bad).focus();out.textContent=`Links: nach ${bc} ${k(bc)} allem zugestimmt. Genau dafür ist dieses Banner gebaut.`}
      if(a==='save'){const n=$$('input:checked',bad).length;renderBad('done');$('button',bad).focus();out.textContent=n?`Links: gespeichert – aber ${n} vorangekreuzte Kategorien waren noch aktiv.`:`Links: nach ${bc} ${k(bc)} alles abgelehnt. Rechts wäre es 1 Klick.`}
    });
    good.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='reset'){gc=0;renderGood(false);$('button',good).focus();return}
      gc++;
      if(a==='choose'){toast({msg:'Hier ginge eine Auswahl auf – ohne vorangekreuzte Kästchen.',duration:3500});return}
      renderGood(true);$('button',good).focus();
      out.textContent=a==='reject'?`Rechts: nach ${gc} ${k(gc)} abgelehnt.`:`Rechts: zugestimmt – bewusst, mit ${gc} ${k(gc)}.`;
    });
  },
  do:[`„Alle ablehnen“ und „Alle akzeptieren“ auf derselben Ebene, gleich groß, gleich gestaltet.`,`Einwilligungen standardmäßig aus; Zustimmung ist ein aktiver Klick.`,`Kündigen, Abmelden und Widerrufen dort anbieten, wo man es sucht, mit so wenigen Schritten wie der Abschluss.`],
  dont:[`„Alle akzeptieren“ groß und bunt, „Ablehnen“ als grauer Mini-Link.`,`Confirmshaming: „Nein danke, ich zahle lieber mehr.“`,`Vorangekreuzte Checkboxen für Newsletter und Datenweitergabe.`],
  why:`<p>Dark Patterns (auch <em>Deceptive Patterns</em>) sind Oberflächen, die gegen die Interessen der Nutzer arbeiten: Sie verstecken Optionen, setzen Häkchen vorab oder erzeugen falschen Zeitdruck. Kurzfristig steigern sie Zahlen, langfristig kosten sie Vertrauen – und in der EU zunehmend Bußgelder.</p><p>Nach der DSGVO muss eine Einwilligung freiwillig, informiert und aktiv sein, und der Widerruf muss so einfach sein wie die Zustimmung (Art. 7). Der Digital Services Act verbietet Online-Plattformen manipulatives Design ausdrücklich (Art. 25). In Deutschland verlangt § 312k BGB seit 2022 einen Kündigungsbutton für online geschlossene Verträge.</p>`,
  here:`Diese App fragt nach nichts: keine Cookies, kein Tracking, kein Newsletter. Dein Lernfortschritt liegt nur in deinem Browser. Die beste Einwilligungsfrage ist die, die man gar nicht stellen muss.`
}
);

const BRANDS={
  fjord:{name:'Fjord',app:'Fjord Kompass',letter:'F'},
  glut:{name:'Glut',app:'Glut Campus',letter:'G'},
  moos:{name:'Moos',app:'Moos Leitfaden',letter:'M'}
};
const hostTheme=document.documentElement.getAttribute('data-theme');
let themeMode=store.get('theme','auto');
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function lum(hex){
  let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function ratio(a,b){const[x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return(x+0.05)/(y+0.05)}
function applyBrand(b,notify){
  if(!BRANDS[b])b='fjord';
  document.documentElement.dataset.brand=b;store.set('brand',b);
  $('#brand-select').value=b;$('#logo-mark').textContent=BRANDS[b].letter;$('#app-name').textContent=BRANDS[b].app;
  updateTitle();
  window.dispatchEvent(new Event('themechange'));
  if(notify)toast({msg:`Marke „${BRANDS[b].name}“ aktiv. Gleicher Code, andere Tokens.`,duration:3500});
}
function applyTheme(m){
  themeMode=m;store.set('theme',m);
  if(m==='auto'){if(hostTheme)document.documentElement.setAttribute('data-theme',hostTheme);else document.documentElement.removeAttribute('data-theme')}
  else document.documentElement.setAttribute('data-theme',m);
  window.dispatchEvent(new Event('themechange'));
}

['1.3.2','A','Bedeutungstragende Reihenfolge','Meaningful Sequence','d',0,'Die DOM-Reihenfolge ergibt Sinn. <code>order</code>, <code>grid-area</code> und <code>flex-direction: row-reverse</code> ändern nur die Optik, nicht die Lesereihenfolge.'],
['1.3.3','A','Sensorische Eigenschaften','Sensory Characteristics','cg',0,'Anleitungen hängen nie nur an Form, Farbe, Position oder Ton: „der runde Button rechts“ reicht nicht.'],
['1.3.4','AA','Ausrichtung','Orientation','d',0,'Kein erzwungenes Hoch- oder Querformat, außer es ist wirklich nötig (Klavier-App, Scheck-Scan).'],
['1.3.5','AA','Bestimmung des Eingabezwecks','Identify Input Purpose','d',1,'Felder für persönliche Daten haben das passende <code>autocomplete</code>: <code>email</code>, <code>given-name</code>, <code>postal-code</code>, <code>tel</code> …'],
['1.4.1','A','Benutzung von Farbe','Use of Color','g',0,'Farbe ist nie das einzige Signal. Fehler rot <em>plus</em> Icon und Text; Links im Fließtext unterstrichen.'],
['1.4.2','A','Audio-Steuerelement','Audio Control','d',0,'Ton, der automatisch länger als 3 Sekunden spielt, lässt sich stoppen oder unabhängig leiser stellen.'],
['1.4.3','AA','Kontrast (Minimum)','Contrast (Minimum)','g',1,'Text hat mindestens 4,5 : 1 Kontrast zum Hintergrund, großer Text (ab 24 px oder 18,7 px fett) 3 : 1.'],
['1.4.4','AA','Textgröße ändern','Resize Text','d',0,'Bei 200 % Textgröße wird nichts abgeschnitten und nichts überlappt. Feste Höhen und <code>px</code>-Schriftgrößen sind die üblichen Täter.'],
['1.4.5','AA','Bilder eines Textes','Images of Text','g',0,'Echter Text statt Text im Bild. Ausnahme: Logos.'],
['1.4.10','AA','Umbruch (Reflow)','Reflow','d',0,'Bei 320 CSS-Pixeln Breite – das sind 1280 px bei 400 % Zoom – gibt es kein horizontales Scrollen. Ausgenommen: Tabellen, Karten, Code, Diagramme.'],
['1.4.11','AA','Nicht-Text-Kontrast','Non-text Contrast','g',0,'Ränder von Eingabefeldern, Fokusring, Checkbox-Haken und Diagrammlinien haben mindestens 3 : 1 zur Umgebung.'],
['1.4.12','AA','Textabstand','Text Spacing','d',0,'Das Layout hält aus, wenn jemand Zeilenhöhe 1,5, Absatzabstand 2 em, Buchstabenabstand 0,12 em und Wortabstand 0,16 em erzwingt.'],
['1.4.13','AA','Eingeblendeter Inhalt bei Hover oder Fokus','Content on Hover or Focus','d',0,'Tooltips und Popover lassen sich mit Esc schließen, mit der Maus überfahren und bleiben stehen, bis man sie verlässt.'],
['2.1.1','A','Tastatur','Keyboard','d',0,'Alles, was mit der Maus geht, geht auch mit der Tastatur – ohne bestimmtes Timing.'],
['2.1.2','A','Keine Tastaturfalle','No Keyboard Trap','d',0,'Wohin der Fokus kommt, von dort kommt er auch wieder weg. Ein Modal hält den Fokus absichtlich fest, lässt sich aber mit Esc schließen.'],
['2.1.4','A','Tastaturkurzbefehle','Character Key Shortcuts','d',0,'Kürzel aus einer einzelnen Taste (etwa „/“ für die Suche) lassen sich abschalten oder umbelegen, oder sie wirken nur, solange das Element den Fokus hat. Diese App hält das mit „/“ selbst nicht ein – ein Schalter dafür fehlt noch.'],
['2.2.1','A','Zeiteinteilung anpassbar','Timing Adjustable','d',0,'Zeitlimits lassen sich abschalten, anpassen oder verlängern – mit mindestens 20 Sekunden Vorwarnung. Gilt auch für Toasts mit Aktion.'],
['2.2.2','A','Pausieren, beenden, ausblenden','Pause, Stop, Hide','d',0,'Was sich automatisch länger als 5 Sekunden bewegt, blinkt, scrollt oder aktualisiert, lässt sich anhalten.'],
['2.3.1','A','Grenzwert von dreimaligem Blitzen','Three Flashes or Below Threshold','g',0,'Nichts blitzt öfter als dreimal pro Sekunde. Das kann epileptische Anfälle auslösen.'],
['2.4.1','A','Blöcke umgehen','Bypass Blocks','d',1,'Ein Skip-Link oder Landmarks erlauben, wiederkehrende Blöcke wie die Navigation zu überspringen.'],
['2.4.2','A','Seite mit Titel','Page Titled','d',1,'Jede Seite und jede Route hat einen eigenen, beschreibenden <code>&lt;title&gt;</code>.'],
['2.4.3','A','Fokus-Reihenfolge','Focus Order','d',0,'Der Fokus wandert in sinnvoller Reihenfolge. Kein positiver <code>tabindex</code>; nach Dialog oder Löschen landet der Fokus an einer sinnvollen Stelle.'],
['2.4.4','A','Linkzweck (im Kontext)','Link Purpose (In Context)','c',1,'Der Linktext – notfalls zusammen mit seinem Satz – sagt, wohin es geht. „Hier klicken“ sagt es nicht.'],
['2.4.5','AA','Verschiedene Methoden','Multiple Ways','g',0,'Zu jeder Seite führen mindestens zwei Wege: Navigation, Suche, Sitemap, Verlinkung.'],
['2.4.6','AA','Überschriften und Beschriftungen','Headings and Labels','c',0,'Überschriften und Labels beschreiben Thema oder Zweck. Ob es sie überhaupt gibt, regelt 1.3.1.'],
['2.4.7','AA','Fokus sichtbar','Focus Visible','d',0,'Der Tastaturfokus ist immer sichtbar. <code>outline: none</code> ohne Ersatz ist der Klassiker.'],
['2.4.11','AA','Fokus nicht verdeckt (Minimum)','Focus Not Obscured (Minimum)','d',0,'Das fokussierte Element wird nicht vollständig von Sticky Header, Cookie-Banner oder Chat-Widget verdeckt.',1],
['2.5.1','A','Zeigergesten','Pointer Gestures','d',0,'Mehrfinger- und Pfadgesten (Pinch, Wischen) haben eine Ein-Finger-Alternative, etwa Plus/Minus-Buttons.'],
['2.5.2','A','Zeigerabbruch','Pointer Cancellation','d',0,'Aktionen lösen beim Loslassen aus (<code>click</code>), nicht beim Drücken (<code>mousedown</code>). Wer daneben drückt, kann noch wegziehen.'],
['2.5.3','A','Beschriftung im Namen','Label in Name','d',0,'Der sichtbare Text steckt auch im zugänglichen Namen, am besten am Anfang. Sonst scheitert Sprachsteuerung: „Klick Senden“.'],
['2.5.4','A','Betätigung durch Bewegung','Motion Actuation','d',0,'Schütteln oder Neigen ist nie die einzige Bedienung und lässt sich abschalten.'],
['2.5.7','AA','Ziehbewegungen','Dragging Movements','d',0,'Alles, was man ziehen kann, geht auch mit einzelnen Klicks – etwa Pfeil-Buttons zum Umsortieren.',1],
['2.5.8','AA','Zielgröße (Minimum)','Target Size (Minimum)','g',1,'Klickziele sind mindestens 24 × 24 CSS-Pixel groß oder haben so viel Abstand, dass ein 24-px-Kreis nichts anderes trifft.',1],
['3.1.1','A','Sprache der Seite','Language of Page','d',1,'<code>&lt;html lang="de"&gt;</code> ist gesetzt. Sonst liest der Screenreader deutschen Text mit englischer Aussprache.'],
['3.1.2','AA','Sprache von Teilen','Language of Parts','c',0,'Fremdsprachige Passagen haben ein eigenes <code>lang</code>-Attribut – wie die englischen Namen auf dieser Seite.'],
['3.2.1','A','Bei Fokus','On Focus','d',0,'Fokus allein löst keinen Kontextwechsel aus: kein Absenden, kein Seitenwechsel, kein Popup beim Hineintabben.'],
['3.2.2','A','Bei Eingabe','On Input','d',0,'Eine Auswahl oder Eingabe wechselt nicht unerwartet den Kontext. Ein Select, das sofort die Seite lädt, braucht vorher einen Hinweis.'],
['3.2.3','AA','Konsistente Navigation','Consistent Navigation','g',0,'Wiederkehrende Navigation steht auf jeder Seite an derselben Stelle, in derselben Reihenfolge.'],
['3.2.4','AA','Konsistente Erkennung','Consistent Identification','g',0,'Gleiche Funktion heißt überall gleich und sieht gleich aus: nicht hier „Suchen“, dort „Finden“.'],
['3.2.6','A','Konsistente Hilfe','Consistent Help','g',0,'Gibt es Hilfe (Kontakt, Chat, FAQ), steht sie auf jeder Seite an derselben Stelle.',1],
['3.3.1','A','Fehlererkennung','Error Identification','d',0,'Erkannte Eingabefehler werden als Text beschrieben und dem Feld zugeordnet – nicht nur roter Rahmen.'],
['3.3.2','A','Beschriftungen oder Anweisungen','Labels or Instructions','d',1,'Eingabefelder haben ein Label und, wo nötig, eine Anleitung: Format, Pflichtfeld, erlaubte Werte.'],
['3.3.3','AA','Fehlerempfehlung','Error Suggestion','c',0,'Die Fehlermeldung sagt, wie es richtig geht: „Datum im Format TT.MM.JJJJ“ statt „Ungültige Eingabe“.'],
['3.3.4','AA','Fehlervermeidung (rechtlich, finanziell, Daten)','Error Prevention (Legal, Financial, Data)','d',0,'Bei Käufen, Verträgen und Löschungen: rückgängig machen, vorher prüfen oder ausdrücklich bestätigen.'],
['3.3.7','A','Redundante Eingabe','Redundant Entry','d',0,'Was jemand in diesem Ablauf schon eingegeben hat, wird vorausgefüllt oder ist auswählbar – nicht erneut abgefragt.',1],
['3.3.8','AA','Barrierefreie Authentifizierung (Minimum)','Accessible Authentication (Minimum)','d',0,'Login ohne Gedächtnis- oder Rätseltest: Einfügen und Passwortmanager erlaubt, keine Zeichen abtippen, keine Rechenaufgabe.',1],
['4.1.2','A','Name, Rolle, Wert','Name, Role, Value','d',1,'Jedes Bedienelement hat einen Namen, eine Rolle und seinen Zustand im Code. Native Elemente bringen das mit; eigene brauchen ARIA.'],
['4.1.3','AA','Statusmeldungen','Status Messages','d',0,'Meldungen ohne Seitenwechsel – „Gespeichert“, „12 Treffer“, „Fehler beim Laden“ – werden über eine Live-Region angesagt, ohne den Fokus zu verschieben.']
].map(([nr,lvl,de,en,roles,auto,text,neu])=>({nr,lvl,de,en,roles:[...roles],auto:!!auto,text,neu:!!neu,p:+nr[0]-1,

const W_BY=Object.fromEntries(WCAG.map(w=>[w.nr,w]));
const wSlug=nr=>'k-'+nr.replace(/\./g,'-');

/* Kriterium → Lektionen: aus den refs der Lektionen abgeleitet, plus ein paar Ergänzungen */
const W_LESSONS={};
const wAddLesson=(nr,id)=>{const a=W_LESSONS[nr]??=[];if(BY_ID[id]&&!a.includes(id))a.push(id)};
LESSONS.forEach(l=>l.refs.forEach(r=>{const m=/^WCAG (\d\.\d\.\d+)/.exec(r);if(m&&W_BY[m[1]])wAddLesson(m[1],l.id)}));

{id:'button',name:'Button',icon:'button',
 crit:['4.1.2','2.1.1','2.5.3','2.5.8','2.4.7','1.4.11'],
 rule:'Alles, was eine Aktion auslöst, ist ein echtes <code>&lt;button&gt;</code>. Dann gibt es Fokus, Enter, Leertaste und die Rolle „Schaltfläche“ gratis.',
 dos:['<code>&lt;button type="button"&gt;</code> für Aktionen, <code>&lt;a href&gt;</code> für Navigation – nie <code>&lt;div (click)&gt;</code>.','Icon-Buttons brauchen einen zugänglichen Namen, meist <code>aria-label</code>.','Der sichtbare Text steht auch im Namen, am besten vorne (2.5.3).','Mindestens 24 × 24 px Klickfläche, besser 44 (2.5.8).','Fokusring sichtbar und mit 3 : 1 Kontrast (2.4.7, 1.4.11).','Lieber aktiv lassen und beim Klick erklären, was fehlt, als stumm <code>disabled</code>.'],
 test:['Mit Tab hinkommen, mit Enter <em>und</em> Leertaste auslösen.','Screenreader sagt „Entwurf speichern, Schaltfläche“ – nicht nur „Schaltfläche“.','DevTools → Elements → Accessibility: Name und Rolle ablesen.'],
 ng:['Die ESLint-Regeln <code>click-events-have-key-events</code> und <code>interactive-supports-focus</code> aus <code>@angular-eslint/template</code> schlagen bei <code>&lt;div (click)&gt;</code> an – einschalten, siehe Test-Routine.','ARIA dynamisch über <code>[attr.aria-label]</code>, <code>[attr.aria-expanded]</code>, <code>[attr.aria-pressed]</code> binden. Das <code>attr.</code>-Präfix funktioniert in jeder Angular-Version.','<code>mat-icon-button</code> hat keinen Text: <code>aria-label</code> ist Pflicht. <code>matTooltip</code> ersetzt es nicht – auf Touch gibt es kein Hover.','<code>&lt;mat-icon&gt;</code> ist standardmäßig <code>aria-hidden="true"</code> – richtig für Icons neben Text.','In Formularen <code>type="button"</code> setzen, sonst sendet jeder Button das Formular ab. Die Regel <code>button-has-type</code> erinnert daran.'],

{id:'link',name:'Link',icon:'link',

{id:'formular',name:'Formular',icon:'form',
 crit:['1.3.1','1.3.5','3.3.1','3.3.2','3.3.3','3.3.4','3.3.7','3.3.8','3.2.2'],
 rule:'Jedes Feld hat ein sichtbares Label. Fehler stehen als Text am Feld und sagen, wie es richtig geht.',
 dos:['<code>&lt;label for&gt;</code> für jedes Feld – der Platzhalter ist kein Label.','<code>autocomplete</code> setzen (<code>email</code>, <code>given-name</code>, <code>current-password</code>): erfüllt 1.3.5, und Passwortmanager funktionieren (3.3.8).','Fehler als Text, mit <code>aria-describedby</code> verknüpft, dazu <code>aria-invalid="true"</code> am Feld.','Die Meldung nennt die Lösung, nicht nur das Problem (3.3.3).','Beim Absenden den Fokus aufs erste fehlerhafte Feld oder auf eine Fehlerübersicht.','Einfügen in Passwort- und Code-Felder nie blockieren (3.3.8).','Schon Eingegebenes nicht erneut abfragen – „Rechnungsadresse wie Lieferadresse“ (3.3.7).'],
 test:['Klick aufs Label setzt den Fokus ins Feld.','Leer absenden: Wird der Fehler vorgelesen? Wo steht der Fokus?','Browser-Autofill ausprobieren.'],
 ng:['<code>aria-invalid</code> an den Control-Zustand binden: <code>[attr.aria-invalid]="email.invalid &amp;&amp; email.touched"</code>.','Beim Submit <code>form.markAllAsTouched()</code>, dann das erste <code>.ng-invalid</code>-Feld fokussieren.','<code>mat-form-field</code> verknüpft <code>mat-label</code>, <code>mat-hint</code> und <code>mat-error</code> selbst per <code>aria-describedby</code>. <code>mat-label</code> trotzdem immer setzen.','Den Container der Fehlermeldung dauerhaft rendern und nur den Inhalt per <code>@if</code> wechseln – dann stimmt <code>aria-describedby</code> immer.','Die ESLint-Regel <code>label-has-associated-control</code> findet Felder ohne Label.'],

{id:'bild',name:'Bild & Icon',icon:'image',

{id:'modal',name:'Modal & Overlay',icon:'modal',
 crit:['2.1.2','2.4.3','4.1.2','1.4.13','2.4.11'],
 rule:'Ein Modal holt den Fokus, hält ihn fest, schließt mit Esc und gibt den Fokus beim Schließen dem Element zurück, das es geöffnet hat.',
 dos:['Beim Öffnen: Fokus aufs erste sinnvolle Element oder auf den Dialog selbst.','Tab bleibt im Dialog, Esc schließt ihn – so wird die gewollte Fokusfalle keine echte (2.1.2).','Beim Schließen: Fokus zurück auf den Auslöser (2.4.3).','<code>role="dialog"</code>, <code>aria-modal="true"</code> und <code>aria-labelledby</code> auf den Titel – oder gleich natives <code>&lt;dialog&gt;</code> mit <code>showModal()</code>.','Tooltips und Popover: per Esc schließbar, mit der Maus überfahrbar, bleiben stehen (1.4.13).','Sticky Header und Banner verdecken das fokussierte Element nicht (2.4.11); <code>scroll-padding-top</code> hilft.'],
 test:['Nur mit der Tastatur öffnen, durchtabben, mit Esc schließen. Wo steht der Fokus danach?','Screenreader: Wird der Titel beim Öffnen vorgelesen?'],

{id:'tabelle',name:'Tabelle & Liste',icon:'table',
 crit:['1.3.1','4.1.2','4.1.3','1.4.10','2.1.1'],
 rule:'Daten in Zeilen und Spalten gehören in eine echte <code>&lt;table&gt;</code> mit Kopfzellen. Sortieren und Filtern wird angesagt.',

 ng:['<code>mat-table</code> rendert echte Tabellenrollen, <code>matSort</code> setzt <code>aria-sort</code> selbst. Für die Ansage im <code>(matSortChange)</code> den <code>LiveAnnouncer</code> aufrufen – so zeigt es auch die Material-Doku.','<code>sortActionDescription</code> am <code>mat-sort-header</code> gibt dem Sortier-Button einen Namen.','<code>@for (row of rows; track row.id)</code>: Mit einem stabilen <code>track</code> verwendet Angular DOM-Knoten wieder, der Fokus bleibt bei Updates in der richtigen Zeile. <code>track $index</code> verliert ihn beim Sortieren.','Virtuelles Scrollen (<code>cdk-virtual-scroll-viewport</code>) nimmt Zeilen aus dem DOM – Screenreader kennen die Gesamtzahl nicht. <code>aria-rowcount</code> setzen oder Pagination nehmen.'],

  return `<article class="lesson" aria-labelledby="lesson-title">
  ${kHead('WCAG für Frontend-Devs','WCAG 2.2 hat 86 Prüfkriterien. Für dich zählen 55: alle auf Stufe A und AA. Die meisten davon entscheidest du im Template – nicht im Design und nicht erst im Test.')}
  <ul class="refs" aria-label="Normen und Quellen" style="margin-top:16px" data-anno="Chips"><li>WCAG 2.2</li><li>EN 301 549</li><li>EAA · BaFG</li><li>Angular CDK a11y</li></ul>
  <h2>Die Zahlen</h2>
  <dl class="numbers" data-anno="Description List (dl)"><div class="num"><dt>55</dt><dd>Kriterien auf A und AA (${n('A')} + ${n('AA')}) – diese Stufe verlangen die Gesetze</dd></div><div class="num"><dt>4,5 : 1</dt><dd>Mindestkontrast für Text – der häufigste Fehler im Web</dd></div><div class="num"><dt>28.06.2025</dt><dd>seitdem gilt der European Accessibility Act, in Österreich als BaFG</dd></div><div class="num"><dt>30–57 %</dt><dd>der Probleme finden automatische Tools, je nach Studie. Den Rest findest nur du</dd></div></dl>
  <h2>Vier Prinzipien: POUR</h2>
  <p class="prose" style="margin:0 0 12px">Jedes Kriterium hängt an einem von vier Prinzipien. Die Nummer verrät es: 2.4.7 gehört zu Prinzip 2, Bedienbar.</p>
  <ul class="tiers" data-anno="Cards (Grid)">${PRINC.map((p,i)=>`<li><b>${i+1} · ${p}</b>${PRINC_Q[i]}<br><span class="hint">${WCAG.filter(w=>w.p===i).length} Kriterien</span></li>`).join('')}</ul>
  <h2>A, AA, AAA – was davon?</h2>
  <div class="k-cols" data-anno="Cards (Grid)">
    <div class="k-box"><h3>Stufe A</h3><p>Das Minimum. Fehlt es, ist die Seite für manche Menschen <em>gar nicht</em> benutzbar: keine Tastatur, kein Alt-Text, keine Labels.</p></div>
    <div class="k-box"><h3>Stufe AA</h3><p>Das Ziel. Gesetze und Ausschreibungen verlangen A plus AA. Kontrast, Zoom, sichtbarer Fokus und Statusmeldungen kommen hier dazu.</p></div>
    <div class="k-box"><h3>Stufe AAA</h3><p>Die Kür. Selbst das W3C empfiehlt AAA nicht für ganze Websites. Einzelnes lohnt sich trotzdem, etwa reduzierte Bewegung (2.3.3).</p></div>

  <h2>Was das Gesetz sagt</h2>

  <p class="prose" style="margin:0 0 12px">Die WebAIM Million prüft jedes Jahr die eine Million meistbesuchten Startseiten. Rund 95 % haben automatisch erkennbare Fehler – und seit Jahren sind es dieselben sechs:</p>

function kCritInit(root,sub,params){
  const q=$('#k-q',root),neu=$('#k-neu',root),count=$('#k-count',root),empty=$('#k-empty',root),cards=$$('.k-crit',root),secs=$$('.k-sec',root);
  const val=n=>$(`input[name="k-${n}"]:checked`,root).value;
  const setVal=(n,v)=>{($(`input[name="k-${n}"][value="${CSS.escape(v)}"]`,root)||$(`input[name="k-${n}"]`,root)).checked=true};
  q.value=params.get('q')||'';['stufe','rolle','test'].forEach(n=>setVal(n,params.get(n)||''));neu.checked=params.get('neu')==='1';
  let t;
  function apply(user,typed){
    const s=norm(q.value.trim()),st=val('stufe'),ro=val('rolle'),te=val('test'),nu=neu.checked;
    let n=0;
    cards.forEach(el=>{const w=W_BY[el.dataset.nr];
      const ok=(!st||w.lvl===st)&&(!ro||w.roles.includes(ro))&&(!te||(te==='tool')===w.auto)&&(!nu||w.neu)&&(!s||norm(`${w.nr} ${w.de} ${w.en} ${w.text.replace(/<[^>]+>/g,'')}`).includes(s));
      el.hidden=!ok;if(ok)n++});
    secs.forEach(sec=>{sec.hidden=!$('.k-crit:not([hidden])',sec)});
    // „Bauteile zeigen“ beschriftet nur die erste sichtbare Karte, nicht alle 55
    $$('.k-crit [data-anno], .k-crit[data-anno]',root).forEach(el=>el.removeAttribute('data-anno'));
    const first=cards.find(el=>!el.hidden);
    if(first){first.dataset.anno='Card (article)';$('.k-meta',first).dataset.anno='Badges';$('.k-links',first).dataset.anno='Links'}
    empty.hidden=n>0;
    clearTimeout(t);t=setTimeout(()=>{count.textContent=n===WCAG.length?`Alle ${n} Kriterien`:`${n} von ${WCAG.length} Kriterien`},typed?400:0);
    if(!user)return;
    const p=new URLSearchParams();
    if(q.value.trim())p.set('q',q.value.trim());if(st)p.set('stufe',st);if(ro)p.set('rolle',ro);if(te)p.set('test',te);if(nu)p.set('neu','1');
    const qs=p.toString();
    history.replaceState(null,'','#wcag-kriterien'+(qs?'?'+qs:''));
  }
  const form=$('#k-filter',root);
  form.addEventListener('input',e=>apply(true,e.target===q));
  form.addEventListener('submit',e=>e.preventDefault());
  $('#k-reset',root).addEventListener('click',()=>{q.value='';['stufe','rolle','test'].forEach(n=>setVal(n,''));neu.checked=false;apply(true);q.focus()});
  apply(false);
  const hit=sub&&$('#'+wSlug(sub),root);
  if(hit){hit.classList.add('k-hit');requestAnimationFrame(()=>hit.scrollIntoView({block:'start'}))}
  return ()=>clearTimeout(t);
}

function kCheckInit(root){
  let done=kChecked();
  const upd=()=>{
    const n=done.size,N=CHECK_IDS.length;
    $('#kc-label',root).textContent=`${n} von ${N} Punkten erledigt`;
    const bar=$('#kc-bar',root);bar.setAttribute('aria-valuenow',n);bar.style.setProperty('--p',(n/N*100)+'%');
  };
  const save=()=>{store.set('wcag-check',[...done]);upd()};
  root.addEventListener('change',e=>{const id=e.target.dataset?.id;if(!id)return;if(e.target.checked)done.add(id);else done.delete(id);save()});
  $('#kc-copy',root).addEventListener('click',async()=>{
    const strip=s=>s.replace(/<code>(.*?)<\/code>/g,'`$1`').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
    const md='## Barrierefreiheit (WCAG 2.2 AA)\n'+CHECK.map(([sec,items])=>`\n### ${sec}\n`+items.map(([id,t,crit])=>`- [${done.has(id)?'x':' '}] ${strip(t)}${crit?` (${crit.split(' ').join(', ')})`:''}`).join('\n')).join('\n')+'\n';
    try{await navigator.clipboard.writeText(md);toast({msg:`Checkliste kopiert – ${done.size} von ${CHECK_IDS.length} abgehakt.`,type:'success',duration:3500})}
    catch(err){toast({msg:'Kopieren ging nicht – der Browser hat die Zwischenablage blockiert.',type:'error'})}
  });
  $('#kc-reset',root).addEventListener('click',()=>{
    if(!done.size){toast({msg:'Es ist noch nichts abgehakt.',duration:2500});return}
    const before=[...done];done=new Set();save();
    $$('input[data-id]',root).forEach(cb=>cb.checked=false);
    toast({msg:`${before.length} Haken entfernt.`,action:{label:'Rückgängig',fn:()=>{done=new Set(before);save();$$('input[data-id]',root).forEach(cb=>cb.checked=done.has(cb.dataset.id))}}});
  });
  upd();
}

function duList(el,names,bad){
  /* Löschliste für „Rückgängig schlägt Nachfrage“ */
  let items=[...names];
  const ul=$('ul',el);
  const draw=()=>{
    ul.innerHTML=items.length?items.map((n,i)=>`<li><span>${n}</span><span class="du-li-act" data-i="${i}"><button type="button" class="btn btn-ghost du-sm" data-del="${i}">Löschen</button></span></li>`).join(''):'<li class="hint">Alles gelöscht.</li>';
  };
  ul.addEventListener('click',e=>{
    const del=e.target.closest('[data-del]'),yes=e.target.closest('[data-yes]'),no=e.target.closest('[data-no]');
    if(del&&bad){const i=+del.dataset.del;del.parentElement.innerHTML=`<span class="du-ask">Wirklich?</span><button type="button" class="btn btn-danger du-sm" data-yes="${i}">Ja</button><button type="button" class="btn btn-ghost du-sm" data-no>Nein</button>`;$('[data-yes]',ul).focus()}
    else if(del){const i=+del.dataset.del,[gone]=items.splice(i,1);draw();
      toast({msg:`„${gone}“ gelöscht.`,action:{label:'Rückgängig',fn:()=>{items.splice(i,0,gone);draw()}}})}
    else if(yes){items.splice(+yes.dataset.yes,1);draw()}
    else if(no)draw();
  });
  draw();
}
