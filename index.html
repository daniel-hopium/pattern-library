        $('#cls-slot',root).innerHTML=`<div class="cls-ad"><button type="button" class="btn btn-secondary" id="cls-news">${tx('Newsletter abonnieren','Subscribe to newsletter')}</button><span class="hint">${tx('10 % Rabatt auf die erste Bestellung','10% off your first order')}</span></div>`;
        const dy=Math.round($('#cls-buy',root).getBoundingClientRect().top-y0);
        out.textContent=dy?tx(`Der Button ist um ${dy} px nach unten gesprungen. An seiner Stelle sitzt jetzt „Newsletter abonnieren“.`,`The button jumped ${dy} px down. “Subscribe to newsletter” now sits in its place.`):tx('Nichts ist gesprungen – der Platz war reserviert.','Nothing jumped – the space was reserved.');
      },1100);
    });
    stage.addEventListener('click',e=>{
      if(e.target.closest('#cls-buy'))out.textContent=tx('In den Warenkorb gelegt.','Added to cart.');
      if(e.target.closest('#cls-news'))out.textContent=tx('Newsletter abonniert statt Schuh gekauft. Genau das misst CLS.','Subscribed to the newsletter instead of buying the boot. That’s exactly what CLS measures.');
    });
    const tick=$('#inp-tick',root),spin=$('#inp-spin',root),rm=reducedMotion();
    const loop=()=>{n++;tick.textContent=n;if(!rm)spin.style.transform=`rotate(${n*6}deg)`;raf=requestAnimationFrame(loop)};
    raf=requestAnimationFrame(loop);
    const io=$('#inp-out',root),busy=ms=>{const e=performance.now()+ms;while(performance.now()<e){}};
    $('#inp-bad',root).addEventListener('click',e=>{
      const b=e.currentTarget,t0=performance.now();busy(600);b.classList.add('flash');
      requestAnimationFrame(()=>{io.textContent=tx(`Erste sichtbare Reaktion nach ${Math.round(performance.now()-t0)} ms. So lange war die Seite eingefroren – der Zähler stand still. INP: schlecht.`,`First visible response after ${Math.round(performance.now()-t0)} ms. That’s how long the page was frozen – the counter stood still. INP: poor.`);setTimeout(()=>b.classList.remove('flash'),400)});
    });
    $('#inp-good',root).addEventListener('click',async e=>{
      const b=e.currentTarget;if(b.getAttribute('aria-busy'))return;
      const t0=performance.now();b.classList.add('is-loading');b.setAttribute('aria-busy','true');
      await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
      const first=Math.round(performance.now()-t0);
      for(let i=0;i<12;i++){busy(50);await new Promise(r=>setTimeout(r,0))}
      b.classList.remove('is-loading');b.removeAttribute('aria-busy');
      io.textContent=tx(`Erste Reaktion nach ${first} ms, fertig nach ${Math.round(performance.now()-t0)} ms. Die Arbeit lief in 12 Häppchen, der Zähler lief weiter. INP: gut.`,`First response after ${first} ms, done after ${Math.round(performance.now()-t0)} ms. The work ran in 12 small chunks, and the counter kept going. INP: good.`);
    });
    return()=>{clearTimeout(tl);cancelAnimationFrame(raf)};
  },
  do:tx([`Platz für Bilder, Banner und Werbung reservieren (<code>width</code>/<code>height</code> oder <code>aspect-ratio</code>).`,`Bei jeder Eingabe sofort sichtbar reagieren, lange Arbeit in kleine Stücke teilen.`,`Das wichtigste Bild früh laden, alles unterhalb des sichtbaren Bereichs später (<code>loading="lazy"</code>).`],[`Reserve space for images, banners and ads (<code>width</code>/<code>height</code> or <code>aspect-ratio</code>).`,`Respond visibly to every input right away, and split long work into small chunks.`,`Load the most important image early, and everything below the visible area later (<code>loading="lazy"</code>).`]),
  dont:tx([`Bilder und Banner ohne reservierte Höhe.`,`Lange Berechnung im Klick-Handler, ohne zuerst Feedback zu zeigen.`,`Fünf Webfonts in je vier Schnitten.`],[`Images and banners without a reserved height.`,`A long calculation in the click handler without showing feedback first.`,`Five web fonts with four weights each.`]),
  why:tx(`<p>Nutzer erleben keine Millisekunden, sondern „die App hängt“, „der Button hat nicht reagiert“ oder „ich habe das Falsche angeklickt“. Genau diese drei Erlebnisse messen die Core Web Vitals.</p><p>Google misst sie an echten Besuchen und wertet das 75. Perzentil aus: Drei von vier Besuchen müssen im grünen Bereich liegen. Die Werte fließen auch ins Suchranking ein.</p><p>Der größte Hebel ist oft einfach: Platz reservieren (gegen CLS), sofort Feedback zeigen und Arbeit aufteilen (gegen schlechten INP), das wichtigste Bild zuerst laden (für LCP).</p>`,`<p>Users don’t experience milliseconds, they experience “the app is stuck”, “the button didn’t respond” or “I clicked the wrong thing”. Those three experiences are exactly what the Core Web Vitals measure.</p><p>Google measures them on real visits and looks at the 75th percentile: three out of four visits have to be in the green. The values also feed into search ranking.</p><p>The biggest lever is often simple: reserve space (against CLS), show feedback right away and split up work (against poor INP), load the most important image first (for LCP).</p>`),
  here:tx(`Die ganze App ist eine Datei ohne Framework. Schriften laden mit <code>font-display: swap</code>: Der Text ist sofort lesbar, die Schrift kommt nach. Der Preis dafür: Beim Tausch kann der Text minimal springen.`,`The whole app is a single file without a framework. Fonts load with <code>font-display: swap</code>: the text is readable right away, and the font follows. The price: the text can shift slightly when the font swaps in.`)
},
{
  id:'i18n',cat:'Qualität',title:tx('Internationalisierung (i18n)','Internationalization (i18n)'),
  short:tx('Längere Texte einplanen, Zahlen mit Intl formatieren, RTL mitdenken.','Plan for longer text, format numbers with Intl, keep RTL in mind.'),
  keys:'i18n l10n übersetzung sprache internationalisierung lokalisierung intl datum zahl währung rtl arabisch lang translation language internationalization localization locale date number currency arabic right-to-left',
  refs:['WCAG 3.1.1 · A','WCAG 3.1.2 · AA','Intl API'],
  rule:tx(`Texte, Zahlen, Daten und Leserichtung gehören nie fest ins Layout. Plane für <strong>längere Übersetzungen</strong>, formatiere mit der Intl-API und setze die Sprache im HTML (<code>lang</code>).`,`Text, numbers, dates and reading direction never belong hard-coded in the layout. Plan for <strong>longer translations</strong>, format with the Intl API and set the language in the HTML (<code>lang</code>).`),
  numbers:tx([['+ 20–35 %','Deutsch gegenüber Englisch, kurze Labels oft mehr'],['Intl','Zahlen, Beträge, Datum je Sprache und Region'],['lang','Screenreader wählt die richtige Aussprache'],['inline-start','statt left – spiegelt sich bei RTL']],[['+ 20–35%','German vs. English, often more for short labels'],['Intl','numbers, amounts, dates per language and region'],['lang','the screen reader picks the right pronunciation'],['inline-start','instead of left – mirrors in RTL']]),
  demo:`
  <fieldset class="seg"><legend>${tx('Sprache und Region','Language and region')}</legend><div class="seg-opts">
    <label><input type="radio" name="i18n-loc" value="de-AT"${tx(' checked','')}>${tx('Deutsch (AT)','<span lang="de">Deutsch (AT)</span>')}</label>
    <label><input type="radio" name="i18n-loc" value="de-DE">${tx('Deutsch (DE)','<span lang="de">Deutsch (DE)</span>')}</label>
    <label><input type="radio" name="i18n-loc" value="en-US"${tx('',' checked')}><span lang="en">English (US)</span></label>
    <label><input type="radio" name="i18n-loc" value="fr-FR"><span lang="fr">Français</span></label>
    <label><input type="radio" name="i18n-loc" value="ar-EG"><span lang="ar">العربية</span></label>
  </div></fieldset>
  <dl class="i18n-out" id="i18n-out"></dl>
  <p class="demo-note" style="margin:0">${tx('Vergleich Österreich und Deutschland: „€ 1.234,50“ gegen „1.234,50 €“ und „Jänner“ gegen „Januar“ – dieselbe Sprache, andere Region.','Compare Austria and Germany: “€ 1.234,50” vs. “1.234,50 €” and <span lang="de">“Jänner”</span> vs. <span lang="de">“Januar”</span> – same language, different region.')}</p>
  <div>
    <h3>${tx('Leserichtung: links nach rechts – oder umgekehrt','Reading direction: left to right – or the other way around')}</h3>
    <div class="i18n-card" id="i18n-card"></div>
    <p class="demo-note">${tx('Wähl „العربية“: Die Karte spiegelt sich, weil sie <code>padding-inline-start</code> und <code>border-inline-start</code> statt <code>left</code> nutzt. Der Pfeil im Button dreht sich mit.','Pick <span lang="ar">“العربية”</span>: the card mirrors because it uses <code>padding-inline-start</code> and <code>border-inline-start</code> instead of <code>left</code>. The arrow in the button turns with it.')}</p>
  </div>
  <div>
    <h3>${tx('Textlänge','Text length')}</h3>
    <p style="margin:0 0 12px">${sw('i18n-fix',tx('Feste Button-Breite wie im Englischen','Fixed button width as in English'))}</p>
    <div class="xp" id="xp" inert><span class="xp-h">English</span><span class="xp-h"${tx('',' lang="de"')}>Deutsch</span>${[['Save','Speichern'],['Settings','Einstellungen'],['Download','Herunterladen'],['Undo','Rückgängig machen'],['Sign up','Registrieren']].map(([e,d])=>`<button class="btn btn-secondary xp-b" lang="en">${e}</button><button class="btn btn-secondary xp-b"${tx('',' lang="de"')}>${d}</button>`).join('')}</div>
  </div>`,
  init(root){
    const out=$('#i18n-out',root),card=$('#i18n-card',root);
    const TX={'de':['Nachricht von Lena','Treffen wir uns morgen um 10?','Antworten'],'en':['Message from Lena','Shall we meet tomorrow at 10?','Reply'],'fr':['Message de Lena','On se retrouve demain à 10 h ?','Répondre'],'ar':['رسالة من لينا','هل نلتقي غدًا في العاشرة؟','رد']};
    const upd=()=>{
      const loc=$('input[name="i18n-loc"]:checked',root).value,lang=loc.split('-')[0],cur={'en-US':'USD','ar-EG':'EGP'}[loc]||'EUR';
      const rtf=o=>new Intl.RelativeTimeFormat(loc,o);
      const rows=[
        [tx('Zahl','Number'),'NumberFormat',new Intl.NumberFormat(loc).format(1234567.891)],
        [tx('Betrag','Amount'),`currency: '${cur}'`,new Intl.NumberFormat(loc,{style:'currency',currency:cur}).format(1234.5)],
        [tx('Datum','Date'),"dateStyle: 'long'",new Intl.DateTimeFormat(loc,{dateStyle:'long'}).format(new Date(2027,0,15))],
        [tx('Relativ','Relative'),'RelativeTimeFormat',`${rtf({numeric:'auto'}).format(-1,'day')} · ${rtf().format(-3,'day')}`],
        [tx('Aufzählung','List'),'ListFormat',new Intl.ListFormat(loc,{type:'conjunction'}).format(['Lena','Tom','Aylin'])]
      ];
      out.innerHTML=rows.map(([k,c,v])=>`<div><dt>${k}</dt><dd class="i18n-v" lang="${loc}" dir="auto">${esc(v)}</dd><dd class="i18n-c"><code>${esc(c)}</code></dd></div>`).join('');
      const t=TX[lang];card.lang=loc;card.dir=lang==='ar'?'rtl':'ltr';
      card.innerHTML=`<span class="i18n-av" aria-hidden="true">L</span><div class="i18n-tx"><b>${t[0]}</b><span>${t[1]}</span></div><button type="button" class="btn btn-secondary i18n-reply">${t[2]}${ic('fwd','dir-ic')}</button>`;
    };
    $$('input[name="i18n-loc"]',root).forEach(r=>r.addEventListener('change',upd));
    $('#i18n-fix',root).addEventListener('toggle',e=>$('#xp',root).classList.toggle('fixed',e.detail));
    card.addEventListener('click',e=>{if(e.target.closest('.i18n-reply'))toast({msg:tx('Antwort-Feld geöffnet (Demo).','Reply field opened (demo).'),duration:2500})});
    upd();
  },
  do:tx([`Alle Texte in Übersetzungsdateien, Buttons und Spalten mit flexibler Breite.`,`Zahlen, Beträge und Daten immer über <code>Intl</code> formatieren, nie per String-Verkettung.`,`Logische CSS-Eigenschaften (<code>margin-inline-start</code>, <code>inset-inline-end</code>) statt <code>left</code>/<code>right</code>.`],[`All text in translation files; buttons and columns with flexible widths.`,`Always format numbers, amounts and dates with <code>Intl</code>, never by concatenating strings.`,`Logical CSS properties (<code>margin-inline-start</code>, <code>inset-inline-end</code>) instead of <code>left</code>/<code>right</code>.`]),
  dont:tx([`Buttons mit fester Breite, in die nur der englische Text passt.`,`Zahlen und Daten selbst zusammensetzen: „1,234.50 €“, „09/25/26“.`,`<code>left</code> und <code>right</code> statt <code>inline-start</code>/<code>-end</code> – in RTL steht alles falsch herum.`],[`Fixed-width buttons that only fit the English text.`,`Assembling numbers and dates yourself: “1,234.50 €”, “09/25/26”.`,`<code>left</code> and <code>right</code> instead of <code>inline-start</code>/<code>-end</code> – in RTL everything ends up backwards.`]),
  why:tx(`<p>i18n (internationalization: i + 18 Buchstaben + n) heißt, eine App so zu bauen, dass sie sich ohne Code-Änderung übersetzen lässt. l10n (localization) ist die eigentliche Anpassung an eine Sprache und Region.</p><p>Die typischen Brüche: Texte, die auf Deutsch nicht mehr in den Button passen, selbst zusammengebaute Zahlen und Daten, und Layouts mit <code>left</code>/<code>right</code>, die in arabischer oder hebräischer Schrift falsch herum stehen.</p><p>Das <code>lang</code>-Attribut sagt dem Screenreader, welche Aussprache er nehmen soll (WCAG 3.1.1). Ohne liest eine englische Stimme deutschen Text wie Kauderwelsch. Einzelne fremdsprachige Wörter bekommen ihr eigenes <code>lang</code> (3.1.2) – wie „العربية“ in der Auswahl oben.</p>`,`<p>i18n (internationalization: i + 18 letters + n) means building an app so it can be translated without changing code. l10n (localization) is the actual adaptation to a language and region.</p><p>The typical breakages: text that no longer fits in the button once it’s in German, hand-assembled numbers and dates, and layouts with <code>left</code>/<code>right</code> that end up backwards in Arabic or Hebrew script.</p><p>The <code>lang</code> attribute tells the screen reader which pronunciation to use (WCAG 3.1.1). Without it, an English voice reads German text like gibberish. Individual foreign-language words get their own <code>lang</code> (3.1.2) – like <span lang="ar">“العربية”</span> in the picker above.</p>`),
  here:tx(`Die App gibt es auf Deutsch und Englisch. Ein Link im Kopfbereich wechselt in die andere Sprache und ist in der Zielsprache selbst beschriftet („English“ bzw. „Deutsch“) – mit einem <code>lang</code>-Attribut am Link (WCAG 3.1.2, Sprache von Teilen). Beim Laden setzt die App <code>lang</code> am html-Element auf die Seitensprache (WCAG 3.1.1). Die Sprache steht als <code>?lang=en</code> in der URL, so lassen sich Links gezielt in einer Sprache teilen. Die Wahl merkt sich die App im localStorage, sonst folgt sie der Browsersprache. Zahlen und Daten laufen über <code>Intl</code> mit dem Gebietsschema der Seite – auf Deutsch <code>de-AT</code>, darum steht dort „€ 149,00“ und nicht „149,00 €“.`,`The app comes in German and English. A link in the header switches to the other language and is labeled in that language itself (“English” or <span lang="de">“Deutsch”</span>), with a <code>lang</code> attribute on the link (WCAG 3.1.2 Language of Parts). On load, the app sets <code>lang</code> on the html element to the page language (WCAG 3.1.1). The language sits in the URL as <code>?lang=en</code>, so you can share a link in a specific language. The app remembers your choice in localStorage and otherwise follows your browser language. Numbers and dates go through <code>Intl</code> with the page locale – <code>en-US</code> in English, which is why you see “€149.00” and not “149,00 €”.`)
},
{
  id:'dark-patterns',cat:'Qualität',title:tx('Dark Patterns & faire Einwilligung','Dark patterns & fair consent'),
  short:tx('Ablehnen so leicht wie Zustimmen – alles andere ist Manipulation.','Rejecting as easy as accepting – anything else is manipulation.'),
  keys:'dark patterns deceptive design cookie banner consent einwilligung dsgvo gdpr confirmshaming kündigung abo cancellation subscription manipulation pre-checked roach motel false urgency',
  refs:tx(['DSGVO Art. 7','DSA Art. 25','EDPB-Leitlinien 03/2022'],['GDPR Art. 7','DSA Art. 25','EDPB Guidelines 03/2022']),
  rule:tx(`Eine Oberfläche darf niemanden zu Entscheidungen drängen, die er so nicht treffen würde. <strong>Ablehnen ist so einfach wie Zustimmen</strong>, Kündigen so einfach wie Abschließen.`,`An interface must not push anyone into decisions they wouldn’t otherwise make. <strong>Rejecting is as easy as accepting</strong>, canceling as easy as signing up.`),
  numbers:tx([['1 Klick','Ablehnen so leicht wie Zustimmen'],['gleich stark','„Ablehnen“ und „Akzeptieren“ sehen gleich aus'],['0','vorangekreuzte Einwilligungen'],['Art. 7 (3)','Widerruf so einfach wie Einwilligung (DSGVO)']],[['1 click','rejecting as easy as accepting'],['equal weight','“Reject” and “Accept” look the same'],['0','pre-checked consents'],['Art. 7 (3)','withdrawing as easy as consenting (GDPR)']]),
  demo:`
  <p class="dp-out" id="dp-out" aria-live="polite">${tx('Aufgabe: Lehne in beiden Bannern alle optionalen Cookies ab. Zähl mit, wie viele Klicks es braucht.','Task: reject all optional cookies in both banners. Count how many clicks it takes.')}</p>
  <div class="compare">
    <figure><figcaption class="tag tag-bad">${ic('xc')} ${tx('Manipulativ','Manipulative')}</figcaption><div class="cb" id="dp-bad"></div></figure>
    <figure><figcaption class="tag tag-good">${ic('ok')} Fair</figcaption><div class="cb" id="dp-good"></div></figure>
  </div>
  <div>
    <h3>${tx('Weitere Muster, die du erkennen solltest','More patterns you should recognize')}</h3>
    <div class="table-wrap"><table class="sem">
      <thead><tr><th scope="col">${tx('Muster','Pattern')}</th><th scope="col">${tx('Beispiel','Example')}</th><th scope="col">${tx('Fair wäre','Fair would be')}</th></tr></thead>
      <tbody>
        <tr><th scope="row">Confirmshaming</th><td>${tx('„Nein danke, ich zahle lieber den vollen Preis.“','“No thanks, I’d rather pay full price.”')}</td><td>${tx('„Nein, danke.“','“No, thanks.”')}</td></tr>
        <tr><th scope="row">Roach Motel</th><td>${tx('Abo in einem Klick, Kündigung nur per Brief','Subscribe in one click, cancel only by letter')}</td><td>${tx('Kündigen so einfach wie abschließen (in DE: Kündigungsbutton, § 312k BGB)','Canceling as easy as signing up (in Germany: a cancellation button, § 312k BGB)')}</td></tr>
        <tr><th scope="row">${tx('Vorangekreuzt','Pre-checked')}</th><td>${tx('„Newsletter erhalten“ ist schon angehakt','“Receive newsletter” is already checked')}</td><td>${tx('Leere Checkbox, aktive Zustimmung','Empty checkbox, active consent')}</td></tr>
        <tr><th scope="row">${tx('Falsche Dringlichkeit','False urgency')}</th><td>${tx('„Nur noch 1 Zimmer! 14 Personen sehen sich das an.“ ohne echte Grundlage','“Only 1 room left! 14 people are looking at this.” with no real basis')}</td><td>${tx('Echte Verfügbarkeit – oder gar nichts','Real availability – or nothing at all')}</td></tr>
        <tr><th scope="row">Sneak into Basket</th><td>${tx('Reiseversicherung liegt automatisch im Warenkorb','Travel insurance lands in the cart automatically')}</td><td>${tx('Zusatzleistung als Angebot, nicht vorausgewählt','Add-on as an offer, not preselected')}</td></tr>
      </tbody>
    </table></div>
  </div>`,
  init(root){
    const out=$('#dp-out',root),bad=$('#dp-bad',root),good=$('#dp-good',root);let bc=0,gc=0;
    const k=n=>n===1?tx('Klick','click'):tx('Klicks','clicks');
    const CL={Statistik:'Statistics',Marketing:'Marketing',Personalisierung:'Personalization'};
    const renderBad=v=>{
      bad.innerHTML=v==='main'?`<p class="cb-t"><b>${tx('Wir respektieren deine Privatsphäre!','We respect your privacy!')}</b></p><p class="cb-p">${tx('Wir und unsere 847 Partner verwenden Cookies, um dir das beste Erlebnis zu bieten.','We and our 847 partners use cookies to give you the best experience.')}</p><button type="button" class="btn btn-primary cb-big" data-a="accept">${tx('Alle akzeptieren','Accept all')}</button><button type="button" class="cb-weak" data-a="settings">${tx('Einstellungen','Settings')}</button>`
        :v==='settings'?`<p class="cb-t"><b>${tx('Deine Einstellungen','Your settings')}</b></p>${['Statistik','Marketing','Personalisierung'].map(x=>`<div class="check-row"><input type="checkbox" id="dp-${x}" checked data-a="tick"><label for="dp-${x}">${tx(x,CL[x])}</label></div>`).join('')}<button type="button" class="btn btn-primary cb-big" data-a="accept">${tx('Alle akzeptieren','Accept all')}</button><button type="button" class="cb-weak" data-a="save">${tx('Auswahl speichern','Save selection')}</button>`
        :`<p class="cb-t"><b>${tx('Erledigt.','Done.')}</b></p><button type="button" class="btn btn-ghost" data-a="reset">${tx('Banner zurücksetzen','Reset banner')}</button>`;
    };
    const renderGood=done=>{
      good.innerHTML=done?`<p class="cb-t">${tx('<b>Gespeichert.</b> Du kannst das jederzeit unter „Datenschutz“ ändern.','<b>Saved.</b> You can change this any time under “Privacy”.')}</p><button type="button" class="btn btn-ghost" data-a="reset">${tx('Banner zurücksetzen','Reset banner')}</button>`
        :`<p class="cb-t"><b>${tx('Cookies auf dieser Seite','Cookies on this site')}</b></p><p class="cb-p">${tx('Notwendige Cookies sind immer aktiv. Statistik und Marketing nur mit deiner Zustimmung.','Necessary cookies are always active. Statistics and marketing only with your consent.')}</p><div class="btn-row"><button type="button" class="btn btn-secondary" data-a="reject">${tx('Alle ablehnen','Reject all')}</button><button type="button" class="btn btn-secondary" data-a="accept">${tx('Alle akzeptieren','Accept all')}</button></div><button type="button" class="btn btn-ghost" data-a="choose">${tx('Einzeln auswählen','Choose individually')}</button>`;
    };
    renderBad('main');renderGood(false);
    bad.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='reset'){bc=0;renderBad('main');$('button',bad).focus();return}
      bc++;
      if(a==='settings'){renderBad('settings');$('input',bad).focus()}
      if(a==='accept'){renderBad('done');$('button',bad).focus();out.textContent=tx(`Links: nach ${bc} ${k(bc)} allem zugestimmt. Genau dafür ist dieses Banner gebaut.`,`Left: accepted everything after ${bc} ${k(bc)}. That’s exactly what this banner is built for.`)}
      if(a==='save'){const n=$$('input:checked',bad).length;renderBad('done');$('button',bad).focus();out.textContent=n?tx(`Links: gespeichert – aber ${n} vorangekreuzte Kategorien waren noch aktiv.`,`Left: saved – but ${n} pre-checked ${n===1?'category was':'categories were'} still active.`):tx(`Links: nach ${bc} ${k(bc)} alles abgelehnt. Rechts wäre es 1 Klick.`,`Left: rejected everything after ${bc} ${k(bc)}. On the right it would take 1 click.`)}
    });
    good.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='reset'){gc=0;renderGood(false);$('button',good).focus();return}
      gc++;
      if(a==='choose'){toast({msg:tx('Hier ginge eine Auswahl auf – ohne vorangekreuzte Kästchen.','A selection would open here – without pre-checked boxes.'),duration:3500});return}
      renderGood(true);$('button',good).focus();
      out.textContent=a==='reject'?tx(`Rechts: nach ${gc} ${k(gc)} abgelehnt.`,`Right: rejected after ${gc} ${k(gc)}.`):tx(`Rechts: zugestimmt – bewusst, mit ${gc} ${k(gc)}.`,`Right: accepted – deliberately, with ${gc} ${k(gc)}.`);
    });
  },
  do:tx([`„Alle ablehnen“ und „Alle akzeptieren“ auf derselben Ebene, gleich groß, gleich gestaltet.`,`Einwilligungen standardmäßig aus; Zustimmung ist ein aktiver Klick.`,`Kündigen, Abmelden und Widerrufen dort anbieten, wo man es sucht, mit so wenigen Schritten wie der Abschluss.`],[`“Reject all” and “Accept all” on the same level, the same size, the same style.`,`Consents off by default; agreeing is an active click.`,`Offer canceling, unsubscribing and withdrawing consent where people look for it, with as few steps as signing up.`]),
  dont:tx([`„Alle akzeptieren“ groß und bunt, „Ablehnen“ als grauer Mini-Link.`,`Confirmshaming: „Nein danke, ich zahle lieber mehr.“`,`Vorangekreuzte Checkboxen für Newsletter und Datenweitergabe.`],[`“Accept all” big and colorful, “Reject” as a tiny gray link.`,`Confirmshaming: “No thanks, I’d rather pay more.”`,`Pre-checked checkboxes for newsletters and data sharing.`]),
  why:tx(`<p>Dark Patterns (auch <em>Deceptive Patterns</em>) sind Oberflächen, die gegen die Interessen der Nutzer arbeiten: Sie verstecken Optionen, setzen Häkchen vorab oder erzeugen falschen Zeitdruck. Kurzfristig steigern sie Zahlen, langfristig kosten sie Vertrauen – und in der EU zunehmend Bußgelder.</p><p>Nach der DSGVO muss eine Einwilligung freiwillig, informiert und aktiv sein, und der Widerruf muss so einfach sein wie die Zustimmung (Art. 7). Der Digital Services Act verbietet Online-Plattformen manipulatives Design ausdrücklich (Art. 25). In Deutschland verlangt § 312k BGB seit 2022 einen Kündigungsbutton für online geschlossene Verträge.</p>`,`<p>Dark patterns (also called <em>deceptive patterns</em>) are interfaces that work against users’ interests: they hide options, pre-check boxes or create false time pressure. In the short term they boost numbers; in the long term they cost trust – and, increasingly, fines in the EU.</p><p>Under the GDPR (EU General Data Protection Regulation, <span lang="de">DSGVO</span> in German), consent must be freely given, informed and active, and withdrawing it must be as easy as giving it (Art. 7). The Digital Services Act (DSA) explicitly bans manipulative design on online platforms (Art. 25). In Germany, § 312k of the German Civil Code (BGB) has required a cancellation button for contracts concluded online since 2022.</p>`),
  here:tx(`Diese App fragt nach nichts: keine Cookies, kein Tracking, kein Newsletter. Dein Lernfortschritt liegt nur in deinem Browser. Die beste Einwilligungsfrage ist die, die man gar nicht stellen muss.`,`This app asks for nothing: no cookies, no tracking, no newsletter. Your progress lives only in your browser. The best consent question is the one you never have to ask.`)
}
);
LESSONS.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat));
const BY_ID=Object.fromEntries(LESSONS.map(l=>[l.id,l]));

/* ---------- Negative examples, one per "Falsch" item (same order) ----------
   string = static illustration (inert); {h, live, init, wide} = interactive or wide */
const CODE=s=>`<pre class="bd-code"><code>${s}</code></pre>`;

/* ---------- Brand & theme ---------- */
const BRANDS={
  fjord:{name:'Fjord',app:tx('Fjord Kompass','Fjord Compass'),letter:'F'},
  glut:{name:'Glut',app:'Glut Campus',letter:'G'},
  moos:{name:'Moos',app:tx('Moos Leitfaden','Moos Guide'),letter:'M'}
};
const hostTheme=document.documentElement.getAttribute('data-theme');
let themeMode=store.get('theme','auto');
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function lum(hex){
  let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function ratio(a,b){const[x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return(x+0.05)/(y+0.05)}
function applyBrand(b,notify){
  if(!BRANDS[b])b='fjord';
  document.documentElement.dataset.brand=b;store.set('brand',b);
  $('#brand-select').value=b;$('#logo-mark').textContent=BRANDS[b].letter;$('#app-name').textContent=BRANDS[b].app;
  updateTitle();
  window.dispatchEvent(new Event('themechange'));
  if(notify)toast({msg:tx(`Marke „${BRANDS[b].name}“ aktiv. Gleicher Code, andere Tokens.`,`Brand “${BRANDS[b].name}” active. Same code, different tokens.`),duration:3500});
}
function applyTheme(m){
  themeMode=m;store.set('theme',m);
  if(m==='auto'){if(hostTheme)document.documentElement.setAttribute('data-theme',hostTheme);else document.documentElement.removeAttribute('data-theme')}
  else document.documentElement.setAttribute('data-theme',m);
  window.dispatchEvent(new Event('themechange'));
}

['2.2.1','A','Zeiteinteilung anpassbar','Timing Adjustable','d',0,tx('Zeitlimits lassen sich abschalten, anpassen oder verlängern – mit mindestens 20 Sekunden Vorwarnung. Gilt auch für Toasts mit Aktion.','Time limits can be turned off, adjusted, or extended – with at least 20 seconds’ warning. This also applies to toasts with an action.')],
['2.2.2','A','Pausieren, beenden, ausblenden','Pause, Stop, Hide','d',0,tx('Was sich automatisch länger als 5 Sekunden bewegt, blinkt, scrollt oder aktualisiert, lässt sich anhalten.','Anything that moves, blinks, scrolls, or updates automatically for more than 5 seconds can be paused.')],
['2.3.1','A','Grenzwert von dreimaligem Blitzen','Three Flashes or Below Threshold','g',0,tx('Nichts blitzt öfter als dreimal pro Sekunde. Das kann epileptische Anfälle auslösen.','Nothing flashes more than three times per second. That can trigger epileptic seizures.')],
['2.4.1','A','Blöcke umgehen','Bypass Blocks','d',1,tx('Ein Skip-Link oder Landmarks erlauben, wiederkehrende Blöcke wie die Navigation zu überspringen.','A skip link or landmarks let you bypass repeated blocks such as the navigation.')],
['2.4.2','A','Seite mit Titel','Page Titled','d',1,tx('Jede Seite und jede Route hat einen eigenen, beschreibenden <code>&lt;title&gt;</code>.','Every page and every route has its own descriptive <code>&lt;title&gt;</code>.')],
['2.4.3','A','Fokus-Reihenfolge','Focus Order','d',0,tx('Der Fokus wandert in sinnvoller Reihenfolge. Kein positiver <code>tabindex</code>; nach Dialog oder Löschen landet der Fokus an einer sinnvollen Stelle.','Focus moves in a meaningful order. No positive <code>tabindex</code>; after a dialog or a deletion, focus lands somewhere sensible.')],
['2.4.4','A','Linkzweck (im Kontext)','Link Purpose (In Context)','c',1,tx('Der Linktext – notfalls zusammen mit seinem Satz – sagt, wohin es geht. „Hier klicken“ sagt es nicht.','The link text – if need be together with its sentence – says where it leads. “Click here” doesn’t.')],
['2.4.5','AA','Verschiedene Methoden','Multiple Ways','g',0,tx('Zu jeder Seite führen mindestens zwei Wege: Navigation, Suche, Sitemap, Verlinkung.','At least two ways lead to every page: navigation, search, sitemap, links.')],
['2.4.6','AA','Überschriften und Beschriftungen','Headings and Labels','c',0,tx('Überschriften und Labels beschreiben Thema oder Zweck. Ob es sie überhaupt gibt, regelt 1.3.1.','Headings and labels describe the topic or purpose. Whether they exist at all is covered by 1.3.1.')],
['2.4.7','AA','Fokus sichtbar','Focus Visible','d',0,tx('Der Tastaturfokus ist immer sichtbar. <code>outline: none</code> ohne Ersatz ist der Klassiker.','Keyboard focus is always visible. <code>outline: none</code> without a replacement is the classic mistake.')],
['2.4.11','AA','Fokus nicht verdeckt (Minimum)','Focus Not Obscured (Minimum)','d',0,tx('Das fokussierte Element wird nicht vollständig von Sticky Header, Cookie-Banner oder Chat-Widget verdeckt.','The focused element isn’t completely hidden by a sticky header, cookie banner, or chat widget.'),1],
['2.5.1','A','Zeigergesten','Pointer Gestures','d',0,tx('Mehrfinger- und Pfadgesten (Pinch, Wischen) haben eine Ein-Finger-Alternative, etwa Plus/Minus-Buttons.','Multi-finger and path-based gestures (pinch, swipe) have a single-finger alternative, such as plus/minus buttons.')],
['2.5.2','A','Zeigerabbruch','Pointer Cancellation','d',0,tx('Aktionen lösen beim Loslassen aus (<code>click</code>), nicht beim Drücken (<code>mousedown</code>). Wer daneben drückt, kann noch wegziehen.','Actions fire on release (<code>click</code>), not on press (<code>mousedown</code>). If you press the wrong spot, you can still drag away.')],
['2.5.3','A','Beschriftung im Namen','Label in Name','d',0,tx('Der sichtbare Text steckt auch im zugänglichen Namen, am besten am Anfang. Sonst scheitert Sprachsteuerung: „Klick Senden“.','The visible text is also part of the accessible name, ideally at the start. Otherwise voice control fails: “Click Send”.')],
['2.5.4','A','Betätigung durch Bewegung','Motion Actuation','d',0,tx('Schütteln oder Neigen ist nie die einzige Bedienung und lässt sich abschalten.','Shaking or tilting is never the only way to operate something, and it can be turned off.')],
['2.5.7','AA','Ziehbewegungen','Dragging Movements','d',0,tx('Alles, was man ziehen kann, geht auch mit einzelnen Klicks – etwa Pfeil-Buttons zum Umsortieren.','Everything you can drag also works with single clicks – for example arrow buttons for reordering.'),1],
['2.5.8','AA','Zielgröße (Minimum)','Target Size (Minimum)','g',1,tx('Klickziele sind mindestens 24 × 24 CSS-Pixel groß oder haben so viel Abstand, dass ein 24-px-Kreis nichts anderes trifft.','Click targets are at least 24 × 24 CSS pixels, or spaced so that a 24 px circle doesn’t touch anything else.'),1],
['3.1.1','A','Sprache der Seite','Language of Page','d',1,tx('<code>&lt;html lang="de"&gt;</code> ist gesetzt. Sonst liest der Screenreader deutschen Text mit englischer Aussprache.','<code>&lt;html lang="en"&gt;</code> is set. Otherwise the screen reader may read English text with, say, German pronunciation.')],
['3.1.2','AA','Sprache von Teilen','Language of Parts','c',0,tx('Fremdsprachige Passagen haben ein eigenes <code>lang</code>-Attribut – wie die englischen Namen auf dieser Seite.','Passages in another language have their own <code>lang</code> attribute – say, a German quote in an English text.')],
['3.2.1','A','Bei Fokus','On Focus','d',0,tx('Fokus allein löst keinen Kontextwechsel aus: kein Absenden, kein Seitenwechsel, kein Popup beim Hineintabben.','Focus alone doesn’t trigger a change of context: no submitting, no page change, no popup when you tab in.')],
['3.2.2','A','Bei Eingabe','On Input','d',0,tx('Eine Auswahl oder Eingabe wechselt nicht unerwartet den Kontext. Ein Select, das sofort die Seite lädt, braucht vorher einen Hinweis.','Selecting or entering something doesn’t change the context unexpectedly. A select that loads a new page right away needs a notice beforehand.')],
['3.2.3','AA','Konsistente Navigation','Consistent Navigation','g',0,tx('Wiederkehrende Navigation steht auf jeder Seite an derselben Stelle, in derselben Reihenfolge.','Repeated navigation sits in the same place on every page, in the same order.')],
['3.2.4','AA','Konsistente Erkennung','Consistent Identification','g',0,tx('Gleiche Funktion heißt überall gleich und sieht gleich aus: nicht hier „Suchen“, dort „Finden“.','The same function has the same name and look everywhere: not “Search” here and “Find” there.')],
['3.2.6','A','Konsistente Hilfe','Consistent Help','g',0,tx('Gibt es Hilfe (Kontakt, Chat, FAQ), steht sie auf jeder Seite an derselben Stelle.','If there’s help (contact, chat, FAQ), it’s in the same place on every page.'),1],
['3.3.1','A','Fehlererkennung','Error Identification','d',0,tx('Erkannte Eingabefehler werden als Text beschrieben und dem Feld zugeordnet – nicht nur roter Rahmen.','Detected input errors are described in text and tied to the field – not just a red border.')],
['3.3.2','A','Beschriftungen oder Anweisungen','Labels or Instructions','d',1,tx('Eingabefelder haben ein Label und, wo nötig, eine Anleitung: Format, Pflichtfeld, erlaubte Werte.','Input fields have a label and, where needed, instructions: format, required field, allowed values.')],
['3.3.3','AA','Fehlerempfehlung','Error Suggestion','c',0,tx('Die Fehlermeldung sagt, wie es richtig geht: „Datum im Format TT.MM.JJJJ“ statt „Ungültige Eingabe“.','The error message says how to get it right: “Date in the format MM/DD/YYYY” instead of “Invalid input”.')],
['3.3.4','AA','Fehlervermeidung (rechtlich, finanziell, Daten)','Error Prevention (Legal, Financial, Data)','d',0,tx('Bei Käufen, Verträgen und Löschungen: rückgängig machen, vorher prüfen oder ausdrücklich bestätigen.','For purchases, contracts, and deletions: allow undo, a review step, or explicit confirmation.')],
['3.3.7','A','Redundante Eingabe','Redundant Entry','d',0,tx('Was jemand in diesem Ablauf schon eingegeben hat, wird vorausgefüllt oder ist auswählbar – nicht erneut abgefragt.','Whatever someone already entered in this process is prefilled or selectable – not asked for again.'),1],
['3.3.8','AA','Barrierefreie Authentifizierung (Minimum)','Accessible Authentication (Minimum)','d',0,tx('Login ohne Gedächtnis- oder Rätseltest: Einfügen und Passwortmanager erlaubt, keine Zeichen abtippen, keine Rechenaufgabe.','Login without a memory test or puzzle: pasting and password managers allowed, no retyping characters, no math problems.'),1],
['4.1.2','A','Name, Rolle, Wert','Name, Role, Value','d',1,tx('Jedes Bedienelement hat einen Namen, eine Rolle und seinen Zustand im Code. Native Elemente bringen das mit; eigene brauchen ARIA.','Every control has a name, a role, and its state in the code. Native elements come with this built in; custom ones need ARIA.')],
['4.1.3','AA','Statusmeldungen','Status Messages','d',0,tx('Meldungen ohne Seitenwechsel – „Gespeichert“, „12 Treffer“, „Fehler beim Laden“ – werden über eine Live-Region angesagt, ohne den Fokus zu verschieben.','Messages without a page change – “Saved”, “12 results”, “Error while loading” – are announced through a live region without moving focus.')]
].map(([nr,lvl,de,en,roles,auto,text,neu])=>({nr,lvl,de,en,roles:[...roles],auto:!!auto,text,neu:!!neu,p:+nr[0]-1,
  url:'https://www.w3.org/WAI/WCAG22/Understanding/'+en.toLowerCase().replace(/[(),]/g,'').replace(/\s+/g,'-')}));
const W_BY=Object.fromEntries(WCAG.map(w=>[w.nr,w]));
const wSlug=nr=>'k-'+nr.replace(/\./g,'-');

/* Kriterium → Lektionen: aus den refs der Lektionen abgeleitet, plus ein paar Ergänzungen */
const W_LESSONS={};
const wAddLesson=(nr,id)=>{const a=W_LESSONS[nr]??=[];if(BY_ID[id]&&!a.includes(id))a.push(id)};
LESSONS.forEach(l=>l.refs.forEach(r=>{const m=/^WCAG (\d\.\d\.\d+)/.exec(r);if(m&&W_BY[m[1]])wAddLesson(m[1],l.id)}));
Object.entries({'2.4.1':['navigation'],'4.1.2':['buttons','dialog'],'3.3.8':['forms'],'2.5.3':['buttons'],'1.3.2':['semantics'],'2.4.4':['navigation']}).forEach(([nr,ids])=>ids.forEach(id=>wAddLesson(nr,id)));

const COMPS=[
{id:'button',name:'Button',icon:'button',
 crit:['4.1.2','2.1.1','2.5.3','2.5.8','2.4.7','1.4.11'],
 rule:tx('Alles, was eine Aktion auslöst, ist ein echtes <code>&lt;button&gt;</code>. Dann gibt es Fokus, Enter, Leertaste und die Rolle „Schaltfläche“ gratis.','Anything that triggers an action is a real <code>&lt;button&gt;</code>. Then you get focus, Enter, Space, and the role “button” for free.'),
 dos:tx(['<code>&lt;button type="button"&gt;</code> für Aktionen, <code>&lt;a href&gt;</code> für Navigation – nie <code>&lt;div (click)&gt;</code>.','Icon-Buttons brauchen einen zugänglichen Namen, meist <code>aria-label</code>.','Der sichtbare Text steht auch im Namen, am besten vorne (2.5.3).','Mindestens 24 × 24 px Klickfläche, besser 44 (2.5.8).','Fokusring sichtbar und mit 3 : 1 Kontrast (2.4.7, 1.4.11).','Lieber aktiv lassen und beim Klick erklären, was fehlt, als stumm <code>disabled</code>.'],
  ['<code>&lt;button type="button"&gt;</code> for actions, <code>&lt;a href&gt;</code> for navigation – never <code>&lt;div (click)&gt;</code>.','Icon buttons need an accessible name, usually <code>aria-label</code>.','The visible text is also in the name, ideally at the start (2.5.3).','At least a 24 × 24 px hit area, better 44 (2.5.8).','Focus ring visible and with 3:1 contrast (2.4.7, 1.4.11).','Better to keep it enabled and explain on click what’s missing than to silently set <code>disabled</code>.']),
 test:tx(['Mit Tab hinkommen, mit Enter <em>und</em> Leertaste auslösen.','Screenreader sagt „Entwurf speichern, Schaltfläche“ – nicht nur „Schaltfläche“.','DevTools → Elements → Accessibility: Name und Rolle ablesen.'],
  ['Reach it with Tab, trigger it with Enter <em>and</em> Space.','The screen reader says “Save draft, button” – not just “button”.','DevTools → Elements → Accessibility: read off name and role.']),
 ng:tx(['Die ESLint-Regeln <code>click-events-have-key-events</code> und <code>interactive-supports-focus</code> aus <code>@angular-eslint/template</code> schlagen bei <code>&lt;div (click)&gt;</code> an – einschalten, siehe Test-Routine.','ARIA dynamisch über <code>[attr.aria-label]</code>, <code>[attr.aria-expanded]</code>, <code>[attr.aria-pressed]</code> binden. Das <code>attr.</code>-Präfix funktioniert in jeder Angular-Version.','<code>mat-icon-button</code> hat keinen Text: <code>aria-label</code> ist Pflicht. <code>matTooltip</code> ersetzt es nicht – auf Touch gibt es kein Hover.','<code>&lt;mat-icon&gt;</code> ist standardmäßig <code>aria-hidden="true"</code> – richtig für Icons neben Text.','In Formularen <code>type="button"</code> setzen, sonst sendet jeder Button das Formular ab. Die Regel <code>button-has-type</code> erinnert daran.'],
  ['The ESLint rules <code>click-events-have-key-events</code> and <code>interactive-supports-focus</code> from <code>@angular-eslint/template</code> flag <code>&lt;div (click)&gt;</code> – turn them on, see the test routine.','Bind ARIA dynamically via <code>[attr.aria-label]</code>, <code>[attr.aria-expanded]</code>, <code>[attr.aria-pressed]</code>. The <code>attr.</code> prefix works in every Angular version.','<code>mat-icon-button</code> has no text: <code>aria-label</code> is required. <code>matTooltip</code> doesn’t replace it – there’s no hover on touch.','<code>&lt;mat-icon&gt;</code> is <code>aria-hidden="true"</code> by default – right for icons next to text.','Inside forms, set <code>type="button"</code>, otherwise every button submits the form. The rule <code>button-has-type</code> reminds you.']),
 bad:`<div class="btn" (click)="save()">
  <mat-icon>save</mat-icon>
</div>`,
 good:`<button type="button" mat-icon-button
        aria-label="${tx('Entwurf speichern','Save draft')}"
        (click)="save()">
  <mat-icon>save</mat-icon>
</button>`,
 lessons:['buttons','touch-targets','focus']},
{id:'link',name:'Link',icon:'link',
 crit:['2.4.4','1.4.1','2.1.1','4.1.2'],
 rule:tx('Ein Link führt woanders hin und sagt vorher, wohin. Er ist auch ohne Farbe als Link zu erkennen.','A link takes you somewhere else and says where beforehand. It’s recognizable as a link even without color.'),
 dos:tx(['Linktext beschreibt das Ziel: „Preisliste 2026 (PDF, 2 MB)“ statt „hier klicken“.','Links im Fließtext unterstreichen; Farbe allein reicht nicht (1.4.1).','Öffnet der Link ein neues Fenster, steht das im Text, nicht nur im Icon.','Kein <code>href="#"</code> für Aktionen – das ist ein Button.'],
  ['Link text describes the destination: “2026 price list (PDF, 2 MB)” instead of “click here”.','Underline links in body text; color alone isn’t enough (1.4.1).','If the link opens a new window, say so in the text, not just in an icon.','No <code>href="#"</code> for actions – that’s a button.']),
 test:tx(['NVDA-Elementliste (<kbd>NVDA</kbd> + <kbd>F7</kbd>): Ergibt jeder Link allein gelesen Sinn?','Graustufen einschalten: Sind Links im Text noch erkennbar?','Mittelklick und „In neuem Tab öffnen“ funktionieren.'],
  ['NVDA Elements List (<kbd>NVDA</kbd> + <kbd>F7</kbd>): does every link make sense read on its own?','Switch to grayscale: can you still spot the links in the text?','Middle-click and “Open in new tab” work.']),
 ng:tx(['<code>routerLink</code> rendert ein echtes <code>&lt;a href&gt;</code>: Mittelklick, Kopieren und Screenreader funktionieren. <code>(click)="router.navigate(…)"</code> auf einem <code>&lt;span&gt;</code> kann nichts davon.','<code>routerLinkActive</code> mit <code>ariaCurrentWhenActive="page"</code> setzt <code>aria-current</code> automatisch.','<code>&lt;a (click)&gt;</code> ohne <code>href</code> ist nicht fokussierbar – dafür ist <code>&lt;button&gt;</code> da.'],
  ['<code>routerLink</code> renders a real <code>&lt;a href&gt;</code>: middle-click, copying, and screen readers work. <code>(click)="router.navigate(…)"</code> on a <code>&lt;span&gt;</code> can’t do any of that.','<code>routerLinkActive</code> with <code>ariaCurrentWhenActive="page"</code> sets <code>aria-current</code> automatically.','<code>&lt;a (click)&gt;</code> without <code>href</code> isn’t focusable – that’s what <code>&lt;button&gt;</code> is for.']),
 bad:`<span class="link"

  ${tx('Hier klicken','Click here')}
</span>`,
 good:`<a routerLink="${tx('/preise','/pricing')}"

  ${tx('Preisliste 2026','2026 price list')}

{id:'formular',name:tx('Formular','Form'),icon:'form',
 crit:['1.3.1','1.3.5','3.3.1','3.3.2','3.3.3','3.3.4','3.3.7','3.3.8','3.2.2'],
 rule:tx('Jedes Feld hat ein sichtbares Label. Fehler stehen als Text am Feld und sagen, wie es richtig geht.','Every field has a visible label. Errors appear as text at the field and say how to get it right.'),
 dos:tx(['<code>&lt;label for&gt;</code> für jedes Feld – der Platzhalter ist kein Label.','<code>autocomplete</code> setzen (<code>email</code>, <code>given-name</code>, <code>current-password</code>): erfüllt 1.3.5, und Passwortmanager funktionieren (3.3.8).','Fehler als Text, mit <code>aria-describedby</code> verknüpft, dazu <code>aria-invalid="true"</code> am Feld.','Die Meldung nennt die Lösung, nicht nur das Problem (3.3.3).','Beim Absenden den Fokus aufs erste fehlerhafte Feld oder auf eine Fehlerübersicht.','Einfügen in Passwort- und Code-Felder nie blockieren (3.3.8).','Schon Eingegebenes nicht erneut abfragen – „Rechnungsadresse wie Lieferadresse“ (3.3.7).'],
  ['<code>&lt;label for&gt;</code> for every field – the placeholder is not a label.','Set <code>autocomplete</code> (<code>email</code>, <code>given-name</code>, <code>current-password</code>): meets 1.3.5, and password managers work (3.3.8).','Errors as text, linked with <code>aria-describedby</code>, plus <code>aria-invalid="true"</code> on the field.','The message names the fix, not just the problem (3.3.3).','On submit, move focus to the first invalid field or to an error summary.','Never block pasting into password and code fields (3.3.8).','Don’t ask again for what was already entered – “Billing address same as shipping address” (3.3.7).']),
 test:tx(['Klick aufs Label setzt den Fokus ins Feld.','Leer absenden: Wird der Fehler vorgelesen? Wo steht der Fokus?','Browser-Autofill ausprobieren.'],
  ['Clicking the label puts focus in the field.','Submit it empty: is the error read out? Where is focus?','Try browser autofill.']),
 ng:tx(['<code>aria-invalid</code> an den Control-Zustand binden: <code>[attr.aria-invalid]="email.invalid &amp;&amp; email.touched"</code>.','Beim Submit <code>form.markAllAsTouched()</code>, dann das erste <code>.ng-invalid</code>-Feld fokussieren.','<code>mat-form-field</code> verknüpft <code>mat-label</code>, <code>mat-hint</code> und <code>mat-error</code> selbst per <code>aria-describedby</code>. <code>mat-label</code> trotzdem immer setzen.','Den Container der Fehlermeldung dauerhaft rendern und nur den Inhalt per <code>@if</code> wechseln – dann stimmt <code>aria-describedby</code> immer.','Die ESLint-Regel <code>label-has-associated-control</code> findet Felder ohne Label.'],
  ['Bind <code>aria-invalid</code> to the control state: <code>[attr.aria-invalid]="email.invalid &amp;&amp; email.touched"</code>.','On submit, call <code>form.markAllAsTouched()</code>, then focus the first <code>.ng-invalid</code> field.','<code>mat-form-field</code> links <code>mat-label</code>, <code>mat-hint</code>, and <code>mat-error</code> via <code>aria-describedby</code> on its own. Still, always set <code>mat-label</code>.','Render the error message container permanently and only swap its content with <code>@if</code> – then <code>aria-describedby</code> always points somewhere.','The ESLint rule <code>label-has-associated-control</code> finds fields without a label.']),
 bad:`<input placeholder="${tx('E-Mail','Email')}"
       formControlName="email">
@if (email.invalid) {
  <span class="red">${tx('Ungültig','Invalid')}</span>
}`,
 good:`<label for="email">${tx('E-Mail','Email')}</label>
<input id="email" type="email"
       formControlName="email"
       autocomplete="email"
       [attr.aria-invalid]="email.invalid && email.touched"
       aria-describedby="email-err">
<p id="email-err" class="err">
  @if (email.invalid && email.touched) {
    ${tx('Es fehlt die Domain, etwa firma.at.','The domain is missing, e.g. company.com.')}
  }
</p>`,
 lessons:['forms','onboarding']},
{id:'bild',name:tx('Bild & Icon','Image & icon'),icon:'image',
 crit:['1.1.1','1.4.5','1.4.11','1.3.3'],
 rule:tx('Informative Bilder bekommen einen Alternativtext mit derselben Information. Dekorative bekommen <code>alt=""</code> und verschwinden für Screenreader.','Informative images get alt text with the same information. Decorative ones get <code>alt=""</code> and disappear for screen readers.'),
 dos:tx(['Alt-Text beschreibt den Zweck, nicht das Aussehen: „Umsatz 2025: plus 12 %“ statt „Balkendiagramm“.','Dekorativ heißt <code>alt=""</code> – nicht weglassen, sonst liest der Screenreader den Dateinamen vor.','Inline-SVG neben Text: <code>aria-hidden="true"</code>. Steht das Icon allein, gehört der Name an den Button.','Kein Text im Bild (1.4.5).','Icons und Diagrammlinien mit 3 : 1 Kontrast (1.4.11).'],
  ['Alt text describes the purpose, not the appearance: “Revenue 2025: up 12%” instead of “bar chart”.','Decorative means <code>alt=""</code> – don’t leave it out, or the screen reader reads the file name aloud.','Inline SVG next to text: <code>aria-hidden="true"</code>. If the icon stands alone, the name belongs on the button.','No text in images (1.4.5).','Icons and chart lines with 3:1 contrast (1.4.11).']),
 test:tx(['axe findet fehlende <code>alt</code>-Attribute zuverlässig. Ob der Text <em>stimmt</em>, prüfst nur du.','Bilder ausblenden (etwa mit der Web Developer Extension): Fehlt jetzt Information?'],
  ['axe reliably finds missing <code>alt</code> attributes. Whether the text is <em>right</em> is something only you can check.','Hide images (e.g. with the Web Developer extension): is information missing now?']),
 ng:tx(['<code>NgOptimizedImage</code> (<code>ngSrc</code>) erzwingt Breite und Höhe – gut gegen Layout-Sprünge. Den <code>alt</code> setzt du selbst; die ESLint-Regel <code>alt-text</code> meldet ihn, wenn er fehlt.','Kommt der Text aus Daten, <code>[alt]="produkt.name"</code> binden und einen leeren Namen abfangen.','<code>&lt;mat-icon&gt;</code> ist standardmäßig versteckt. Trägt das Icon allein Bedeutung, Text danebenstellen oder <code>aria-hidden="false"</code> plus <code>aria-label</code>.'],
  ['<code>NgOptimizedImage</code> (<code>ngSrc</code>) enforces width and height – good against layout shifts. You set the <code>alt</code> yourself; the ESLint rule <code>alt-text</code> flags it when it’s missing.','If the text comes from data, bind <code>[alt]="product.name"</code> and catch an empty name.','<code>&lt;mat-icon&gt;</code> is hidden by default. If the icon alone carries meaning, put text next to it or use <code>aria-hidden="false"</code> plus <code>aria-label</code>.']),

<mat-icon class="warn">error</mat-icon>`,

     alt="${tx('Umsatz 2025: plus 12 % zum Vorjahr','Revenue 2025: up 12% on the previous year')}">

<mat-icon aria-hidden="true">error</mat-icon>
<span>${tx('Zahlung fehlgeschlagen','Payment failed')}</span>`,

{id:'modal',name:tx('Modal & Overlay','Modal & overlay'),icon:'modal',
 crit:['2.1.2','2.4.3','4.1.2','1.4.13','2.4.11'],
 rule:tx('Ein Modal holt den Fokus, hält ihn fest, schließt mit Esc und gibt den Fokus beim Schließen dem Element zurück, das es geöffnet hat.','A modal takes focus, holds on to it, closes with Esc, and on closing returns focus to the element that opened it.'),
 dos:tx(['Beim Öffnen: Fokus aufs erste sinnvolle Element oder auf den Dialog selbst.','Tab bleibt im Dialog, Esc schließt ihn – so wird die gewollte Fokusfalle keine echte (2.1.2).','Beim Schließen: Fokus zurück auf den Auslöser (2.4.3).','<code>role="dialog"</code>, <code>aria-modal="true"</code> und <code>aria-labelledby</code> auf den Titel – oder gleich natives <code>&lt;dialog&gt;</code> mit <code>showModal()</code>.','Tooltips und Popover: per Esc schließbar, mit der Maus überfahrbar, bleiben stehen (1.4.13).','Sticky Header und Banner verdecken das fokussierte Element nicht (2.4.11); <code>scroll-padding-top</code> hilft.'],
  ['On open: focus on the first meaningful element or on the dialog itself.','Tab stays inside the dialog, Esc closes it – so the intended focus trap doesn’t become a real one (2.1.2).','On close: focus back on the trigger (2.4.3).','<code>role="dialog"</code>, <code>aria-modal="true"</code>, and <code>aria-labelledby</code> pointing to the title – or just use a native <code>&lt;dialog&gt;</code> with <code>showModal()</code>.','Tooltips and popovers: dismissible with Esc, hoverable with the mouse, and they stay put (1.4.13).','Sticky headers and banners don’t cover the focused element (2.4.11); <code>scroll-padding-top</code> helps.']),
 test:tx(['Nur mit der Tastatur öffnen, durchtabben, mit Esc schließen. Wo steht der Fokus danach?','Screenreader: Wird der Titel beim Öffnen vorgelesen?'],
  ['Open it with the keyboard only, tab through, close with Esc. Where is focus afterward?','Screen reader: is the title read out on open?']),
 ng:tx(['<code>MatDialog</code> bzw. <code>Dialog</code> aus <code>@angular/cdk/dialog</code> erledigt Fokusfalle, Esc und Fokus-Rückgabe. <code>mat-dialog-title</code> verknüpft den Titel automatisch.','<code>autoFocus</code> steuert, wohin der Fokus beim Öffnen geht (<code>\'first-tabbable\'</code>, <code>\'dialog\'</code> oder ein CSS-Selektor); <code>restoreFocus</code> ist standardmäßig an.','Eigenes Overlay? <code>cdkTrapFocus</code> mit <code>cdkTrapFocusAutoCapture</code>: fängt den Fokus beim Erscheinen und gibt ihn beim Zerstören zurück.','<code>matTooltip</code> nur für Zusatzinfo, nie für Pflichtinformation.'],
  ['<code>MatDialog</code> or <code>Dialog</code> from <code>@angular/cdk/dialog</code> handles the focus trap, Esc, and focus return. <code>mat-dialog-title</code> links the title automatically.','<code>autoFocus</code> controls where focus goes on open (<code>\'first-tabbable\'</code>, <code>\'dialog\'</code>, or a CSS selector); <code>restoreFocus</code> is on by default.','Custom overlay? <code>cdkTrapFocus</code> with <code>cdkTrapFocusAutoCapture</code>: captures focus when it appears and returns it when it’s destroyed.','<code>matTooltip</code> only for extra info, never for essential information.']),
 bad:`@if (open) {
  <div class="overlay">
    <div class="box">
      <span class="x" (click)="open = false">×</span>
      ${tx('Wirklich löschen?','Delete for real?')}
    </div>
  </div>
}`,
 good:`// component.ts
this.dialog.open(ConfirmDeleteComponent, {
  autoFocus: 'first-tabbable',
  restoreFocus: true,
});

<!-- confirm-delete.component.html -->
<h2 mat-dialog-title>${tx('Projekt löschen?','Delete project?')}</h2>
<mat-dialog-content>…</mat-dialog-content>`,
 lessons:['dialog','overlays','focus']},
{id:'tabelle',name:tx('Tabelle & Liste','Table & list'),icon:'table',
 crit:['1.3.1','4.1.2','4.1.3','1.4.10','2.1.1'],
 rule:tx('Daten in Zeilen und Spalten gehören in eine echte <code>&lt;table&gt;</code> mit Kopfzellen. Sortieren und Filtern wird angesagt.','Data in rows and columns belongs in a real <code>&lt;table&gt;</code> with header cells. Sorting and filtering get announced.'),
 dos:tx(['<code>&lt;th scope="col"&gt;</code> für Spaltenköpfe, <code>&lt;caption&gt;</code> als Titel.','Sortierbare Spalte: Button im <code>&lt;th&gt;</code>, <code>aria-sort</code> am <code>&lt;th&gt;</code>.','Ergebnis ansagen: „24 Einträge, nach Datum absteigend“ (4.1.3).','Breite Tabelle: im eigenen Container horizontal scrollen, der Rest der Seite bricht um (1.4.10). Den Container mit <code>tabindex="0"</code> und Namen per Tastatur scrollbar machen.','Listen sind <code>&lt;ul&gt;</code> oder <code>&lt;ol&gt;</code> – dann sagt der Screenreader „Liste, 12 Einträge“.'],
  ['<code>&lt;th scope="col"&gt;</code> for column headers, <code>&lt;caption&gt;</code> as the title.','Sortable column: a button inside the <code>&lt;th&gt;</code>, <code>aria-sort</code> on the <code>&lt;th&gt;</code>.','Announce the result: “24 entries, sorted by date, descending” (4.1.3).','Wide table: scroll horizontally in its own container while the rest of the page reflows (1.4.10). Give the container <code>tabindex="0"</code> and a name so it can be scrolled with the keyboard.','Lists are <code>&lt;ul&gt;</code> or <code>&lt;ol&gt;</code> – then the screen reader says “list, 12 items”.']),
 test:tx(['Screenreader-Tabellennavigation (<kbd>Strg</kbd> + <kbd>Alt</kbd> + Pfeile): Wird beim Spaltenwechsel der Kopf vorgelesen?','Bei 320 px Breite: Scrollt nur die Tabelle, nicht die ganze Seite?'],
  ['Screen reader table navigation (<kbd>Ctrl</kbd> + <kbd>Alt</kbd> + arrow keys): is the header read out when you change columns?','At 320 px width: does only the table scroll, not the whole page?']),
 ng:tx(['<code>mat-table</code> rendert echte Tabellenrollen, <code>matSort</code> setzt <code>aria-sort</code> selbst. Für die Ansage im <code>(matSortChange)</code> den <code>LiveAnnouncer</code> aufrufen – so zeigt es auch die Material-Doku.','<code>sortActionDescription</code> am <code>mat-sort-header</code> gibt dem Sortier-Button einen Namen.','<code>@for (row of rows; track row.id)</code>: Mit einem stabilen <code>track</code> verwendet Angular DOM-Knoten wieder, der Fokus bleibt bei Updates in der richtigen Zeile. <code>track $index</code> verliert ihn beim Sortieren.','Virtuelles Scrollen (<code>cdk-virtual-scroll-viewport</code>) nimmt Zeilen aus dem DOM – Screenreader kennen die Gesamtzahl nicht. <code>aria-rowcount</code> setzen oder Pagination nehmen.'],
  ['<code>mat-table</code> renders real table roles, <code>matSort</code> sets <code>aria-sort</code> itself. For the announcement, call the <code>LiveAnnouncer</code> in <code>(matSortChange)</code> – that’s how the Material docs show it, too.','<code>sortActionDescription</code> on <code>mat-sort-header</code> gives the sort button a name.','<code>@for (row of rows; track row.id)</code>: with a stable <code>track</code>, Angular reuses DOM nodes, and focus stays in the right row on updates. <code>track $index</code> loses it when sorting.','Virtual scrolling (<code>cdk-virtual-scroll-viewport</code>) removes rows from the DOM – screen readers don’t know the total count. Set <code>aria-rowcount</code> or use pagination.']),
 bad:`<div class="row head">
  <div (click)="sort('date')">${tx('Datum','Date')} ▼</div>
</div>
@for (r of rows; track $index) {
  <div class="row"><div>{{ r.date }}</div></div>
}`,
 good:`<table mat-table [dataSource]="rows" matSort
       (matSortChange)="announceSort($event)">
  <caption>${tx('Rechnungen 2026','Invoices 2026')}</caption>
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef
        mat-sort-header
        sortActionDescription="${tx('Nach Datum sortieren','Sort by date')}">
      ${tx('Datum','Date')}
    </th>
    <td mat-cell *matCellDef="let r">{{ r.date | date }}</td>
  </ng-container>
  …
</table>`,
 lessons:['tables','search-filter']},
{id:'navigation',name:'Navigation',icon:'menu',
 crit:['2.4.1','2.4.5','3.2.3','3.2.4','3.2.6','1.3.1'],
 rule:tx('Navigation steht überall an derselben Stelle, heißt überall gleich, und man kann sie überspringen.','Navigation sits in the same place everywhere, is labeled the same everywhere, and can be skipped.'),
 dos:tx(['Skip-Link „Zum Inhalt springen“ als erstes fokussierbares Element (2.4.1).','Landmarks: <code>&lt;header&gt;</code>, <code>&lt;nav aria-label&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code> – Screenreader springen damit direkt.','Aktuelle Seite mit <code>aria-current="page"</code> markieren.','Mindestens zwei Wege zu jeder Seite: Menü plus Suche oder Sitemap (2.4.5).','Gleiche Funktion, gleicher Name, gleiches Icon (3.2.4); Hilfe immer an derselben Stelle (3.2.6).'],
  ['Skip link “Skip to content” as the first focusable element (2.4.1).','Landmarks: <code>&lt;header&gt;</code>, <code>&lt;nav aria-label&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code> – screen readers jump straight to them.','Mark the current page with <code>aria-current="page"</code>.','At least two ways to every page: menu plus search or sitemap (2.4.5).','Same function, same name, same icon (3.2.4); help always in the same place (3.2.6).']),
 test:tx(['Seite laden, einmal Tab: Erscheint der Skip-Link, und springt er wirklich?','NVDA-Elementliste → Orientierungspunkte: Sind header, nav und main da?'],
  ['Load the page, press Tab once: does the skip link appear, and does it really jump?','NVDA Elements List → Landmarks: are header, nav, and main there?']),
 ng:tx(['Achtung <code>&lt;base href="/"&gt;</code>: Ein Skip-Link mit <code>href="#main"</code> löst sich gegen die Base-URL auf und springt zur Startseite statt zum Anker. Lösung: <code>(click)</code> mit <code>preventDefault()</code> und <code>main.focus()</code>, dazu <code>&lt;main tabindex="-1"&gt;</code>.','Header, Navigation und Footer ins App-Shell-Template (<code>app.component.html</code>) statt in jede Seite – dann ist 3.2.3 automatisch erfüllt.','Menüs mit Pfeiltasten: <code>CdkMenu</code> aus <code>@angular/cdk/menu</code> oder <code>ListKeyManager</code> aus <code>@angular/cdk/a11y</code>. Seit Angular 21 gibt es zusätzlich <code>@angular/aria</code> (Developer Preview) mit fertigen headless Patterns.'],
  ['Watch out for <code>&lt;base href="/"&gt;</code>: a skip link with <code>href="#main"</code> resolves against the base URL and jumps to the home page instead of the anchor. Fix: <code>(click)</code> with <code>preventDefault()</code> and <code>main.focus()</code>, plus <code>&lt;main tabindex="-1"&gt;</code>.','Put header, navigation, and footer in the app shell template (<code>app.component.html</code>) instead of in every page – then 3.2.3 is met automatically.','Menus with arrow keys: <code>CdkMenu</code> from <code>@angular/cdk/menu</code> or <code>ListKeyManager</code> from <code>@angular/cdk/a11y</code>. Since Angular 21 there’s also <code>@angular/aria</code> (developer preview) with ready-made headless patterns.']),
 bad:`<a href="#main">${tx('Zum Inhalt','To content')}</a>
<div class="nav">
  <div (click)="go('/')">${tx('Start','Home')}</div>
</div>
<div class="content">
  <router-outlet />
</div>`,
 good:`<a class="skip" href="#main"
   (click)="$event.preventDefault(); main.focus()">
  ${tx('Zum Inhalt springen','Skip to content')}
</a>
<nav aria-label="${tx('Hauptmenü','Main menu')}">
  <a routerLink="/" routerLinkActive="active"
     ariaCurrentWhenActive="page"
     [routerLinkActiveOptions]="{ exact: true }">${tx('Start','Home')}</a>
</nav>
<main #main id="main" tabindex="-1">
  <router-outlet />
</main>`,
 lessons:['navigation','focus']},
{id:'seite',name:tx('Seite & Routing','Page & routing'),icon:'file',
 crit:['2.4.2','3.1.1','3.1.2','2.4.3','2.4.6','1.3.4','1.4.4','1.4.10'],
 rule:tx('Jede Route hat einen eigenen Titel und eine <code>h1</code>. Nach dem Wechsel wird der Fokus neu gesetzt – sonst merkt ein Screenreader-Nutzer nichts davon.','Every route has its own title and an <code>h1</code>. After the route changes, focus is set anew – otherwise a screen reader user won’t notice anything happened.'),
 dos:tx(['<code>&lt;title&gt;</code> pro Route: „Rechnungen · Firmenname“ (2.4.2).','<code>&lt;html lang="de"&gt;</code>; fremdsprachige Stellen mit <code>lang="en"</code> (3.1.1, 3.1.2).','Nach der Navigation: Fokus auf die <code>h1</code> mit <code>tabindex="-1"</code> und nach oben scrollen.','Eine <code>h1</code> pro Seite, Überschriften ohne Sprünge.','Kein festes Format (1.3.4), 200 % Textzoom (1.4.4) und 320 px Breite (1.4.10) ohne Verluste.'],
  ['<code>&lt;title&gt;</code> per route: “Invoices · Company name” (2.4.2).','<code>&lt;html lang="en"&gt;</code>; passages in other languages with e.g. <code>lang="de"</code> (3.1.1, 3.1.2).','After navigating: focus the <code>h1</code> with <code>tabindex="-1"</code> and scroll to the top.','One <code>h1</code> per page, headings without skipped levels.','No locked orientation (1.3.4), 200% text zoom (1.4.4), and 320 px width (1.4.10) without losing anything.']),
 test:tx(['Route wechseln mit Screenreader: Wird die neue Seite angesagt?','Nach dem Wechsel Tab drücken: Startet der Fokus im neuen Inhalt – oder irgendwo im alten Menü?','Zoom auf 200 % und 400 %.'],
  ['Change routes with a screen reader: is the new page announced?','Press Tab after the change: does focus start in the new content – or somewhere in the old menu?','Zoom to 200% and 400%.']),
 ng:tx(['<code>title</code> direkt an der Route: <code>{ path: \'rechnungen\', title: \'Rechnungen\', … }</code>. Eine eigene <code>TitleStrategy</code> hängt den App-Namen an.','Fokus nach der Navigation macht Angular <em>nicht</em> von selbst – anders als ein echter Seitenwechsel. Auf <code>NavigationEnd</code> hören und die <code>h1</code> fokussieren.','<code>withInMemoryScrolling({ scrollPositionRestoration: \'enabled\' })</code> in <code>provideRouter</code>: nach oben beim Wechsel, alte Position bei „Zurück“.','<code>lang</code> steht in <code>src/index.html</code>. Wer zur Laufzeit die Sprache wechselt (Transloco, ngx-translate), setzt <code>document.documentElement.lang</code> mit.'],
  ['<code>title</code> right on the route: <code>{ path: \'invoices\', title: \'Invoices\', … }</code>. A custom <code>TitleStrategy</code> appends the app name.','Angular does <em>not</em> move focus after navigation on its own – unlike a real page load. Listen for <code>NavigationEnd</code> and focus the <code>h1</code>.','<code>withInMemoryScrolling({ scrollPositionRestoration: \'enabled\' })</code> in <code>provideRouter</code>: back to the top on change, previous position on “Back”.','<code>lang</code> lives in <code>src/index.html</code>. If you switch languages at runtime (Transloco, ngx-translate), update <code>document.documentElement.lang</code> as well.']),
 bad:tx(`// app.routes.ts
{ path: 'rechnungen', component: InvoicesComponent }
// Titel bleibt überall „MyApp“,
// der Fokus bleibt im Menü hängen`,`// app.routes.ts
{ path: 'invoices', component: InvoicesComponent }
// the title stays “MyApp” everywhere,
// and focus gets stuck in the menu`),
 good:`// app.routes.ts
{ path: '${tx('rechnungen','invoices')}', title: '${tx('Rechnungen','Invoices')}',
  component: InvoicesComponent }

// app.component.ts
constructor() {
  inject(Router).events.pipe(
    filter(e => e instanceof NavigationEnd),
    takeUntilDestroyed(),
  ).subscribe(() => setTimeout(() =>
    document.querySelector<HTMLElement>('main h1')?.focus()
  ));
}`,
 lessons:['deep-linking','i18n','responsive','typography']},
{id:'status',name:tx('Statusmeldung & Laden','Status message & loading'),icon:'bell',
 crit:['4.1.3','2.2.1','3.3.1','2.2.2'],
 rule:tx('Was sich ohne Seitenwechsel ändert – Toast, Ladezustand, Trefferzahl – wird über eine Live-Region angesagt, ohne den Fokus zu stehlen.','Whatever changes without a page load – toast, loading state, result count – is announced through a live region without stealing focus.'),
 dos:tx(['Die Live-Region ist schon beim Laden im DOM; danach ändert sich nur ihr Text.','<code>role="status"</code> (höflich) für Erfolg und Info, <code>role="alert"</code> nur für Fehler.','Toasts mit Aktion: mindestens rund 8 Sekunden, Pause bei Hover und Fokus – oder sie bleiben, bis man sie schließt (2.2.1).','Ladebereich mit <code>aria-busy="true"</code>, danach ansagen: „12 Ergebnisse geladen“.','Vor einem Session-Timeout warnen und verlängern lassen (2.2.1).'],
  ['The live region is already in the DOM on page load; after that, only its text changes.','<code>role="status"</code> (polite) for success and info, <code>role="alert"</code> only for errors.','Toasts with an action: at least about 8 seconds, paused on hover and focus – or they stay until you close them (2.2.1).','Loading area with <code>aria-busy="true"</code>, then announce: “12 results loaded”.','Warn before a session timeout and let people extend it (2.2.1).']),
 test:tx(['Screenreader an, Aktion auslösen: Hörst du die Meldung, ohne dass der Fokus springt?','Kommst du per Tastatur zur Toast-Aktion, bevor der Toast verschwindet?'],
  ['Screen reader on, trigger the action: do you hear the message without focus jumping?','Can you reach the toast action with the keyboard before the toast disappears?']),
 ng:tx(['<code>LiveAnnouncer</code> aus <code>@angular/cdk/a11y</code>: <code>announce(\'Gespeichert\', \'polite\')</code>. Der Service hält seine Live-Region selbst im DOM.','Eine Meldung, die per <code>@if</code> neu erscheint, wird oft <em>nicht</em> vorgelesen: Das Element fehlte vorher, also hat der Screenreader keine Region beobachtet. Region dauerhaft rendern oder <code>cdkAriaLive="polite"</code> nutzen.','<code>MatSnackBar</code> sagt über den <code>LiveAnnouncer</code> an; <code>politeness</code> und <code>duration</code> sind pro Aufruf einstellbar. Mit Aktion <code>duration</code> weglassen – dann bleibt sie bis zum Klick.','<code>[attr.aria-busy]="loading()"</code> – mit Signals direkt im Template.'],
  ['<code>LiveAnnouncer</code> from <code>@angular/cdk/a11y</code>: <code>announce(\'Saved\', \'polite\')</code>. The service keeps its own live region in the DOM.','A message that newly appears via <code>@if</code> is often <em>not</em> read out: the element wasn’t there before, so the screen reader wasn’t watching any region. Render the region permanently or use <code>cdkAriaLive="polite"</code>.','<code>MatSnackBar</code> announces through the <code>LiveAnnouncer</code>; <code>politeness</code> and <code>duration</code> can be set per call. With an action, leave out <code>duration</code> – then it stays until clicked.','<code>[attr.aria-busy]="loading()"</code> – with signals, right in the template.']),
 bad:`@if (saved) {
  <div class="toast">${tx('Gespeichert!','Saved!')}</div>
}`,
 good:`private announcer = inject(LiveAnnouncer);
private snackBar = inject(MatSnackBar);

onResults(n: number): void {
  this.announcer.announce(n + '${tx(' Ergebnisse gefunden',' results found')}', 'polite');
}

onDeleted(): void {
  this.snackBar.open('${tx('Projekt gelöscht','Project deleted')}', '${tx('Rückgängig','Undo')}');
}`,
 lessons:['toast','loading','errors-offline']},
{id:'medien',name:tx('Medien & Animation','Media & animation'),icon:'play',
 crit:['1.2.1','1.2.2','1.2.3','1.2.4','1.2.5','1.4.2','2.2.2','2.3.1','2.5.4'],
 rule:tx('Videos haben Untertitel, nichts spielt ungefragt Ton, und was sich länger als 5 Sekunden bewegt, lässt sich anhalten.','Videos have captions, nothing plays sound unasked, and anything that moves for more than 5 seconds can be paused.'),
 dos:tx(['Untertitel per <code>&lt;track kind="captions"&gt;</code> für jedes Video mit Ton, Transkript für reines Audio.','Zeigt das Bild Wichtiges, das niemand sagt: Audiodeskription oder Textfassung (1.2.3, 1.2.5).','Kein Autoplay mit Ton. Wenn doch: Stopp-Button gleich zu Beginn (1.4.2).','Karussell, Ticker, Hintergrundvideo über 5 Sekunden: Pause-Button (2.2.2).','Nichts blitzt öfter als dreimal pro Sekunde (2.3.1).','<code>prefers-reduced-motion</code> respektieren. Formal ist das AAA (2.3.3), aber schnell gebaut und für Menschen mit Gleichgewichtsstörungen entscheidend.'],
  ['Captions via <code>&lt;track kind="captions"&gt;</code> for every video with sound, a transcript for audio only.','If the picture shows something important that nobody says: audio description or text version (1.2.3, 1.2.5).','No autoplay with sound. If you must: a stop button right at the start (1.4.2).','Carousel, ticker, background video over 5 seconds: pause button (2.2.2).','Nothing flashes more than three times per second (2.3.1).','Respect <code>prefers-reduced-motion</code>. Formally that’s AAA (2.3.3), but it’s quick to build and crucial for people with vestibular disorders.']),

  ['Watch the video without sound: do you understand everything?','Turn on “Reduce motion” in your operating system and click through the app.']),

  ['Handle reduced motion in CSS first: <code>@media (prefers-reduced-motion: reduce)</code>. That also affects <code>animate.enter</code> and <code>animate.leave</code>, because they work with CSS classes.','With the older <code>@angular/animations</code> package: <code>[@.disabled]="reduceMotion"</code> on the container. <code>BreakpointObserver.observe(\'(prefers-reduced-motion: reduce)\')</code> from <code>@angular/cdk/layout</code> provides the value.']),

const CI_AXE=`// e2e/a11y.spec.ts – Playwright ${tx('mit','with')} @axe-core/playwright
import { test, expect } from '@playwright/test';
import AxeBuilder from '@axe-core/playwright';

for (const path of ${tx("['/', '/rechnungen', '/einstellungen']","['/', '/invoices', '/settings']")}) {
  test('${tx('keine axe-Verstöße auf ','no axe violations on ')}' + path, async ({ page }) => {
    await page.goto(path);
    const result = await new AxeBuilder({ page })
      .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa', 'wcag22aa'])
      .analyze();
    expect(result.violations).toEqual([]);
  });
}`;

function kCritInit(root,sub,params){
  const q=$('#k-q',root),neu=$('#k-neu',root),count=$('#k-count',root),empty=$('#k-empty',root),cards=$$('.k-crit',root),secs=$$('.k-sec',root);
  const val=n=>$(`input[name="k-${n}"]:checked`,root).value;
  const setVal=(n,v)=>{($(`input[name="k-${n}"][value="${CSS.escape(v)}"]`,root)||$(`input[name="k-${n}"]`,root)).checked=true};
  q.value=params.get('q')||'';['stufe','rolle','test'].forEach(n=>setVal(n,params.get(n)||''));neu.checked=params.get('neu')==='1';
  let t;
  function apply(user,typed){
    const s=norm(q.value.trim()),st=val('stufe'),ro=val('rolle'),te=val('test'),nu=neu.checked;
    let n=0;
    cards.forEach(el=>{const w=W_BY[el.dataset.nr];
      const ok=(!st||w.lvl===st)&&(!ro||w.roles.includes(ro))&&(!te||(te==='tool')===w.auto)&&(!nu||w.neu)&&(!s||norm(`${w.nr} ${w.de} ${w.en} ${w.text.replace(/<[^>]+>/g,'')}`).includes(s));
      el.hidden=!ok;if(ok)n++});
    secs.forEach(sec=>{sec.hidden=!$('.k-crit:not([hidden])',sec)});
    // „Bauteile zeigen“ beschriftet nur die erste sichtbare Karte, nicht alle 55
    $$('.k-crit [data-anno], .k-crit[data-anno]',root).forEach(el=>el.removeAttribute('data-anno'));
    const first=cards.find(el=>!el.hidden);
    if(first){first.dataset.anno='Card (article)';$('.k-meta',first).dataset.anno='Badges';$('.k-links',first).dataset.anno='Links'}
    empty.hidden=n>0;
    clearTimeout(t);t=setTimeout(()=>{count.textContent=n===WCAG.length?tx(`Alle ${n} Kriterien`,`All ${n} criteria`):tx(`${n} von ${WCAG.length} Kriterien`,`${n} of ${WCAG.length} criteria`)},typed?400:0);
    if(!user)return;
    const p=new URLSearchParams();
    if(q.value.trim())p.set('q',q.value.trim());if(st)p.set('stufe',st);if(ro)p.set('rolle',ro);if(te)p.set('test',te);if(nu)p.set('neu','1');
    const qs=p.toString();
    history.replaceState(null,'','#wcag-kriterien'+(qs?'?'+qs:''));
  }
  const form=$('#k-filter',root);
  form.addEventListener('input',e=>apply(true,e.target===q));
  form.addEventListener('submit',e=>e.preventDefault());
  $('#k-reset',root).addEventListener('click',()=>{q.value='';['stufe','rolle','test'].forEach(n=>setVal(n,''));neu.checked=false;apply(true);q.focus()});
  apply(false);
  const hit=sub&&$('#'+wSlug(sub),root);
  if(hit){hit.classList.add('k-hit');requestAnimationFrame(()=>hit.scrollIntoView({block:'start'}))}
  return ()=>clearTimeout(t);
}

function kCheckInit(root){

    try{await navigator.clipboard.writeText(md);toast({msg:tx(`Checkliste kopiert – ${done.size} von ${CHECK_IDS.length} abgehakt.`,`Checklist copied – ${done.size} of ${CHECK_IDS.length} checked.`),type:'success',duration:3500})}
    catch(err){toast({msg:tx('Kopieren ging nicht – der Browser hat die Zwischenablage blockiert.','Couldn’t copy – the browser blocked the clipboard.'),type:'error'})}
  });
  $('#kc-reset',root).addEventListener('click',()=>{
    if(!done.size){toast({msg:tx('Es ist noch nichts abgehakt.','Nothing is checked yet.'),duration:2500});return}
    const before=[...done];done=new Set();save();
    $$('input[data-id]',root).forEach(cb=>cb.checked=false);
    toast({msg:tx(`${before.length} Haken entfernt.`,`${before.length} ${before.length===1?'check':'checks'} cleared.`),action:{label:tx('Rückgängig','Undo'),fn:()=>{done=new Set(before);save();$$('input[data-id]',root).forEach(cb=>cb.checked=done.has(cb.dataset.id))}}});
  });
  upd();
}
