      inp.addEventListener('input',()=>{if(inp.getAttribute('aria-invalid')==='true')show(k,F[k](inp.value))});
    });
    const pw=$('#f-pw',root),meter=$('#f-pw-meter',root);
    const upd=()=>{const n=pw.value.length;meter.textContent=n>=12?`${n} Zeichen – passt.`:`${n} von 12 Zeichen`;meter.classList.toggle('ok',n>=12)};
    pw.addEventListener('input',upd);
    const tg=$('#f-pw-toggle',root);
    tg.addEventListener('click',()=>{const on=tg.getAttribute('aria-pressed')!=='true';tg.setAttribute('aria-pressed',String(on));pw.type=on?'text':'password';tg.textContent=on?'Verbergen':'Anzeigen'});
    const form=$('#fm',root),sum=$('#fm-sum',root),list=$('#fm-sum-list',root);
    list.addEventListener('click',e=>{const a=e.target.closest('a[data-focus]');if(!a)return;e.preventDefault();$('#'+a.dataset.focus,root).focus()});
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const errs=[];
      Object.keys(F).forEach(k=>{const m=F[k]($('#f-'+k,root).value);show(k,m);if(m)errs.push([k,m])});
      if(errs.length){
        $('#fm-sum-h span',root).textContent=errs.length===1?'Bitte prüfe 1 Angabe':`Bitte prüfe ${errs.length} Angaben`;
        list.innerHTML=errs.map(([k,m])=>`<li><a href="#f-${k}" data-focus="f-${k}">${L[k]}: ${esc(m)}</a></li>`).join('');
        sum.hidden=false;sum.focus();
      }else{
        sum.hidden=true;
        toast({msg:`Konto für ${$('#f-email',root).value.trim()} erstellt (nur Demo).`,type:'success'});
        form.reset();upd();tg.setAttribute('aria-pressed','false');pw.type='password';tg.textContent='Anzeigen';
      }
    });
  },
  do:[`Optionale Felder mit „(optional)“ kennzeichnen – oder Pflichtfelder mit „(Pflicht)“, je nachdem, was seltener ist. Ein Sternchen allein erklärt nichts.`,`Fehlermeldung = Was ist falsch + wie behebe ich es + Beispiel.`,`Beim Absenden eine Fehlerübersicht mit Sprunglinks zu den Feldern.`],
  dont:[`Placeholder als Label: verschwindet beim Tippen, hat oft zu wenig Kontrast.`,`Bei jedem Tastendruck validieren, bevor jemand fertig ist („Ungültige E-Mail“ nach dem ersten Buchstaben).`,`Das Formular leeren, wenn ein Fehler auftritt.`],
  why:`<p>Formulare sind die Stelle, an der Nutzer abspringen. Jede Unklarheit – Was gehört hier hinein? Was war falsch? – kostet Abschlüsse.</p><p>Fehler erst beim Verlassen des Feldes zu zeigen, verhindert, dass jemand beim ersten Buchstaben angeschrien wird. Ist ein Fehler aber sichtbar, soll er beim Korrigieren sofort verschwinden. Das ist die Belohnung.</p><p>Für Screenreader verbindet <code>aria-describedby</code> Hinweis und Fehlertext mit dem Feld, <code>aria-invalid="true"</code> meldet den Fehlerzustand. <code>autocomplete</code> lässt Browser und Passwortmanager ausfüllen, das hilft allen und ist WCAG 1.3.5.</p>`,
  here:`Das Suchfeld links hat ein sichtbares Label und <code>type="search"</code>. Auf dem Handy erscheint dadurch eine „Suchen“-Taste statt „Enter“.`
},
{
  id:'toast',cat:'Feedback',title:'Toasts & Snackbars',
  short:'Kurze Rückmeldung, die von selbst geht – mit „Rückgängig“ statt Rückfrage.',
  keys:'snackbar benachrichtigung meldung undo rückgängig live region notification',
  refs:['WCAG 4.1.3 · AA','WCAG 2.2.1 · A','Material 3: Snackbar'],
  rule:`Ein Toast bestätigt eine erledigte Aktion kurz und unaufdringlich. Er blockiert nichts, verschwindet von selbst und bietet höchstens <strong>eine</strong> Aktion – meist „Rückgängig“.`,
  numbers:[['4–10 s','Anzeigedauer, länger mit Aktion'],['max. 1 Aktion','z. B. „Rückgängig“'],['≤ 2 Zeilen','Text – mehr ist kein Toast mehr'],['Pause','bei Hover und Tastaturfokus']],
  demo:`
  <div>
    <h3>Löschen mit „Rückgängig“</h3>
    <ul class="files" id="tf-list"></ul>
    <p class="demo-note">Lösch eine Datei. Statt „Wirklich löschen?“ kommt ein Toast mit „Rückgängig“ – oder drück <kbd>Strg</kbd> + <kbd>Z</kbd>.</p>
  </div>
  <div>
    <h3>Varianten</h3>
    <div class="btn-row"><button type="button" class="btn btn-secondary" data-t="success">Erfolg</button><button type="button" class="btn btn-secondary" data-t="info">Info</button><button type="button" class="btn btn-secondary" data-t="error">Fehler als Toast (Anti-Pattern)</button></div>
    <p class="demo-note" id="tf-note" aria-live="polite"></p>
  </div>`,
  init(root){
    const START=['Rechnung_März.pdf','Angebot_Müller_GmbH.docx','Logo_final_final2.svg'];
    let files=[...START];const list=$('#tf-list',root);
    const render=()=>{
      list.innerHTML=files.length?files.map((f,i)=>`<li class="file">${ic('file')}<span>${esc(f)}</span><button type="button" class="icon-btn" data-i="${i}" aria-label="„${esc(f)}“ löschen">${ic('trash')}</button></li>`).join('')
        :`<li class="file-empty"><p><b>Alle Dateien gelöscht.</b></p><p class="hint">Das ist ein Empty State: Er sagt, warum es leer ist, und bietet einen Ausweg.</p><button type="button" class="btn btn-ghost" id="tf-restore">Beispieldateien wiederherstellen</button></li>`;
    };
    render();
    list.addEventListener('click',e=>{
      if(e.target.closest('#tf-restore')){files=[...START];render();list.querySelector('button')?.focus();return}
      const b=e.target.closest('button[data-i]');if(!b)return;
      const i=+b.dataset.i,removed=files.splice(i,1)[0];render();
      (list.querySelectorAll('button[data-i]')[Math.min(i,files.length-1)]||$('#tf-restore',root))?.focus();
      toast({msg:`„${removed}“ gelöscht.`,action:{label:'Rückgängig',fn:()=>{files.splice(Math.min(i,files.length),0,removed);render();toast({msg:`„${removed}“ wiederhergestellt.`,type:'success',duration:3000})}}});
    });
    const note=$('#tf-note',root);
    $$('[data-t]',root).forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.t;
      if(t==='success'){toast({msg:'Profil gespeichert.',type:'success'});note.textContent=''}
      if(t==='info'){toast({msg:'Neue Version verfügbar – sie wird beim nächsten Start geladen.'});note.textContent=''}
      if(t==='error'){toast({msg:'Zahlung fehlgeschlagen: Karte abgelaufen.',type:'error'});note.textContent='Siehst du das Problem? Die Meldung verlangt eine Handlung (neue Karte eingeben), ist aber nach 5 Sekunden weg. So ein Fehler gehört als Inline-Fehler direkt an das Zahlungsfeld.'}
    }));
  },
  do:[`Undo-Toast statt „Wirklich löschen?“-Dialog bei allem, was sich rückgängig machen lässt.`,`Über eine Live-Region (<code>role="status"</code>) ansagen, damit Screenreader ihn hören.`,`Timer anhalten, solange Maus oder Fokus auf dem Toast liegen.`],
  dont:[`Fehler, die eine Handlung erfordern, als Toast. Dafür gibt es Inline-Fehler oder ein Banner.`,`Toasts stapeln, bis der Bildschirm voll ist (hier: maximal 3).`,`Eine wichtige Aktion <em>nur</em> im Toast anbieten – er ist flüchtig.`],
  why:`<p>Jede Aktion braucht eine Rückmeldung, sonst klickt man noch einmal. Ein Toast gibt sie, ohne den Arbeitsfluss zu unterbrechen. Genau deshalb ist er falsch für alles Wichtige: Er ist flüchtig und liegt oft außerhalb des Blickfelds.</p><p>Der Undo-Toast ist die freundlichere Alternative zum Bestätigungsdialog. Statt jedes Mal „Wirklich?“ zu fragen, wird sofort ausgeführt, und wer sich vertan hat, macht es rückgängig. Das spart der Mehrheit einen Klick und schützt die Minderheit.</p><p>Screenreader bekommen den Toast über eine <strong>Live-Region</strong> angesagt, ohne dass der Fokus springt (WCAG 4.1.3). Wer langsamer liest, braucht Zeit: Hover oder Fokus hält den Timer an (WCAG 2.2.1).</p>`,
  here:`Alle Toasts laufen durch eine einzige Funktion und landen unten in einer Region. Beachte den dünnen Zeitbalken: Er stoppt, wenn du mit der Maus darüberfährst. Auf dem Desktop sitzen Toasts unten rechts, auf dem Handy unten in der Mitte.`
},
{
  id:'loading',cat:'Feedback',title:'Ladezustände: Skeleton, Spinner, Fortschritt',
  short:'Welcher Indikator bei welcher Wartezeit – nach den Nielsen-Grenzen.',
  keys:'laden spinner skeleton progress fortschritt wartezeit optimistic aria-busy',
  refs:['Nielsen: 0,1 / 1 / 10 s','WCAG 4.1.3 · AA'],
  rule:`Die Wartezeit bestimmt den Indikator: unter etwa 300 ms <strong>nichts</strong>, bis etwa 10 s ein <strong>Skeleton</strong> (für Inhalt) oder Spinner (für Aktionen), darüber ein <strong>Fortschrittsbalken</strong> mit Restzeit und „Abbrechen“.`,
  numbers:[['0,1 s','fühlt sich sofort an'],['1 s','Gedankenfluss bleibt erhalten'],['10 s','Aufmerksamkeit ist weg'],['~300 ms','Verzögerung, bevor ein Indikator erscheint']],
  demo:`
  <fieldset class="seg"><legend>Simulierte Wartezeit</legend><div class="seg-opts">
    <label><input type="radio" name="ld-dur" value="200">0,2 s</label>
    <label><input type="radio" name="ld-dur" value="2500" checked>2,5 s</label>
    <label><input type="radio" name="ld-dur" value="12000">12 s</label>
  </div></fieldset>
  <div class="btn-row"><button type="button" class="btn btn-primary" id="ld-go">Kontoauszüge laden</button></div>
  <div class="ld-out" id="ld-out" aria-live="polite" aria-busy="false"><p class="demo-note" style="margin:0">Noch nichts geladen.</p></div>
  <p class="ld-why" id="ld-why"></p>`,
  init(root){
    const out=$('#ld-out',root),why=$('#ld-why',root);let timers=[],iv=null;
    const stop=()=>{timers.forEach(clearTimeout);timers=[];clearInterval(iv);iv=null};
    const rows=()=>['Juli 2026','Juni 2026','Mai 2026'].map((m,i)=>`<div class="ld-row"><span class="ld-ic">${ic('file')}</span><p><b>Kontoauszug ${m}</b><br><small>PDF · ${[84,91,77][i]} KB</small></p></div>`).join('');
    const skel=()=>Array.from({length:3},()=>`<div class="ld-row" aria-hidden="true"><span class="skel" style="width:36px;height:36px;flex:none"></span><span class="skel-lines"><span class="skel" style="height:12px;width:60%;display:block"></span><span class="skel" style="height:10px;width:35%;display:block"></span></span></div>`).join('');
    const done=()=>{stop();out.innerHTML=rows();out.setAttribute('aria-busy','false')};
    function run(d){
      stop();out.setAttribute('aria-busy','true');out.innerHTML='';why.innerHTML='';
      const t0=Date.now();
      if(d<=300) why.innerHTML='<strong>Unter ~300 ms:</strong> kein Indikator. Ein Spinner, der kurz aufblitzt, wirkt langsamer als gar keiner.';
      timers.push(setTimeout(()=>{
        if(d>300&&d<=10000){out.innerHTML=skel();why.innerHTML='<strong>~0,3–10 s:</strong> Skeleton in der Form des echten Inhalts. Die Struktur steht schon, das Layout springt nicht, die Wartezeit fühlt sich kürzer an.'}
        else if(d>10000){
          out.innerHTML=`<div class="ld-prog"><div class="ld-prog-row"><span id="ld-pct">0 %</span><span id="ld-rest">noch ca. ${Math.round(d/1000)} s</span></div><div class="bar" role="progressbar" aria-label="Ladefortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ld-bar"><span></span></div><button type="button" class="btn btn-secondary" id="ld-cancel">Abbrechen</button></div>`;
          why.innerHTML='<strong>Über ~10 s:</strong> Fortschrittsbalken mit Prozent, Restzeit und „Abbrechen“. Ohne das glauben Nutzer, die App hängt.';
          const bar=$('#ld-bar',out);
          iv=setInterval(()=>{const p=Math.min(100,Math.round((Date.now()-t0)/d*100));$('#ld-pct',out).textContent=p+' %';$('#ld-rest',out).textContent=`noch ca. ${Math.max(0,Math.ceil((d-(Date.now()-t0))/1000))} s`;bar.style.setProperty('--p',p+'%');bar.setAttribute('aria-valuenow',p)},250);
          $('#ld-cancel',out).addEventListener('click',()=>{
            stop();out.setAttribute('aria-busy','false');
            out.innerHTML='<div class="ld-prog"><p style="margin:0"><b>Laden abgebrochen.</b> Es wurde nichts geändert.</p><button type="button" class="btn btn-secondary" id="ld-retry">Erneut versuchen</button></div>';
            const r=$('#ld-retry',out);r.addEventListener('click',()=>run(d));r.focus();
          });
        }
      },300));
      timers.push(setTimeout(done,d));
    }
    $('#ld-go',root).addEventListener('click',()=>run(+$('input[name="ld-dur"]:checked',root).value));
    return stop;
  },
  do:[`Skeleton in der Form des echten Inhalts – das Layout springt nicht, wenn die Daten kommen.`,`<strong>Optimistic UI:</strong> Bei fast sicher erfolgreichen Aktionen (Like, Abhaken) sofort das Ergebnis zeigen und im Fehlerfall zurückrollen.`,`Bei langen Vorgängen: Prozent, Restzeit, Abbrechen.`],
  dont:[`Vollbild-Spinner, der die ganze App blockiert, wenn nur ein Bereich lädt.`,`Ein Spinner, der 100 ms aufblitzt.`,`Endlos-Spinner ohne Timeout und ohne Fehlermeldung.`],
  why:`<p>Jakob Nielsens Antwortzeit-Grenzen gelten seit Jahrzehnten: 0,1 s fühlt sich sofort an, bis 1 s bleibt der Gedankenfluss erhalten, ab 10 s wandert die Aufmerksamkeit ab. Der Indikator muss zur Wartezeit passen.</p><p>Ein Skeleton ist mehr als Deko. Es zeigt, <em>was</em> gleich kommt, und reserviert den Platz. Wenn die Daten da sind, springt nichts (weniger <em>Layout Shift</em>).</p><p>Für Screenreader markiert <code>aria-busy="true"</code> den Bereich als „wird gerade aktualisiert“. Erst danach wird der neue Inhalt angesagt.</p>`,
  here:`Diese App lädt nichts nach, darum gibt es hier nur die Demo. Der Ergebnisbereich trägt während des Ladens <code>aria-busy="true"</code>, und nach „Abbrechen“ springt der Fokus auf „Erneut versuchen“, weil der Abbrechen-Button verschwindet.`
},
{
  id:'empty-states',cat:'Feedback',title:'Empty States',
  short:'Leere Ansichten erklären, warum sie leer sind, und was als Nächstes kommt.',
  keys:'leer keine daten treffer onboarding erster start leerer zustand',
  refs:['UX-Muster','Onboarding'],
  rule:`Ein leerer Zustand ist nie nur „Keine Daten“. Er sagt, <strong>warum</strong> hier nichts ist, und bietet genau die Aktion an, die das ändert.`,
  numbers:[['4 Arten','Erste Nutzung · Keine Treffer · Alles erledigt · Fehler'],['1 Aktion','der passende nächste Schritt'],['1–2 Sätze','Erklärung, nicht mehr'],['„Keine Daten.“','ist nie genug']],
  demo:`
  <div class="es-controls">
    <fieldset class="seg"><legend>Situation</legend><div class="seg-opts">
      <label><input type="radio" name="es-kind" value="first" checked>Erste Nutzung</label>
      <label><input type="radio" name="es-kind" value="search">Keine Treffer</label>
      <label><input type="radio" name="es-kind" value="done">Alles erledigt</label>
      <label><input type="radio" name="es-kind" value="error">Fehler</label>
    </div></fieldset>
    <button type="button" class="switch" role="switch" aria-checked="false" id="es-bad"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>Schlechte Version zeigen</span></button>
  </div>
  <div class="es-stage" id="es-stage" aria-live="polite"></div>`,
  init(root){
    const stage=$('#es-stage',root);let bad=false,filled=false;
    const S={
      first:{ic:'inbox',h:'Noch keine Aufgaben',p:'Hier landen alle Aufgaben, die du dir oder deinem Team zuweist. Leg die erste an – das dauert zehn Sekunden.',b:'Erste Aufgabe anlegen',c:'btn-primary'},
      search:{ic:'search',h:'Keine Treffer für „Steuererklärung 2019“',p:'Gesucht wurde nur in der Liste „Privat“. Prüfe die Schreibweise oder such in allen Listen.',b:'In allen Listen suchen',c:'btn-secondary'},
      done:{ic:'ok',h:'Alles erledigt',p:'Für heute steht nichts mehr an. Neue Aufgaben erscheinen hier automatisch.',b:'Aufgabe für morgen planen',c:'btn-ghost'},
      error:{ic:'alert',h:'Aufgaben konnten nicht geladen werden',p:'Keine Verbindung zum Server. Deine Daten sind sicher – nur die Anzeige klappt gerade nicht.',b:'Erneut versuchen',c:'btn-secondary'}
    };
    const render=()=>{
      const k=$('input[name="es-kind"]:checked',root).value,s=S[k];
      if(filled){stage.innerHTML=`<div class="es-filled"><ul class="es-list"><li>${ic('circle')}Angebot an Müller GmbH schicken</li><li>${ic('circle')}Logo in drei Größen exportieren</li><li>${ic('circle')}Design-Review vorbereiten</li></ul><button type="button" class="btn btn-ghost" id="es-reset">Zurück zum leeren Zustand</button></div>`;return}
      if(bad){stage.innerHTML='<p class="es-bad">Keine Daten.</p>';return}
      stage.innerHTML=`<div class="es ${k}">${ic(s.ic)}<h3>${s.h}</h3><p>${s.p}</p><button type="button" class="btn ${s.c}" id="es-act">${s.b}</button></div>`;
    };
    render();
    $$('input[name="es-kind"]',root).forEach(r=>r.addEventListener('change',()=>{filled=false;render()}));
    $('#es-bad',root).addEventListener('toggle',e=>{bad=e.detail;filled=false;render()});
    stage.addEventListener('click',e=>{
      if(e.target.closest('#es-act')){filled=true;render();$('#es-reset',root).focus()}
      if(e.target.closest('#es-reset')){filled=false;render();$('#es-act',root)?.focus()}
    });
  },
  do:[`Bei „keine Treffer“ den Suchbegriff zeigen und einen Ausweg anbieten.`,`Bei der ersten Nutzung erklären, was hier später steht – ein Mini-Onboarding.`,`„Alles erledigt“ darf sich wie ein Erfolg anfühlen.`],
  dont:[`„Keine Daten.“ ohne Grund und Ausweg.`,`Eine leere Tabelle mit Spaltenköpfen und nichts darunter.`,`Fehler als leeren Zustand tarnen („Keine Einträge“, obwohl der Server nicht erreichbar war).`],
  why:`<p>Leere Zustände sieht man genau dann, wenn man am unsichersten ist: beim ersten Start, nach einer erfolglosen Suche, nach einem Fehler. „Keine Daten“ lässt einen allein. Ein guter Empty State beantwortet drei Fragen: Was ist das hier? Warum ist es leer? Was kann ich tun?</p><p>Fehler dürfen nie als Leere getarnt werden. „Keine Einträge“ bei einem Serverausfall lässt Nutzer glauben, ihre Daten seien weg.</p>`,
  here:`Tipp links in die Suche etwas Unsinniges wie „xyz“: Die Liste zeigt einen Empty State mit deinem Suchbegriff und „Suche zurücksetzen“. Auch die Datei-Demo bei „Toasts“ hat einen, wenn du alles löschst.`
},
{
  id:'dialog',cat:'Feedback',title:'Modal-Dialoge',
  short:'Nur für Entscheidungen, die den Ablauf wirklich unterbrechen müssen.',
  keys:'modal dialog popup overlay bestätigung confirm fokus falle escape',
  refs:['WCAG 2.1.2 · A','WCAG 2.4.3 · A','ARIA APG: Dialog'],
  rule:`Ein Modal unterbricht bewusst. Nur für Entscheidungen, die nicht rückgängig zu machen sind oder ohne die es nicht weitergeht. <strong>Fokus hinein, Escape hinaus, Fokus zurück zum Auslöser.</strong>`,
  numbers:[['1','Dialog gleichzeitig – nie stapeln'],['Esc','schließt immer'],['Fokus','startet auf der sichersten Option'],['…','Button-Text endet mit Ellipse, wenn ein Dialog folgt']],
  demo:`
  <div>
    <div class="proj" id="dg-proj"></div>
    <p class="demo-note">Die drei Punkte im Button kündigen an: Es kommt noch eine Rückfrage, es passiert noch nichts.</p>
  </div>
  <dialog id="dg" aria-labelledby="dg-title" aria-describedby="dg-desc">
    <form method="dialog" class="dlg-in">
      <h3 id="dg-title">Projekt „Alpha“ löschen?</h3>
      <p id="dg-desc">Alle 24 Dateien werden endgültig entfernt. Das lässt sich nicht rückgängig machen.</p>
      <div class="btn-row dlg-actions"><button class="btn btn-secondary" value="cancel" autofocus>Abbrechen</button><button class="btn btn-danger" value="delete">Projekt endgültig löschen</button></div>
    </form>
  </dialog>
  <div>
    <h3>Probier mit der Tastatur</h3>
    <ul class="tips"><li><kbd>Tab</kbd> bleibt im Dialog, der Hintergrund ist gesperrt.</li><li><kbd>Esc</kbd> oder ein Klick daneben schließt ohne zu löschen.</li><li>Danach steht der Fokus wieder auf dem Button, der den Dialog geöffnet hat.</li></ul>
  </div>`,
  init(root){
    const proj=$('#dg-proj',root),dg=$('#dg',root);
    const renderProj=()=>{proj.innerHTML=`<span class="proj-ic">${ic('file')}</span><div class="proj-text"><p class="proj-name">Projekt „Alpha“</p><p class="hint">24 Dateien · zuletzt geändert heute</p></div><button type="button" class="btn btn-danger" id="dg-open">Projekt löschen …</button>`};
    renderProj();
    proj.addEventListener('click',e=>{
      if(e.target.closest('#dg-open')){dg.returnValue='';dg.showModal()}
      if(e.target.closest('#dg-restore')){renderProj();$('#dg-open',root).focus()}
    });
    dg.addEventListener('click',e=>{if(e.target===dg)dg.close('cancel')});
    dg.addEventListener('close',()=>{
      if(dg.returnValue==='delete'){
        proj.innerHTML=`<span class="proj-ic">${ic('trash')}</span><div class="proj-text"><p class="proj-name">Projekt „Alpha“ wurde gelöscht.</p><p class="hint">Kein Undo möglich – genau deshalb gab es die Rückfrage.</p></div><button type="button" class="btn btn-secondary" id="dg-restore">Demo zurücksetzen</button>`;
        $('#dg-restore',root).focus();
        toast({msg:'Projekt „Alpha“ gelöscht.',type:'success'});
      }else $('#dg-open',root)?.focus();
    });
    return()=>{if(dg.open)dg.close()};
  },
  do:[`Natives <code>&lt;dialog&gt;</code> mit <code>showModal()</code>: Hintergrund wird inert, Esc funktioniert, liegt im Top Layer.`,`Titel als Frage mit Objekt: „Projekt „Alpha“ löschen?“`,`Den destruktiven Button eindeutig benennen und rot markieren – aber nicht vorfokussieren.`],
  dont:[`Modals für Infos, die auch inline stehen könnten („Wussten Sie schon …?“).`,`Ein Dialog, der sich nur über ein winziges × schließen lässt.`,`Bestätigungsdialog für Dinge, die man rückgängig machen kann – dann lieber Undo-Toast.`],
  why:`<p>Ein Modal nimmt den Rest der Oberfläche aus dem Spiel. Das ist gewollt, wenn eine Entscheidung wirklich erst getroffen werden muss, und ärgerlich in allen anderen Fällen.</p><p>Für Tastatur- und Screenreader-Nutzer gilt: Der Fokus muss in den Dialog springen, darf ihn nicht versehentlich verlassen und muss nach dem Schließen zurück zum Auslöser. Sonst landet man am Seitenanfang und sucht. Das native <code>&lt;dialog&gt;</code> mit <code>showModal()</code> erledigt das meiste davon.</p><p>Der Fokus startet auf „Abbrechen“: Wer reflexartig Enter drückt, soll nichts zerstören.</p>`,
  here:`Diese App hat genau einen Dialog – den in der Demo. Alles andere ist harmlos oder rückgängig machbar und braucht deshalb keine Rückfrage.`
},
{
  id:'deep-linking',cat:'Navigation',title:'Deep Linking',
  short:'Jeder teilbare Zustand hat eine eigene URL – und „Zurück“ funktioniert.',
  keys:'url link teilen bookmark history zurück back routing hash universal links app links',
  refs:['WCAG 2.4.2 · A','Universal Links / App Links','UX-Grundregel'],
  rule:`Alles, was man teilen, bookmarken oder wiederfinden möchte, bekommt eine eigene Adresse: die geöffnete Lektion, der gewählte Tab, ein Filter. Wer den Link öffnet, landet <strong>genau dort</strong>.`,
  numbers:[['1 URL','pro teilbarem Zustand'],['Zurück','führt zum vorherigen Zustand'],['Titel','document.title passt zur Ansicht'],['Fokus','nach dem Wechsel auf die neue Überschrift']],
  demo:`
  <div>
    <p class="hint">Adresse dieser Ansicht</p>
    <div class="dl-url"><code id="dl-hash">#deep-linking</code><button type="button" class="btn btn-secondary" id="dl-copy">${ic('copy')} Anker kopieren</button></div>
    <p class="demo-note">In einer echten App stünde hier ein Pfad wie <code>https://app.beispiel.at/lektionen/deep-linking</code>.</p>
  </div>
  <div>
    <h3>Direkt hinspringen</h3>
    <ul class="dl-links"><li><a href="#contrast">#contrast</a> öffnet die Kontrast-Lektion</li><li><a href="#dialog">#dialog</a> öffnet die Dialog-Lektion</li><li><a href="#gibt-es-nicht">#gibt-es-nicht</a> zeigt eine hilfreiche 404-Seite</li></ul>
    <p class="demo-note">Danach mit dem Zurück-Button des Browsers (oder <kbd>Alt</kbd> + <kbd>←</kbd>) wieder hierher.</p>
  </div>
  <div>
    <h3>Dein Verlauf in dieser Sitzung</h3>
    <ol class="dl-hist" id="dl-hist"></ol>
  </div>`,
  init(root){
    $('#dl-hist',root).innerHTML=VISITED.map(v=>`<li><a href="#${v.id}">${esc(v.title)}</a></li>`).join('');
    const code=$('#dl-hash',root);
    $('#dl-copy',root).addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(code.textContent);toast({msg:`Anker „${code.textContent}“ kopiert.`,type:'success',duration:3000})}
      catch(e){const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);toast({msg:'Kopieren ist hier nicht erlaubt. Der Text ist markiert – drück Strg + C.',duration:6000})}
    });
  },
  do:[`Nach einem Wechsel in einer Single-Page-App: Titel aktualisieren und Fokus auf die neue <code>h1</code> setzen, sonst merkt ein Screenreader nichts.`,`Alte Links nicht brechen: weiterleiten oder eine hilfreiche 404 zeigen.`,`In Native Apps: Universal Links (iOS) bzw. App Links (Android), damit ein Web-Link direkt in die App führt.`],
  dont:[`Zustand nur im Arbeitsspeicher – Reload, und alles ist weg.`,`Jeden Tastendruck als eigenen Verlaufseintrag speichern. Für Filter und Suche gibt es <code>history.replaceState</code>.`,`„Link kopieren“, der immer nur die Startseite liefert.`],
  why:`<p>Links sind das Gedächtnis des Webs. Bildet eine App ihren Zustand nicht in der URL ab, kann niemand eine Stelle teilen („schau dir mal Lektion 11 an“), bookmarken oder nach einem Reload wiederfinden.</p><p>Single-Page-Apps wechseln Inhalte ohne Seiten-Reload. Für Screenreader passiert dann scheinbar nichts. Deshalb setzt diese App nach jedem Wechsel den Fokus auf die neue Überschrift und aktualisiert den Seitentitel (WCAG 2.4.2).</p>`,
  here:`Jede Lektion hat einen Anker wie <code>#toast</code>. In einer echten App wäre das ein Pfad über die History API – diese Vorschau erlaubt nur einfache Anker. Der Tab-Titel deines Browsers wechselt mit jeder Lektion.`
},
{
  id:'master-detail',cat:'Navigation',title:'Master-Detail',
  short:'Liste und Detail nebeneinander – auf dem Handy nacheinander.',
  keys:'list detail split view zwei spalten container query responsive postfach',
  refs:['Material 3: List-Detail','Apple: Split View','WCAG 1.4.10 · AA'],
  rule:`Die Liste (Master) und der gewählte Eintrag (Detail) stehen auf breiten Bildschirmen nebeneinander. Auf schmalen werden sie zum Vor-und-zurück: Liste → Detail → zurück zur Liste, <strong>an dieselbe Stelle</strong>.`,
  numbers:[['~ 600–840 px','Breite, ab der beide Spalten passen'],['280–360 px','typische Breite der Master-Spalte'],['aria-current','markiert den aktiven Eintrag'],['Scroll + Fokus','bleiben beim Zurückgehen erhalten']],
  demo:`
  <div class="md-ctl"><label for="md-w">Breite der Vorschau: <output id="md-wout">640 px</output></label><input type="range" id="md-w" min="280" max="720" step="10" value="640"></div>
  <div class="md-frame" id="md-frame" style="--w:640px">
    <div class="md" id="md" data-view="list">
      <ul class="md-list" id="md-list" aria-label="Posteingang (Beispiel)"></ul>
      <div class="md-detail"><button type="button" class="md-back" id="md-back">${ic('back')} Posteingang</button><div id="md-content"></div></div>
    </div>
  </div>
  <p class="md-state" id="md-state" aria-live="polite"></p>`,
  init(root){
    const M=[
      {from:'Lena Hofer',subj:'Entwurf für die Startseite',body:'Ich habe die Startseite überarbeitet: weniger Text, dafür ein klarer Primary-Button. Schaust du bis Freitag drüber?',time:'09:14'},
      {from:'Build-Server',subj:'Deployment erfolgreich',body:'Version 2.4.0 ist live. 0 Fehler, 3 Warnungen.',time:'08:02'},
      {from:'Tom Berger',subj:'Frage zu Farben',body:'Reicht unser Hellgrau (#9AA0A6) auf Weiß für Hilfetexte? Ich glaube, das ist zu schwach. (Er hat recht: 2,6 : 1.)',time:'Gestern'},
      {from:'Kalender',subj:'Design-Review um 14 Uhr',body:'Raum 2.13 oder per Video. Agenda: Toasts, Empty States, Dark Mode.',time:'Gestern'}
    ];
    const md=$('#md',root),list=$('#md-list',root),content=$('#md-content',root),frame=$('#md-frame',root),state=$('#md-state',root);let sel=0;
    list.innerHTML=M.map((m,i)=>`<li><button type="button" class="md-item" data-i="${i}"><b>${esc(m.subj)}</b><span>${esc(m.from)} · ${m.time}</span></button></li>`).join('');
    const wide=()=>frame.clientWidth>=520;
    const show=(i,focus)=>{
      sel=i;
      $$('.md-item',list).forEach((b,j)=>{if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
      const m=M[i];content.innerHTML=`<h3 tabindex="-1">${esc(m.subj)}</h3><p class="hint">Von ${esc(m.from)} · ${m.time}</p><p>${esc(m.body)}</p>`;
      md.dataset.view='detail';if(focus&&!wide())$('h3',content).focus();
    };
    const upd=()=>{state.textContent=wide()?`Container ${frame.clientWidth} px ≥ 520 px → nebeneinander`:`Container ${frame.clientWidth} px < 520 px → nacheinander (${md.dataset.view==='list'?'Liste':'Detail'})`};
    show(0,false);md.dataset.view='list';upd();
    list.addEventListener('click',e=>{const b=e.target.closest('.md-item');if(b){show(+b.dataset.i,true);upd()}});
    $('#md-back',root).addEventListener('click',()=>{md.dataset.view='list';upd();$$('.md-item',list)[sel].focus()});
    $('#md-w',root).addEventListener('input',e=>{frame.style.setProperty('--w',e.target.value+'px');$('#md-wout',root).textContent=e.target.value+' px';requestAnimationFrame(upd)});
    const ro=new ResizeObserver(upd);ro.observe(frame);
    return()=>ro.disconnect();
  },
  do:[`Den aktiven Eintrag deutlich markieren – mit Form (Balken, Fläche), nicht nur mit Farbe.`,`Auf breiten Screens ein sinnvolles Detail vorauswählen oder einen hilfreichen Platzhalter zeigen.`,`Beim Zurück: Scrollposition und Fokus auf dem zuletzt geöffneten Eintrag.`],
  dont:[`Auf dem Handy beide Spalten auf je 50 % quetschen.`,`Nach „Zurück“ wieder ganz oben in der Liste landen.`,`Das Detail in einem Modal öffnen – dann fehlt die URL.`],
  why:`<p>Master-Detail spart Wege: Auf großen Screens sieht man Überblick und Einzelheit gleichzeitig und kann durch Einträge blättern, ohne hin und her zu navigieren.</p><p>Auf kleinen Screens wäre das Nebeneinander unlesbar, also wird es zur Abfolge. Wichtig ist dann das Zurück: Wer aus Eintrag 40 zurückkommt, will bei Eintrag 40 weitermachen.</p><p>Die Demo nutzt <strong>Container Queries</strong>: Das Mini-Postfach reagiert auf die Breite seines Containers, nicht auf die des Fensters. So funktioniert dieselbe Komponente in einer schmalen Sidebar und im breiten Hauptbereich.</p>`,
  here:`Die ganze App ist ein Master-Detail. Mach das Fenster schmaler als 800 px: Liste und Lektion werden zu zwei Ansichten mit „Alle Lektionen“ als Zurück-Link – und beim Zurückgehen steht der Fokus auf der Lektion, aus der du kommst.`
},
{
  id:'navigation',cat:'Navigation',title:'Navigation & Orientierung',
  short:'Wo bin ich, wo kann ich hin – Tab Bar, Breadcrumb, aria-current.',
  keys:'tab bar bottom navigation hamburger breadcrumb menü menu aria-current badge',
  refs:['WCAG 3.2.3 · AA','WCAG 2.4.8 · AAA','Apple HIG: Tab Bars'],
  rule:`Nutzer müssen jederzeit sehen, wo sie sind und wohin sie können. Die Hauptnavigation bleibt an derselben Stelle, zeigt den aktuellen Ort und hat <strong>Icons mit Text</strong>.`,
  numbers:[['3–5','Ziele in einer Bottom Tab Bar'],['Icon + Text','Icons allein sind mehrdeutig'],['aria-current','„page“ für den aktuellen Ort'],['gleiche Stelle','auf jeder Seite (WCAG 3.2.3)']],
  demo:`
  <div class="phones">
    <figure class="phone">
      <div class="phone-frame">
        <div class="phone-screen"><p class="phone-title" id="nv-title">Start</p><p id="nv-text">Deine Übersicht mit den wichtigsten Zahlen.</p></div>
        <div class="tabbar" role="group" aria-label="Hauptnavigation (Beispiel)" id="nv-bar">
          <button type="button" class="tab" data-t="Start" aria-current="page">${ic('home')}Start</button>
          <button type="button" class="tab" data-t="Suche">${ic('search')}Suche</button>
          <button type="button" class="tab" data-t="Nachrichten">${ic('mail')}Nachrichten<span class="nbadge" aria-hidden="true">3</span><span class="sr-only">, 3 ungelesen</span></button>
          <button type="button" class="tab" data-t="Profil">${ic('user')}Profil</button>
        </div>
      </div>
      <figcaption class="tag tag-good">${ic('ok')} 4 Ziele, Icon + Text, Badge mit Zahl</figcaption>
    </figure>
    <figure class="phone">
      <div class="phone-frame" inert>
        <div class="phone-screen"><p class="phone-title">???</p><p>Welches Icon war nochmal „Favoriten“ und welches „Gesundheit“?</p></div>
        <div class="tabbar bad"><span class="tab">${ic('home')}</span><span class="tab">${ic('search')}</span><span class="tab">${ic('heart')}</span><span class="tab">${ic('star')}</span><span class="tab">${ic('bell')}</span><span class="tab">${ic('tag')}</span><span class="tab">${ic('gear')}</span></div>
      </div>
      <figcaption class="tag tag-bad">${ic('xc')} 7 Ziele, nur Icons, zu klein</figcaption>
    </figure>
  </div>
  <div>
    <h3>Breadcrumb</h3>
    <nav class="crumbs" aria-label="Brotkrümelnavigation (Beispiel)"><ol><li><a href="#navigation">Start</a></li><li><a href="#navigation">Einstellungen</a></li><li><span aria-current="page">Benachrichtigungen</span></li></ol></nav>
    <p class="demo-note">Die letzte Station ist kein Link – man ist ja schon dort. Sie trägt <code>aria-current="page"</code>.</p>
  </div>`,
  init(root){
    const T={Start:'Deine Übersicht mit den wichtigsten Zahlen.',Suche:'Suche über alle Inhalte.',Nachrichten:'3 ungelesene Nachrichten.',Profil:'Konto, Einstellungen, Abmelden.'};
    $('#nv-bar',root).addEventListener('click',e=>{
      const b=e.target.closest('.tab');if(!b)return;
      $$('.tab',$('#nv-bar',root)).forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
      $('#nv-title',root).textContent=b.dataset.t;$('#nv-text',root).textContent=T[b.dataset.t];
    });
  },
  do:[`Auf dem Handy: Bottom Tab Bar für die 3–5 wichtigsten Bereiche – dort, wo der Daumen ist.`,`Breadcrumbs bei tiefer Hierarchie (Start › Einstellungen › Benachrichtigungen).`,`Badges sparsam, mit Zahl und Text für Screenreader.`],
  dont:[`Alle Ziele hinter einem Hamburger-Menü verstecken.`,`Die Reihenfolge der Navigation von Seite zu Seite ändern.`,`Den aktuellen Ort nur durch eine andere Farbe markieren.`],
  why:`<p>Orientierung ist die Grundfrage jeder Oberfläche: Wo bin ich? Wo kann ich hin? Wie komme ich zurück? Eine gute Navigation beantwortet alle drei ohne Nachdenken.</p><p>Versteckte Navigation (Hamburger-Menü) wird messbar seltener genutzt – was man nicht sieht, vergisst man. Auf dem Handy ist die Bottom Tab Bar deshalb Standard: sichtbar und in Daumenreichweite.</p><p>Icons allein sind mehrdeutig. Ist das Herz „Favoriten“ oder „Gesundheit“? Mit Text gibt es kein Rätselraten.</p>`,
  here:`In der Liste trägt der aktive Eintrag <code>aria-current="page"</code> und einen Balken links. Screenreader sagen dann „aktuelle Seite“. Die Liste steht immer an derselben Stelle.`
},
{
  id:'contrast',cat:'Barrierefreiheit',title:'Farbkontrast',
  short:'4,5 : 1 für Text, 3 : 1 für große Schrift und Bedienelemente – live prüfen.',
  keys:'kontrast farbe lesbarkeit wcag aa aaa grau contrast ratio',
  refs:['WCAG 1.4.3 · AA','WCAG 1.4.6 · AAA','WCAG 1.4.11 · AA'],
  rule:`Normaler Text braucht mindestens <strong>4,5 : 1</strong> Kontrast zum Hintergrund, große Schrift <strong>3 : 1</strong>. Rahmen von Eingabefeldern, Icons und Fokusringe brauchen ebenfalls 3 : 1.`,
  numbers:[['4,5 : 1','Fließtext (AA)'],['3 : 1','große Schrift ab 24 px bzw. 18,66 px fett'],['3 : 1','UI-Grafik: Feldrahmen, Icons, Fokus'],['7 : 1','Fließtext (AAA)']],
  demo:`
  <div class="ct">
    <div class="ct-inputs">
      <div class="field"><label for="ct-fg">Textfarbe</label><div class="ct-pick"><input type="color" id="ct-fg" value="#767676"><output id="ct-fg-hex" for="ct-fg">#767676</output></div></div>
      <div class="field"><label for="ct-bg">Hintergrund</label><div class="ct-pick"><input type="color" id="ct-bg" value="#ffffff"><output id="ct-bg-hex" for="ct-bg">#FFFFFF</output></div></div>
      <div><p class="hint" style="margin-bottom:6px">Beispiele</p><div class="ct-presets">
        <button type="button" class="btn btn-secondary" data-fg="#a3a3a3" data-bg="#ffffff">Placeholder-Grau</button>
        <button type="button" class="btn btn-secondary" data-fg="#ffffff" data-bg="#f5c400">Weiß auf Gelb</button>
        <button type="button" class="btn btn-secondary" data-fg="#767676" data-bg="#ffffff">Gerade so AA</button>
        <button type="button" class="btn btn-secondary" data-brand="1">Markenfarbe</button>
      </div></div>
    </div>
    <div style="display:grid;gap:14px">
      <div class="ct-preview" id="ct-preview"><p class="ct-normal">Normaler Text, 16 px. So liest sich Fließtext.</p><p class="ct-large">Große Schrift, 24 px</p><span class="ct-ui">Feldrahmen / Icon</span></div>
      <p class="ct-ratio"><output id="ct-ratio" aria-live="polite">4,54 : 1</output></p>
      <ul class="ct-results" id="ct-results"></ul>
    </div>
  </div>`,
  init(root){
    const fg=$('#ct-fg',root),bg=$('#ct-bg',root);
    const upd=()=>{
      const r=ratio(fg.value,bg.value),pv=$('#ct-preview',root);
      pv.style.color=fg.value;pv.style.background=bg.value;
      $('#ct-fg-hex',root).textContent=fg.value.toUpperCase();$('#ct-bg-hex',root).textContent=bg.value.toUpperCase();
      $('#ct-ratio',root).textContent=fmt(r)+' : 1';
      const C=[['Fließtext AA',4.5],['Große Schrift AA',3],['UI-Elemente AA',3],['Fließtext AAA',7]];
      $('#ct-results',root).innerHTML=C.map(([n,min])=>{const ok=r>=min;return`<li>${ic(ok?'ok':'xc')}<span><span class="${ok?'pass':'fail'}">${ok?'bestanden':'nicht bestanden'}</span> – ${n} (mind. ${String(min).replace('.',',')} : 1)</span></li>`}).join('');
      $$('#ct-results .ic',root).forEach(i=>i.style.color=i.nextElementSibling.firstElementChild.classList.contains('pass')?'var(--success)':'var(--danger)');
    };
    fg.addEventListener('input',upd);bg.addEventListener('input',upd);
    $$('.ct-presets .btn',root).forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.brand){fg.value='#ffffff';bg.value=cssVar('--brand-l').toLowerCase()}else{fg.value=b.dataset.fg;bg.value=b.dataset.bg}
      upd();
    }));
    upd();
  },
  do:[`Kontrast schon beim Anlegen der Farbtokens prüfen – für Hell und Dunkel.`,`Placeholder und „ausgegrauten“ Hilfetext mitprüfen, das sind die Klassiker.`,`Bei White-Label: jede Kundenfarbe automatisch testen.`],
  dont:[`Hellgrauer Text auf Weiß, „weil es eleganter aussieht“.`,`Weißer Text auf Gelb oder Hellgrün.`,`Text über Fotos ohne abdunkelndes Overlay.`],
  why:`<p>Kontrast hilft nicht nur Menschen mit Sehschwäche, sondern allen im Sonnenlicht, auf billigen Displays oder mit gedimmtem Bildschirm.</p><p>Das Verhältnis wird aus der <em>relativen Leuchtdichte</em> beider Farben berechnet: (L<sub>hell</sub> + 0,05) / (L<sub>dunkel</sub> + 0,05). Schwarz auf Weiß ergibt 21 : 1, gleiche Farben 1 : 1. Grün trägt dabei am meisten zur Helligkeit bei, Blau am wenigsten – deshalb wirkt Gelb so hell.</p>`,
  here:`Jede Markenfarbe dieser App wurde gegen ihre Textfarbe geprüft, im hellen und im dunklen Theme. In der Lektion „White-Label“ läuft die Prüfung live, sobald du die Marke wechselst.`
},
{
  id:'focus',cat:'Barrierefreiheit',title:'Tastatur & sichtbarer Fokus',
  short:'Alles per Tab erreichbar, Fokus immer sichtbar, Reihenfolge logisch.',
  keys:'tastatur keyboard fokus focus outline tab skip link tabindex',
  refs:['WCAG 2.1.1 · A','WCAG 2.4.3 · A','WCAG 2.4.7 · AA','WCAG 2.4.11 · AA'],
  rule:`Alles, was mit der Maus geht, muss auch mit der Tastatur gehen. Das fokussierte Element ist <strong>immer deutlich sichtbar</strong>, und die Tab-Reihenfolge folgt der Lesereihenfolge.`,
  numbers:[['≥ 2 px','Dicke des Fokusrings'],['3 : 1','Kontrast des Fokusrings'],[':focus-visible','Ring bei Tastatur, nicht nach Mausklick'],['Tab / Shift+Tab','vor und zurück']],
  demo:`
  <div>
    <div class="fd">
      <div class="fd-col"><p class="tag tag-bad">${ic('xc')} Ohne Fokusring</p><div class="btn-row nofocus"><button type="button" class="btn btn-secondary">Eins</button><button type="button" class="btn btn-secondary">Zwei</button><button type="button" class="btn btn-secondary">Drei</button></div></div>
      <div class="fd-col"><p class="tag tag-good">${ic('ok')} Mit Fokusring</p><div class="btn-row"><button type="button" class="btn btn-secondary">Eins</button><button type="button" class="btn btn-secondary">Zwei</button><button type="button" class="btn btn-secondary">Drei</button></div></div>
    </div>
    <p class="demo-note">Klick auf „Live-Beispiel“ oben und drück dann mehrmals <kbd>Tab</kbd>. Wo bist du gerade – links?</p>
  </div>
  <div>
    <h3>Echter Button vs. <code>div</code></h3>
    <div class="btn-row"><div class="fake-btn" id="fd-fake">Speichern (div)</div><button type="button" class="btn btn-primary" id="fd-real">Speichern (button)</button></div>
    <p class="demo-note" id="fd-log" aria-live="polite">Versuch, beide nur mit der Tastatur auszulösen.</p>
  </div>
  <div>
    <h3>Tastenkürzel dieser App</h3>
    <div class="table-wrap"><table class="kb-table"><tbody>
      <tr><th scope="row"><kbd>Tab</kbd> / <kbd>Shift</kbd> + <kbd>Tab</kbd></th><td>Zum nächsten / vorherigen Bedienelement</td></tr>
      <tr><th scope="row"><kbd>Enter</kbd> / <kbd>Leertaste</kbd></th><td>Button oder Link auslösen, Checkbox umschalten</td></tr>
      <tr><th scope="row"><kbd>←</kbd> <kbd>→</kbd></th><td>Innerhalb einer Radio-Gruppe wechseln (z. B. Wartezeit)</td></tr>
      <tr><th scope="row"><kbd>/</kbd></th><td>In die Lektionssuche springen</td></tr>
      <tr><th scope="row"><kbd>Esc</kbd></th><td>Dialog schließen</td></tr>
      <tr><th scope="row"><kbd>Strg</kbd> + <kbd>Z</kbd></th><td>Letztes Löschen rückgängig (solange der Toast sichtbar ist)</td></tr>
    </tbody></table></div>
  </div>`,
  init(root){
    const log=$('#fd-log',root);
    $('#fd-fake',root).addEventListener('click',()=>{log.textContent='Das div hat reagiert – aber nur auf die Maus. Per Tab kommst du gar nicht hin, und ein Screenreader sagt nicht „Schaltfläche“.'});
    $('#fd-real',root).addEventListener('click',e=>{log.textContent=e.detail===0?'Button per Tastatur ausgelöst. Das gibt es bei <button> gratis.':'Button per Maus ausgelöst. Probier es auch mit Tab + Enter.'});
  },
  do:[`Echte <code>&lt;button&gt;</code> und <code>&lt;a href&gt;</code> verwenden – die sind automatisch fokussierbar und reagieren auf Enter und Leertaste.`,`Skip Link als erstes Element: „Zum Inhalt springen“.`,`Fokus nie hinter Sticky Headern oder Cookie-Bannern verstecken (WCAG 2.4.11, neu in 2.2).`],
  dont:[`<code>outline: none</code> ohne Ersatz.`,`<code>&lt;div onclick&gt;</code> als Button.`,`Positiver <code>tabindex</code> (1, 2, 3 …) – zerstört die natürliche Reihenfolge.`],
  why:`<p>Viele Menschen bedienen ohne Maus: mit Tastatur, Schaltern, Sprachsteuerung oder Screenreader. Auch Power-User sind mit der Tastatur schneller. Ohne sichtbaren Fokus ist das, als würde man mit einem unsichtbaren Mauszeiger arbeiten.</p><p><code>:focus-visible</code> löst den alten Streit zwischen Design und Barrierefreiheit: Der Browser zeigt den Ring nur, wenn er sinnvoll ist – bei Tastaturbedienung, nicht nach jedem Mausklick.</p>`,
  here:`Lade die Seite neu und drück sofort <kbd>Tab</kbd>: Oben links erscheint der Skip Link „Zum Inhalt springen“. Taste <kbd>/</kbd> springt jederzeit in die Suche.`
},
{
  id:'color-alone',cat:'Barrierefreiheit',title:'Farbe nie als einziges Signal',
  short:'Status und Fehler zusätzlich mit Icon, Text oder Form zeigen.',
  keys:'farbenblind farbsehschwäche rot grün status icon unterstrichen links',
  refs:['WCAG 1.4.1 · A','WCAG 1.4.11 · AA'],
  rule:`Information darf nie <strong>nur</strong> über Farbe transportiert werden. Rot für Fehler ist gut – aber erst mit Icon und Text ist es für alle verständlich.`,
  numbers:[['~ 8 %','der Männer mit Farbsehschwäche (meist Rot-Grün)'],['~ 0,5 %','der Frauen'],['2 Signale','Farbe + Icon, Text, Form oder Vorzeichen'],['Level A','die Grundstufe – also Pflicht']],
  demo:`
  <p style="margin:0"><button type="button" class="switch" role="switch" aria-checked="false" id="ca-gray"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>Farbe entfernen (Graustufen)</span></button></p>
  <div class="compare ca" id="ca">
    <figure>
      <figcaption class="tag tag-bad">${ic('xc')} Nur Farbe</figcaption>
      <div inert>
        <div class="field ca-field"><label>IBAN</label><input class="input" value="AT61 1904 3002 3457 32"></div>
        <ul class="status-list"><li><span class="dot dot-g"></span>Server A</li><li><span class="dot dot-r"></span>Server B</li></ul>
        <div class="pl"><span class="up">2,4 %</span><span class="down">1,1 %</span></div>
        <p>Details in der <a class="nolink" href="#color-alone">Anleitung</a>.</p>
      </div>
    </figure>
    <figure>
      <figcaption class="tag tag-good">${ic('ok')} Farbe + zweites Signal</figcaption>
      <div inert>
        <div class="field ca-field"><label>IBAN</label><input class="input" value="AT61 1904 3002 3457 32"><p class="err" style="color:#D93025">${ic('alert')}<span>Eine Ziffer fehlt: Österreichische IBANs haben 20 Stellen.</span></p></div>
        <ul class="status-list"><li><span class="dot dot-g"></span>Server A – online</li><li><span class="dot dot-hollow"></span>Server B – offline</li></ul>
        <div class="pl"><span class="up">▲ +2,4 %</span><span class="down">▼ −1,1 %</span></div>
        <p>Details in der <a href="#color-alone">Anleitung</a>.</p>
      </div>
    </figure>
  </div>
  <p class="demo-note" style="margin:0">Graustufen sind nur eine grobe Näherung an Farbsehschwäche – aber sie zeigen sofort, welche Information allein an der Farbe hängt.</p>`,
  init(root){$('#ca-gray',root).addEventListener('toggle',e=>$('#ca',root).classList.toggle('gray',e.detail))},
  do:[`Fehler: rote Umrandung + Icon + Fehlertext.`,`Status-Punkte mit Text („online“) und unterschiedlicher Form ergänzen.`,`Links im Fließtext unterstreichen.`],
  dont:[`Diagrammlinien nur farblich unterscheiden.`,`„Pflichtfelder sind rot markiert.“`,`Grün/Rot als einzige Unterscheidung von Gewinn und Verlust – Vorzeichen und Pfeile kosten nichts.`],
  why:`<p>Rund jeder zwölfte Mann unterscheidet Rot und Grün schlecht. Dazu kommen Graustufen-Displays, Sonnenlicht, Ausdrucke und Nachtmodi. Wer Status nur über Farbe kommuniziert, schließt viele aus, oft ohne es zu merken.</p><p>Die Lösung ist Redundanz: Farbe <em>plus</em> ein zweites Signal. Die Farbe darf bleiben – sie beschleunigt das Erkennen für alle, die sie sehen.</p>`,
  here:`Gelernte Lektionen in der Liste haben ein Häkchen <em>und</em> das Wort „gelernt“. Der aktive Eintrag hat einen Balken, nicht nur eine andere Hintergrundfarbe. Links im Text sind unterstrichen.`
},
{
  id:'semantics',cat:'Barrierefreiheit',title:'Semantisches HTML & Screenreader',
  short:'Das richtige Element sagt dem Screenreader, was etwas ist.',
  keys:'html semantik screenreader aria label alt text überschrift heading landmark accessibility tree',
  refs:['WCAG 1.1.1 · A','WCAG 1.3.1 · A','WCAG 4.1.2 · A'],
  rule:`Nimm das HTML-Element, das zur Bedeutung passt: <code>button</code> für Aktionen, <code>a</code> für Navigation, Überschriften in richtiger Reihenfolge, Landmarks für Bereiche. <strong>ARIA nur dort, wo HTML nicht reicht.</strong>`,
  numbers:[['1','h1 pro Seite bzw. Ansicht'],['keine Sprünge','h2 → h3, nicht h2 → h4'],['alt=""','für rein dekorative Bilder'],['aria-label','für Buttons, die nur ein Icon haben']],
  demo:`
  <div class="table-wrap"><table class="sem">
    <caption>Was ein Screenreader aus deinem Code macht</caption>
    <thead><tr><th scope="col">Bewertung</th><th scope="col">Code</th><th scope="col">Ansage</th></tr></thead>
    <tbody>
      <tr><td><span class="tag tag-bad">${ic('xc')} Falsch</span></td><td><code>&lt;button&gt;&lt;svg …/&gt;&lt;/button&gt;</code></td><td>„Schaltfläche“ – wofür?</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} Richtig</span></td><td><code>&lt;button aria-label="Suchen"&gt;&lt;svg aria-hidden="true" …/&gt;&lt;/button&gt;</code></td><td>„Suchen, Schaltfläche“</td></tr>
      <tr><td><span class="tag tag-bad">${ic('xc')} Falsch</span></td><td><code>&lt;div class="btn" onclick="save()"&gt;Speichern&lt;/div&gt;</code></td><td>„Speichern“ – kein Hinweis, dass man klicken kann; per Tab nicht erreichbar</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} Richtig</span></td><td><code>&lt;button type="button"&gt;Speichern&lt;/button&gt;</code></td><td>„Speichern, Schaltfläche“</td></tr>
      <tr><td><span class="tag tag-bad">${ic('xc')} Falsch</span></td><td><code>&lt;img src="q3.png"&gt;</code></td><td>„q3.png, Bild“</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} Richtig</span></td><td><code>&lt;img src="q3.png" alt="Umsatz Q3: plus 12 % zum Vorjahr"&gt;</code></td><td>„Umsatz Q3: plus 12 % zum Vorjahr, Bild“</td></tr>
      <tr><td><span class="tag tag-bad">${ic('xc')} Falsch</span></td><td><code>&lt;a href="/preise.pdf"&gt;hier&lt;/a&gt;</code></td><td>„hier, Link“</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} Richtig</span></td><td><code>&lt;a href="/preise.pdf"&gt;Preisliste (PDF, 2 MB)&lt;/a&gt;</code></td><td>„Preisliste (PDF, 2 MB), Link“</td></tr>
    </tbody>
  </table></div>
  <div>
    <h3>Die Struktur dieser Seite, wie ein Screenreader sie sieht</h3>
    <div class="btn-row"><button type="button" class="btn btn-secondary" id="sm-heads">Überschriften-Gliederung anzeigen</button><button type="button" class="btn btn-secondary" id="sm-lm">Landmarks anzeigen</button></div>
    <div class="sm-out" id="sm-out" aria-live="polite" style="margin-top:12px"></div>
  </div>`,
  init(root){
    const out=$('#sm-out',root);
    const vis=el=>!el.closest('[hidden],dialog:not([open])')&&(el.checkVisibility?el.checkVisibility():true);
    $('#sm-heads',root).addEventListener('click',()=>{
      const hs=$$('h1,h2,h3,h4,h5,h6').filter(vis);
      out.innerHTML=`<p class="hint">${hs.length} Überschriften. Screenreader-Nutzer springen mit der Taste H von einer zur nächsten.</p><ul>${hs.map(h=>{const l=+h.tagName[1];return`<li style="--lvl:${l}"><span class="lvl">H${l}</span>${esc(h.textContent.trim())}</li>`}).join('')}</ul>`;
    });
    $('#sm-lm',root).addEventListener('click',()=>{
      const R={HEADER:'banner',NAV:'navigation',MAIN:'main',ASIDE:'complementary',FOOTER:'contentinfo',SECTION:'region',FORM:'form'};
      const name=el=>el.getAttribute('aria-label')||(el.getAttribute('aria-labelledby')||'').split(' ').map(id=>document.getElementById(id)?.textContent.trim()).filter(Boolean).join(' ');
      const lms=$$('header,nav,main,aside,footer,section[aria-labelledby],section[aria-label]').filter(vis).filter(el=>!(el.tagName==='HEADER'&&el.closest('article,section,aside,nav,main')));
      out.innerHTML=`<p class="hint">Landmarks sind die Sprungmarken für ganze Bereiche (Taste D bzw. Rotor).</p><ul>${lms.map(el=>`<li><span class="lvl">${R[el.tagName]}</span>${esc(name(el)||'(ohne Namen)')}</li>`).join('')}</ul>`;
    });
  },
  do:[`Landmarks: <code>header</code>, <code>nav</code>, <code>main</code>, <code>footer</code> – Screenreader springen damit direkt zu Bereichen.`,`Linktexte, die ohne Kontext verständlich sind.`,`Erste ARIA-Regel: Kein ARIA ist besser als falsches ARIA.`],
  dont:[`Eine Überschrift wählen, weil sie „die richtige Größe hat“ – Größe ist CSS.`,`Icon-Buttons ohne zugänglichen Namen.`,`„Hier klicken“ als Linktext.`],
  why:`<p>Ein Screenreader sieht keine Pixel, sondern den <strong>Accessibility Tree</strong>: eine vom Browser aus dem HTML abgeleitete Struktur mit Rolle, Name und Zustand jedes Elements. Ein <code>&lt;button&gt;</code> liefert Rolle, Fokus und Tastaturbedienung gratis; ein <code>&lt;div&gt;</code> liefert nichts davon.</p><p>Screenreader-Nutzer navigieren meist über Überschriften und Landmarks, wie über ein Inhaltsverzeichnis. Eine saubere Gliederung ist für sie, was ein gutes Layout für Sehende ist.</p>`,
  here:`Die Gruppennamen in der Liste links sind bewusst <em>keine</em> Überschriften, sondern Beschriftungen der Listen (<code>aria-labelledby</code>). So beginnt die Gliederung jeder Seite mit ihrer eigenen <code>h1</code>. Die Demo oben zeigt es dir.`
},
{
  id:'motion',cat:'Barrierefreiheit',title:'Bewegung & Animation',
  short:'Kurz, zweckmäßig und abschaltbar über prefers-reduced-motion.',
  keys:'animation bewegung transition dauer easing reduced motion schwindel',
  refs:['WCAG 2.3.1 · A','WCAG 2.2.2 · A','WCAG 2.3.3 · AAA'],
  rule:`Animation erklärt Veränderung – woher etwas kommt, wohin es geht. Sie ist kurz (<strong>100–300 ms</strong>) und wird reduziert, wenn das System „Bewegung reduzieren“ meldet.`,
  numbers:[['100–200 ms','kleine Elemente: Hover, Switch'],['200–400 ms','größere Flächen: Drawer, Dialog'],['ease-out','beim Hereinkommen'],['≤ 3 Blitze/s','sonst Anfallsgefahr (WCAG 2.3.1)']],
  demo:`
  <div class="mo-track" id="mo-track"><div class="mo-dot" id="mo-dot"></div></div>
  <div class="mo-controls">
    <div><p class="hint" style="margin-bottom:6px">Bewegen mit …</p><div class="btn-row" role="group" aria-label="Animationsdauer"><button type="button" class="btn btn-secondary" data-ms="100">100 ms</button><button type="button" class="btn btn-secondary" data-ms="300">300 ms</button><button type="button" class="btn btn-secondary" data-ms="1000">1000 ms</button></div></div>
    <div class="field"><label for="mo-ease">Easing</label><select id="mo-ease"><option value="cubic-bezier(.2,.8,.2,1)">ease-out (empfohlen)</option><option value="linear">linear</option><option value="cubic-bezier(.6,-.5,.4,1.5)">übertrieben federnd</option></select></div>
  </div>
  <p style="margin:0"><button type="button" class="switch" role="switch" aria-checked="false" id="mo-rm"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>„Bewegung reduzieren“ simulieren</span></button></p>
  <p class="demo-note" id="mo-sys" style="margin:0"></p>`,
  init(root){
    const dot=$('#mo-dot',root),track=$('#mo-track',root);let at=false,sim=false;
    const sys=reducedMotion();
    $('#mo-sys',root).innerHTML=sys?'Dein System meldet gerade: <strong>Bewegung reduzieren ist an</strong>. Diese App schaltet ihre Animationen deshalb ab – auch in dieser Demo.':'Dein System meldet: Bewegung reduzieren ist <strong>aus</strong>. Unter Windows: Einstellungen › Barrierefreiheit › Visuelle Effekte › Animationseffekte.';
    $('#mo-rm',root).addEventListener('toggle',e=>{sim=e.detail});
    $$('[data-ms]',root).forEach(b=>b.addEventListener('click',()=>{
      at=!at;const ms=+b.dataset.ms;
      dot.style.transition=(sim||sys)?'none':`transform ${ms}ms ${$('#mo-ease',root).value}`;
      dot.style.transform=at?`translateX(${track.clientWidth-56}px)`:'none';
    }));
  },
  do:[`<code>@media (prefers-reduced-motion: reduce)</code>: Bewegung durch Überblenden ersetzen oder abschalten.`,`Animationen, die länger als 5 s laufen, pausierbar machen (WCAG 2.2.2).`,`Eine Bewegung pro Aktion, die etwas erklärt.`],
  dont:[`Parallax und Zoom-Effekte ohne Abschaltmöglichkeit – lösen bei manchen Schwindel aus.`,`Animationen, die man abwarten muss, bevor man weiterklicken kann.`,`Blinkende Elemente, um Aufmerksamkeit zu erzwingen.`],
  why:`<p>Gute Animation beantwortet eine Frage: Woher kommt das? Wohin ist es verschwunden? Hat mein Klick etwas ausgelöst? Alles darüber hinaus ist Deko und kostet Zeit. Vergleich 300 ms und 1000 ms in der Demo: Das Langsame fühlt sich nach Warten an.</p><p>Bei vestibulären Störungen können große Bewegungen, Parallax oder Zoom Schwindel und Übelkeit auslösen. Betriebssysteme bieten deshalb „Bewegung reduzieren“, und über <code>prefers-reduced-motion</code> kann jede Website darauf reagieren.</p>`,
  here:`Die Toasts dieser App gleiten herein, der Switch-Knopf rutscht. Ist „Bewegung reduzieren“ in deinem System an, erscheinen sie einfach – und der Zeitbalken im Toast verschwindet.`
},
{
  id:'typography',cat:'Layout & Marke',title:'Typografie & Lesbarkeit',
  short:'Zeilenlänge, Zeilenhöhe, Schriftgröße – und warum rem statt px.',
  keys:'schrift font zeilenlänge zeilenhöhe line height rem px zoom lesbarkeit text spacing',
  refs:['WCAG 1.4.4 · AA','WCAG 1.4.12 · AA','WCAG 1.4.8 · AAA'],
  rule:`Fließtext mindestens <strong>16 px</strong>, <strong>45–75 Zeichen</strong> pro Zeile, Zeilenhöhe um <strong>1,5</strong>. Schriftgrößen in <code>rem</code>, damit Zoom und die Schriftgröße im System funktionieren.`,
  numbers:[['≥ 16 px','Fließtext (1 rem)'],['45–75','Zeichen pro Zeile, ideal ~66'],['1,5','Zeilenhöhe für Fließtext'],['200 %','Zoom ohne Informationsverlust']],
  demo:`
  <div class="ty-controls">
    <div class="field"><label for="ty-size">Schriftgröße <output id="ty-size-o">16 px</output></label><input type="range" id="ty-size" min="11" max="22" step="1" value="16"></div>
    <div class="field"><label for="ty-lh">Zeilenhöhe <output id="ty-lh-o">1,5</output></label><input type="range" id="ty-lh" min="1" max="2.2" step="0.1" value="1.5"></div>
    <div class="field"><label for="ty-len">Zeilenlänge <output id="ty-len-o">66 Zeichen</output></label><input type="range" id="ty-len" min="25" max="130" step="1" value="66"></div>
  </div>
  <div class="ty-sample" id="ty-sample"><p>Gute Typografie fällt nicht auf. Man liest einfach weiter, ohne zu merken, wie viel Arbeit darin steckt: Die Zeile ist kurz genug, dass das Auge den Anfang der nächsten findet, der Abstand zwischen den Zeilen groß genug, dass sie nicht verschwimmen, und die Schrift groß genug, dass niemand die Augen zusammenkneifen muss. Wird eine dieser Stellschrauben überdreht, steigt die Lesezeit messbar – und die Lust am Weiterlesen sinkt.</p></div>
  <ul class="checks" id="ty-checks" aria-live="polite"></ul>
  <p style="margin:0"><button type="button" class="switch" role="switch" aria-checked="false" id="ty-wcag"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>WCAG-1.4.12-Abstände testen</span></button></p>`,
  init(root){
    const s=$('#ty-sample',root),size=$('#ty-size',root),lh=$('#ty-lh',root),len=$('#ty-len',root);
    const upd=()=>{
      const fs=+size.value,l=+lh.value,n=+len.value;
      s.style.fontSize=(fs/16)+'rem';s.style.lineHeight=l;s.style.maxWidth=n+'ch';
      $('#ty-size-o',root).textContent=fs+' px';$('#ty-lh-o',root).textContent=String(l.toFixed(1)).replace('.',',');$('#ty-len-o',root).textContent=n+' Zeichen';
      const C=[[fs>=16,fs>=16?'Schriftgröße passt für Fließtext.':'Unter 16 px wird Fließtext anstrengend, besonders auf dem Handy.'],[l>=1.4&&l<=1.8,l<1.4?'Zeilen zu eng – sie verschwimmen.':l>1.8?'Zeilen zu weit – der Text zerfällt in Einzelzeilen.':'Zeilenhöhe im angenehmen Bereich.'],[n>=45&&n<=75,n<45?'Zeilen zu kurz – ständige Zeilenwechsel zerhacken den Satz.':n>75?'Zeilen zu lang – das Auge verfehlt beim Zurückspringen die nächste Zeile.':'Zeilenlänge im Idealbereich.']];
      $('#ty-checks',root).innerHTML=C.map(([ok,t])=>`<li style="color:${ok?'var(--success)':'var(--warn)'}">${ic(ok?'ok':'alert')}<span style="color:var(--ink)">${t}</span></li>`).join('');
    };
    [size,lh,len].forEach(i=>i.addEventListener('input',upd));upd();
    $('#ty-wcag',root).addEventListener('toggle',e=>s.classList.toggle('wcag-spacing',e.detail));
  },
  do:[`Eine Schriftgrößen-Skala festlegen (z. B. 14 / 16 / 19 / 24 / 32) und dabei bleiben.`,`Linksbündig setzen – Blocksatz reißt im Web Löcher in den Text.`,`Testen, ob das Layout mehr Abstand verträgt (WCAG 1.4.12).`],
  dont:[`Zeilen über die ganze Bildschirmbreite.`,`Feste Höhen für Textcontainer – bei größerer Schrift wird abgeschnitten.`,`Längere Texte in durchgehenden Großbuchstaben.`],
  why:`<p>Zu lange Zeilen lassen das Auge beim Zeilenwechsel die nächste Zeile verfehlen, zu kurze zerhacken den Satz. 45–75 Zeichen sind seit dem Buchdruck der Sweet Spot.</p><p>Schriftgrößen in <code>rem</code> beziehen sich auf die Grundschriftgröße des Browsers. Wer dort 20 statt 16 px einstellt, bekommt die ganze Seite größer – mit <code>px</code> ignoriert man diese Einstellung.</p><p>WCAG 1.4.12 verlangt: Wenn Nutzer Zeilenhöhe, Absatz-, Buchstaben- und Wortabstand erhöhen, darf nichts abgeschnitten werden oder überlappen. Der Schalter in der Demo setzt genau diese Werte.</p>`,
  here:`Diese App nutzt <strong>Atkinson Hyperlegible</strong>, entworfen vom Braille Institute für Menschen mit Sehschwäche: Zeichen wie I, l und 1 oder 0 und O sind klar unterscheidbar. Der Lesetext ist auf etwa 68 Zeichen begrenzt, alle Größen stehen in <code>rem</code>.`
},
{
  id:'responsive',cat:'Layout & Marke',title:'Responsive Design & Reflow',
  short:'Mobile first, Breakpoints nach Inhalt, kein Querscrollen bei 320 px.',
  keys:'responsive mobile first breakpoint grid reflow zoom daumenzone thumb zone container query',
  refs:['WCAG 1.4.10 · AA','WCAG 1.3.4 · AA'],
  rule:`Gestalte zuerst für die schmalste Breite und erweitere dann. Bei <strong>320 px</strong> Breite (so viel bleibt bei 400 % Zoom auf einem Laptop) darf nichts horizontal scrollen – außer Tabellen, Karten und Code.`,
  numbers:[['320 px','schmalste Breite ohne Querscrollen'],['Breakpoints','wo der Inhalt bricht, nicht bei Gerätenamen'],['auto-fit','Grid findet die Spaltenzahl selbst'],['unteres Drittel','am leichtesten mit dem Daumen erreichbar']],
  demo:`
  <div class="md-ctl"><label for="rs-w">Breite des Containers: <output id="rs-wout">640 px</output></label><input type="range" id="rs-w" min="260" max="900" step="10" value="640"></div>
  <div class="rs-frame" id="rs-frame" style="--w:640px"><div class="rs-grid" id="rs-grid">
    ${['Umsatz','Bestellungen','Retouren','Kunden','Warenkorb','Lager'].map((t,i)=>`<div class="rs-card"><b>${t}</b><span class="hint">Karte ${i+1}</span></div>`).join('')}
  </div></div>
  <p class="md-state" id="rs-state" aria-live="polite"></p>
  <p class="demo-note" style="margin:0">Keine einzige Media Query: <code>grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))</code> entscheidet selbst, wie viele Spalten passen.</p>
  <div>
    <h3>Daumenzone</h3>
    <div class="thumb-wrap">
      <div class="thumb-phone" role="img" aria-label="Handy einhändig gehalten: oberer Bereich schwer, Mitte okay, unterer Bereich leicht erreichbar"><div class="tz tz-hard">schwer</div><div class="tz tz-ok">okay</div><div class="tz tz-easy">leicht</div></div>
      <p style="margin:0;max-width:40ch">Einhändig erreicht der Daumen die untere Mitte am leichtesten. Darum liegen Tab Bars und Haupt-Buttons auf dem Handy unten, und „Löschen“ gehört nicht in die leichteste Ecke.</p>
    </div>
  </div>`,
  init(root){
    const frame=$('#rs-frame',root),grid=$('#rs-grid',root),state=$('#rs-state',root);
    const upd=()=>{const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;state.textContent=`${frame.clientWidth} px → ${cols} ${cols===1?'Spalte':'Spalten'}`};
    $('#rs-w',root).addEventListener('input',e=>{frame.style.setProperty('--w',e.target.value+'px');$('#rs-wout',root).textContent=e.target.value+' px';requestAnimationFrame(upd)});
    const ro=new ResizeObserver(upd);ro.observe(frame);upd();
    return()=>ro.disconnect();
  },
  do:[`Grids mit <code>repeat(auto-fit, minmax(…, 1fr))</code> – die Spaltenzahl ergibt sich selbst.`,`Hoch- und Querformat unterstützen (WCAG 1.3.4).`,`Auf dem Handy primäre Aktionen in die untere Hälfte.`],
  dont:[`Layouts für „iPhone 15“ statt für Inhaltsbreiten.`,`Zoom per Meta-Tag sperren (<code>user-scalable=no</code>).`,`Wichtiges auf dem Handy einfach ausblenden.`],
  why:`<p>Über die Hälfte des Web-Traffics kommt vom Handy. Mobile first zwingt zur Priorisierung: Was auf 360 px passt, ist das Wichtigste. Auf größeren Screens kommt Luft dazu, nicht umgekehrt.</p><p>Reflow (WCAG 1.4.10) betrifft vor allem Menschen, die stark zoomen. 400 % Zoom auf einem 1280-px-Laptop entsprechen einem 320 px breiten Viewport. Muss man dann in zwei Richtungen scrollen, wird Lesen zur Qual.</p><p>Die Daumenzone geht auf Beobachtungsstudien von Steven Hoober zurück: Die meisten halten das Handy einhändig, und die oberen Ecken sind dann am schwersten zu erreichen.</p>`,
  here:`Das Master-Detail dieser App klappt unter 800 px um, die Kennzahlen in jeder Lektion springen per Container Query von 2 auf 4 Spalten, und die Toasts sitzen auf dem Handy unten in der Mitte.`
},
{
  id:'white-label',cat:'Layout & Marke',title:'White-Label & Design Tokens',
  short:'Eine App, viele Marken: Tokens statt fest verdrahteter Farben.',
  keys:'white label whitelabel theming tokens marke brand dark mode theme css variablen custom properties',
  refs:['Design Tokens','Theming','WCAG 1.4.3 · AA'],
  rule:`Eine White-Label-App trennt Struktur von Marke. Komponenten verwenden nur <strong>semantische Tokens</strong> wie <code>--brand</code> oder <code>--radius-ctl</code>, jede Marke liefert eigene Werte. So entstehen aus einem Code-Stand beliebig viele Apps.`,
  numbers:[['3 Ebenen','Primitive → Semantische → Komponenten-Tokens'],['4–6','Stellschrauben pro Marke: Farbe, Logo, Schrift, Radius'],['2 Themes','Hell und Dunkel je Marke'],['0','fest verdrahtete Farben in Komponenten']],
  demo:`
  <div class="wl-controls">
    <fieldset class="seg"><legend>Marke</legend><div class="seg-opts">
      <label><input type="radio" name="wl-brand" value="fjord">Fjord</label>
      <label><input type="radio" name="wl-brand" value="glut">Glut</label>
      <label><input type="radio" name="wl-brand" value="moos">Moos</label>
    </div></fieldset>
    <fieldset class="seg"><legend>Darstellung</legend><div class="seg-opts">
      <label><input type="radio" name="wl-theme" value="auto">Automatisch</label>
      <label><input type="radio" name="wl-theme" value="light">Hell</label>
      <label><input type="radio" name="wl-theme" value="dark">Dunkel</label>
    </div></fieldset>
  </div>
  <div class="wl-preview">

  why:`<p>White-Label heißt: ein Produkt, das unter fremdem Namen verkauft wird – eine Banking-App für zehn Banken, eine Shop-App für hundert Händler. Wirtschaftlich lohnt sich das nur, wenn eine neue Marke <em>Konfiguration</em> ist und kein Code.</p><p><strong>Design Tokens</strong> machen das möglich: benannte Werte für Farbe, Schrift, Abstand, Radius. Komponenten kennen nur den Namen, die Marke liefert den Wert. Dieselbe Zwischenebene ermöglicht Dark Mode: Hell und Dunkel sind einfach zwei Wertesätze für dieselben Namen.</p>`,
  here:`Wechsle oben die Marke: Name, Logo, Farbe, Schrift und Eckenradius der ganzen App ändern sich, der Code bleibt derselbe. Intern heißt das Produkt „Daumenregel“ – diesen Namen sieht nur der Browser-Tab.`

{

  do:[`Eine Abstandsskala festlegen (z. B. 4, 8, 16, 24, 32, 48) und nur diese Werte verwenden – am besten als Design Tokens.`,`Label nah an sein Feld, Felder mit Luft dazwischen, Abschnitte mit noch mehr Luft.`,`Hierarchie über wenige Hebel: Größe, Schriftgewicht, Farbe – nicht über alles gleichzeitig.`],

  why:`<p>Das Auge gruppiert, bevor es liest. Die Gestaltpsychologie hat das vor rund hundert Jahren beschrieben: Was nah beieinander liegt, gehört zusammen (Nähe). Was gleich aussieht, hat dieselbe Funktion (Ähnlichkeit). Was einen gemeinsamen Rahmen hat, ist eine Einheit (gemeinsame Region).</p><p>Ein festes Raster macht Abstände zu Entscheidungen statt zu Zufällen. Gibt es nur fünf erlaubte Werte, sieht jede Seite automatisch aufgeräumt aus, und im Team diskutiert niemand über 13 oder 14 px. Die 8 hat sich durchgesetzt, weil sie sich auf allen gängigen Bildschirmdichten sauber teilen lässt.</p>`,

{
  id:'ux-laws',cat:'Grundlagen',title:'UX-Gesetze: die Psychologie dahinter',
  short:'Hick, Fitts, Jakob, Doherty – warum die anderen Regeln funktionieren.',
  keys:'hick fitts jakob miller cowan doherty tesler peak end von restorff psychologie gesetze laws',
  refs:['Hick-Hyman','Jakob’s Law','Doherty 1982','Cowan 2001'],
  rule:`Viele UI-Regeln folgen aus wenigen Beobachtungen über Menschen: Mehr Auswahl verlangsamt Entscheidungen, Bekanntes wird schneller verstanden, und unter <strong>400 ms</strong> Antwortzeit bleibt man im Fluss.`,
  numbers:[['log₂(n + 1)','Hick: Entscheidungszeit wächst mit der Zahl der Optionen'],['400 ms','Doherty-Schwelle: darunter bleibt man im Fluss'],['≈ 4','Einheiten im Arbeitsgedächtnis (Cowan) – nicht 7'],['Peak-End','in Erinnerung bleiben Höhepunkt und Ende']],
  demo:`
  <div>
    <h3>Auswahl-Test</h3>
    <div class="es-controls">
      <fieldset class="seg"><legend>Anzahl der Optionen</legend><div class="seg-opts">

    <div class="table-wrap" style="margin-top:14px"><table class="sem small"><thead><tr><th scope="col">Optionen</th><th scope="col">Runden</th><th scope="col">Ø Zeit</th></tr></thead><tbody id="hk-res"></tbody></table></div>

      <tbody>
        <tr><th scope="row">Fitts</th><td>Große, nahe Ziele trifft man schneller.</td><td><a href="#touch-targets">Touch-Targets</a>, Hauptaktion in Daumennähe</td></tr>
        <tr><th scope="row">Hick</th><td>Mehr Optionen, längere Entscheidung.</td><td><a href="#buttons">Ein Primary</a>, <a href="#navigation">3–5 Navigationsziele</a></td></tr>
        <tr><th scope="row">Jakob</th><td>Nutzer verbringen die meiste Zeit in anderen Apps und erwarten dort gelernte Muster.</td><td>Warenkorb oben rechts, Lupe für Suche, Logo führt zur Startseite</td></tr>
        <tr><th scope="row">Miller / Cowan</th><td>Das Arbeitsgedächtnis hält etwa vier Einheiten.</td><td><a href="#onboarding">Stepper</a> statt Formularwand, IBAN in Vierergruppen</td></tr>
        <tr><th scope="row">Doherty</th><td>Unter 400 ms Antwortzeit bleibt man produktiv im Fluss.</td><td><a href="#loading">Ladezustände</a>, Optimistic UI</td></tr>

  init(root){
    const grid=$('#hk-grid',root),task=$('#hk-task',root),go=$('#hk-go',root);let target=null,t0=0;const res={4:[],16:[],48:[]};

    });

  do:[`Optionen reduzieren oder gruppieren, bevor man sie hübscher macht.`,`Bekannte Muster übernehmen, wo Nutzer sie erwarten – Originalität dort, wo sie etwas bringt.`,`Arbeit ins System verlagern: Formate selbst erkennen, sinnvolle Standardwerte, Autovervollständigung.`],
  dont:[`Menüs mit 15 gleichrangigen Punkten.`,`Bekannte Muster „kreativ“ neu erfinden, z. B. den Warenkorb nach unten links.`,`Nutzer rechnen oder formatieren lassen, was das System selbst kann.`],
  why:`<p>UX-Gesetze sind keine Naturgesetze, sondern gut belegte Beobachtungen, wie Menschen wahrnehmen und entscheiden. Sie erklären, <em>warum</em> die Regeln der anderen Lektionen funktionieren, und helfen, in neuen Situationen selbst die richtige Regel zu finden.</p><p>Vorsicht mit der berühmten „7 ± 2“: George Miller schrieb 1956 über die Kapazität des Kurzzeitgedächtnisses, nicht über Menüs. Spätere Forschung (Nelson Cowan) kommt eher auf etwa vier Einheiten. Die Konsequenz bleibt: Informationen in kleine Gruppen teilen, statt Menüs pauschal auf sieben Punkte zu kürzen.</p>`,
  here:`Von Restorff steckt im einzigen Primary pro Ansicht, Fitts in den 44-px-Buttons. Jakob: Liste links, Detail rechts, Suche mit Lupe – wie in jedem Mailprogramm. Und der Fortschrittsbalken nutzt den Goal-Gradient-Effekt: Je näher das Ziel, desto mehr Motivation.`
},

    [['#ov-drawerbtn','#ov-drawer'],['#ov-sheetbtn','#ov-sheet']].forEach(([b,d])=>{

      });

    });
    const sheet=$('#ov-sheet',root),grip=$('.sheet-drag',root);
    grip.addEventListener('pointerdown',e=>{
      const y0=e.clientY;let dy=0;grip.setPointerCapture(e.pointerId);sheet.style.transition='none';
