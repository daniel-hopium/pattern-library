      out.innerHTML=`<p class="hint">${tx('Landmarks sind die Sprungmarken für ganze Bereiche (Taste D bzw. Rotor).','Landmarks are the jump targets for entire regions (D key or the rotor).')}</p><ul>${lms.map(el=>`<li><span class="lvl">${R[el.tagName]}</span>${esc(name(el)||tx('(ohne Namen)','(no name)'))}</li>`).join('')}</ul>`;
    });
  },
  do:tx([`Landmarks: <code>header</code>, <code>nav</code>, <code>main</code>, <code>footer</code> – Screenreader springen damit direkt zu Bereichen.`,`Linktexte, die ohne Kontext verständlich sind.`,`Erste ARIA-Regel: Kein ARIA ist besser als falsches ARIA.`],[`Landmarks: <code>header</code>, <code>nav</code>, <code>main</code>, <code>footer</code> – screen readers use them to jump straight to regions.`,`Link texts that make sense without context.`,`First rule of ARIA: no ARIA is better than bad ARIA.`]),
  dont:tx([`Eine Überschrift wählen, weil sie „die richtige Größe hat“ – Größe ist CSS.`,`Icon-Buttons ohne zugänglichen Namen.`,`„Hier klicken“ als Linktext.`],[`Picking a heading level because it “has the right size” – size is CSS.`,`Icon buttons without an accessible name.`,`“Click here” as link text.`]),
  why:tx(`<p>Ein Screenreader sieht keine Pixel, sondern den <strong>Accessibility Tree</strong>: eine vom Browser aus dem HTML abgeleitete Struktur mit Rolle, Name und Zustand jedes Elements. Ein <code>&lt;button&gt;</code> liefert Rolle, Fokus und Tastaturbedienung gratis; ein <code>&lt;div&gt;</code> liefert nichts davon.</p><p>Screenreader-Nutzer navigieren meist über Überschriften und Landmarks, wie über ein Inhaltsverzeichnis. Eine saubere Gliederung ist für sie, was ein gutes Layout für Sehende ist.</p>`,`<p>A screen reader doesn’t see pixels – it sees the <strong>accessibility tree</strong>: a structure the browser derives from the HTML, with the role, name and state of every element. A <code>&lt;button&gt;</code> gives you role, focus and keyboard support for free; a <code>&lt;div&gt;</code> gives you none of that.</p><p>Screen reader users mostly navigate by headings and landmarks, like a table of contents. A clean outline is to them what a good layout is to sighted users.</p>`),
  here:tx(`Die Gruppennamen in der Liste links sind bewusst <em>keine</em> Überschriften, sondern Beschriftungen der Listen (<code>aria-labelledby</code>). So beginnt die Gliederung jeder Seite mit ihrer eigenen <code>h1</code>. Die Demo oben zeigt es dir.`,`The group names in the list on the left are deliberately <em>not</em> headings but labels for the lists (<code>aria-labelledby</code>). That way, every page’s outline starts with its own <code>h1</code>. The demo above shows you.`)
},
{
  id:'motion',cat:'Barrierefreiheit',title:tx('Bewegung & Animation','Motion & animation'),
  short:tx('Kurz, zweckmäßig und abschaltbar über prefers-reduced-motion.','Short, purposeful, and switchable off via prefers-reduced-motion.'),
  keys:'animation bewegung transition dauer easing reduced motion schwindel motion duration prefers-reduced-motion vertigo dizziness vestibular flashing parallax',
  refs:['WCAG 2.3.1 · A','WCAG 2.2.2 · A','WCAG 2.3.3 · AAA'],
  rule:tx(`Animation erklärt Veränderung – woher etwas kommt, wohin es geht. Sie ist kurz (<strong>100–300 ms</strong>) und wird reduziert, wenn das System „Bewegung reduzieren“ meldet.`,`Animation explains change – where something comes from and where it goes. It’s short (<strong>100–300 ms</strong>) and gets toned down when the system reports “Reduce motion.”`),
  numbers:tx([['100–200 ms','kleine Elemente: Hover, Switch'],['200–400 ms','größere Flächen: Drawer, Dialog'],['ease-out','beim Hereinkommen'],['≤ 3 Blitze/s','sonst Anfallsgefahr (WCAG 2.3.1)']],[['100–200 ms','small elements: hover, switch'],['200–400 ms','larger surfaces: drawer, dialog'],['ease-out','when entering'],['≤ 3 flashes/s','otherwise risk of seizures (WCAG 2.3.1)']]),
  demo:`
  <div class="mo-track" id="mo-track"><div class="mo-dot" id="mo-dot"></div></div>
  <div class="mo-controls">
    <div><p class="hint" style="margin-bottom:6px">${tx('Bewegen mit …','Move with …')}</p><div class="btn-row" role="group" aria-label="${tx('Animationsdauer','Animation duration')}"><button type="button" class="btn btn-secondary" data-ms="100">100 ms</button><button type="button" class="btn btn-secondary" data-ms="300">300 ms</button><button type="button" class="btn btn-secondary" data-ms="1000">1000 ms</button></div></div>
    <div class="field"><label for="mo-ease">Easing</label><select id="mo-ease"><option value="cubic-bezier(.2,.8,.2,1)">ease-out (${tx('empfohlen','recommended')})</option><option value="linear">linear</option><option value="cubic-bezier(.6,-.5,.4,1.5)">${tx('übertrieben federnd','overly bouncy')}</option></select></div>
  </div>
  <p style="margin:0"><button type="button" class="switch" role="switch" aria-checked="false" id="mo-rm"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('„Bewegung reduzieren“ simulieren','Simulate “Reduce motion”')}</span></button></p>
  <p class="demo-note" id="mo-sys" style="margin:0"></p>`,
  init(root){
    const dot=$('#mo-dot',root),track=$('#mo-track',root);let at=false,sim=false;
    const sys=reducedMotion();
    $('#mo-sys',root).innerHTML=sys?tx('Dein System meldet gerade: <strong>Bewegung reduzieren ist an</strong>. Diese App schaltet ihre Animationen deshalb ab – auch in dieser Demo.','Your system currently reports: <strong>Reduce motion is on</strong>. That’s why this app turns off its animations – in this demo, too.'):tx('Dein System meldet: Bewegung reduzieren ist <strong>aus</strong>. Unter Windows: Einstellungen › Barrierefreiheit › Visuelle Effekte › Animationseffekte.','Your system reports: Reduce motion is <strong>off</strong>. On Windows: Settings › Accessibility › Visual effects › Animation effects.');
    $('#mo-rm',root).addEventListener('toggle',e=>{sim=e.detail});
    $$('[data-ms]',root).forEach(b=>b.addEventListener('click',()=>{
      at=!at;const ms=+b.dataset.ms;
      dot.style.transition=(sim||sys)?'none':`transform ${ms}ms ${$('#mo-ease',root).value}`;
      dot.style.transform=at?`translateX(${track.clientWidth-56}px)`:'none';
    }));
  },
  do:tx([`<code>@media (prefers-reduced-motion: reduce)</code>: Bewegung durch Überblenden ersetzen oder abschalten.`,`Animationen, die länger als 5 s laufen, pausierbar machen (WCAG 2.2.2).`,`Eine Bewegung pro Aktion, die etwas erklärt.`],[`<code>@media (prefers-reduced-motion: reduce)</code>: replace motion with a crossfade or turn it off.`,`Make animations that run longer than 5 s pausable (WCAG 2.2.2).`,`One motion per action, and it should explain something.`]),
  dont:tx([`Parallax und Zoom-Effekte ohne Abschaltmöglichkeit – lösen bei manchen Schwindel aus.`,`Animationen, die man abwarten muss, bevor man weiterklicken kann.`,`Blinkende Elemente, um Aufmerksamkeit zu erzwingen.`],[`Parallax and zoom effects with no way to turn them off – they make some people dizzy.`,`Animations you have to wait out before you can click on.`,`Blinking elements to force attention.`]),
  why:tx(`<p>Gute Animation beantwortet eine Frage: Woher kommt das? Wohin ist es verschwunden? Hat mein Klick etwas ausgelöst? Alles darüber hinaus ist Deko und kostet Zeit. Vergleich 300 ms und 1000 ms in der Demo: Das Langsame fühlt sich nach Warten an.</p><p>Bei vestibulären Störungen können große Bewegungen, Parallax oder Zoom Schwindel und Übelkeit auslösen. Betriebssysteme bieten deshalb „Bewegung reduzieren“, und über <code>prefers-reduced-motion</code> kann jede Website darauf reagieren.</p>`,`<p>Good animation answers a question: Where did this come from? Where did it go? Did my click do anything? Everything beyond that is decoration and costs time. Compare 300 ms and 1000 ms in the demo: the slow one feels like waiting.</p><p>For people with vestibular disorders, large movements, parallax or zoom can trigger dizziness and nausea. That’s why operating systems offer “Reduce motion,” and any website can respond to it via <code>prefers-reduced-motion</code>.</p>`),
  here:tx(`Die Toasts dieser App gleiten herein, der Switch-Knopf rutscht. Ist „Bewegung reduzieren“ in deinem System an, erscheinen sie einfach – und der Zeitbalken im Toast verschwindet.`,`The toasts in this app slide in, and the switch thumb glides. If “Reduce motion” is on in your system, they simply appear – and the timer bar in the toast disappears.`)
},
{
  id:'typography',cat:'Layout & Marke',title:tx('Typografie & Lesbarkeit','Typography & readability'),
  short:tx('Zeilenlänge, Zeilenhöhe, Schriftgröße – und warum rem statt px.','Line length, line height, font size – and why rem instead of px.'),
  keys:'schrift font zeilenlänge zeilenhöhe line height rem px zoom lesbarkeit text spacing typography line length measure font size readability legibility',
  refs:['WCAG 1.4.4 · AA','WCAG 1.4.12 · AA','WCAG 1.4.8 · AAA'],
  rule:tx(`Fließtext mindestens <strong>16 px</strong>, <strong>45–75 Zeichen</strong> pro Zeile, Zeilenhöhe um <strong>1,5</strong>. Schriftgrößen in <code>rem</code>, damit Zoom und die Schriftgröße im System funktionieren.`,`Body text at least <strong>16 px</strong>, <strong>45–75 characters</strong> per line, line height around <strong>1.5</strong>. Font sizes in <code>rem</code>, so zoom and the system font size setting work.`),
  numbers:tx([['≥ 16 px','Fließtext (1 rem)'],['45–75','Zeichen pro Zeile, ideal ~66'],['1,5','Zeilenhöhe für Fließtext'],['200 %','Zoom ohne Informationsverlust']],[['≥ 16 px','body text (1 rem)'],['45–75','characters per line, ideally ~66'],['1.5','line height for body text'],['200%','zoom without loss of information']]),
  demo:`
  <div class="ty-controls">
    <div class="field"><label for="ty-size">${tx('Schriftgröße','Font size')} <output id="ty-size-o">16 px</output></label><input type="range" id="ty-size" min="11" max="22" step="1" value="16"></div>
    <div class="field"><label for="ty-lh">${tx('Zeilenhöhe','Line height')} <output id="ty-lh-o">${tx('1,5','1.5')}</output></label><input type="range" id="ty-lh" min="1" max="2.2" step="0.1" value="1.5"></div>
    <div class="field"><label for="ty-len">${tx('Zeilenlänge','Line length')} <output id="ty-len-o">${tx('66 Zeichen','66 characters')}</output></label><input type="range" id="ty-len" min="25" max="130" step="1" value="66"></div>
  </div>
  <div class="ty-sample" id="ty-sample"><p>${tx('Gute Typografie fällt nicht auf. Man liest einfach weiter, ohne zu merken, wie viel Arbeit darin steckt: Die Zeile ist kurz genug, dass das Auge den Anfang der nächsten findet, der Abstand zwischen den Zeilen groß genug, dass sie nicht verschwimmen, und die Schrift groß genug, dass niemand die Augen zusammenkneifen muss. Wird eine dieser Stellschrauben überdreht, steigt die Lesezeit messbar – und die Lust am Weiterlesen sinkt.','Good typography goes unnoticed. You just keep reading without realizing how much work went into it: the line is short enough for your eye to find the start of the next one, the space between lines is large enough that they don’t blur together, and the text is big enough that nobody has to squint. Push any one of these settings too far and reading time goes up measurably – and the desire to keep reading goes down.')}</p></div>
  <ul class="checks" id="ty-checks" aria-live="polite"></ul>
  <p style="margin:0"><button type="button" class="switch" role="switch" aria-checked="false" id="ty-wcag"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('WCAG-1.4.12-Abstände testen','Test WCAG 1.4.12 spacing')}</span></button></p>`,
  init(root){
    const s=$('#ty-sample',root),size=$('#ty-size',root),lh=$('#ty-lh',root),len=$('#ty-len',root);
    const upd=()=>{
      const fs=+size.value,l=+lh.value,n=+len.value;
      s.style.fontSize=(fs/16)+'rem';s.style.lineHeight=l;s.style.maxWidth=n+'ch';
      $('#ty-size-o',root).textContent=fs+' px';$('#ty-lh-o',root).textContent=tx(String(l.toFixed(1)).replace('.',','),l.toFixed(1));$('#ty-len-o',root).textContent=n+tx(' Zeichen',' characters');
      const C=[[fs>=16,fs>=16?tx('Schriftgröße passt für Fließtext.','Font size works for body text.'):tx('Unter 16 px wird Fließtext anstrengend, besonders auf dem Handy.','Below 16 px, body text gets tiring to read, especially on a phone.')],[l>=1.4&&l<=1.8,l<1.4?tx('Zeilen zu eng – sie verschwimmen.','Lines too tight – they blur together.'):l>1.8?tx('Zeilen zu weit – der Text zerfällt in Einzelzeilen.','Lines too loose – the text falls apart into single lines.'):tx('Zeilenhöhe im angenehmen Bereich.','Line height is in the comfortable range.')],[n>=45&&n<=75,n<45?tx('Zeilen zu kurz – ständige Zeilenwechsel zerhacken den Satz.','Lines too short – constant line breaks chop up the sentence.'):n>75?tx('Zeilen zu lang – das Auge verfehlt beim Zurückspringen die nächste Zeile.','Lines too long – your eye misses the next line when jumping back.'):tx('Zeilenlänge im Idealbereich.','Line length is in the ideal range.')]];
      $('#ty-checks',root).innerHTML=C.map(([ok,t])=>`<li style="color:${ok?'var(--success)':'var(--warn)'}">${ic(ok?'ok':'alert')}<span style="color:var(--ink)">${t}</span></li>`).join('');
    };
    [size,lh,len].forEach(i=>i.addEventListener('input',upd));upd();
    $('#ty-wcag',root).addEventListener('toggle',e=>s.classList.toggle('wcag-spacing',e.detail));
  },
  do:tx([`Eine Schriftgrößen-Skala festlegen (z. B. 14 / 16 / 19 / 24 / 32) und dabei bleiben.`,`Linksbündig setzen – Blocksatz reißt im Web Löcher in den Text.`,`Testen, ob das Layout mehr Abstand verträgt (WCAG 1.4.12).`],[`Define a type scale (e.g. 14 / 16 / 19 / 24 / 32) and stick to it.`,`Align text left – justified text tears holes into it on the web.`,`Test whether the layout can handle more spacing (WCAG 1.4.12).`]),
  dont:tx([`Zeilen über die ganze Bildschirmbreite.`,`Feste Höhen für Textcontainer – bei größerer Schrift wird abgeschnitten.`,`Längere Texte in durchgehenden Großbuchstaben.`],[`Lines spanning the full screen width.`,`Fixed heights for text containers – larger text gets cut off.`,`Longer texts in all caps.`]),
  why:tx(`<p>Zu lange Zeilen lassen das Auge beim Zeilenwechsel die nächste Zeile verfehlen, zu kurze zerhacken den Satz. 45–75 Zeichen sind seit dem Buchdruck der Sweet Spot.</p><p>Schriftgrößen in <code>rem</code> beziehen sich auf die Grundschriftgröße des Browsers. Wer dort 20 statt 16 px einstellt, bekommt die ganze Seite größer – mit <code>px</code> ignoriert man diese Einstellung.</p><p>WCAG 1.4.12 verlangt: Wenn Nutzer Zeilenhöhe, Absatz-, Buchstaben- und Wortabstand erhöhen, darf nichts abgeschnitten werden oder überlappen. Der Schalter in der Demo setzt genau diese Werte.</p>`,`<p>Lines that are too long make your eye miss the next line when it wraps; lines that are too short chop up the sentence. 45–75 characters has been the sweet spot since the days of the printing press.</p><p>Font sizes in <code>rem</code> are relative to the browser’s base font size. If someone sets it to 20 px instead of 16 px, the whole page gets bigger – with <code>px</code> you ignore that setting.</p><p>WCAG 1.4.12 requires that when users increase line height, paragraph, letter and word spacing, nothing gets cut off or overlaps. The switch in the demo applies exactly those values.</p>`),
  here:tx(`Diese App nutzt <strong>Atkinson Hyperlegible</strong>, entworfen vom Braille Institute für Menschen mit Sehschwäche: Zeichen wie I, l und 1 oder 0 und O sind klar unterscheidbar. Der Lesetext ist auf etwa 68 Zeichen begrenzt, alle Größen stehen in <code>rem</code>.`,`This app uses <strong>Atkinson Hyperlegible</strong>, designed by the Braille Institute for people with low vision: characters like I, l and 1 or 0 and O are clearly distinguishable. Body text is limited to about 68 characters per line, and all sizes are in <code>rem</code>.`)
},
{
  id:'responsive',cat:'Layout & Marke',title:tx('Responsive Design & Reflow','Responsive design & reflow'),
  short:tx('Mobile first, Breakpoints nach Inhalt, kein Querscrollen bei 320 px.','Mobile first, breakpoints based on content, no horizontal scrolling at 320 px.'),
  keys:'responsive mobile first breakpoint grid reflow zoom daumenzone thumb zone container query horizontal scrolling orientation media query auto-fit phone',
  refs:['WCAG 1.4.10 · AA','WCAG 1.3.4 · AA'],
  rule:tx(`Gestalte zuerst für die schmalste Breite und erweitere dann. Bei <strong>320 px</strong> Breite (so viel bleibt bei 400 % Zoom auf einem Laptop) darf nichts horizontal scrollen – außer Tabellen, Karten und Code.`,`Design for the narrowest width first, then expand. At <strong>320 px</strong> wide (what’s left at 400% zoom on a laptop), nothing may scroll horizontally – except tables, maps and code.`),
  numbers:tx([['320 px','schmalste Breite ohne Querscrollen'],['Breakpoints','wo der Inhalt bricht, nicht bei Gerätenamen'],['auto-fit','Grid findet die Spaltenzahl selbst'],['unteres Drittel','am leichtesten mit dem Daumen erreichbar']],[['320 px','narrowest width with no horizontal scrolling'],['Breakpoints','where the content breaks, not at device names'],['auto-fit','Grid works out the number of columns itself'],['bottom third','easiest to reach with your thumb']]),
  demo:`
  <div class="md-ctl"><label for="rs-w">${tx('Breite des Containers:','Container width:')} <output id="rs-wout">640 px</output></label><input type="range" id="rs-w" min="260" max="900" step="10" value="640"></div>
  <div class="rs-frame" id="rs-frame" style="--w:640px"><div class="rs-grid" id="rs-grid">
    ${tx(['Umsatz','Bestellungen','Retouren','Kunden','Warenkorb','Lager'],['Revenue','Orders','Returns','Customers','Cart','Inventory']).map((t,i)=>`<div class="rs-card"><b>${t}</b><span class="hint">${tx('Karte','Card')} ${i+1}</span></div>`).join('')}
  </div></div>
  <p class="md-state" id="rs-state" aria-live="polite"></p>
  <p class="demo-note" style="margin:0">${tx('Keine einzige Media Query:','Not a single media query:')} <code>grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))</code> ${tx('entscheidet selbst, wie viele Spalten passen.','decides on its own how many columns fit.')}</p>
  <div>
    <h3>${tx('Daumenzone','Thumb zone')}</h3>
    <div class="thumb-wrap">
      <div class="thumb-phone" role="img" aria-label="${tx('Handy einhändig gehalten: oberer Bereich schwer, Mitte okay, unterer Bereich leicht erreichbar','Phone held in one hand: top area hard, middle okay, bottom area easy to reach')}"><div class="tz tz-hard">${tx('schwer','hard')}</div><div class="tz tz-ok">okay</div><div class="tz tz-easy">${tx('leicht','easy')}</div></div>
      <p style="margin:0;max-width:40ch">${tx('Einhändig erreicht der Daumen die untere Mitte am leichtesten. Darum liegen Tab Bars und Haupt-Buttons auf dem Handy unten, und „Löschen“ gehört nicht in die leichteste Ecke.','With one hand, your thumb reaches the bottom center most easily. That’s why tab bars and main buttons sit at the bottom on phones – and “Delete” doesn’t belong in the easiest corner.')}</p>
    </div>
  </div>`,
  init(root){
    const frame=$('#rs-frame',root),grid=$('#rs-grid',root),state=$('#rs-state',root);
    const upd=()=>{const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;state.textContent=`${frame.clientWidth} px → ${cols} ${cols===1?tx('Spalte','column'):tx('Spalten','columns')}`};
    $('#rs-w',root).addEventListener('input',e=>{frame.style.setProperty('--w',e.target.value+'px');$('#rs-wout',root).textContent=e.target.value+' px';requestAnimationFrame(upd)});
    const ro=new ResizeObserver(upd);ro.observe(frame);upd();
    return()=>ro.disconnect();
  },
  do:tx([`Grids mit <code>repeat(auto-fit, minmax(…, 1fr))</code> – die Spaltenzahl ergibt sich selbst.`,`Hoch- und Querformat unterstützen (WCAG 1.3.4).`,`Auf dem Handy primäre Aktionen in die untere Hälfte.`],[`Grids with <code>repeat(auto-fit, minmax(…, 1fr))</code> – the number of columns sorts itself out.`,`Support both portrait and landscape (WCAG 1.3.4).`,`On phones, put primary actions in the bottom half.`]),
  dont:tx([`Layouts für „iPhone 15“ statt für Inhaltsbreiten.`,`Zoom per Meta-Tag sperren (<code>user-scalable=no</code>).`,`Wichtiges auf dem Handy einfach ausblenden.`],[`Layouts for “iPhone 15” instead of for content widths.`,`Blocking zoom with a meta tag (<code>user-scalable=no</code>).`,`Simply hiding important content on phones.`]),
  why:tx(`<p>Über die Hälfte des Web-Traffics kommt vom Handy. Mobile first zwingt zur Priorisierung: Was auf 360 px passt, ist das Wichtigste. Auf größeren Screens kommt Luft dazu, nicht umgekehrt.</p><p>Reflow (WCAG 1.4.10) betrifft vor allem Menschen, die stark zoomen. 400 % Zoom auf einem 1280-px-Laptop entsprechen einem 320 px breiten Viewport. Muss man dann in zwei Richtungen scrollen, wird Lesen zur Qual.</p><p>Die Daumenzone geht auf Beobachtungsstudien von Steven Hoober zurück: Die meisten halten das Handy einhändig, und die oberen Ecken sind dann am schwersten zu erreichen.</p>`,`<p>More than half of web traffic comes from phones. Mobile first forces you to prioritize: whatever fits into 360 px is what matters most. Larger screens add breathing room, not the other way around.</p><p>Reflow (WCAG 1.4.10) mainly affects people who zoom in a lot. 400% zoom on a 1280 px laptop equals a viewport 320 px wide. If you then have to scroll in two directions, reading becomes torture.</p><p>The thumb zone goes back to observational studies by Steven Hoober: most people hold their phone in one hand, and the top corners are then the hardest to reach.</p>`),
  here:tx(`Das Master-Detail dieser App klappt unter 800 px um, die Kennzahlen in jeder Lektion springen per Container Query von 2 auf 4 Spalten, und die Toasts sitzen auf dem Handy unten in der Mitte.`,`This app’s master-detail layout switches below 800 px, the numbers in every lesson jump from 2 to 4 columns via a container query, and on phones the toasts sit at the bottom center.`)
},
{
  id:'white-label',cat:'Layout & Marke',title:tx('White-Label & Design Tokens','White label & design tokens'),
  short:tx('Eine App, viele Marken: Tokens statt fest verdrahteter Farben.','One app, many brands: tokens instead of hard-coded colors.'),
  keys:'white label whitelabel theming tokens marke brand dark mode theme css variablen custom properties design tokens css variables branding light mode semantic tokens',
  refs:['Design Tokens','Theming','WCAG 1.4.3 · AA'],
  rule:tx(`Eine White-Label-App trennt Struktur von Marke. Komponenten verwenden nur <strong>semantische Tokens</strong> wie <code>--brand</code> oder <code>--radius-ctl</code>, jede Marke liefert eigene Werte. So entstehen aus einem Code-Stand beliebig viele Apps.`,`A white-label app separates structure from brand. Components use only <strong>semantic tokens</strong> like <code>--brand</code> or <code>--radius-ctl</code>, and each brand supplies its own values. That way, a single codebase turns into as many apps as you like.`),
  numbers:tx([['3 Ebenen','Primitive → Semantische → Komponenten-Tokens'],['4–6','Stellschrauben pro Marke: Farbe, Logo, Schrift, Radius'],['2 Themes','Hell und Dunkel je Marke'],['0','fest verdrahtete Farben in Komponenten']],[['3 tiers','primitive → semantic → component tokens'],['4–6','settings per brand: color, logo, font, radius'],['2 themes','light and dark per brand'],['0','hard-coded colors in components']]),
  demo:`
  <div class="wl-controls">
    <fieldset class="seg"><legend>${tx('Marke','Brand')}</legend><div class="seg-opts">
      <label><input type="radio" name="wl-brand" value="fjord">Fjord</label>
      <label><input type="radio" name="wl-brand" value="glut">Glut</label>
      <label><input type="radio" name="wl-brand" value="moos">Moos</label>
    </div></fieldset>
    <fieldset class="seg"><legend>${tx('Darstellung','Appearance')}</legend><div class="seg-opts">
      <label><input type="radio" name="wl-theme" value="auto">${tx('Automatisch','Automatic')}</label>
      <label><input type="radio" name="wl-theme" value="light">${tx('Hell','Light')}</label>
      <label><input type="radio" name="wl-theme" value="dark">${tx('Dunkel','Dark')}</label>
    </div></fieldset>
  </div>
  <div class="wl-preview">
    <div class="wl-head"><span class="logo-mark" id="wl-mark" aria-hidden="true">F</span><b id="wl-name">Fjord Kompass</b></div>
    <p style="margin:0">${tx('Dieselbe Komponente, drei Marken. Nur die Werte der Tokens ändern sich.','The same component, three brands. Only the token values change.')}</p>
    <div class="btn-row"><button type="button" class="btn btn-primary">Primary</button><button type="button" class="btn btn-secondary">Secondary</button><span class="chip">${ic('tag')}Chip</span></div>
  </div>
  <p class="wl-check" id="wl-check" aria-live="polite"></p>
  <div class="table-wrap"><table class="tokens">
    <thead><tr><th scope="col">Token</th><th scope="col">${tx('Aktueller Wert','Current value')}</th><th scope="col">${tx('Wofür','Used for')}</th></tr></thead>
    <tbody id="wl-tokens"></tbody>
  </table></div>
  <div>

  do:tx([`Kundenfarben automatisch auf Kontrast prüfen, bevor sie live gehen.`,`Nur definierte Stellschrauben freigeben: Farbe, Logo, Schrift, Radius – nicht das Layout.`,`Die Systemeinstellung Hell/Dunkel respektieren und zusätzlich eine manuelle Wahl erlauben.`],[`Check customer colors for contrast automatically before they go live.`,`Expose only defined settings: color, logo, font, radius – not the layout.`,`Respect the system’s light/dark setting and also allow a manual choice.`]),
  dont:tx([`<code>color: #1F5FAD</code> direkt in einer Komponente.`,`Kunden eine Markenfarbe erlauben, auf der weißer Text unlesbar ist.`,`Den eigenen Produktnamen irgendwo stehen lassen („Powered by …“ in einer Fehlermeldung).`],[`<code>color: #1F5FAD</code> directly in a component.`,`Letting customers pick a brand color that makes white text unreadable.`,`Leaving your own product name lying around somewhere (“Powered by …” in an error message).`]),
  why:tx(`<p>White-Label heißt: ein Produkt, das unter fremdem Namen verkauft wird – eine Banking-App für zehn Banken, eine Shop-App für hundert Händler. Wirtschaftlich lohnt sich das nur, wenn eine neue Marke <em>Konfiguration</em> ist und kein Code.</p><p><strong>Design Tokens</strong> machen das möglich: benannte Werte für Farbe, Schrift, Abstand, Radius. Komponenten kennen nur den Namen, die Marke liefert den Wert. Dieselbe Zwischenebene ermöglicht Dark Mode: Hell und Dunkel sind einfach zwei Wertesätze für dieselben Namen.</p>`,`<p>White label means a product that’s sold under someone else’s name – one banking app for ten banks, one shop app for a hundred retailers. It only pays off if a new brand is <em>configuration</em>, not code.</p><p><strong>Design tokens</strong> make that possible: named values for color, font, spacing, radius. Components know only the name; the brand supplies the value. The same in-between layer enables dark mode: light and dark are simply two sets of values for the same names.</p>`),
  here:tx(`Wechsle oben die Marke: Name, Logo, Farbe, Schrift und Eckenradius der ganzen App ändern sich, der Code bleibt derselbe. Intern heißt das Produkt „Daumenregel“ – diesen Namen sieht nur der Browser-Tab.`,`Switch the brand above: the name, logo, color, font and corner radius of the entire app change, while the code stays the same. Internally, the product is called “Daumenregel” (rule of thumb) – only the browser tab ever shows that name.`)

{
  id:'spacing',cat:'Grundlagen',title:tx('Abstände, Raster & Gestaltgesetze','Spacing, grids & Gestalt laws'),

  keys:'spacing abstand raster grid 8pt gestalt nähe ähnlichkeit hierarchie weißraum whitespace padding margin proximity similarity common region hierarchy spacing scale layout grid',
  refs:[tx('Gestaltpsychologie','Gestalt psychology'),tx('8-pt-Raster','8-pt grid'),'Material 3: Layout'],
  rule:tx(`Abstände transportieren Bedeutung: Was zusammengehört, steht näher beieinander als das, was getrennt ist. Alle Abstände kommen aus <strong>einer festen Skala</strong> – Werte wie 13 px oder 27 px gibt es nicht.`,`Spacing carries meaning: things that belong together sit closer to each other than things that are separate. Every spacing value comes from <strong>one fixed scale</strong> – values like 13 px or 27 px don’t exist.`),
  numbers:tx([['4 · 8 · 16 · 24 · 32','typische Skala im 8-pt-Raster'],['innen < außen','Abstand in der Gruppe kleiner als zwischen Gruppen'],['≈ 2 ×','Außenabstand mindestens doppelt so groß'],['3 Hebel','Hierarchie über Größe, Gewicht, Farbe']],[['4 · 8 · 16 · 24 · 32','typical scale on an 8-pt grid'],['inside < outside','spacing within a group is smaller than between groups'],['≈ 2 ×','outer spacing at least twice as large'],['3 levers','hierarchy through size, weight, color']]),

  why:tx(`<p>Das Auge gruppiert, bevor es liest. Die Gestaltpsychologie hat das vor rund hundert Jahren beschrieben: Was nah beieinander liegt, gehört zusammen (Nähe). Was gleich aussieht, hat dieselbe Funktion (Ähnlichkeit). Was einen gemeinsamen Rahmen hat, ist eine Einheit (gemeinsame Region).</p><p>Ein festes Raster macht Abstände zu Entscheidungen statt zu Zufällen. Gibt es nur fünf erlaubte Werte, sieht jede Seite automatisch aufgeräumt aus, und im Team diskutiert niemand über 13 oder 14 px. Die 8 hat sich durchgesetzt, weil sie sich auf allen gängigen Bildschirmdichten sauber teilen lässt.</p>`,`<p>The eye groups before it reads. Gestalt psychology described this about a hundred years ago: things that are close together belong together (proximity). Things that look alike share the same function (similarity). Things inside a shared frame form a unit (common region).</p><p>A fixed grid turns spacing into decisions instead of accidents. With only five allowed values, every page looks tidy automatically, and nobody on the team argues about 13 vs. 14 px. The 8 won out because it divides cleanly on all common screen densities.</p>`),
  here:tx(`In jeder Lektion stehen Wert und Erklärung bei „Die Zahlen“ eng beieinander, zwischen den Abschnitten liegen 40 px. Die Kennzahlen teilen sich einen gemeinsamen Rahmen – gemeinsame Region.`,`In every lesson, value and explanation sit close together under “The numbers”, while the sections are 40 px apart. The key figures share a common frame – common region.`)

{

  refs:['Hick-Hyman','Jakob’s Law','Doherty 1982','Cowan 2001'],

  numbers:tx([['log₂(n + 1)','Hick: Entscheidungszeit wächst mit der Zahl der Optionen'],['400 ms','Doherty-Schwelle: darunter bleibt man im Fluss'],['≈ 4','Einheiten im Arbeitsgedächtnis (Cowan) – nicht 7'],['Peak-End','in Erinnerung bleiben Höhepunkt und Ende']],[['log₂(n + 1)','Hick: decision time grows with the number of options'],['400 ms','Doherty threshold: below it you stay in the flow'],['≈ 4','chunks in working memory (Cowan) – not 7'],['Peak-end','people remember the peak and the end']]),
  demo:`

      <tbody>
        <tr><th scope="row">Fitts</th><td>${tx('Große, nahe Ziele trifft man schneller.','Large, nearby targets are hit faster.')}</td><td><a href="#touch-targets">${tx('Touch-Targets','Touch targets')}</a>${tx(', Hauptaktion in Daumennähe',', main action within thumb reach')}</td></tr>
        <tr><th scope="row">Hick</th><td>${tx('Mehr Optionen, längere Entscheidung.','More options, longer decisions.')}</td><td><a href="#buttons">${tx('Ein Primary','One primary')}</a>, <a href="#navigation">${tx('3–5 Navigationsziele','3–5 navigation destinations')}</a></td></tr>
        <tr><th scope="row">Jakob</th><td>${tx('Nutzer verbringen die meiste Zeit in anderen Apps und erwarten dort gelernte Muster.','Users spend most of their time in other apps and expect the patterns they learned there.')}</td><td>${tx('Warenkorb oben rechts, Lupe für Suche, Logo führt zur Startseite','Cart at the top right, magnifier for search, logo leads to the home page')}</td></tr>
        <tr><th scope="row">Miller / Cowan</th><td>${tx('Das Arbeitsgedächtnis hält etwa vier Einheiten.','Working memory holds about four chunks.')}</td><td><a href="#onboarding">Stepper</a>${tx(' statt Formularwand, IBAN in Vierergruppen',' instead of a wall of form fields, IBAN in groups of four')}</td></tr>

  do:tx([`Optionen reduzieren oder gruppieren, bevor man sie hübscher macht.`,`Bekannte Muster übernehmen, wo Nutzer sie erwarten – Originalität dort, wo sie etwas bringt.`,`Arbeit ins System verlagern: Formate selbst erkennen, sinnvolle Standardwerte, Autovervollständigung.`],[`Reduce or group options before you make them prettier.`,`Use familiar patterns where users expect them – save originality for where it adds value.`,`Shift work to the system: detect formats automatically, sensible defaults, autocomplete.`]),
  dont:tx([`Menüs mit 15 gleichrangigen Punkten.`,`Bekannte Muster „kreativ“ neu erfinden, z. B. den Warenkorb nach unten links.`,`Nutzer rechnen oder formatieren lassen, was das System selbst kann.`],[`Menus with 15 items of equal rank.`,`“Creatively” reinventing familiar patterns, e.g. moving the cart to the bottom left.`,`Making users calculate or format what the system can do itself.`]),
  why:tx(`<p>UX-Gesetze sind keine Naturgesetze, sondern gut belegte Beobachtungen, wie Menschen wahrnehmen und entscheiden. Sie erklären, <em>warum</em> die Regeln der anderen Lektionen funktionieren, und helfen, in neuen Situationen selbst die richtige Regel zu finden.</p><p>Vorsicht mit der berühmten „7 ± 2“: George Miller schrieb 1956 über die Kapazität des Kurzzeitgedächtnisses, nicht über Menüs. Spätere Forschung (Nelson Cowan) kommt eher auf etwa vier Einheiten. Die Konsequenz bleibt: Informationen in kleine Gruppen teilen, statt Menüs pauschal auf sieben Punkte zu kürzen.</p>`,`<p>UX laws aren’t laws of nature but well-documented observations about how people perceive and decide. They explain <em>why</em> the rules in the other lessons work, and they help you find the right rule yourself in new situations.</p><p>Be careful with the famous “7 ± 2”: in 1956 George Miller wrote about the capacity of short-term memory, not about menus. Later research (Nelson Cowan) lands closer to about four chunks. The takeaway stays the same: split information into small groups instead of blindly cutting menus down to seven items.</p>`),
  here:tx(`Von Restorff steckt im einzigen Primary pro Ansicht, Fitts in den 44-px-Buttons. Jakob: Liste links, Detail rechts, Suche mit Lupe – wie in jedem Mailprogramm. Und der Fortschrittsbalken nutzt den Goal-Gradient-Effekt: Je näher das Ziel, desto mehr Motivation.`,`Von Restorff lives in the single primary button per view, Fitts in the 44 px buttons. Jakob: list on the left, detail on the right, search with a magnifier – like every email app. And the progress bar uses the goal-gradient effect: the closer the goal, the more motivation.`)

  refs:['WCAG 1.4.13 · AA','ARIA APG','Material 3'],
  rule:tx(`Je stärker ein Overlay unterbricht, desto seltener darf es vorkommen. Wähle das <strong>schwächste</strong>, das den Zweck erfüllt: Tooltip &lt; Popover &lt; Drawer / Bottom Sheet &lt; Modal-Dialog.`,`The more an overlay interrupts, the less often it should appear. Choose the <strong>lightest</strong> one that does the job: tooltip &lt; popover &lt; drawer / bottom sheet &lt; modal dialog.`),
  numbers:tx([['1','Overlay gleichzeitig'],['Esc','schließt jedes Overlay'],['300–500 ms','Verzögerung, bevor ein Tooltip erscheint'],['WCAG 1.4.13','Hover-Inhalt: schließbar, überfahrbar, bleibt stehen']],[['1','overlay at a time'],['Esc','closes every overlay'],['300–500 ms','delay before a tooltip appears'],['WCAG 1.4.13','hover content: dismissible, hoverable, persistent']]),
  demo:`

    <div popover id="ov-pop" class="popover" aria-label="Filter">

    </div>
    <dialog class="drawer" id="ov-drawer" aria-labelledby="ov-drawer-h"><div class="drawer-in">
      <div class="drawer-head"><h3 id="ov-drawer-h">${tx('Einstellungen','Settings')}</h3><button type="button" class="icon-btn" data-close aria-label="${tx('Einstellungen schließen','Close settings')}">${ic('x')}</button></div>
      <p class="hint">${tx('Ein Drawer kommt vom Rand und trägt Navigation oder Einstellungen. Der Inhalt dahinter bleibt teilweise sichtbar, der Kontext geht nicht verloren.','A drawer slides in from the edge and holds navigation or settings. The content behind it stays partly visible, so the context isn’t lost.')}</p>
      ${sw('ov-s1',tx('Benachrichtigungen','Notifications'),true)}
