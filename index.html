    </div></dialog>
    <dialog class="sheet" id="ov-sheet" aria-labelledby="ov-sheet-h"><div class="sheet-in">
      <div class="sheet-drag" aria-hidden="true"><span></span></div>
      <h3 id="ov-sheet-h">${tx('Lektion teilen','Share lesson')}</h3>
      <div class="sheet-actions">
        <button type="button" class="btn btn-secondary" data-act="${tx('Link kopiert','Link copied')}">${ic('copy')} ${tx('Link kopieren','Copy link')}</button>
        <button type="button" class="btn btn-secondary" data-act="${tx('E-Mail vorbereitet','Email drafted')}">${ic('mail')} ${tx('Per E-Mail senden','Send by email')}</button>
        <button type="button" class="btn btn-secondary" data-act="${tx('Gemerkt','Saved')}">${ic('star')} ${tx('Merken','Save')}</button>
      </div>
      <button type="button" class="btn btn-ghost" data-close>${tx('Abbrechen','Cancel')}</button>
      <p class="hint">${tx('Am Griff nach unten ziehen schließt auch – „Abbrechen“ ist die Alternative ohne Geste.','Dragging the handle down also closes it – “Cancel” is the alternative without a gesture.')}</p>
    </div></dialog>
  </div>
  <div>
    <h3>${tx('Welches Overlay wofür?','Which overlay for what?')}</h3>
    <div class="table-wrap"><table class="sem">
      <thead><tr><th scope="col">Overlay</th><th scope="col">${tx('Wofür','Used for')}</th><th scope="col">${tx('Blockiert?','Blocks?')}</th><th scope="col">${tx('Schließt durch','Closes via')}</th></tr></thead>
      <tbody>
        <tr><th scope="row">Tooltip</th><td>${tx('Kurzer Name oder Hinweis zu einem Element','Short name or hint for an element')}</td><td>${tx('nein','no')}</td><td>${tx('Wegbewegen, Fokus weg, Esc','Moving away, losing focus, Esc')}</td></tr>
        <tr><th scope="row">Popover</th><td>${tx('Kleine Auswahl direkt am Auslöser (Filter, Menü)','Small choice right at the trigger (filter, menu)')}</td><td>${tx('nein','no')}</td><td>${tx('Klick daneben, Esc','Clicking outside, Esc')}</td></tr>
        <tr><th scope="row">Drawer</th><td>${tx('Navigation oder Einstellungen am Rand','Navigation or settings at the edge')}</td><td>${tx('meist ja','usually yes')}</td><td>${tx('×, Klick auf den Schleier, Esc','×, clicking the backdrop, Esc')}</td></tr>
        <tr><th scope="row">Bottom Sheet</th><td>${tx('Zusatzaktionen auf dem Handy, in Daumenreichweite','Extra actions on mobile, within thumb reach')}</td><td>${tx('meist ja','usually yes')}</td><td>${tx('Abbrechen, Wischen, Schleier, Esc','Cancel, swiping, backdrop, Esc')}</td></tr>
        <tr><th scope="row">${tx('Modal-Dialog','Modal dialog')}</th><td>${tx('Entscheidung, die vor dem Weitermachen fallen muss','A decision that must be made before continuing')}</td><td>${tx('ja','yes')}</td><td>${tx('Button-Wahl, Esc','Choosing a button, Esc')}</td></tr>
      </tbody>
    </table></div>
  </div>`,
  init(root){
    const tb=$('#ov-tipbtn',root),tip=$('#ov-tip',root),wrap=tb.parentElement;let tt;
    const showTip=()=>{clearTimeout(tt);tt=setTimeout(()=>{tip.hidden=false},400)};
    const hideTip=()=>{clearTimeout(tt);tip.hidden=true};
    wrap.addEventListener('mouseenter',showTip);wrap.addEventListener('mouseleave',hideTip);
    tb.addEventListener('focus',showTip);tb.addEventListener('blur',hideTip);
    const onKey=e=>{if(e.key==='Escape')hideTip()};
    document.addEventListener('keydown',onKey);
    tb.addEventListener('click',()=>{hideTip();toast({msg:tx('Link kopiert (Demo).','Link copied (demo).'),type:'success',duration:2500})});
    const pop=$('#ov-pop',root),pb=$('#ov-popbtn',root);
    const isOpen=()=>{try{return pop.matches(':popover-open')}catch(e){return false}};
    pop.addEventListener('toggle',e=>{
      pb.setAttribute('aria-expanded',String(e.newState==='open'));
      if(e.newState==='open'){const r=pb.getBoundingClientRect();pop.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-pop.offsetHeight-8))+'px';pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+'px'}
    });
    const onScroll=()=>{if(isOpen())pop.hidePopover()};
    detail.addEventListener('scroll',onScroll);
    $('#ov-apply',root).addEventListener('click',()=>{const s=$$('input:checked',pop).map(i=>i.value);pop.hidePopover();pb.focus();toast({msg:s.length?tx(`Filter angewendet: ${s.join(', ')}.`,`Filter applied: ${s.join(', ')}.`):tx('Kein Filter aktiv.','No filter active.'),duration:3000})});
    [['#ov-drawerbtn','#ov-drawer'],['#ov-sheetbtn','#ov-sheet']].forEach(([b,d])=>{
      const btn=$(b,root),dlg=$(d,root);
      btn.addEventListener('click',()=>dlg.showModal());
      dlg.addEventListener('click',e=>{
        const act=e.target.closest('[data-act]');
        if(act){toast({msg:tx(`${act.dataset.act} (Demo).`,`${act.dataset.act} (demo).`),type:'success',duration:2500});dlg.close();return}
        if(e.target===dlg||e.target.closest('[data-close]'))dlg.close();
      });
      dlg.addEventListener('close',()=>btn.focus());
    });
    const sheet=$('#ov-sheet',root),grip=$('.sheet-drag',root);
    grip.addEventListener('pointerdown',e=>{
      const y0=e.clientY;let dy=0;grip.setPointerCapture(e.pointerId);sheet.style.transition='none';
      const mv=ev=>{dy=Math.max(0,ev.clientY-y0);sheet.style.transform=`translateY(${dy}px)`};
      const up=()=>{grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);sheet.style.transition='';sheet.style.transform='';if(dy>80)sheet.close()};
      grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
    });
    return()=>{document.removeEventListener('keydown',onKey);detail.removeEventListener('scroll',onScroll);if(isOpen())pop.hidePopover();$$('dialog[open]',root).forEach(d=>d.close())};
  },
  do:tx([`Das natives <code>popover</code>-Attribut für Menüs und kleine Auswahlen – Top Layer, Klick daneben und Esc schließen gratis.`,`Tooltips nur als Ergänzung: Alles Wichtige muss auch ohne Hover sichtbar sein.`,`Jedes Overlay mit Esc schließbar, Fokus danach zurück zum Auslöser.`],[`Use the native <code>popover</code> attribute for menus and small choices – top layer, click-outside and Esc to close come for free.`,`Use tooltips only as an extra: everything important must be visible without hover.`,`Make every overlay closable with Esc, then return focus to the trigger.`]),
  dont:tx([`Wichtige Infos nur im Tooltip – auf dem Handy unsichtbar.`,`Ein Popover, das ein Popover öffnet, das einen Dialog öffnet.`,`Drawer für die Hauptnavigation am Desktop, obwohl genug Platz da ist.`],[`Important info only in a tooltip – invisible on mobile.`,`A popover that opens a popover that opens a dialog.`,`A drawer for the main navigation on desktop, even though there’s enough room.`]),
  why:tx(`<p>Jedes Overlay verdeckt etwas. Je mehr es verdeckt und blockiert, desto höher die Kosten: Kontext geht verloren, der Arbeitsfluss bricht ab. Deshalb gilt: das schwächste Overlay, das den Zweck erfüllt.</p><p>Tooltips haben eigene Regeln (WCAG 1.4.13): Man muss sie mit Esc schließen können, ohne die Maus zu bewegen, man muss mit der Maus auf sie fahren können, und sie dürfen nicht von selbst verschwinden. Auf Touch-Geräten gibt es kein Hover – was nur im Tooltip steht, sieht dort niemand.</p><p>Das <code>popover</code>-Attribut in HTML bringt Popovers ohne Bibliothek: Top Layer, Klick daneben schließt, Esc schließt.</p>`,`<p>Every overlay covers something. The more it covers and blocks, the higher the cost: context gets lost and the workflow breaks. That’s why the rule is: the lightest overlay that does the job.</p><p>Tooltips have their own rules (WCAG 1.4.13): you must be able to dismiss them with Esc without moving the mouse, you must be able to move the mouse onto them, and they must not disappear on their own. Touch devices have no hover – whatever lives only in a tooltip, nobody sees there.</p><p>The HTML <code>popover</code> attribute gives you popovers without a library: top layer, clicking outside closes, Esc closes.</p>`),
  here:tx(`Die App nutzt Toasts (blockieren nichts) und genau einen Modal-Dialog. Auf dem Handy hätte die Lektionsliste ein Drawer sein können – sie ist stattdessen eine eigene Ansicht, weil sie die Hauptnavigation ist und nicht versteckt werden soll.`,`The app uses toasts (they block nothing) and exactly one modal dialog. On mobile, the lesson list could have been a drawer – instead it’s a view of its own, because it’s the main navigation and shouldn’t be hidden.`)
},
{
  id:'gestures',cat:'Bedienung',title:tx('Gesten & Mobile','Gestures & mobile'),
  short:tx('Jede Geste ist eine Abkürzung – nie der einzige Weg.','Every gesture is a shortcut – never the only way.'),
  keys:'wischen swipe drag drop ziehen sortieren touch pointer geste mobil handy pull to refresh gesture mobile reorder sort dragging alternative',
  refs:['WCAG 2.5.1 · A','WCAG 2.5.2 · A','WCAG 2.5.7 · AA'],
  rule:tx(`Wischen, Ziehen und Mehrfinger-Gesten sind Abkürzungen für Geübte. Für jede gibt es eine <strong>sichtbare Alternative mit einfachem Tippen</strong>.`,`Swiping, dragging and multi-finger gestures are shortcuts for experienced users. Each one needs a <strong>visible alternative using a simple tap</strong>.`),
  numbers:tx([['1 Finger · 1 Tipp','muss für alles reichen (2.5.1)'],['Ziehen','braucht eine Alternative ohne Ziehen (2.5.7)'],['beim Loslassen','auslösen, nicht beim Drücken (2.5.2)'],['≥ 44 px','Griff-Fläche für Drag Handles']],[['1 finger · 1 tap','must be enough for everything (2.5.1)'],['Dragging','needs an alternative without dragging (2.5.7)'],['On release','trigger on release, not on press (2.5.2)'],['≥ 44 px','grab area for drag handles']]),
  demo:`
  <div>
    <h3>${tx('Wischen zum Löschen – mit Alternative','Swipe to delete – with an alternative')}</h3>
    <ul class="sw-list" id="sw-list"></ul>
    <p class="demo-note">${tx('Wisch eine Zeile nach links (mit der Maus: ziehen). Oder tipp auf ⋯ – das Ergebnis ist dasselbe, ganz ohne Geste.','Swipe a row to the left (with a mouse: drag). Or tap ⋯ – same result, no gesture needed.')}</p>
  </div>
  <div>
    <h3>${tx('Sortieren per Ziehen – oder per Knopf','Reorder by dragging – or by button')}</h3>
    <ol class="dr-list" id="dr-list"></ol>
    <p class="demo-note">${tx('Zieh am Griff links oder nimm die Pfeile. Die Pfeile sind die Alternative, die WCAG 2.5.7 verlangt.','Drag the handle on the left or use the arrows. The arrows are the alternative WCAG 2.5.7 requires.')}</p>
  </div>
  <div>
    <h3>${tx('Auslösen beim Drücken oder beim Loslassen?','Trigger on press or on release?')}</h3>
    <div class="btn-row"><button type="button" class="btn btn-secondary" id="pd-bad">${tx('Löst beim Drücken aus','Triggers on press')}</button><button type="button" class="btn btn-secondary" id="pd-good">${tx('Löst beim Loslassen aus','Triggers on release')}</button></div>
    <p class="demo-note" id="pd-log" aria-live="polite">${tx('Drück einen Button, halte die Maustaste und zieh dann weg, bevor du loslässt.','Press a button, hold the mouse button down, then drag away before you let go.')}</p>
  </div>`,
  init(root){
    const START=tx(['Newsletter Oktober','Rechnung 2026-114','Einladung Team-Event','Paket ist unterwegs'],['October newsletter','Invoice 2026-114','Invitation: team event','Your package is on its way']);
    let items=[...START],open=-1;const list=$('#sw-list',root);
    const render=()=>{
      list.innerHTML=items.length?items.map((t,i)=>`<li class="sw-item${i===open?' open':''}"><div class="sw-actions"${i===open?'':' inert'}><button type="button" class="btn btn-danger sw-del" data-i="${i}">${tx('Löschen','Delete')}</button></div><div class="sw-row" data-i="${i}"><span>${esc(t)}</span><button type="button" class="icon-btn sw-more" data-i="${i}" aria-expanded="${i===open}" aria-label="${tx(`Aktionen für „${esc(t)}“`,`Actions for “${esc(t)}”`)}">${ic('more')}</button></div></li>`).join('')
        :`<li class="file-empty"><p><b>${tx('Posteingang leer.','Inbox empty.')}</b></p><button type="button" class="btn btn-ghost" id="sw-restore">${tx('Beispiele wiederherstellen','Restore examples')}</button></li>`;
    };
    render();
    list.addEventListener('click',e=>{
      if(e.target.closest('#sw-restore')){items=[...START];open=-1;render();$('.sw-more',list).focus();return}
      const m=e.target.closest('.sw-more');
      if(m){const i=+m.dataset.i;open=open===i?-1:i;render();$(open===i?`.sw-del[data-i="${i}"]`:`.sw-more[data-i="${i}"]`,list).focus();return}
      const d=e.target.closest('.sw-del');
      if(d){
        const i=+d.dataset.i,t=items.splice(i,1)[0];open=-1;render();
        (list.querySelectorAll('.sw-more')[Math.min(i,items.length-1)]||$('#sw-restore',list))?.focus();
        toast({msg:tx(`„${t}“ gelöscht.`,`“${t}” deleted.`),action:{label:tx('Rückgängig','Undo'),fn:()=>{items.splice(Math.min(i,items.length),0,t);render()}}});
      }
    });
    list.addEventListener('pointerdown',e=>{
      const row=e.target.closest('.sw-row');if(!row||e.target.closest('button'))return;
      const i=+row.dataset.i,base=i===open?-112:0,x0=e.clientX;let dx=0;
      row.setPointerCapture(e.pointerId);row.style.transition='none';
      const mv=ev=>{dx=ev.clientX-x0;row.style.transform=`translateX(${Math.max(-160,Math.min(0,base+dx))}px)`};
      const up=()=>{
        row.removeEventListener('pointermove',mv);row.removeEventListener('pointerup',up);row.removeEventListener('pointercancel',up);
        if(Math.abs(dx)<6){if(open===i)open=-1}else open=base+dx<-56?i:-1;
        render();
      };
      row.addEventListener('pointermove',mv);row.addEventListener('pointerup',up);row.addEventListener('pointercancel',up);
    });

    let order=tx(['Aufwärmen','Kniebeugen','Liegestütze','Plank','Dehnen'],['Warm-up','Squats','Push-ups','Plank','Stretching']);const dl=$('#dr-list',root);let dragCleanup=null;
    const renderD=()=>{dl.innerHTML=order.map((t,i)=>`<li class="dr-item" data-i="${i}"><span class="dr-grip" aria-hidden="true">${ic('grip')}</span><span class="dr-pos">${i+1}</span><span class="dr-name">${t}</span><button type="button" class="icon-btn" data-mv="-1" data-i="${i}" aria-label="${tx(`„${t}“ nach oben`,`Move “${t}” up`)}" ${i===0?'disabled':''}>${ic('up')}</button><button type="button" class="icon-btn" data-mv="1" data-i="${i}" aria-label="${tx(`„${t}“ nach unten`,`Move “${t}” down`)}" ${i===order.length-1?'disabled':''}>${ic('down')}</button></li>`).join('')};
    renderD();
    dl.addEventListener('click',e=>{
      const b=e.target.closest('[data-mv]');if(!b)return;
      const i=+b.dataset.i,d=+b.dataset.mv,j=i+d;[order[i],order[j]]=[order[j],order[i]];
      renderD();const same=$(`[data-i="${j}"][data-mv="${d}"]`,dl);
      (same&&!same.disabled?same:$(`[data-i="${j}"][data-mv="${-d}"]`,dl)).focus();
      announce(tx(`${order[j]} ist jetzt an Position ${j+1} von ${order.length}.`,`${order[j]} is now at position ${j+1} of ${order.length}.`));
    });
    dl.addEventListener('pointerdown',e=>{
      const g=e.target.closest('.dr-grip');if(!g)return;e.preventDefault();
      const li=g.closest('.dr-item');li.classList.add('dragging');
      const mv=ev=>{let before=null;for(const o of dl.children){if(o===li)continue;const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=o;break}}dl.insertBefore(li,before)};
      const up=()=>{dragCleanup();const t=order[+li.dataset.i];order=[...dl.children].map(x=>order[+x.dataset.i]);renderD();announce(tx(`${t} ist jetzt an Position ${order.indexOf(t)+1} von ${order.length}.`,`${t} is now at position ${order.indexOf(t)+1} of ${order.length}.`))};
      dragCleanup=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);dragCleanup=null};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });

    const log=$('#pd-log',root),bad=$('#pd-bad',root),good=$('#pd-good',root);
    bad.addEventListener('pointerdown',()=>{log.textContent=tx('Schon ausgelöst – beim Drücken. Wegziehen hilft jetzt nichts mehr.','Already triggered – on press. Dragging away won’t help now.')});
    bad.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')log.textContent=tx('Schon ausgelöst – beim Drücken der Taste.','Already triggered – when the key was pressed.')});
    good.addEventListener('pointerdown',()=>{log.textContent=tx('Gedrückt – noch ist nichts passiert. Jetzt loslassen oder wegziehen.','Pressed – nothing has happened yet. Now let go or drag away.')});
    good.addEventListener('pointerleave',e=>{if(e.buttons)log.textContent=tx('Weggezogen – abgebrochen, nichts ist passiert.','Dragged away – canceled, nothing happened.')});
    good.addEventListener('click',()=>{log.textContent=tx('Ausgelöst beim Loslassen. Wer vorher wegzieht, bricht ab.','Triggered on release. Dragging away first cancels it.')});
    return()=>{if(dragCleanup)dragCleanup()};
  },
  do:tx([`Jede Wischaktion auch über einen sichtbaren Button anbieten (⋯-Menü, Löschen-Icon).`,`Drag Handles mindestens 44 px groß, Sortieren zusätzlich mit Pfeilen oder „Nach oben“.`,`<code>touch-action</code> gezielt setzen, damit Wischen in der Zeile das senkrechte Scrollen nicht blockiert.`],[`Offer every swipe action through a visible button as well (⋯ menu, delete icon).`,`Make drag handles at least 44 px, and also allow reordering with arrows or “Move up”.`,`Set <code>touch-action</code> deliberately so swiping a row doesn’t block vertical scrolling.`]),
  dont:tx([`Wischen als einziger Weg zum Löschen.`,`Sortieren nur per Drag and Drop.`,`Auslösen schon beim Drücken (<code>pointerdown</code>) – kein Abbrechen möglich.`],[`Swiping as the only way to delete.`,`Reordering only via drag and drop.`,`Triggering on press (<code>pointerdown</code>) – no way to cancel.`]),
  why:tx(`<p>Gesten sind unsichtbar. Niemand sieht einer Zeile an, dass man sie wischen kann. Dazu kommen Menschen, die mit einem Finger, einem Stift, einer Mundmaus oder per Sprachsteuerung bedienen: Für sie sind Wischen und Ziehen oft unmöglich.</p><p>WCAG 2.5.7 (neu in 2.2) verlangt deshalb für jede Ziehbewegung eine Alternative mit einfachen Klicks. WCAG 2.5.2 sorgt dafür, dass man es sich anders überlegen kann: Ausgelöst wird beim Loslassen, wer den Finger vorher wegzieht, bricht ab.</p>`,`<p>Gestures are invisible. Nobody can tell by looking at a row that it can be swiped. On top of that, some people operate with one finger, a stylus, a mouth stick or voice control: for them, swiping and dragging are often impossible.</p><p>That’s why WCAG 2.5.7 (new in 2.2) requires an alternative with simple clicks for every dragging movement. WCAG 2.5.2 makes sure you can change your mind: the action fires on release, and moving your finger away first cancels it.</p>`),
  here:tx(`Die App selbst braucht keine einzige Geste. Alles geht mit Tippen, Klicken oder der Tastatur – Gesten gibt es nur in den Demos, und jede hat eine Alternative.`,`The app itself doesn’t need a single gesture. Everything works with tapping, clicking or the keyboard – gestures only appear in the demos, and each one has an alternative.`)
},
{
  id:'onboarding',cat:'Bedienung',title:tx('Onboarding & Progressive Disclosure','Onboarding & progressive disclosure'),
  short:tx('Erst das Wesentliche, Details auf Abruf – und lange Abläufe in Schritten.','Essentials first, details on demand – and long flows in steps.'),
  keys:'stepper wizard schritte onboarding einführung tour accordion details erweitert progressive disclosure steps introduction advanced settings review page multi-step form',
  refs:['WCAG 3.3.7 · A','WCAG 3.3.4 · AA','NN/g: Progressive Disclosure'],
  rule:tx(`Zeig zuerst nur, was für den nächsten Schritt nötig ist; Details kommen auf Abruf. Lange Abläufe werden zu <strong>wenigen, benannten Schritten</strong> – und keine Angabe wird zweimal verlangt.`,`Show only what’s needed for the next step at first; details come on demand. Long flows become <strong>a few named steps</strong> – and no information is asked for twice.`),
  numbers:tx([['3–5','Schritte in einem Stepper'],['1 Ziel','pro Schritt'],['Überspringen','muss bei jedem Onboarding gehen'],['3.3.7','schon Eingegebenes nicht erneut abfragen']],[['3–5','steps in a stepper'],['1 goal','per step'],['Skip','must be possible in every onboarding'],['3.3.7','don’t ask again for what was already entered']]),
  demo:`
  <div class="wz">
    <ol class="steps" id="wz-steps" aria-label="${tx('Fortschritt','Progress')}"></ol>
    <div id="wz-body"></div>
    <div class="btn-row wz-nav"><button type="button" class="btn btn-secondary" id="wz-back">${tx('Zurück','Back')}</button><button type="button" class="btn btn-primary" id="wz-next">${tx('Weiter','Next')}</button></div>
  </div>
  <div>
    <h3>${tx('Progressive Disclosure mit','Progressive disclosure with')} <code>&lt;details&gt;</code></h3>
    <div class="pd-box">
      <div class="field"><label for="pd-name">${tx('Projektname','Project name')}</label><input class="input" id="pd-name" value="${tx('Herbstkampagne','Fall campaign')}"></div>
      <details class="acc"><summary>${tx('Erweiterte Einstellungen','Advanced settings')}</summary><div class="acc-body">
        <div class="check-row"><input type="checkbox" id="pd-a1" checked><label for="pd-a1">${tx('Änderungsverlauf 90 Tage behalten','Keep change history for 90 days')}</label></div>
        <div class="check-row"><input type="checkbox" id="pd-a2"><label for="pd-a2">${tx('Öffentliche Vorschau-Links erlauben','Allow public preview links')}</label></div>
        <div class="field"><label for="pd-tz">${tx('Zeitzone','Time zone')}</label><select id="pd-tz"><option>${tx('Europa/Wien','Europe/Vienna')}</option><option>${tx('Europa/Berlin','Europe/Berlin')}</option><option>UTC</option></select></div>
      </div></details>
    </div>
    <p class="demo-note">${tx('Die meisten brauchen nur den Namen. Die übrigen Optionen sind da, aber sie stehen nicht im Weg.','Most people only need the name. The other options are there, but they stay out of the way.')}</p>
  </div>`,
  init(root){
    const S=tx(['Konto','Adresse','Prüfen'],['Account','Address','Review']);let step=0;
    const d={name:'Lena Hofer',email:tx('lena@beispiel.at','lena@example.com'),street:'Herrengasse 16',city:'8010 Graz',same:true,bstreet:'',bcity:''};
    const body=$('#wz-body',root),steps=$('#wz-steps',root),back=$('#wz-back',root),next=$('#wz-next',root);
    const val=id=>$('#'+id,root)?.value??'';
    const field=(id,label,v,ac)=>`<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" value="${esc(v)}"${ac?` autocomplete="${ac}"`:''}></div>`;
    const save=()=>{
      if(step===0){d.name=val('wz-name');d.email=val('wz-email')}
      if(step===1){d.street=val('wz-street');d.city=val('wz-city');d.same=$('#wz-same',root).checked;d.bstreet=val('wz-bstreet');d.bcity=val('wz-bcity')}
    };
    const render=focus=>{
      steps.innerHTML=S.map((s,i)=>`<li class="${i<step?'done':''}"${i===step?' aria-current="step"':''}><span class="step-n">${i<step?ic('check'):i+1}</span>${s}${i<step?`<span class="sr-only">${tx(' (erledigt)',' (done)')}</span>`:''}</li>`).join('');
      let h=`<h3 tabindex="-1" id="wz-h">${tx(`Schritt ${step+1} von 3: ${S[step]}`,`Step ${step+1} of 3: ${S[step]}`)}</h3>`;
      if(step===0)h+=field('wz-name',tx('Vollständiger Name','Full name'),d.name,'name')+field('wz-email',tx('E-Mail-Adresse','Email address'),d.email,'email');
      if(step===1)h+=field('wz-street',tx('Straße und Hausnummer','Street and house number'),d.street,'street-address')+field('wz-city',tx('PLZ und Ort','Postal code and city'),d.city,'')+`<div class="check-row"><input type="checkbox" id="wz-same"${d.same?' checked':''}><label for="wz-same">${tx('Rechnungsadresse ist dieselbe','Billing address is the same')}</label></div><div id="wz-bill" class="wz-bill"${d.same?' hidden':''}>${field('wz-bstreet',tx('Rechnung: Straße und Hausnummer','Billing: street and house number'),d.bstreet,'')}${field('wz-bcity',tx('Rechnung: PLZ und Ort','Billing: postal code and city'),d.bcity,'')}</div>`;
      if(step===2)h+=`<dl class="wz-sum">${[[tx('Name','Name'),d.name,0],[tx('E-Mail','Email'),d.email,0],[tx('Lieferadresse','Shipping address'),`${d.street}, ${d.city}`,1],[tx('Rechnungsadresse','Billing address'),d.same?tx('wie Lieferadresse','same as shipping address'):`${d.bstreet}, ${d.bcity}`,1]].map(([k,v,s])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd><dd><button type="button" class="btn btn-ghost wz-edit" data-s="${s}" aria-label="${tx(`${k} ändern`,`Edit ${k.toLowerCase()}`)}">${tx('Ändern','Edit')}</button></dd></div>`).join('')}</dl>`;
      body.innerHTML=h;back.hidden=step===0;
      next.textContent=step===0?tx('Weiter zur Adresse','Continue to address'):step===1?tx('Weiter zur Prüfung','Continue to review'):tx('Konto anlegen','Create account');
      if(focus)$('#wz-h',root).focus();
    };
    render(false);
    body.addEventListener('change',e=>{if(e.target.id==='wz-same')$('#wz-bill',root).hidden=e.target.checked});
    body.addEventListener('click',e=>{const b=e.target.closest('.wz-edit');if(b){step=+b.dataset.s;render(true)}});
    next.addEventListener('click',()=>{save();if(step<2){step++;render(true)}else{toast({msg:tx(`Konto für ${d.name} angelegt (nur Demo).`,`Account created for ${d.name} (demo only).`),type:'success'});step=0;render(true)}});
    back.addEventListener('click',()=>{save();step--;render(true)});
  },
  do:tx([`Stepper mit sichtbarem Stand: „Schritt 2 von 3“, erledigte Schritte markiert, Zurück ohne Datenverlust.`,`Am Ende eine Prüfseite mit „Ändern“-Links.`,`Seltene Optionen hinter <code>&lt;details&gt;</code> oder „Erweitert“ – nie ganz entfernen.`],[`A stepper with visible progress: “Step 2 of 3”, completed steps marked, going back without losing data.`,`A review page at the end with “Edit” links.`,`Put rare options behind <code>&lt;details&gt;</code> or “Advanced” – never remove them entirely.`]),
  dont:tx([`Eine Tour mit fünf Sprechblasen, bevor man überhaupt etwas tun darf.`,`Alles auf einmal: 30 Felder auf einer Seite.`,`Dieselbe Adresse zweimal abfragen.`],[`A tour with five speech bubbles before you’re allowed to do anything at all.`,`Everything at once: 30 fields on one page.`,`Asking for the same address twice.`]),
  why:tx(`<p><strong>Progressive Disclosure</strong> heißt: zuerst das Wesentliche, Details auf Abruf. Das senkt die Einstiegshürde für Neue, ohne Profis etwas wegzunehmen – die erweiterten Optionen sind nur einen Klick entfernt.</p><p>Lange Formulare wirken in Schritten kleiner. Ein guter Stepper zeigt, wo man ist und wie viel noch kommt, und erlaubt Zurückgehen ohne Datenverlust. Die Prüfseite mit „Ändern“-Links fängt Fehler ab, bevor sie Folgen haben (WCAG 3.3.4).</p><p>Onboarding-Touren, die Sprechblasen über die Oberfläche legen, werden meist weggeklickt. Besser wirken gute Empty States und Hinweise genau dort, wo man sie gerade braucht.</p>`,`<p><strong>Progressive disclosure</strong> means: essentials first, details on demand. It lowers the barrier for newcomers without taking anything away from pros – the advanced options are just one click away.</p><p>Long forms feel smaller when split into steps. A good stepper shows where you are and how much is left, and lets you go back without losing data. The review page with “Edit” links catches mistakes before they have consequences (WCAG 3.3.4).</p><p>Onboarding tours that lay speech bubbles over the interface mostly get clicked away. Good empty states and hints right where you need them work better.</p>`),
  here:tx(`Die Startseite ist das Onboarding: vier Kacheln, ein Primary-Button – und wer will, überspringt sie, indem er links eine Lektion wählt. Nach jedem Schritt im Stepper springt der Fokus auf die neue Schritt-Überschrift.`,`The home page is the onboarding: four tiles, one primary button – and if you want, you skip it by picking a lesson on the left. After each step in the stepper, focus jumps to the new step heading.`)
},
{
  id:'tables',cat:'Daten & Inhalte',title:tx('Tabellen & lange Listen','Tables & long lists'),
  short:tx('Zahlen rechtsbündig, sortierbar mit Richtung, Kopfzeile bleibt stehen.','Right-aligned numbers, sortable with a visible direction, a header row that stays put.'),
  keys:'tabelle table data grid sortieren sort pagination infinite scroll mehr laden auswahl bulk aria-sort load more selection bulk actions sticky header right-aligned numbers',
  refs:['WCAG 1.3.1 · A','ARIA: aria-sort','NN/g: Infinite Scroll'],
  rule:tx(`Tabellen sind zum Vergleichen da: Zahlen <strong>rechtsbündig mit gleich breiten Ziffern</strong>, sortierbare Spalten mit sichtbarer Richtung, eine Kopfzeile, die beim Scrollen stehen bleibt.`,`Tables are for comparing: numbers <strong>right-aligned with equal-width digits</strong>, sortable columns with a visible direction, and a header row that stays put while you scroll.`),
  numbers:tx([['rechtsbündig','Zahlen – Stellen stehen untereinander'],['tabular-nums','gleich breite Ziffern'],['aria-sort','nennt Screenreadern die Sortierung'],['20–50','Zeilen pro Seite als Startwert']],[['right-aligned','numbers – digits line up in columns'],['tabular-nums','equal-width digits'],['aria-sort','tells screen readers the sort order'],['20–50','rows per page as a starting point']]),
  demo:`
  <p style="margin:0">${sw('tb-bad',tx('Zahlen linksbündig und mit Proportionalziffern','Left-aligned numbers with proportional digits'))}</p>
  <div>
    <div class="bulk" id="tb-bulk" hidden><span id="tb-count"></span><button type="button" class="btn btn-secondary" id="tb-paid">${tx('Als bezahlt markieren','Mark as paid')}</button><button type="button" class="btn btn-ghost" id="tb-clear">${tx('Auswahl aufheben','Clear selection')}</button></div>
    <div class="tb-wrap" tabindex="0" role="region" aria-labelledby="tb-cap">
      <table class="dt" id="tb"><caption id="tb-cap" class="sr-only">${tx('Rechnungen 2026, Beispieldaten','Invoices 2026, sample data')}</caption>
        <thead><tr>
          <th scope="col" class="tb-check"><input type="checkbox" id="tb-all" aria-label="${tx('Alle Rechnungen auswählen','Select all invoices')}"></th>
          <th scope="col" data-k="nr"><button type="button" class="sort">${tx('Nr.','No.')}<span class="sort-ic"></span></button></th>
          <th scope="col" data-k="k"><button type="button" class="sort">${tx('Kunde','Customer')}<span class="sort-ic"></span></button></th>
          <th scope="col" data-k="d"><button type="button" class="sort">${tx('Datum','Date')}<span class="sort-ic"></span></button></th>
          <th scope="col" data-k="b" class="num"><button type="button" class="sort">${tx('Betrag','Amount')}<span class="sort-ic"></span></button></th>
          <th scope="col" data-k="s"><button type="button" class="sort">Status<span class="sort-ic"></span></button></th>
        </tr></thead>
        <tbody id="tb-body"></tbody>
      </table>
    </div>
    <p class="demo-note">${tx('Klick auf einen Spaltenkopf zum Sortieren, noch einmal für die umgekehrte Richtung. Die Kopfzeile bleibt beim Scrollen stehen. Wähl ein paar Zeilen aus: Oben erscheint die Leiste für Mehrfachaktionen.','Click a column header to sort, click again to reverse the order. The header row stays put while you scroll. Select a few rows: a bar for bulk actions appears at the top.')}</p>
  </div>
  <div>
    <h3>${tx('Pagination, „Mehr laden“ oder Infinite Scroll?','Pagination, “Load more” or infinite scroll?')}</h3>
    <div class="table-wrap"><table class="sem">
      <thead><tr><th scope="col">${tx('Muster','Pattern')}</th><th scope="col">${tx('Gut für','Good for')}</th><th scope="col">${tx('Schlecht für','Bad for')}</th></tr></thead>
      <tbody>
        <tr><th scope="row">Pagination</th><td>${tx('Suchen und Vergleichen – „es war auf Seite 3“ lässt sich wiederfinden','Searching and comparing – “it was on page 3” can be found again')}</td><td>${tx('schnelles Stöbern auf dem Handy','quick browsing on a phone')}</td></tr>
        <tr><th scope="row">${tx('„Mehr laden“','“Load more”')}</th><td>${tx('Shops und Feeds: Nutzer entscheidet, der Footer bleibt erreichbar','Shops and feeds: the user decides, the footer stays reachable')}</td><td>${tx('sehr lange Listen (die Seite wird schwer)','very long lists (the page gets heavy)')}</td></tr>
        <tr><th scope="row">Infinite Scroll</th><td>${tx('endlose Feeds ohne Ziel','endless feeds without a goal')}</td><td>${tx('alles mit Footer, gezielte Suche, Tastatur und Screenreader','anything with a footer, targeted search, keyboard and screen reader users')}</td></tr>
      </tbody>
    </table></div>
  </div>`,
  init(root){
    const K=['Müller GmbH','Hofer & Partner','Café Lindner','Studio Nord','Bauer KG','Alpenblick Hotel'];
    const B=[1250,89.9,12480.5,430,2999,74.5,860,15200,318.2,1999,49,6420];
    const SS=['Bezahlt','Offen','Überfällig','Bezahlt','Offen','Bezahlt','Überfällig','Offen','Bezahlt','Offen','Bezahlt','Offen'];
    const SL=s=>tx(s,{Bezahlt:'Paid',Offen:'Open','Überfällig':'Overdue'}[s]);
    const rows=B.map((b,i)=>({nr:`2026-${101+i}`,k:K[i%6],d:new Date(2026,(i*5)%9,2+(i*7)%26),b,s:SS[i]}));
    let key='d',dir=-1;const sel=new Set();
    const money=new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}),date=new Intl.DateTimeFormat(LOCALE,{day:'2-digit',month:'2-digit',year:'numeric'});
    const ST={Bezahlt:['ok','st-ok'],Offen:['circle','st-open'],'Überfällig':['alert','st-late']};
    const tbody=$('#tb-body',root),all=$('#tb-all',root),bulk=$('#tb-bulk',root);
    const updSel=()=>{
      all.checked=sel.size===rows.length;all.indeterminate=sel.size>0&&sel.size<rows.length;
      bulk.hidden=!sel.size;$('#tb-count',root).textContent=sel.size===1?tx('1 Rechnung ausgewählt','1 invoice selected'):tx(`${sel.size} Rechnungen ausgewählt`,`${sel.size} invoices selected`);
      $$('tr[data-nr]',tbody).forEach(tr=>tr.classList.toggle('sel',sel.has(tr.dataset.nr)));
    };
    const render=()=>{
      const sorted=[...rows].sort((a,b)=>{const x=key==='s'?SL(a.s):a[key],y=key==='s'?SL(b.s):b[key];return(typeof x==='string'?x.localeCompare(y,LOCALE):x-y)*dir});
      tbody.innerHTML=sorted.map(r=>`<tr data-nr="${r.nr}"><td class="tb-check"><input type="checkbox" data-nr="${r.nr}"${sel.has(r.nr)?' checked':''} aria-label="${tx(`Rechnung ${r.nr} auswählen`,`Select invoice ${r.nr}`)}"></td><td class="num-l">${r.nr}</td><td>${esc(r.k)}</td><td class="num-l">${date.format(r.d)}</td><td class="num">${money.format(r.b)}</td><td><span class="st ${ST[r.s][1]}">${ic(ST[r.s][0])}${SL(r.s)}</span></td></tr>`).join('');
      $$('th[data-k]',root).forEach(th=>{const on=th.dataset.k===key;if(on)th.setAttribute('aria-sort',dir>0?'ascending':'descending');else th.removeAttribute('aria-sort');$('.sort-ic',th).innerHTML=on?ic(dir>0?'up':'down'):''});
      updSel();
    };
    render();
    $('#tb thead',root).addEventListener('click',e=>{const b=e.target.closest('.sort');if(!b)return;const k=b.closest('th').dataset.k;if(k===key)dir=-dir;else{key=k;dir=1}render()});
    tbody.addEventListener('change',e=>{const nr=e.target.dataset.nr;if(!nr)return;if(e.target.checked)sel.add(nr);else sel.delete(nr);updSel();announce($('#tb-count',root).textContent)});
    all.addEventListener('change',()=>{if(all.checked)rows.forEach(r=>sel.add(r.nr));else sel.clear();render();announce(sel.size?$('#tb-count',root).textContent:tx('Auswahl aufgehoben','Selection cleared'))});
    $('#tb-paid',root).addEventListener('click',()=>{const n=sel.size;rows.forEach(r=>{if(sel.has(r.nr))r.s='Bezahlt'});sel.clear();render();all.focus();toast({msg:n===1?tx('1 Rechnung als bezahlt markiert.','1 invoice marked as paid.'):tx(`${n} Rechnungen als bezahlt markiert.`,`${n} invoices marked as paid.`),type:'success'})});
    $('#tb-clear',root).addEventListener('click',()=>{sel.clear();render();all.focus()});
    $('#tb-bad',root).addEventListener('toggle',e=>$('#tb',root).classList.toggle('bad-align',e.detail));
  },
  do:tx([`Eine echte <code>&lt;table&gt;</code> mit <code>&lt;th scope="col"&gt;</code> – Screenreader sagen dann den Spaltenkopf mit an.`,`Scrollbare Tabellen-Container mit <code>tabindex="0"</code>, damit man sie per Tastatur scrollen kann.`,`Bei Auswahl eine Leiste mit Mehrfachaktionen, „Alle auswählen“ mit Zwischenzustand.`],[`A real <code>&lt;table&gt;</code> with <code>&lt;th scope="col"&gt;</code> – screen readers then announce the column header too.`,`Scrollable table containers with <code>tabindex="0"</code>, so you can scroll them with the keyboard.`,`A bulk-action bar once rows are selected, and “Select all” with an indeterminate state.`]),
  dont:tx([`Zahlen linksbündig mit Proportionalziffern.`,`Tabellen aus <code>div</code>-Elementen – Screenreader verlieren die Spaltenköpfe.`,`Infinite Scroll über einem Footer mit Impressum und Kontakt.`],[`Left-aligned numbers with proportional digits.`,`Tables built from <code>div</code> elements – screen readers lose the column headers.`,`Infinite scroll above a footer with the legal notice and contact details.`]),
  why:tx(`<p>Das Auge liest Zahlen spaltenweise. Nur wenn Einer unter Einern und Tausender unter Tausendern stehen, sieht man auf einen Blick, welcher Betrag größer ist. Dafür braucht es rechtsbündige Zahlen und gleich breite Ziffern – <code>font-variant-numeric: tabular-nums</code>, oder eine Monospace-Schrift, wenn die Schrift keine Tabellenziffern hat (wie hier).</p><p>Für Screenreader ist eine echte <code>&lt;table&gt;</code> Gold wert: Beim Wechsel in eine Zelle wird der Spaltenkopf mit angesagt („Betrag, € 12.480,50“). Nachgebaute Tabellen aus <code>div</code>s verlieren das. <code>aria-sort</code> sagt zusätzlich, nach welcher Spalte sortiert ist.</p>`,`<p>The eye reads numbers column by column. Only when ones sit under ones and thousands under thousands can you see at a glance which amount is larger. That takes right-aligned numbers and equal-width digits – <code>font-variant-numeric: tabular-nums</code>, or a monospace font if the typeface has no tabular figures (as here).</p><p>For screen readers, a real <code>&lt;table&gt;</code> is worth its weight in gold: when you move into a cell, the column header is announced along with it (“Amount, €12,480.50”). Tables rebuilt from <code>div</code>s lose that. <code>aria-sort</code> also tells them which column the table is sorted by.</p>`),
  here:tx(`Die Tabelle oben steckt in einem scrollbaren Bereich mit <code>tabindex="0"</code> und einem Namen – sonst könnten Tastaturnutzer ihn nicht scrollen. Alle Kennzahlen in den Lektionen stehen in JetBrains Mono, einer Schrift mit gleich breiten Ziffern.`,`The table above sits in a scrollable region with <code>tabindex="0"</code> and a name – otherwise keyboard users couldn’t scroll it. All key figures in the lessons are set in JetBrains Mono, a typeface with equal-width digits.`)
},
{
  id:'search-filter',cat:'Daten & Inhalte',title:tx('Suche & Filter','Search & filters'),
  short:tx('Aktive Filter als Chips, Debounce beim Tippen, Zustand in der URL.','Active filters as chips, debounce while typing, state in the URL.'),
  keys:'suche search filter chips facetten debounce autocomplete trefferzahl url zustand facets result count state live region empty state',
  refs:['WCAG 4.1.3 · AA','WCAG 3.2.2 · A','ARIA APG: Combobox'],
  rule:tx(`Aktive Filter sind immer <strong>sichtbar und einzeln entfernbar</strong>. Die Trefferzahl wird angesagt, der Filterzustand steht in der URL, und null Treffer bieten einen Ausweg.`,`Active filters are always <strong>visible and removable one by one</strong>. The result count is announced, the filter state lives in the URL, and zero results offer a way out.`),
  numbers:tx([['~ 300 ms','Debounce beim Tippen'],['Chips','zeigen aktive Filter, × entfernt einzeln'],['Trefferzahl','über eine Live-Region angesagt'],['URL','Filter überleben Reload und Teilen']],[['~ 300 ms','debounce while typing'],['Chips','show active filters, × removes one at a time'],['Result count','announced via a live region'],['URL','filters survive reloading and sharing']]),
  demo:`
  <div class="sf">
    <div class="sf-filters" role="group" aria-label="${tx('Wege filtern','Filter trails')}">
      <div class="field"><label for="sf-q">${tx('Name oder Region','Name or region')}</label><input class="input" type="search" id="sf-q" autocomplete="off" aria-describedby="sf-q-h"><p class="hint" id="sf-q-h">${tx('Probier „alm“.','Try “alm”.')}</p></div>
      <fieldset class="sf-fs"><legend>${tx('Schwierigkeit','Difficulty')}</legend>${['leicht','mittel','schwer'].map(x=>`<div class="check-row"><input type="checkbox" name="sf-d" value="${x}" id="sf-d-${x}"><label for="sf-d-${x}">${tx(x[0].toUpperCase()+x.slice(1),{leicht:'Easy',mittel:'Moderate',schwer:'Hard'}[x])}</label></div>`).join('')}</fieldset>
      <div class="field"><label for="sf-r">Region</label><select id="sf-r"><option value="">${tx('Alle Regionen','All regions')}</option>${['Kärnten','Salzburg','Steiermark','Tirol'].map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="check-row"><input type="checkbox" id="sf-loop"><label for="sf-loop">${tx('Nur Rundwege','Loop trails only')}</label></div>
    </div>
    <div>
      <div class="chips" id="sf-chips" role="group" aria-label="${tx('Aktive Filter','Active filters')}"></div>
      <p class="sf-count" id="sf-count" aria-live="polite"></p>
      <ul class="sf-list" id="sf-list" aria-label="${tx('Wanderwege','Hiking trails')}"></ul>
    </div>
  </div>
  <p class="md-state" id="sf-debounce" style="margin:0"></p>
  <p class="demo-note" style="margin:0">${tx('So stünde der Zustand in der URL:','This is how the state would look in the URL:')} <code id="sf-url">${tx('/wege','/trails')}</code></p>`,
  init(root){
    const T=[['Almrunde am Sattel','Steiermark','leicht',2.5,1],['Seeuferweg','Kärnten','leicht',1.5,1],['Gipfelsteig Hochkogel','Tirol','schwer',6,0],['Klammweg','Salzburg','mittel',3,0],['Zirbenweg','Tirol','leicht',2,0],['Wasserfallrunde','Salzburg','mittel',3.5,1],['Panoramaweg über dem Tal','Kärnten','mittel',4,0],['Hüttenweg zur Kaseralm','Steiermark','mittel',4.5,0],['Grat-Überschreitung','Tirol','schwer',7.5,0],['Moorlehrpfad','Salzburg','leicht',1,1],['Weinbergweg','Steiermark','leicht',2.5,1],['Kapellenrunde','Kärnten','leicht',1.5,1],['Jochsteig','Tirol','schwer',5.5,1],['Almweg am Bach','Steiermark','mittel',3,0]].map(([n,r,d,h,loop])=>({n,r,d,h,loop}));
    const DL={leicht:'easy',mittel:'moderate',schwer:'hard'};
    const q=$('#sf-q',root),reg=$('#sf-r',root),loop=$('#sf-loop',root),dbc=$('#sf-debounce',root);let keys=0,runs=0,term='',tm;
    const diffs=()=>$$('input[name="sf-d"]:checked',root).map(i=>i.value);
    const showDbc=()=>{dbc.textContent=tx(`Tastendrücke: ${keys} · Suchen ausgeführt: ${runs}`,`Keystrokes: ${keys} · Searches run: ${runs}`)};
    const apply=()=>{
      runs++;
      const t=norm(term.trim()),ds=diffs(),r=reg.value,lp=loop.checked;
      const res=T.filter(x=>(!t||norm(x.n+' '+x.r).includes(t))&&(!ds.length||ds.includes(x.d))&&(!r||x.r===r)&&(!lp||x.loop));
      const chips=[];
      if(term.trim())chips.push(['q',tx(`„${term.trim()}“`,`“${term.trim()}”`)]);
      ds.forEach(x=>chips.push(['d:'+x,tx(x[0].toUpperCase()+x.slice(1),DL[x][0].toUpperCase()+DL[x].slice(1))]));
      if(r)chips.push(['r',r]);if(lp)chips.push(['loop',tx('Rundweg','Loop trail')]);
      $('#sf-chips',root).innerHTML=chips.map(([k,l])=>`<button type="button" class="fchip" data-k="${esc(k)}" aria-label="${tx(`Filter ${esc(l)} entfernen`,`Remove filter ${esc(l)}`)}">${esc(l)}${ic('x')}</button>`).join('')+(chips.length>1?`<button type="button" class="btn btn-ghost" id="sf-reset">${tx('Alle zurücksetzen','Reset all')}</button>`:'');
      $('#sf-count',root).textContent=tx(`${res.length} von ${T.length} Wegen`,`${res.length} of ${T.length} trails`);
      $('#sf-list',root).innerHTML=res.length?res.map(x=>`<li><b>${esc(x.n)}</b><span>${tx(`${x.r} · ${x.d} · ${String(x.h).replace('.',',')} h${x.loop?' · Rundweg':''}`,`${x.r} · ${DL[x.d]} · ${x.h} h${x.loop?' · loop trail':''}`)}</span></li>`).join('')
        :`<li class="sf-empty"><b>${tx('Kein Weg passt zu diesen Filtern.','No trail matches these filters.')}</b><span>${tx('Entferne oben einen Filter oder ','Remove a filter above or ')}<button type="button" class="linkbtn" id="sf-reset2">${tx('setz alle zurück','reset them all')}</button>.</span></li>`;
      const p=new URLSearchParams();if(term.trim())p.set('q',term.trim());ds.forEach(x=>p.append(tx('schwierigkeit','difficulty'),tx(x,DL[x])));if(r)p.set('region',r);if(lp)p.set(tx('rundweg','loop'),'1');
      $('#sf-url',root).textContent=tx('/wege','/trails')+(p.toString()?'?'+p:'');
      showDbc();
    };
    const reset=()=>{q.value='';term='';$$('input[name="sf-d"]',root).forEach(i=>i.checked=false);reg.value='';loop.checked=false;apply();q.focus()};
    q.addEventListener('input',()=>{keys++;showDbc();clearTimeout(tm);tm=setTimeout(()=>{term=q.value;apply()},300)});
    [...$$('input[name="sf-d"]',root),reg,loop].forEach(x=>x.addEventListener('change',apply));
    $('#sf-chips',root).addEventListener('click',e=>{
      if(e.target.closest('#sf-reset')){reset();return}
      const c=e.target.closest('.fchip');if(!c)return;
      const k=c.dataset.k,idx=$$('.fchip',root).indexOf(c);
      if(k==='q'){q.value='';term=''}else if(k.startsWith('d:'))$(`input[name="sf-d"][value="${k.slice(2)}"]`,root).checked=false;else if(k==='r')reg.value='';else if(k==='loop')loop.checked=false;
      apply();const cs=$$('.fchip',root);(cs[Math.min(idx,cs.length-1)]||q).focus();
    });
    $('#sf-list',root).addEventListener('click',e=>{if(e.target.closest('#sf-reset2'))reset()});
    apply();runs=0;showDbc();
    return()=>clearTimeout(tm);
  },
  do:tx([`Aktive Filter als Chips über den Ergebnissen, jeder mit ×, bei mehreren zusätzlich „Alle zurücksetzen“.`,`Beim Tippen entprellen (Debounce), Häkchen und Auswahlfelder sofort anwenden.`,`Filterzustand in die URL schreiben – mit <code>replaceState</code>, damit „Zurück“ nicht durch jeden Filterklick führt.`],[`Active filters as chips above the results, each with an ×, plus “Reset all” when there are several.`,`Debounce while typing; apply checkboxes and selects immediately.`,`Write the filter state into the URL – with <code>replaceState</code>, so “Back” doesn’t step through every filter click.`]),
  dont:tx([`Aktive Filter unsichtbar in einem eingeklappten Panel.`,`Bei jedem Tastendruck neu suchen und neu ansagen.`,`„0 Ergebnisse“ ohne Hinweis, welcher Filter schuld ist.`],[`Active filters hidden away in a collapsed panel.`,`Searching and announcing again on every keystroke.`,`“0 results” with no hint which filter is to blame.`]),
  why:tx(`<p>Filter ohne sichtbaren Zustand sind eine Falle: Man kommt später zurück, sieht nur drei Ergebnisse und hält den Rest für gelöscht. Chips machen jeden aktiven Filter sichtbar und einzeln entfernbar.</p><p><strong>Debouncing</strong> wartet mit der Suche, bis kurz nicht getippt wird. Der Zähler in der Demo zeigt den Effekt: viele Tastendrücke, wenige Suchen. Das schont Server und Akku, und der Screenreader sagt die Trefferzahl nicht nach jedem Buchstaben an.</p><p>Steht der Filterzustand in der URL, überlebt er Reload, Zurück-Button und Teilen („schau, alle leichten Rundwege in Tirol“).</p>`,`<p>Filters without a visible state are a trap: you come back later, see only three results and assume the rest was deleted. Chips make every active filter visible and removable one by one.</p><p><strong>Debouncing</strong> holds off the search until typing pauses briefly. The counter in the demo shows the effect: many keystrokes, few searches. That spares the server and the battery, and the screen reader doesn’t announce the result count after every letter.</p><p>If the filter state lives in the URL, it survives a reload, the Back button and sharing (“look, all the easy loop trails in Tyrol”).</p>`),
  here:tx(`Die Lektionssuche links filtert sofort, sagt die Trefferzahl über eine Live-Region an und zeigt bei null Treffern einen Empty State mit Ausweg. Die Ansage wartet 450 ms, damit ein Screenreader nicht bei jedem Buchstaben redet.`,`The lesson search on the left filters instantly, announces the result count via a live region and shows an empty state with a way out when nothing matches. The announcement waits 450 ms so a screen reader doesn’t talk on every letter.`)
},
{
  id:'errors-offline',cat:'Feedback',title:tx('Fehler, Offline & Wiederherstellung','Errors, offline & recovery'),
  short:tx('Fehler dort zeigen, wo sie entstehen – und nichts geht verloren.','Show errors where they happen – and lose nothing.'),
  keys:'fehler error fehlermeldung offline netzwerk retry erneut versuchen auto save speichern banner error message network try again recovery autosave',
  refs:['WCAG 3.3.1 · A','WCAG 3.3.3 · AA','WCAG 4.1.3 · AA'],
  rule:tx(`Ein Fehler erscheint dort, wo er entstanden ist, und so laut, wie er ernst ist: im Feld, als Banner über dem Bereich oder als ganze Seite. Jede Meldung sagt, was passiert ist und was man jetzt tun kann – und <strong>nichts, was man schon hatte, geht verloren</strong>.`,`An error appears where it happened, and as loud as it is serious: in the field, as a banner above the section, or as a whole page. Every message says what happened and what you can do now – and <strong>nothing you already had gets lost</strong>.`),
  numbers:tx([['3 Ebenen','Feld · Bereich · ganze Seite'],['was · warum · tun','Aufbau jeder Fehlermeldung'],['0','verlorene Eingaben durch einen Fehler'],['Auto-Save','statt „Ungespeicherte Änderungen!“']],[['3 levels','field · section · whole page'],['what · why · what now','structure of every error message'],['0','inputs lost because of an error'],['Auto-save','instead of “Unsaved changes!”']]),
  demo:`
  <p style="margin:0">${sw('eo-off',tx('Offline simulieren','Simulate offline'))}</p>
  <div class="eo-banner" id="eo-banner" hidden>${ic('wifioff')}<span>${tx('<b>Du bist offline.</b> Änderungen werden auf diesem Gerät gesichert und übertragen, sobald die Verbindung zurück ist.','<b>You’re offline.</b> Changes are saved on this device and sent as soon as the connection is back.')}</span></div>
  <div class="eo-grid">
    <section class="eo-card" aria-labelledby="eo-acc-h">
      <div class="eo-head"><h3 id="eo-acc-h">${tx('Kontostand','Account balance')}</h3><button type="button" class="btn btn-secondary" id="eo-refresh"><span class="spinner" aria-hidden="true"></span>${ic('refresh','btn-ic')}${tx('Aktualisieren','Refresh')}</button></div>
      <p class="eo-balance" id="eo-bal"></p><p class="hint" id="eo-stamp"></p>
      <div class="eo-inline" id="eo-err" hidden>${ic('alert')}<div><p id="eo-err-t"></p><button type="button" class="btn btn-secondary" id="eo-retry">${tx('Erneut versuchen','Try again')}</button></div></div>
    </section>
    <div class="eo-card"><div class="field"><label for="eo-note">${tx('Notiz zum Monat','Note for the month')}</label><textarea class="input eo-ta" id="eo-note" rows="4">${tx('Miete ist abgebucht, Versicherung kommt am 1.','Rent has been paid, insurance is due on the 1st.')}</textarea><p class="eo-save" id="eo-save">${tx('Alle Änderungen gespeichert.','All changes saved.')}</p></div></div>
  </div>
  <p class="demo-note" style="margin:0">${tx('Schalte auf offline, tipp in die Notiz und klick auf „Aktualisieren“. Dann wieder online.','Switch to offline, type in the note and click “Refresh”. Then go back online.')}</p>
  <div>
    <h3>${tx('Die drei Ebenen','The three levels')}</h3>
    <ol class="anatomy">
      <li>${tx('<b>Feld:</b> „Die Postleitzahl hat 4 oder 5 Ziffern.“ – direkt am Eingabefeld, siehe <a href="#forms">Formulare</a>.','<b>Field:</b> “The postal code has 4 or 5 digits.” – right at the input, see <a href="#forms">Forms</a>.')}</li>
      <li>${tx('<b>Bereich:</b> ein Banner über der betroffenen Karte, wie beim Kontostand oben. Der Rest der Seite funktioniert weiter.','<b>Section:</b> a banner above the affected card, like the account balance above. The rest of the page keeps working.')}</li>
      <li>${tx('<b>Seite:</b> nur wenn wirklich nichts geht – mit Grund und Ausweg, siehe die <a href="#gibt-es-nicht">404-Seite</a>.','<b>Page:</b> only when truly nothing works – with a reason and a way out, see the <a href="#gibt-es-nicht">404 page</a>.')}</li>
    </ol>
  </div>`,
  init(root){
    let off=false,pending=false,tm,sv,bal=2418.5,stamp=new Date(Date.now()-12*60000);
    const money=new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}),hm=d=>d.toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'});
    const banner=$('#eo-banner',root),err=$('#eo-err',root),errT=$('#eo-err-t',root),save=$('#eo-save',root),ref=$('#eo-refresh',root);
    const show=()=>{$('#eo-bal',root).textContent=money.format(bal);$('#eo-stamp',root).textContent=tx(`Stand: ${hm(stamp)} Uhr`,`As of ${hm(stamp)}`)};
    show();
    const refresh=()=>{
      if(off){err.hidden=false;errT.innerHTML=tx('<b>Aktualisieren nicht möglich.</b> Keine Internetverbindung. Du siehst den letzten bekannten Stand.','<b>Can’t refresh.</b> No internet connection. You’re seeing the last known balance.');announce(tx('Aktualisieren nicht möglich. Keine Internetverbindung.','Can’t refresh. No internet connection.'));return}
      ref.classList.add('is-loading');ref.setAttribute('aria-busy','true');
      tm=setTimeout(()=>{ref.classList.remove('is-loading');ref.removeAttribute('aria-busy');bal=Math.round((bal+Math.random()*80-30)*100)/100;stamp=new Date();err.hidden=true;show();announce(tx('Kontostand aktualisiert.','Account balance refreshed.'))},800);
    };
    ref.addEventListener('click',refresh);
    $('#eo-retry',root).addEventListener('click',()=>{if(off){errT.innerHTML=tx('<b>Immer noch offline.</b> Sobald die Verbindung zurück ist, aktualisiert sich der Stand von selbst.','<b>Still offline.</b> As soon as the connection is back, the balance refreshes on its own.');announce(tx('Immer noch offline.','Still offline.'))}else refresh()});
    $('#eo-note',root).addEventListener('input',()=>{
      clearTimeout(sv);save.textContent=tx('Speichert …','Saving …');save.className='eo-save';
      sv=setTimeout(()=>{if(off){pending=true;save.textContent=tx('Auf diesem Gerät gesichert – wird übertragen, sobald du online bist.','Saved on this device – it will be sent as soon as you’re online.');save.className='eo-save warn'}else{save.textContent=tx(`Gespeichert um ${new Date().toLocaleTimeString(LOCALE)}.`,`Saved at ${new Date().toLocaleTimeString(LOCALE)}.`);save.className='eo-save ok'}},700);
    });
    $('#eo-off',root).addEventListener('toggle',e=>{
      off=e.detail;banner.hidden=!off;
      if(off){announce(tx('Du bist offline. Änderungen werden auf diesem Gerät gesichert.','You’re offline. Changes are saved on this device.'));return}
      const msg=pending?tx('Wieder online. 1 gesicherte Änderung übertragen.','Back online. 1 saved change sent.'):tx('Wieder online.','Back online.');
      if(pending){pending=false;save.textContent=tx(`Synchronisiert um ${new Date().toLocaleTimeString(LOCALE)}.`,`Synced at ${new Date().toLocaleTimeString(LOCALE)}.`);save.className='eo-save ok'}
      if(!err.hidden)refresh();
      toast({msg,type:'success',duration:3500});
    });
    return()=>{clearTimeout(tm);clearTimeout(sv)};
  },
  do:tx([`Fehlermeldung = was ist passiert + warum (falls bekannt) + was kann ich tun. Fehlercode nur als Zusatz für den Support.`,`Bei Netzwerkfehlern die zuletzt geladenen Daten stehen lassen und mit Zeitstempel kennzeichnen.`,`Automatisch speichern und den Speicherstatus zeigen.`],[`Error message = what happened + why (if known) + what can I do. An error code only as an extra for support.`,`On network errors, keep the last loaded data on screen and label it with a timestamp.`,`Save automatically and show the save status.`]),
  dont:tx([`Ein Fehlercode als einzige Aussage.`,`Nach einem Fehler ist die Eingabe weg.`,`Leere Karte statt der zuletzt geladenen Daten.`],[`An error code as the only message.`,`After an error, the input is gone.`,`An empty card instead of the last loaded data.`]),
  why:tx(`<p>Fehler sind keine Ausnahme, sondern Alltag: Funklöcher, abgelaufene Karten, überlastete Server. Gute Oberflächen planen sie mit ein. Die wichtigste Regel: Nichts, was der Nutzer schon hat, verschwindet wegen eines Fehlers – weder eingegebener Text noch zuletzt geladene Daten.</p><p>Eine gute Fehlermeldung beantwortet drei Fragen: Was ist passiert? Warum? Was kann ich jetzt tun? Fehlercodes dürfen dabeistehen, aber nie als einzige Aussage.</p><p><strong>Auto-Save</strong> ersetzt die Warnung „Ungespeicherte Änderungen!“. Statt Nutzern das Speichern aufzubürden, speichert die App selbst und sagt, dass sie es getan hat.</p>`,`<p>Errors aren’t the exception, they’re everyday life: dead zones, expired cards, overloaded servers. Good interfaces plan for them. The most important rule: nothing the user already has disappears because of an error – neither typed text nor the last loaded data.</p><p>A good error message answers three questions: What happened? Why? What can I do now? Error codes may appear alongside, but never as the only message.</p><p><strong>Auto-save</strong> replaces the “Unsaved changes!” warning. Instead of making users responsible for saving, the app saves by itself and says that it did.</p>`),
  here:tx(`Die App speichert deinen Lernfortschritt im Browser. Klappt das nicht (privates Fenster, gesperrter Speicher), läuft sie trotzdem weiter – jeder Speicherzugriff ist abgesichert, und nichts, was du gerade brauchst, geht verloren.`,`The app saves your progress in the browser. If that doesn’t work (private window, blocked storage), it keeps running anyway – every storage access is guarded, and nothing you need right now gets lost.`)
},
{
  id:'performance',cat:'Qualität',title:tx('Performance als UX: Core Web Vitals','Performance as UX: Core Web Vitals'),
  short:tx('Hauptinhalt schnell da, Reaktion sofort, nichts springt.','Main content fast, instant response, nothing jumps.'),
  keys:'performance geschwindigkeit core web vitals lcp inp cls layout shift ladezeit reaktion speed load time responsiveness page speed',
  refs:['Core Web Vitals','LCP · INP · CLS','web.dev'],
  rule:tx(`Geschwindigkeit ist Teil des Designs. Drei Kennzahlen messen, was Nutzer erleben: Wie schnell ist der Hauptinhalt da (<strong>LCP</strong>), wie schnell reagiert die Seite (<strong>INP</strong>), und springt etwas (<strong>CLS</strong>)?`,`Speed is part of the design. Three metrics measure what users experience: How fast does the main content appear (<strong>LCP</strong>), how fast does the page respond (<strong>INP</strong>), and does anything jump (<strong>CLS</strong>)?`),
  numbers:tx([['LCP ≤ 2,5 s','Hauptinhalt sichtbar'],['INP ≤ 200 ms','Reaktion auf Eingaben'],['CLS ≤ 0,1','unerwartete Layout-Verschiebung'],['75. Perzentil','gemessen an echten Besuchen']],[['LCP ≤ 2.5 s','main content visible'],['INP ≤ 200 ms','response to input'],['CLS ≤ 0.1','unexpected layout shift'],['75th percentile','measured on real visits']]),
  demo:`
  <div class="table-wrap"><table class="sem">
    <caption>${tx('Grenzwerte der Core Web Vitals','Core Web Vitals thresholds')}</caption>
    <thead><tr><th scope="col">${tx('Kennzahl','Metric')}</th><th scope="col">${tx('Misst','Measures')}</th><th scope="col">${tx('Gut','Good')}</th><th scope="col">${tx('Mittel','Needs improvement')}</th><th scope="col">${tx('Schlecht','Poor')}</th></tr></thead>
    <tbody>
      <tr><th scope="row">LCP</th><td>${tx('Wann der größte sichtbare Inhalt da ist','When the largest visible content has appeared')}</td><td>${tx('≤ 2,5 s','≤ 2.5 s')}</td><td>≤ 4 s</td><td>&gt; 4 s</td></tr>
      <tr><th scope="row">INP</th><td>${tx('Wie schnell die Seite auf Klicks und Tippen reagiert','How quickly the page responds to clicks and taps')}</td><td>≤ 200 ms</td><td>≤ 500 ms</td><td>&gt; 500 ms</td></tr>
      <tr><th scope="row">CLS</th><td>${tx('Wie stark das Layout unerwartet springt','How much the layout shifts unexpectedly')}</td><td>${tx('≤ 0,1','≤ 0.1')}</td><td>${tx('≤ 0,25','≤ 0.25')}</td><td>${tx('&gt; 0,25','&gt; 0.25')}</td></tr>
    </tbody>
  </table></div>
  <div>
    <h3>${tx('CLS: Der springende Button','CLS: The jumping button')}</h3>

    <div class="cls-stage" id="cls-stage" style="margin-top:12px"><p class="hint" style="margin:0">${tx('Klick auf „Seite laden“ und dann sofort auf „In den Warenkorb“.','Click “Load page” and then immediately “Add to cart”.')}</p></div>
    <p class="md-state" id="cls-out" aria-live="polite" style="margin:8px 0 0"></p>
  </div>
  <div>
    <h3>${tx('INP: Reagiert der Button sofort?','INP: Does the button respond right away?')}</h3>
    <div class="inp-live"><span class="inp-spin" id="inp-spin" aria-hidden="true"></span><span>${tx('Lebenszeichen der Seite: ','Page heartbeat: ')}<b id="inp-tick">0</b>${tx(' Bilder gezeichnet',' frames drawn')}</span></div>
    <div class="btn-row" style="margin-top:12px"><button type="button" class="btn btn-secondary" id="inp-bad">${tx('Filtern (blockiert 600 ms)','Filter (blocks for 600 ms)')}</button><button type="button" class="btn btn-secondary" id="inp-good"><span class="spinner" aria-hidden="true"></span>${tx('Filtern mit Sofort-Feedback','Filter with instant feedback')}</button></div>
    <p class="md-state" id="inp-out" aria-live="polite" style="margin:8px 0 0"></p>
  </div>`,
  init(root){
    let reserve=false,tl,raf,n=0;
    $('#cls-res',root).addEventListener('toggle',e=>{reserve=e.detail});
    const stage=$('#cls-stage',root),out=$('#cls-out',root);
    $('#cls-load',root).addEventListener('click',()=>{
      clearTimeout(tl);
      stage.innerHTML=`<p class="cls-prod"><b>${tx('Wanderschuh „Grat“','Hiking boot “Grat”')}</b> · ${tx('€ 149,00','€149.00')}</p><div class="cls-slot${reserve?' reserved':''}" id="cls-slot"></div><div class="btn-row"><button type="button" class="btn btn-primary" id="cls-buy">${tx('In den Warenkorb','Add to cart')}</button></div>`;
      out.textContent=tx('Klick jetzt schnell auf „In den Warenkorb“ …','Quick, click “Add to cart” now …');
