<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Daumenregel</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --anno:#A3135F; --anno-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --ph-bad:#A3A3A3;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#1F5FAD; --brand-ink-l:#FFFFFF; --brand-soft-l:#E6EEF8;
  --brand-d:#86B6F2; --brand-ink-d:#0A1A2F; --brand-soft-d:#16263A;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
:root[data-brand="glut"]{
  --brand-l:#B8421A; --brand-ink-l:#FFFFFF; --brand-soft-l:#FBEAE3;
  --brand-d:#FF9E72; --brand-ink-d:#2B0E03; --brand-soft-d:#3A1D12;
  --radius-ctl:999px; --radius-sm:14px; --radius-lg:22px; --radius-mark:50%;
  --font-display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;
}
:root[data-brand="moos"]{
  --brand-l:#2E6B3F; --brand-ink-l:#FFFFFF; --brand-soft-l:#E5F0E8;
  --brand-d:#8FD19E; --brand-ink-d:#0B2412; --brand-soft-d:#16301E;
  --radius-ctl:3px; --radius-sm:2px; --radius-lg:4px; --radius-mark:2px;
  --font-display:"Literata", Georgia, "Times New Roman", serif; --display-wt:700;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --anno:#FF7AB8; --anno-ink:#2A0717;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --ph-bad:#555B64;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --anno:#FF7AB8; --anno-ink:#2A0717;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --ph-bad:#555B64;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Switch */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;background:transparent;border:0;border-radius:var(--radius-ctl);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.switch:hover{background:var(--surface-2)}
.track{width:42px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color .15s;flex:none}
.thumb{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch[aria-checked="true"] .track{background:var(--brand)}
.switch[aria-checked="true"] .thumb{transform:translateX(16px);background:var(--brand-ink)}

/* Segmented control */
.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-weight:700;padding:0;margin-bottom:8px}
.seg-opts{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface)}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:.9375rem}
.seg label:hover{background:var(--surface-2)}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.progress{display:grid;gap:6px;position:relative}
.progress-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>span{display:block;height:100%;width:var(--p,0%);background:var(--brand);transition:width .3s}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.lessons-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;position:relative}
.refs li{font:600 .75rem/1.2 var(--font-mono);padding:5px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--muted);background:var(--surface)}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:0;position:relative}
@container (min-width:620px){.numbers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.num{background:var(--surface);padding:14px 16px}
.num dt{font:600 1.0625rem/1.3 var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num dd{margin:5px 0 0;font-size:.875rem;color:var(--muted);line-height:1.4}
.demo{margin-top:40px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);position:relative}
.demo-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.lesson .demo-head h2{margin:0;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase}
.demo-head span{font-size:.875rem;color:var(--muted)}
.demo-body{padding:20px 18px 22px;display:grid;gap:28px;min-width:0}
.demo-body h3{font:700 1rem/1.3 var(--font-body);margin:0 0 10px}
.demo-note{font-size:.875rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:40px;position:relative}
.dd{border-top:4px solid var(--success);padding-top:12px}
.dd.dont{border-top-color:var(--danger)}
.lesson .dd h2{display:flex;align-items:center;gap:8px;font:700 1rem/1.3 var(--font-body);margin:0 0 10px;color:var(--success)}
.lesson .dd.dont h2{color:var(--danger)}
.dd ul{margin:0;padding-left:1.15em;display:grid;gap:8px}
.prose p{margin:0 0 12px;max-width:68ch}
.here{margin-top:40px;padding:16px 18px 18px;background:var(--brand-soft);border-radius:var(--radius-lg);position:relative}
.lesson .here h2{margin:0 0 6px;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.here p{margin:0;max-width:68ch}
.learned{margin-top:32px;display:flex;align-items:center;gap:12px;padding:10px 16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);position:relative;min-height:56px}
.learned input{width:24px;height:24px;accent-color:var(--brand);margin:0;flex:none}
.learned label{font-weight:700;cursor:pointer;flex:1}
.learned .hint{display:block;font-weight:400}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Tags used in comparisons */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;margin:0 0 8px}
.tag .ic{width:18px;height:18px}
.tag-good{color:var(--success)}
.tag-bad{color:var(--danger)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.compare figure{margin:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);min-width:0}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.anatomy{margin:0;padding-left:1.4em;display:grid;gap:6px}
.anatomy li::marker{font-family:var(--font-mono);color:var(--muted)}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chapters a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-weight:700}
.chapters a:hover{color:var(--brand)}
.chapters span{font-weight:400;color:var(--muted);font-family:var(--font-mono);font-size:.875rem;white-space:nowrap}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* Annotation mode ("Bauteile zeigen") */
.anno [data-anno]{outline:2px dashed var(--anno);outline-offset:-2px}
.anno [data-anno]::after{content:attr(data-anno);position:absolute;top:0;right:0;z-index:30;font:600 11px/1.3 var(--font-mono);letter-spacing:0;text-transform:none;background:var(--anno);color:var(--anno-ink);padding:2px 6px;border-radius:0 0 0 4px;pointer-events:none;white-space:nowrap;text-align:left}
.anno .item[data-anno]::after{top:auto;bottom:0;border-radius:4px 0 0 0}

/* Demo: touch targets */
.tt-sizes{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end}
.tt-size{margin:0;display:grid;justify-items:center;gap:10px;text-align:center;font-size:.8125rem;color:var(--muted);min-width:76px;line-height:1.35}
.tt-size b{display:block;color:var(--ink);font-family:var(--font-mono)}
.tt-btn{width:var(--s);height:var(--s);padding:0;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);border:0;border-radius:min(var(--radius-sm),50%);cursor:pointer;position:relative}
.tt-btn .ic{width:min(20px,calc(var(--s) - 6px));height:min(20px,calc(var(--s) - 6px))}
.tt-ext{background:transparent;color:var(--brand)}
.tt-ext::after{content:"";position:absolute;inset:-12px;border-radius:var(--radius-sm)}
.show-hit .tt-btn{outline:2px dashed var(--anno);outline-offset:0}
.show-hit .tt-ext{outline:none}
.show-hit .tt-ext::after{outline:2px dashed var(--anno)}
.tt-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tt-zone-wrap p{margin:0}
.tt-zone{position:relative;height:170px;margin-top:8px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--bg);cursor:crosshair;overflow:hidden}
.tt-target{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:var(--brand);border:0;padding:0;cursor:pointer}
.tt-score{font:600 .875rem/1.4 var(--font-mono);margin-top:8px!important;font-variant-numeric:tabular-nums}

/* Demo: buttons */
.mini-dlg{padding:14px;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow)}
.mini-q{font-weight:700;margin:0 0 12px}

/* Demo: forms */
.form-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px;align-items:start}
.form{display:grid;gap:18px}
.err-summary{border:2px solid var(--danger);border-radius:var(--radius-lg);padding:14px 16px;background:var(--danger-bg)}
.err-summary h3{color:var(--danger);display:flex;gap:8px;align-items:center}
.err-summary ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.err-summary a{color:var(--danger);font-weight:700}
.pw-row{display:flex;gap:8px}
.pw-row .btn{flex:none}
.pw-meter{font:600 .8125rem/1.3 var(--font-mono);color:var(--muted);margin:0}
.pw-meter.ok{color:var(--success)}
.bad-field{padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.bad-field .input::placeholder{color:var(--ph-bad)}

/* Demo: toast list */
.files{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.file{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.file:last-child{border-bottom:0}
.file span{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:.875rem}
.file>.ic{color:var(--muted)}
.file-empty{padding:18px 16px;display:grid;justify-items:start;gap:8px}
.file-empty p{margin:0}

/* Demo: loading */
.ld-out{min-height:190px;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;background:var(--bg);display:grid;align-content:start;gap:10px}
.ld-row{display:flex;gap:12px;align-items:center;padding:8px 10px;background:var(--surface);border-radius:var(--radius-sm)}
.ld-row .ld-ic{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ld-row p{margin:0;line-height:1.35}
.ld-row small{color:var(--muted);font-family:var(--font-mono);font-size:.8125rem}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skel-lines{flex:1;display:grid;gap:8px}
.ld-prog{display:grid;gap:10px;padding:8px 4px}
.ld-prog-row{display:flex;justify-content:space-between;font:600 .875rem/1.3 var(--font-mono);font-variant-numeric:tabular-nums}
.ld-prog .btn{justify-self:start}
.ld-why{margin:0;padding:12px 14px;border-radius:var(--radius-sm);background:var(--brand-soft);font-size:.9375rem}
.ld-why:empty{display:none}

/* Demo: empty states */
.es-stage{min-height:230px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);display:grid;place-items:center;padding:24px 18px;text-align:center}
.es{display:grid;justify-items:center;gap:8px;max-width:34ch}
.es>.ic{width:44px;height:44px;color:var(--muted);stroke-width:1.6}
.es.error>.ic{color:var(--danger)}
.es.done>.ic{color:var(--success)}
.es h3{margin:0!important;font-size:1.0625rem!important}
.es p{margin:0 0 6px;color:var(--muted);font-size:.9375rem}
.es-bad{color:var(--muted);margin:0}
.es-list{list-style:none;margin:0;padding:0;width:100%;max-width:340px;display:grid;gap:6px;text-align:left}
.es-list li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--line)}
.es-filled{display:grid;gap:12px;justify-items:center;width:100%}
.es-controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end}

/* Demo: dialog */
.proj{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.proj-ic{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.proj-text{flex:1 1 160px;min-width:0}
.proj-name{margin:0;font-weight:700}
dialog{border:0;padding:0;border-radius:var(--radius-lg);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(460px,calc(100% - 32px))}
dialog::backdrop{background:rgb(8 12 18 / .6)}
.dlg-in{padding:22px 22px 20px;display:grid;gap:10px}
.dlg-in h3{margin:0;font:var(--display-wt) 1.3rem/1.25 var(--font-display)}
.dlg-in p{margin:0 0 8px;color:var(--muted)}
.dlg-actions{justify-content:flex-end}
.tips{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.9375rem}

/* Demo: deep linking */
.dl-url{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.dl-url code{font-size:1rem;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.dl-links{margin:0;padding-left:1.2em;display:grid;gap:6px}
.dl-hist{margin:0;padding-left:1.6em;display:grid;gap:4px;font-size:.9375rem}
.dl-hist li::marker{font-family:var(--font-mono);color:var(--muted)}

/* Demo: master-detail (container queries) */
.md-ctl{display:grid;gap:6px;max-width:420px}
.md-ctl label{font-weight:700}
input[type="range"]{width:100%;accent-color:var(--brand);min-height:32px}
.md-frame{width:min(100%,var(--w));container-type:inline-size;border:1.5px solid var(--line-strong);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface)}
.md{display:grid;grid-template-columns:minmax(0,1fr);min-height:280px}
.md-list{list-style:none;margin:0;padding:6px;border-right:1px solid var(--line);background:var(--bg)}
.md-item{display:grid;gap:1px;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--radius-sm);padding:9px 10px;font:inherit;color:inherit;cursor:pointer;position:relative;min-height:44px}
.md-item:hover{background:var(--surface-2)}
.md-item[aria-current="true"]{background:var(--brand-soft)}
.md-item[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.md-item b{font-size:.9375rem}
.md-item span{font-size:.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-detail{padding:14px 16px;min-width:0}
.md-detail h3{margin:0 0 4px!important}
.md-detail p{margin:0 0 10px}
.md-back{display:inline-flex;align-items:center;gap:2px;margin:0 0 8px -8px;min-height:44px;padding:0 10px 0 4px;border:0;background:transparent;color:var(--brand);font:inherit;font-weight:700;cursor:pointer;border-radius:var(--radius-sm)}
.md[data-view="list"] .md-detail{display:none}
.md[data-view="detail"] .md-list{display:none}
.md-list{border-right:0}
@container (min-width:520px){
  .md{grid-template-columns:200px minmax(0,1fr)}
  .md[data-view] .md-list{display:block;border-right:1px solid var(--line)}
  .md[data-view] .md-detail{display:block}
  .md-back{display:none}
}
.md-state{margin:0;font:600 .875rem/1.4 var(--font-mono)}

/* Demo: navigation */
.phones{display:flex;flex-wrap:wrap;gap:24px}
.phone{margin:0;width:230px;max-width:100%;display:grid;gap:10px}
.phone-frame{border:2px solid var(--line-strong);border-radius:26px;overflow:hidden;background:var(--bg);height:320px;display:grid;grid-template-rows:minmax(0,1fr) auto}
.phone-screen{padding:22px 16px}
.phone-title{margin:0 0 4px;font:var(--display-wt) 1.2rem/1.2 var(--font-display)}
.phone-screen p{margin:0;font-size:.875rem;color:var(--muted)}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px 10px}
.tab{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 2px;min-height:52px;background:transparent;border:0;color:var(--muted);font:inherit;font-size:.6875rem;font-weight:700;cursor:pointer;border-radius:10px;position:relative}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .ic{background:var(--brand-soft);border-radius:999px;width:44px;padding:2px 11px;box-sizing:content-box;margin:0 -11px}
.tab .ic{width:22px;height:22px}
.tab .nbadge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--danger-ink);font-size:.6875rem;line-height:18px;padding:0 5px}
.tabbar.bad{padding:6px 2px 10px}
.tabbar.bad .tab{min-height:30px;padding:4px 0}
.tabbar.bad .ic{width:16px;height:16px}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs li{display:flex;align-items:center;gap:4px}
.crumbs li+li::before{content:"›";color:var(--muted);padding:0 4px}
.crumbs [aria-current]{font-weight:700}

/* Demo: contrast */
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;align-items:start}
.ct-inputs{display:grid;gap:14px}
.ct-pick{display:flex;align-items:center;gap:10px}
.ct-pick input[type="color"]{width:52px;height:44px;padding:2px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}
.ct-pick output{font-family:var(--font-mono)}
.ct-presets{display:flex;flex-wrap:wrap;gap:6px}
.ct-presets .btn{min-height:40px;padding:0 12px;font-size:.875rem}
.ct-preview{border-radius:var(--radius-lg);padding:18px;display:grid;gap:10px;border:1px solid var(--line)}
.ct-preview p{margin:0}
.ct-normal{font-size:1rem}
.ct-large{font-size:1.5rem;line-height:1.2}
.ct-ui{display:inline-block;justify-self:start;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius-sm);font-size:.875rem}
.ct-ratio{margin:0;font:600 2.25rem/1 var(--font-mono);font-variant-numeric:tabular-nums}
.ct-results{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ct-results li{display:flex;gap:8px;align-items:center;font-size:.9375rem}
.pass{color:var(--success);font-weight:700}
.fail{color:var(--danger);font-weight:700}

/* Demo: focus */
.fd{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.fd-col{padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.nofocus button:focus,.nofocus button:focus-visible{outline:none}
.fake-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);background:var(--surface-2);border:1.5px dashed var(--line-strong);font-weight:700;cursor:pointer;user-select:none}
.kb-table{width:100%;border-collapse:collapse;font-size:.9375rem}
.kb-table th,.kb-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kb-table th{font-weight:700;white-space:nowrap}

/* Demo: color alone */
.gray{filter:grayscale(1)}
.ca-field .input{border-color:#D93025;border-width:2px}
.status-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.status-list li{display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot-g{background:#2DA44E}
.dot-r{background:#D93025}
.dot-hollow{background:transparent;box-shadow:inset 0 0 0 2.5px #D93025}
.pl{display:flex;gap:16px;margin-top:12px;font:600 1rem/1.3 var(--font-mono)}
.up{color:#1E8E3E}.down{color:#D93025}
.nolink{color:var(--brand);text-decoration:none}
.ca figure p{margin:12px 0 0}

/* Demo: semantics */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
.sem{width:100%;border-collapse:collapse;font-size:.875rem;min-width:560px}
.sem caption{text-align:left;padding:12px 14px 4px;font-weight:700}
.sem th,.sem td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.sem thead th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sem code{white-space:pre-wrap}
.sm-out{display:grid;gap:4px}
.sm-out ul{list-style:none;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);display:grid;gap:4px}
.sm-out li{padding-left:calc((var(--lvl,1) - 1) * 18px);font-size:.9375rem}
.lvl{display:inline-block;min-width:2.4em;font:600 .75rem/1.2 var(--font-mono);color:var(--brand)}

/* Demo: motion */
.mo-track{position:relative;height:56px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.mo-dot{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:50%;background:var(--brand)}
.mo-controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end}

/* Demo: typography */
.ty-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 20px}
.ty-controls label{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.ty-controls output{font-family:var(--font-mono);font-weight:600}
.ty-sample{margin:0;border-left:3px solid var(--line-strong);padding-left:16px}
.ty-sample.wcag-spacing{line-height:1.5!important;letter-spacing:.12em;word-spacing:.16em}
.ty-sample.wcag-spacing p{margin-bottom:2em}
.ty-sample p{margin:0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:.9375rem}
.checks .ic{margin-top:2px}

/* Demo: responsive */
.rs-frame{width:min(100%,var(--w));border:1.5px solid var(--line-strong);border-radius:var(--radius-lg);padding:12px;background:var(--bg)}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rs-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;font-size:.875rem}
.rs-card b{display:block}
.thumb-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.thumb-phone{width:150px;height:260px;border:2px solid var(--line-strong);border-radius:24px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr 1.2fr;flex:none}
.tz{display:grid;place-items:center;font-weight:700;font-size:.8125rem}
.tz-hard{background:repeating-linear-gradient(45deg,var(--danger-bg) 0 6px,var(--surface) 6px 12px);color:var(--danger)}
.tz-ok{background:var(--warn-bg);color:var(--warn)}
.tz-easy{background:var(--success-bg);color:var(--success)}

/* Demo: white-label */
.wl-controls{display:flex;flex-wrap:wrap;gap:16px 28px}
.wl-preview{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.wl-head{display:flex;align-items:center;gap:10px}
.wl-head b{font:var(--display-wt) 1.2rem/1.2 var(--font-display)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-ctl);background:var(--brand-soft);color:var(--brand);font-size:.8125rem;font-weight:700}
.tokens{width:100%;border-collapse:collapse;font-size:.875rem;min-width:420px}
.tokens th,.tokens td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tokens thead th{border-top:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tokens td:first-child,.tokens td:nth-child(2){font-family:var(--font-mono)}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid var(--line-strong);vertical-align:-4px;margin-right:6px}
.tiers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tiers li{padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:.875rem}
.tiers b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tiers code{font-size:.8125rem}
.wl-check{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Richtig / Falsch */
.dd.do{margin-top:40px}
.bads{margin-top:32px;border-top:4px solid var(--danger);padding-top:12px;position:relative}
.lesson .bads h2{display:flex;align-items:center;gap:8px;font:700 1rem/1.3 var(--font-body);margin:0 0 12px;color:var(--danger)}
.bad-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bad-card{margin:0;border:1.5px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;display:grid;grid-template-rows:1fr auto;min-width:0}
.bad-card.wide{grid-column:1/-1}
.bad-show{padding:14px;background:var(--bg);display:grid;align-content:center;gap:8px;min-height:96px;min-width:0;border-bottom:1px solid var(--line)}
.bad-cap{padding:10px 14px 12px;font-size:.9rem;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.bad-cap .ic{color:var(--danger);width:18px;height:18px;margin-top:2px}
.bd-note{margin:0;font-size:.8125rem;color:var(--muted);line-height:1.4}
.bd-sm{min-height:30px;padding:0 10px;font-size:.8125rem}
.bd-l{font-size:.8125rem;font-weight:700}
.bd-mono{font-family:var(--font-mono)}
.bd-tiny{width:16px;height:16px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.bd-tiny .ic{width:16px;height:16px}
.bd-links{font-size:11px;margin:0;line-height:1.2}
.bd-links a,.bd-fakelink{color:var(--brand);text-decoration:underline}
.bd-ph::placeholder{color:var(--ph-bad)}
.bd-stack{display:grid;gap:4px}
.bd-toast{background:var(--toast-bg);color:var(--toast-ink);font-size:.75rem;padding:6px 10px;border-radius:6px}
.bd-toast-lg{position:relative;font-size:.875rem;padding:10px 12px 12px;overflow:hidden}
.bd-timer{position:absolute;left:0;bottom:0;height:3px;width:30%;background:var(--toast-action)}
.bd-app{position:relative;height:110px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;display:grid;gap:6px;align-content:start;overflow:hidden}
.bd-app-bar{height:14px;border-radius:4px;background:var(--surface-2)}
.bd-app-row{height:24px;border-radius:4px;background:var(--surface-2)}
.bd-block{position:absolute;inset:0;background:rgb(8 12 18 / .65);display:grid;place-items:center}
.bd-flash{min-height:24px;display:flex;align-items:center;gap:8px;font-size:.875rem}
.bd-center{display:grid;justify-items:center;gap:6px;padding:10px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface)}
.bd-tab{width:100%;border-collapse:collapse;font-size:.8125rem;background:var(--surface)}
.bd-tab th{text-align:left;padding:6px;background:var(--surface-2)}
.bd-tab td{padding:4px 6px;border-top:1px solid var(--line)}
.bd-modal{background:rgb(8 12 18 / .55);padding:14px;border-radius:8px}
.bd-x{position:absolute;top:4px;right:6px;font-size:10px;line-height:1;color:var(--muted)}
.bd-url{font:600 .8125rem/1.3 var(--font-mono);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow-wrap:anywhere}
.bd-hist{margin:0;padding-left:1.4em;font-size:.75rem;display:grid;gap:2px}
.bd-phone{width:150px;border:2px solid var(--line-strong);border-radius:18px;padding:10px 8px;background:var(--surface);justify-self:center}
.bd-split{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:.6875rem}
.bd-split p{margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-split>div:first-child{border-right:1px solid var(--line);padding-right:4px;min-width:0}
.bd-split>div{min-width:0}
.bd-list{list-style:none;margin:0;padding:0;font-size:.8125rem;display:grid;gap:3px}
.bd-list li{padding:5px 8px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.bd-here{outline:2px solid var(--danger);outline-offset:-2px}
.bd-was{color:var(--muted)}
.bd-foot{opacity:.4;font-size:.75rem}
.bd-ph-head{display:flex;gap:8px;align-items:center;font-size:.875rem;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bd-nav{display:flex;gap:4px}
.bd-nav span{flex:1;text-align:center;padding:6px 2px;background:var(--surface);border:1px solid var(--line);border-radius:4px;font-size:.75rem}
.bd-white{background:#FFFFFF;color:#15191F;padding:12px;border-radius:6px}
.bd-photo{height:90px;border-radius:8px;background:linear-gradient(180deg,#cfe6fb 0%,#e8f3fd 55%,#9cc7a0 56%,#6ea676 100%);padding:10px}
.bd-photo p{margin:0;color:#fff;font-weight:700}
.bd-tabs{display:grid;gap:4px}
.bd-tabs span{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;font-size:.8125rem}
.bd-tabs i{font:600 .75rem/1 var(--font-mono);width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--danger-ink);display:grid;place-items:center;flex:none}
.bd-chart{width:100%;height:80px;background:var(--surface);border-radius:6px}
.bd-fake-in{display:block;height:30px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.bd-big{font:var(--display-wt) 1.6rem/1.1 var(--font-display)}
.bd-code{margin:0;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font:400 .75rem/1.45 var(--font-mono);overflow-x:auto;white-space:pre}
.bd-code code{background:none;padding:0;font-size:inherit}
.bd-zoom{height:80px;border-radius:8px;overflow:hidden;position:relative;display:grid;place-items:center;background:var(--surface)}
.bd-zoom::before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(45deg,var(--brand-soft) 0 14px,var(--surface-2) 14px 28px)}
.bd-zoom span{position:relative;font-weight:700}
.bd-zoom.run::before{animation:bd-zoom 1s ease-in-out infinite alternate}
@keyframes bd-zoom{from{transform:scale(1) rotate(0)}to{transform:scale(1.35) rotate(6deg)}}
.bd-slow{max-height:0;overflow:hidden;transition:max-height 2.5s ease-in-out;font-size:.875rem}
.bd-slow.open{max-height:60px}
.bd-blink{background:var(--danger);color:var(--danger-ink);padding:2px 6px;border-radius:4px;font-weight:700;animation:bd-blink 1s steps(2,start) infinite}
@keyframes bd-blink{to{visibility:hidden}}
.bd-wide{margin:0;font-size:.8125rem;line-height:1.35}
.bd-clip{height:44px;overflow:hidden;font-size:1.05rem;line-height:1.35;background:var(--surface);padding:0 6px;border-radius:4px}
.bd-2{display:flex;gap:8px;align-items:flex-start}
.bd-frame{display:grid;gap:2px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:.75rem;flex:1}
.bd-small{flex:0 0 70px}
.bd-mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800}
.bd-rag p{margin-top:0;margin-bottom:5px;font-size:.8125rem;padding:4px 6px;background:var(--surface);border-radius:3px}
.bd-fields{display:grid}
.bd-menu{display:flex;flex-wrap:wrap;gap:3px}
.bd-menu span{font-size:.6875rem;padding:3px 6px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.bd-cart{justify-self:start;display:flex;align-items:center;gap:4px;font-size:.75rem;margin-top:24px}
.bd-i{font-size:.75rem;color:var(--muted)}
.bd-layers{position:relative;height:104px}
.bd-layers div{position:absolute;width:60%;padding:6px 8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;font-size:.75rem;box-shadow:var(--shadow)}
.bd-layers div:nth-child(2){top:20px;left:12%}
.bd-layers div:nth-child(3){top:40px;left:24%}
.bd-layers div:nth-child(4){top:60px;left:36%}
.bd-tour{height:120px;border-radius:8px;background:rgb(8 12 18 / .6);display:grid;place-items:center;padding:8px}
.bd-tour-bubble{background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:.75rem}
.bd-skip{font-size:.6875rem;color:var(--muted);opacity:.6}
.bd-many{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bd-many span{height:12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--surface)}
.bd-fixed{width:96px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 10px;line-height:41px}
.bd-rtl{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-left:4px solid var(--brand);background:var(--surface);border-radius:4px;font-size:.875rem}
.bd-shame{margin:8px 0 0;font-size:.75rem;text-decoration:underline;color:var(--muted)}

/* Demo: spacing & gestalt */
.sp-card{--in:4px;--out:20px;--sec:36px;width:100%;max-width:360px;padding:20px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.sp-card.even{--in:16px;--out:16px;--sec:16px}
.sp-h{margin:var(--sec) 0 0;font-weight:700;font-size:1.0625rem}
.sp-h:first-child{margin-top:0}
.sp-f{display:grid;gap:var(--in);margin-top:var(--out);border-radius:6px}
.sp-l{font-size:.875rem;font-weight:700}
.sp-i{display:block;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface)}
.sp-card.show .sp-f{outline:2px dashed var(--anno);outline-offset:4px}
.gestalt{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.gestalt figure{margin:0;display:grid;gap:12px;align-content:start}
.gestalt figcaption{font-size:.875rem;color:var(--muted);line-height:1.4}
.gestalt figcaption b{display:block;color:var(--ink)}
.g-dots{display:flex;align-items:center;min-height:64px;padding-left:8px}
.gd{width:12px;height:12px;border-radius:50%;background:var(--ink);display:block;flex:none}
.gd.sq{border-radius:2px;background:var(--brand)}
.g-near{gap:22px}
.g-grp{display:grid;grid-template-columns:repeat(2,12px);gap:6px}
.g-sim{display:grid;grid-template-columns:repeat(6,12px);gap:10px;align-content:center}
.g-region{gap:10px}
.g-box{display:flex;gap:10px;outline:2px solid var(--line-strong);outline-offset:6px;border-radius:8px}

/* Demo: UX laws */
.hk-task{margin:12px 0 0}
.hk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;margin-top:10px}
.hk-grid .btn{padding:0 8px;font-weight:400;font-size:.9rem;min-height:40px}
.sem.small{min-width:0}

/* Demo: overlays */
.tip-wrap{position:relative;display:inline-flex}
.ov-tipbtn{border:1.5px solid var(--line-strong)}
.tooltip{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--toast-bg);color:var(--toast-ink);font-size:.8125rem;line-height:1.3;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:5;box-shadow:var(--shadow)}
.popover{position:fixed;inset:auto;margin:0;width:250px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.popover fieldset{border:0;padding:0;margin:0 0 8px}
.popover legend{font-weight:700;padding:0}
dialog.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(360px,88vw);max-width:88vw;border-radius:var(--radius-lg) 0 0 var(--radius-lg);animation:drawer-in .25s cubic-bezier(.2,.8,.2,1)}
dialog.sheet{margin:auto auto 0;width:min(560px,100%);max-width:100%;border-radius:var(--radius-lg) var(--radius-lg) 0 0;animation:sheet-in .25s cubic-bezier(.2,.8,.2,1);transition:transform .2s}
.drawer-in{padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:grid;gap:12px;justify-items:start}
.drawer-head{display:flex;justify-content:space-between;align-items:center;width:100%}
.demo-body dialog h3{margin:0;font:var(--display-wt) 1.25rem/1.25 var(--font-display)}
.sheet-in{padding:4px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheet-drag{display:grid;place-items:center;height:30px;cursor:grab;touch-action:none}
.sheet-drag span{width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-actions{display:grid;gap:6px}
.sheet-actions .btn{justify-content:flex-start}
@keyframes drawer-in{from{transform:translateX(100%)}}
@keyframes sheet-in{from{transform:translateY(100%)}}

/* Demo: gestures */
.sw-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.sw-item{position:relative;border-bottom:1px solid var(--line);background:var(--danger-bg)}
.sw-item:last-child{border-bottom:0}
.sw-actions{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding-right:8px}
.sw-actions .btn{min-height:40px}
.sw-row{position:relative;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;background:var(--surface);min-height:52px;touch-action:pan-y;transition:transform .2s cubic-bezier(.2,.8,.2,1);cursor:grab;user-select:none}
.sw-row span{flex:1}
.sw-item.open .sw-row{transform:translateX(-112px)}
.dr-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dr-item{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.dr-item.dragging{box-shadow:var(--shadow);border-color:var(--brand);position:relative;z-index:2}
.dr-grip{display:grid;place-items:center;width:44px;height:44px;cursor:grab;touch-action:none;color:var(--muted);flex:none}
.dr-pos{font:600 .8125rem/1 var(--font-mono);color:var(--muted);width:1.4em}
.dr-name{flex:1;font-weight:700}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

/* Demo: onboarding */
.wz{padding:16px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.steps{list-style:none;margin:0 0 18px;padding:0;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.steps li{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.steps li+li::before{content:"";width:22px;height:2px;background:var(--line-strong)}
.step-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);font:600 .8125rem/1 var(--font-mono)}
.step-n .ic{width:16px;height:16px;stroke-width:2.6}
.steps li[aria-current]{color:var(--ink)}
.steps li[aria-current] .step-n{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.steps li.done .step-n{border-color:var(--brand);color:var(--brand)}
#wz-body{display:grid;gap:14px;max-width:420px}
.wz-bill{display:grid;gap:14px}
.wz-nav{margin-top:18px}
.wz-sum{margin:0}
.wz-sum>div{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;padding:6px 0;border-bottom:1px solid var(--line)}
.wz-sum dt{font-weight:700;flex:0 0 9rem}
.wz-sum dd{margin:0;flex:1 1 140px}
.wz-sum dd:last-child{flex:0 0 auto}
.pd-box{display:grid;gap:12px;max-width:420px}
.acc{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.acc summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:700;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:14px;transition:transform .15s}
.acc[open] summary::before{transform:rotate(45deg)}
.acc-body{padding:0 14px 14px;display:grid;gap:4px}

/* Demo: tables */
.tb-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface)}
.dt{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
.dt th,.dt td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.dt thead th{position:sticky;top:0;background:var(--surface-2);z-index:1}
.dt th.num,.dt td.num{text-align:right}
.dt .num,.dt .num-l{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.dt.bad-align td.num{text-align:left}
.dt.bad-align .num,.dt.bad-align .num-l{font-family:var(--font-body);font-size:.9rem;font-variant-numeric:proportional-nums}
.dt tr.sel td{background:var(--brand-soft)}
.tb-check{width:44px}
.tb-check input{width:20px;height:20px;accent-color:var(--brand);margin:0;vertical-align:middle}
.sort{background:none;border:0;font:inherit;font-weight:700;color:inherit;display:inline-flex;align-items:center;gap:4px;padding:6px 4px;margin:-6px -4px;cursor:pointer;min-height:36px}
.sort-ic{display:inline-grid}
.sort-ic .ic{width:16px;height:16px}
.st{display:inline-flex;gap:5px;align-items:center;font-weight:700;font-size:.8125rem}
.st .ic{width:16px;height:16px}
.st-ok{color:var(--success)}.st-open{color:var(--muted)}.st-late{color:var(--danger)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;margin-bottom:8px;border-radius:var(--radius-lg);background:var(--brand-soft)}
.bulk #tb-count{font-weight:700;margin-right:auto}

/* Demo: search & filter */
.sf{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;align-items:start}
.sf-filters{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg)}
.sf-fs{border:0;padding:0;margin:0}
.sf-fs legend{font-weight:700;padding:0;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 6px 0 12px;border-radius:var(--radius-ctl);border:1.5px solid var(--brand);background:var(--brand-soft);color:var(--ink);font:inherit;font-size:.875rem;font-weight:700;cursor:pointer}
.fchip .ic{width:16px;height:16px}
.sf-count{margin:8px 0;font-weight:700}
.sf-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sf-list li{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.sf-list span{font-size:.875rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer}

/* Demo: errors & offline */
.eo-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-lg);background:var(--warn-bg);border:1.5px solid var(--warn)}
.eo-banner .ic{color:var(--warn);margin-top:2px}
.eo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.eo-card{padding:16px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);display:grid;gap:8px;align-content:start}
.eo-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.eo-head h3{margin:0!important}
.eo-balance{margin:0;font:600 1.75rem/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.eo-card .hint{margin:0}
.eo-inline{display:flex;gap:10px;padding:12px;border-radius:var(--radius-sm);background:var(--danger-bg);border:1.5px solid var(--danger)}
.eo-inline>.ic{color:var(--danger);margin-top:2px}
.eo-inline p{margin:0 0 8px}
.eo-ta{min-height:110px;padding:10px 14px;resize:vertical;line-height:1.5;border-radius:var(--radius-sm)}
.eo-save{margin:0;font-size:.875rem;color:var(--muted)}
.eo-save.ok{color:var(--success)}
.eo-save.warn{color:var(--warn)}
.is-loading .btn-ic{display:none}

/* Demo: performance */
.cls-stage{padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);min-height:120px}
.cls-prod{margin:0 0 10px}
.cls-slot.reserved{min-height:92px;border-radius:var(--radius-sm);background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,transparent 8px 16px)}
.cls-ad{display:grid;gap:6px;justify-items:start;padding-bottom:10px}
.inp-live{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);font-variant-numeric:tabular-nums}
.inp-spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);flex:none}
#inp-tick{font-family:var(--font-mono)}
.flash{background:var(--brand-soft)!important}

/* Demo: i18n */
.i18n-out{margin:0;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.i18n-out>div{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.i18n-out>div:first-child{border-top:0}
.i18n-out dt{font-weight:700}
.i18n-out dd{margin:0}
.i18n-v{font-size:1.0625rem}
.i18n-c{grid-column:2}
.i18n-c code{font-size:.75rem;color:var(--muted)}
.i18n-card{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px;padding-inline-start:18px;border:1px solid var(--line);border-inline-start:4px solid var(--brand);border-radius:var(--radius-sm);background:var(--bg)}
.i18n-av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.i18n-tx{flex:1 1 180px;display:grid}
.i18n-tx span{color:var(--muted);font-size:.9375rem}
.i18n-reply{margin-inline-start:auto}
[dir="rtl"] .dir-ic{transform:scaleX(-1)}
.xp{display:grid;grid-template-columns:repeat(2,max-content);gap:8px 12px;align-items:center}
.xp-h{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xp.fixed .xp-b{width:104px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 12px;line-height:41px}

/* Demo: dark patterns */
.dp-out{margin:0;font-weight:700}
.cb{padding:16px;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);display:grid;gap:8px;justify-items:start}
.cb-t,.cb-p{margin:0}
.cb-p{font-size:.875rem;color:var(--muted)}
.cb-big{width:100%;min-height:52px}
.cb-weak{background:none;border:0;padding:4px;font:inherit;font-size:.75rem;color:color-mix(in srgb,var(--muted) 50%,var(--surface));cursor:pointer}

@media (prefers-reduced-motion: reduce){
  dialog.drawer,dialog.sheet,.bd-blink,.bd-zoom.run::before{animation:none}
  .sw-row,.bd-slow{transition:none}
  .toast,.toast.leaving{animation:none}
  .toast-timer{display:none}

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.dataset.anno='Toast';
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label','Meldung schließen');closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} mit Strg plus Z.`:''),type==='error');
  return close;
}
