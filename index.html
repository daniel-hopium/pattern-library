function duChips(el,good){
  const box=$('.du-chips',el);let cities=tx(['Wien','Graz','Linz','Salzburg'],['Vienna','Graz','Linz','Salzburg']);
  const draw=()=>{box.innerHTML=cities.length?cities.map((c,i)=>`<span class="du-chip">${c}${good?`<button type="button" class="du-x-good" data-i="${i}" aria-label="${tx(`${c} entfernen`,`Remove ${c}`)}">${ic('x')}</button>`:`<span class="du-x-bad" role="button" tabindex="0" data-i="${i}" aria-label="${tx(`${c} entfernen`,`Remove ${c}`)}">×</span>`}</span>`).join(''):tx('<button type="button" class="linkbtn" data-reset>Alle wieder da</button>','<button type="button" class="linkbtn" data-reset>Bring them all back</button>')};
  box.addEventListener('click',e=>{const x=e.target.closest('[data-i]');if(x){cities.splice(+x.dataset.i,1);draw();($('[data-i]',box)||$('[data-reset]',box))?.focus()}
    if(e.target.closest('[data-reset]')){cities=tx(['Wien','Graz','Linz','Salzburg'],['Vienna','Graz','Linz','Salzburg']);draw()}});
  draw();
}
function duShift(el){
  const slot=$('.du-slot',el),fixed=slot.classList.contains('du-slot-fix');let t;
  const play=()=>{clearTimeout(t);if(!fixed)slot.innerHTML='';else slot.innerHTML=tx('<span class="hint">Anzeige wird geladen …</span>','<span class="hint">Loading ad…</span>');
    t=setTimeout(()=>{slot.innerHTML=tx('<button type="button" class="du-ad">Anzeige: Jetzt Kredit sichern!</button>','<button type="button" class="du-ad">Ad: Get your loan now!</button>')},1100)};
  el.addEventListener('click',e=>{
    if(e.target.closest('.du-ad'))toast({msg:tx('Anzeige geklickt – eigentlich wolltest du den Artikel.','Ad clicked – you actually wanted the article.'),type:'error',duration:3000});
    if(e.target.closest('.du-read'))toast({msg:tx('Artikel geöffnet.','Article opened.'),type:'success',duration:2000});
    if(e.target.closest('.du-replay'))play();
  });
  play();
}
function duFieldErrors(el,msgs){
  const is=$$('input',el);
  $('form',el).addEventListener('submit',e=>{
    e.preventDefault();let first=null;
    msgs.forEach((m,k)=>{
      const i=is[k],err=$('#'+i.getAttribute('aria-describedby'),el),bad=!i.value.trim()||(i.type==='email'&&!duValid(i.value));
      i.setAttribute('aria-invalid',String(bad));err.hidden=!bad;err.innerHTML=bad?`${ic('alert')}<span>${m}</span>`:'';
      if(bad&&!first)first=i;
    });
    if(first)first.focus();else toast({msg:tx('Abgeschickt.','Submitted.'),type:'success',duration:2500});
  });
}
let duDlgN=0;
function duDlg(el,safe){
  const n=++duDlgN,open=$('.du-open',el),out=document.createElement('p'),d=document.createElement('dialog');
  out.className='du-out';out.setAttribute('role','status');
  d.setAttribute('aria-labelledby','du-dlg'+n);
  d.innerHTML=`<div class="dlg-in"><h3 id="du-dlg${n}">${tx('„Bericht.pdf“ löschen?','Delete “Report.pdf”?')}</h3><p>${tx('Die Datei ist danach für alle weg.','The file will then be gone for everyone.')}</p><div class="btn-row dlg-actions"><button type="button" class="btn btn-secondary" data-v="0">${tx('Abbrechen','Cancel')}</button><button type="button" class="btn ${safe?'btn-danger':'btn-primary'}" data-v="1">${tx('Löschen','Delete')}</button></div></div>`;
  el.append(d,out);
  open.addEventListener('click',()=>{out.textContent='';d.returnValue='';d.showModal();$(`[data-v="${safe?0:1}"]`,d).focus()});
  const done=v=>{out.textContent=v==='1'?tx('Gelöscht. Weg ist weg.','Deleted. Gone is gone.'):tx('Abgebrochen – nichts passiert.','Canceled – nothing happened.');open.focus()};
  d.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){d.close(b.dataset.v);done(b.dataset.v)}});
  d.addEventListener('close',()=>{if(d.returnValue==='')done('0')});
}
function duProgress(el){
  const btn=$('.btn-primary',el),cancel=$('.du-cancel',el),bar=$('.bar',el),out=$('.du-out',el),steps=tx(['Daten sammeln','Datei erzeugen','Komprimieren'],['Collecting data','Creating file','Compressing']);
  let t=null,p=0,step=-1;
  const stop=msg=>{clearInterval(t);t=null;cancel.hidden=true;btn.removeAttribute('aria-disabled');if(msg)out.textContent=msg};
  const tick=()=>{
    if(!el.isConnected)return stop();
    p=Math.min(100,p+10);bar.style.setProperty('--p',p+'%');bar.setAttribute('aria-valuenow',p);
    if(p>=100)return stop(tx('Fertig: export.csv ist bereit.','Done: export.csv is ready.'));
    const s=Math.min(2,Math.floor(p/34));
    if(s!==step){step=s;out.textContent=tx(`Schritt ${s+1} von 3: ${steps[s]} …`,`Step ${s+1} of 3: ${steps[s]}…`)}
  };
  btn.addEventListener('click',()=>{if(t)return;p=0;step=-1;bar.hidden=false;cancel.hidden=false;btn.setAttribute('aria-disabled','true');tick();t=setInterval(tick,600)});
  cancel.addEventListener('click',()=>{stop(tx('Abgebrochen.','Canceled.'));bar.hidden=true;btn.focus()});
}
function duTabs(el){
  const tabs=$$('[role="tab"]',el),panel=$('[role="tabpanel"]',el);
  const sel=(t,focus)=>{tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',String(on));x.tabIndex=on?0:-1});panel.setAttribute('aria-labelledby',t.id);panel.textContent=tx('Inhalt: ','Content: ')+t.textContent;if(focus)t.focus()};
  el.addEventListener('click',e=>{const t=e.target.closest('[role="tab"]');if(t)sel(t)});
  el.addEventListener('keydown',e=>{
    const k=tabs.indexOf(e.target);if(k<0)return;
    const n={ArrowRight:k+1,ArrowLeft:k-1,Home:0,End:tabs.length-1}[e.key];if(n===undefined)return;
    e.preventDefault();sel(tabs[(n+tabs.length)%tabs.length],true);
  });
}
const DU_SLIDES=tx(['Folie 1: Sommerschlussverkauf – bis zu 40 % auf Wanderschuhe.','Folie 2: Neu im Sortiment sind Regenjacken aus recyceltem Material. Sie halten 20.000 mm Wassersäule, sind atmungsaktiv und lassen sich in die eigene Brusttasche packen.','Folie 3: Kostenlose Rücksendung innerhalb von 30 Tagen.'],['Slide 1: Summer sale – up to 40% off hiking boots.','Slide 2: New in our range: rain jackets made from recycled material. They withstand a 20,000 mm water column, are breathable and pack into their own chest pocket.','Slide 3: Free returns within 30 days.']);
function duCarousel(el,auto){
  const s=$('.du-slide',el),n=$('.du-car-n',el);let k=0,t;
  const show=()=>{s.textContent=DU_SLIDES[k];if(n)n.textContent=`${k+1} / ${DU_SLIDES.length}`};
  show();
  if(auto){t=setInterval(()=>{if(!el.isConnected)return clearInterval(t);k=(k+1)%DU_SLIDES.length;show()},2500);return}
  el.addEventListener('click',e=>{
    if(e.target.closest('.du-prev'))k=(k+DU_SLIDES.length-1)%DU_SLIDES.length;
    else if(e.target.closest('.du-next'))k=(k+1)%DU_SLIDES.length;
    else return;
    show();
  });
}
function duSearch(el){
  const i=$('input',el),r=$('.du-res',el);
  const run=()=>{
    const q=i.value.trim();
    r.innerHTML=tx(/^rechnung/i,/^invoice/i).test(q)
      ?tx(`<p class="du-lead">3 Treffer für „${esc(q)}“</p><ul><li>Rechnung März 2026</li><li>Rechnung Februar 2026</li><li>Rechnungsadresse ändern</li></ul>`,`<p class="du-lead">3 results for “${esc(q)}”</p><ul><li>Invoice March 2026</li><li>Invoice February 2026</li><li>Change invoice address</li></ul>`)
      :tx(`<p class="du-lead">Keine Treffer für „${esc(q)}“.</p><p>Meintest du <button type="button" class="linkbtn du-fix">Rechnung</button>?</p><p class="hint">Beliebt: Kündigung, Adresse ändern, Zahlungsarten.</p>`,`<p class="du-lead">No results for “${esc(q)}”.</p><p>Did you mean <button type="button" class="linkbtn du-fix">Invoice</button>?</p><p class="hint">Popular: Cancellation, Change address, Payment methods.</p>`);
  };
  $('form',el).addEventListener('submit',e=>{e.preventDefault();run()});
  r.addEventListener('click',e=>{if(e.target.closest('.du-fix')){i.value=tx('Rechnung','Invoice');run();i.focus()}});
}

  <form class="sf-filters du-filter" id="du-filter" aria-label="${tx('Details filtern','Filter details')}" data-anno="Filter (form)">${kSeg('du',tx('Bereich','Area'),[['',tx('Alle','All')],...D_GROUPS.map((g,i)=>[String(i),g])])}</form>
  ${D_GROUPS.map((g,gi)=>`<section class="du-sec" data-grp="${gi}" aria-labelledby="du-g${gi}"><h2 id="du-g${gi}">${g}</h2>${DUELS.filter(d=>d.grp===gi).map((d,i)=>`<article class="du-item${d.wide?' du-wide':''}" id="du-${d.id}" data-id="${d.id}" aria-labelledby="du-${d.id}-h"${gi+i?'':tx(' data-anno="Vergleich (zwei figures)"',' data-anno="Comparison (two figures)"')}>

function duGalleryInit(root,sub,params){

  <p class="rule">${tx('Paare ohne Etikett, in zufälliger Reihenfolge. Probier beide Varianten aus und entscheide dann. Nach jeder Antwort kommt die Begründung – und das Quiz merkt sich, welche Paare du schon sicher erkennst.','Unlabeled pairs in random order. Try both options, then decide. After each answer you get the reasoning – and the quiz remembers which pairs you already recognize reliably.')}</p>
  <div id="du-quiz" class="du-quiz" data-anno="Quiz"></div>

</article>`;

function duQuizInit(root){
  const box=$('#du-quiz',root),live=$('#du-live',root);
  let round,i,done,score,streak,bestStreak,missed;
  let cfg=Object.assign({n:'10',g:'',m:'rand'},store.get('duell-setup',{}));
  const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const pool=c=>DUELS.filter(d=>(c.g===''||String(d.grp)===c.g)&&(c.m!=='open'||!duKnown(d.id)));
  const size=c=>{const p=pool(c).length;return c.n==='all'?p:Math.min(+c.n,p)};
  const knownCount=()=>DUELS.filter(d=>duKnown(d.id)).length;

  function setup(focus){
    const known=knownCount();
    box.innerHTML=`<form class="du-setup" id="du-setup" aria-labelledby="du-q" data-anno="${tx('Formular (Einstellungen)','Form (settings)')}">
      <h2 id="du-q" tabindex="-1">${tx('Neue Runde','New round')}</h2>
      ${kSeg('dq-n',tx('Wie viele Paare?','How many pairs?'),[['10','10'],['20','20'],['all',tx(`Alle ${DUELS.length}`,`All ${DUELS.length}`)]])}
      ${kSeg('dq-g',tx('Bereich','Area'),[['',tx('Alle','All')],...D_GROUPS.map((g,k)=>[String(k),g])])}
      ${kSeg('dq-m',tx('Welche Paare?','Which pairs?'),[['rand',tx('Zufällig','Random')],['open',tx('Noch nicht erkannt','Not yet recognized')]])}
      <div class="du-know" data-anno="Progress Bar"><p id="du-know-l">${tx(`Zuletzt richtig erkannt: ${known} von ${DUELS.length} Paaren`,`Recognized correctly last time: ${known} of ${DUELS.length} pairs`)}</p><div class="bar" role="progressbar" aria-labelledby="du-know-l" aria-valuemin="0" aria-valuemax="${DUELS.length}" aria-valuenow="${known}" style="--p:${known/DUELS.length*100}%"><span></span></div></div>
      <p class="du-pool" id="du-pool" role="status" tabindex="-1"></p>
      <div class="btn-row"><button class="btn btn-primary">${tx('Quiz starten','Start quiz')} ${ic('fwd')}</button>${known?tx('<button type="button" class="btn btn-ghost" id="du-reset">Lernstand zurücksetzen</button>','<button type="button" class="btn btn-ghost" id="du-reset">Reset progress</button>'):''}</div>
    </form>`;
    const f=$('#du-setup',box);
    [['n','dq-n'],['g','dq-g'],['m','dq-m']].forEach(([k,n])=>{const r=$(`input[name="k-${n}"][value="${CSS.escape(cfg[k])}"]`,f);if(r)r.checked=true});
    const upd=()=>{
      cfg={n:$('input[name="k-dq-n"]:checked',f).value,g:$('input[name="k-dq-g"]:checked',f).value,m:$('input[name="k-dq-m"]:checked',f).value};
      store.set('duell-setup',cfg);
      const n=size(cfg);
      $('#du-pool',f).textContent=n?tx(`Diese Runde: ${n} ${n===1?'Paar':'Paare'}.`,`This round: ${n} ${n===1?'pair':'pairs'}.`):tx('In dieser Auswahl hast du schon alles erkannt. Wähle „Zufällig“ oder einen anderen Bereich.','You’ve already recognized everything in this selection. Choose “Random” or a different area.');
    };
    f.addEventListener('change',upd);upd();
    f.addEventListener('submit',e=>{e.preventDefault();const n=size(cfg);if(!n){$('#du-pool',f).focus();return}start(shuffle(pool(cfg)).slice(0,n))});
    if(focus)$('#du-q',box).focus();
  }
  function start(list){round=list.map(d=>({d,goodFirst:Math.random()<.5}));i=0;done=0;score=0;streak=0;bestStreak=0;missed=[];ask()}
  function ask(){
    const {d,goodFirst}=round[i];
    const panes=goodFirst?[true,false]:[false,true];
    box.innerHTML=`<div class="du-qhead"><h2 id="du-q" tabindex="-1">${tx(`Frage ${i+1} von ${round.length}: ${d.topic}`,`Question ${i+1} of ${round.length}: ${d.topic}`)}</h2><span class="du-score">${tx(`${score} richtig${streak>1?` · ${streak} in Folge`:''}`,`${score} correct${streak>1?` · ${streak} in a row`:''}`)}</span></div>
    <div class="bar du-qbar" data-anno="Progress Bar" role="progressbar" aria-label="${tx('Fortschritt im Quiz','Quiz progress')}" aria-valuemin="0" aria-valuemax="${round.length}" aria-valuenow="${i}" style="--p:${i/round.length*100}%"><span></span></div>
    <p class="du-try">${ic('keyboard')}<span><b>${tx('Probier:','Try:')}</b> ${d.try}</span></p>
    <div class="du-pair${d.wide?' du-wide':''}">${panes.map((g,k)=>duPane(d,g,`${tx('Variante','Option')} ${'AB'[k]}`,`du-q${i}-${k}`)).join('')}</div>
    <div class="btn-row du-answer" data-anno="${tx('Buttons (Antwort)','Buttons (answer)')}"><button type="button" class="btn btn-secondary" data-pick="0">${tx('A ist besser','A is better')}</button><button type="button" class="btn btn-secondary" data-pick="1">${tx('B ist besser','B is better')}</button>${round.length>1?tx('<button type="button" class="btn btn-ghost du-quit" id="du-quit">Runde beenden</button>','<button type="button" class="btn btn-ghost du-quit" id="du-quit">End round</button>'):''}</div>
    <div id="du-result"></div>`;
    duInit(d,box);
    $('#du-q',box).focus();
  }
  function answer(k){
    const {d,goodFirst}=round[i],right=(k===0)===goodFirst;
    done++;duRecord(d.id,right);
    if(right){score++;streak++;bestStreak=Math.max(bestStreak,streak)}else{streak=0;missed.push(d)}
    $$('[data-pick]',box).forEach(b=>b.disabled=true);
    $('.du-score',box).textContent=tx(`${score} richtig${streak>1?` · ${streak} in Folge`:''}`,`${score} correct${streak>1?` · ${streak} in a row`:''}`);
    $$('.du-pane',box).forEach((p,n)=>{const g=(n===0)===goodFirst;p.classList.add(g?'du-good':'du-bad');$('.du-cap',p).innerHTML=`${ic(g?'ok':'xc')}${tx('Variante','Option')} ${'AB'[n]} · ${g?tx('Gut','Good'):tx('Schlecht','Bad')}`});
    const last=i===round.length-1;
    $('#du-result',box).innerHTML=`<div class="du-result ${right?'du-right':'du-wrong'}" data-anno="${tx('Feedback-Box','Feedback box')}"><h3 id="du-r" tabindex="-1">${ic(right?'ok':'xc')}${right?(streak>2?tx(`Richtig – ${streak} in Folge!`,`Correct – ${streak} in a row!`):tx('Richtig!','Correct!')):tx(`Leider nein – Variante ${goodFirst?'A':'B'} ist besser.`,`Not quite – Option ${goodFirst?'A':'B'} is better.`)}</h3><p><b>${d.title}.</b> ${d.why}</p><div class="btn-row"><button type="button" class="btn btn-primary" id="du-next">${last?tx('Auswertung','Results'):tx('Nächstes Paar','Next pair')} ${ic('fwd')}</button><a href="#details/${d.id}">${tx('In der Galerie ansehen','View in the gallery')}</a></div></div>`;
    live.textContent=right?tx('Richtig.','Correct.'):tx('Leider falsch.','Sorry, wrong.');
    $('#du-r',box).focus();
  }
  function finish(){
    if(!done){setup(true);return}
    const played=round.slice(0,done),by=new Map();
    played.forEach(({d})=>{const g=by.get(d.grp)||[0,0];g[1]++;if(!missed.includes(d))g[0]++;by.set(d.grp,g)});
    const r=score/done,known=knownCount();
    box.innerHTML=`<div class="du-end-card" data-anno="${tx('Card (Auswertung)','Card (results)')}"><h2 id="du-q" tabindex="-1">${tx(`${score} von ${done} richtig`,`${score} of ${done} correct`)}</h2>
    <p>${r===1?tx('Alles richtig – dir entgeht kein Detail.','All correct – no detail escapes you.'):r>=.7?tx('Stark. Die paar Ausreißer unten lohnen einen zweiten Blick.','Strong. The few misses below are worth a second look.'):tx('Die Paare unten lohnen einen zweiten Blick – in der Galerie siehst du beide Varianten mit Etikett.','The pairs below are worth a second look – in the gallery you’ll see both options labeled.')}${bestStreak>2?tx(` Längste Serie: ${bestStreak} in Folge.`,` Longest streak: ${bestStreak} in a row.`):''}${tx(` Insgesamt erkennst du jetzt ${known} von ${DUELS.length} Paaren.`,` Overall you now recognize ${known} of ${DUELS.length} pairs.`)}</p>
    ${by.size>1?`<h3>${tx('Nach Bereich','By area')}</h3><ul class="du-areas">${[...by].sort((a,b)=>a[0]-b[0]).map(([g,[ok,n]])=>`<li><span>${D_GROUPS[g]}</span><span class="du-frac">${tx(`${ok} von ${n}`,`${ok} of ${n}`)}</span></li>`).join('')}</ul>`:''}
    ${missed.length?`<h3>${tx('Nochmal ansehen','Take another look')}</h3><ul>${missed.map(d=>`<li><a href="#details/${d.id}">${d.title}</a></li>`).join('')}</ul>`:''}
    <div class="btn-row">${missed.length?`<button type="button" class="btn btn-primary" id="du-retry">${tx('Fehler üben','Practice mistakes')} (${missed.length})</button>`:''}<button type="button" class="btn ${missed.length?'btn-secondary':'btn-primary'}" id="du-again">${tx('Neue Runde','New round')}</button><a class="btn btn-ghost" href="#details">${tx('Zur Galerie','To the gallery')}</a></div></div>`;
    $('#du-q',box).focus();
  }
  box.addEventListener('click',e=>{
    const p=e.target.closest('[data-pick]');if(p){answer(+p.dataset.pick);return}
    if(e.target.closest('#du-next')){i++;if(i<round.length)ask();else finish();return}
    if(e.target.closest('#du-quit')){finish();return}
    if(e.target.closest('#du-retry')){start(shuffle(missed));return}
    if(e.target.closest('#du-again')){setup(true);return}
    if(e.target.closest('#du-reset')){
      const old=duStats();store.set('duell-stats',{});setup(true);
      toast({msg:tx('Lernstand zurückgesetzt.','Progress reset.'),action:{label:tx('Rückgängig','Undo'),fn:()=>{store.set('duell-stats',old);if($('#du-setup',box))setup(true)}}});
    }
  });
  setup(false);
}

function renderList(){
  const q=norm(search.value.trim());
  const match=l=>!q||norm(`${l.title} ${l.short} ${catName(l.cat)} ${l.keys}`).includes(q);
  let html='',count=0;

  [['k',tx('WCAG-Kompass','WCAG Compass'),KOMPASS],['d',tx('Gut &amp; Schlecht','Good &amp; Bad'),DUELL_PAGES]].forEach(([key,label,pages])=>{
    const ps=pages.filter(k=>!q||norm(`${k.title} ${k.short} ${k.keys}`).includes(q));if(!ps.length)return;count+=ps.length;
    html+=`<p class="grp" id="grp-${key}">${label}</p><ul class="items" aria-labelledby="grp-${key}">${ps.map(k=>`<li>${itemHTML(k)}</li>`).join('')}</ul>`;
  });
  CATS.forEach((cat,ci)=>{
    const ls=LESSONS.filter(l=>l.cat===cat&&match(l));if(!ls.length)return;count+=ls.length;
    html+=`<p class="grp" id="grp-${ci}">${catName(cat)}</p><ul class="items" aria-labelledby="grp-${ci}">${ls.map(l=>`<li>${itemHTML(l)}</li>`).join('')}</ul>`;

  clearTimeout(statusTimer);

}

  <div class="start-grid" data-anno="Cards (Grid)">

    <div class="tile"><h3>${ic('palette')} ${tx('Marke wechseln','Switch brand')}</h3><p>${tx('Die App ist White-Label. Oben rechts wählst du eine von drei Marken – gleicher Code, andere Design Tokens.','The app is white-label. Pick one of three brands at the top right – same code, different design tokens.')}</p></div>
    <div class="tile"><h3>${ic('keyboard')} ${tx('Tastatur','Keyboard')}</h3><p>${tx('<kbd>Tab</kbd> zum Weiterspringen, <kbd>/</kbd> für die Suche, <kbd>Esc</kbd> schließt Dialoge.','<kbd>Tab</kbd> to move on, <kbd>/</kbd> for search, <kbd>Esc</kbd> closes dialogs.')}</p></div>
    <div class="tile"><h3>${ic('ok')} ${tx('Fortschritt','Progress')}</h3><p>${tx('Am Ende jeder Lektion kannst du sie als gelernt markieren. Das bleibt in diesem Browser gespeichert.','At the end of each lesson you can mark it as learned. That stays stored in this browser.')}</p></div>
    <div class="tile"><h3>${ic('compass')} ${tx('WCAG-Kompass','WCAG Compass')}</h3><p>${tx('Was die Barrierefreiheits-Norm von dir als Frontend-Dev will – nach Bauteil sortiert, mit Angular-Hinweisen und Checkliste.','What the accessibility standard expects from you as a frontend dev – sorted by component, with Angular hints and a checklist.')}</p><a class="btn btn-secondary" href="#wcag">${tx('Kompass öffnen','Open Compass')}</a></div>
    <div class="tile"><h3>${ic('star')} ${tx('Gut &amp; Schlecht','Good &amp; Bad')}</h3><p>${tx(`${DUELS.length} UI-Details als Paar zum Ausprobieren – und ein Quiz, ob du die gute Variante erkennst.`,`${DUELS.length} UI details as pairs to try out – and a quiz to see if you can spot the good one.`)}</p><a class="btn btn-secondary" href="#details">${tx('Galerie öffnen','Open gallery')}</a></div>
  </div>
  <h2>${tx('Aufbau jeder Lektion','How each lesson is built')}</h2>
  <ol class="anatomy">${tx('<li><b>Die Regel</b> in ein, zwei Sätzen</li><li><b>Die Zahlen</b> – Maße, Zeiten, Verhältnisse zum Merken</li><li><b>Live-Beispiel</b> zum Anfassen</li><li><b>Richtig</b> als Liste, <b>Falsch</b> mit einem Negativbeispiel pro Punkt – zum Anschauen und teils zum Ausprobieren</li><li><b>Warum?</b> – der Grund hinter der Regel</li><li><b>In dieser App</b> – wo du sie hier wiederfindest</li>','<li><b>The rule</b> in one or two sentences</li><li><b>The numbers</b> – sizes, timings and ratios worth remembering</li><li><b>Live example</b> to play with</li><li><b>Do</b> as a list, <b>Don’t</b> with a negative example per item – to look at and partly to try</li><li><b>Why?</b> – the reason behind the rule</li><li><b>In this app</b> – where you find it here</li>')}</ol>
  <h2>${tx('Die Kapitel','The chapters')}</h2>
  <ul class="chapters">${CATS.map(c=>{const n=LESSONS.filter(l=>l.cat===c).length;return `<li><a href="#${firstOf(c).id}">${catName(c)}<span>${tx(`${n} Lektionen`,`${n} lessons`)}</span></a></li>`}).join('')}</ul>
  <h2>${tx('Die Schwester-Apps','The sister apps')}</h2>
  <div class="start-grid sisters"><div class="tile"><h3>${ic('palette')} CSS-Atlas</h3><p>${tx('Die CSS-Referenz mit Live-Vorschau: 53 Eigenschaften und Selektoren – Wert anklicken, Wirkung sehen.','The CSS reference with live previews: 53 properties and selectors – click a value, see the effect.')}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/css-atlas/?lang=${LANG}">${tx('CSS-Atlas öffnen','Open CSS Atlas')}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div><div class="tile"><h3>${ic('code')} ${tx('ARIA-Kompass','ARIA Compass')}</h3><p>${tx('WAI-ARIA zum Anfassen: Rollen, Namen und Zustände mit Live-Beispielen und einem Inspektor, der zeigt, was der Screenreader hört.','WAI-ARIA hands-on: roles, names and states with live examples and an inspector that shows what the screen reader hears.')}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/aria-compass/?lang=${LANG}">${tx('ARIA-Kompass öffnen','Open ARIA Compass')}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div></div>
  <p style="margin-top:28px"><a class="btn btn-primary" href="#${LESSONS[0].id}">${tx('Mit Lektion 1 starten','Start with lesson 1')} ${ic('fwd')}</a></p>
</article>`;
}
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> ist keine Lektion. Vielleicht wurde sie umbenannt, oder der Link hat einen Tippfehler.`,`There is no lesson at <code>#${esc(id)}</code>. Maybe it was renamed, or the link has a typo.`)}</p>
  <p class="hint" style="max-width:60ch">${tx('Das hier ist eine hilfreiche 404: Sie sagt, was passiert ist, und bietet zwei Auswege. Mit „Zurück“ im Browser kommst du dorthin, wo du warst.','This is a helpful 404: it says what happened and offers two ways out. The browser’s “Back” button takes you where you were.')}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zur Startseite','Go to start page')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Lektion suchen','Search lessons')}</button></div>
  </div></article>`;
}

function updateTitle(){
  const b=BRANDS[document.documentElement.dataset.brand||'fjord'];
  const k=VIEWS[currentId];
  if(k){document.title=`${k.docTitle?.(kSub)||k.title} · ${b.app}`;return}
  const l=BY_ID[currentId]||(currentId==='start'?START:null);
  document.title=l?`${l.title} · ${b.app}`:`${tx('Nicht gefunden','Not found')} · ${b.app}`;
}

let lastLessonId=null,masterScroll=0,kSub='';
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  // Kompass-Adressen: #wcag-bauteile/modal, #wcag-kriterien/2.4.7, #wcag-kriterien?stufe=AA
  const [path,qs='']=id.split('?'),[base,sub='']=path.split(/\/(.*)/);
  // Der CSS-Atlas ist umgezogen: alte Adressen (#css, #css-flex/gap) leiten auf die neue App weiter
  if(/^css(-|$)/.test(base)){location.replace(ATLAS+(base==='css'?'':'#'+base.slice(4)+(sub?'/'+sub:'')));return}
  shell.dataset.view=overview?'master':'detail';
  let entry,focusEl=null;
  if(overview||id==='start'){currentId='start';view.innerHTML=startHTML();entry=START}
  else if(BY_ID[id]){
    currentId=id;entry=BY_ID[id];view.innerHTML=lessonHTML(entry);
    const c=entry.init?.(view);if(typeof c==='function')cleanup=c;
    $$('.bad-show',view).forEach(el=>BAD[id]?.[+el.dataset.bad]?.init?.(el));
  }
  else if(VIEWS[base]){
    currentId=base;kSub=sub;entry=VIEWS[base];view.innerHTML=entry.render(sub);
    const c=entry.init?.(view,sub,new URLSearchParams(qs));if(typeof c==='function')cleanup=c;
    focusEl=entry.focus?.(view,sub)||null;
  }
  else{currentId=null;view.innerHTML=notFoundHTML(id)}
  markActive(currentId);updateTitle();
  if(entry&&(!VISITED.length||VISITED[VISITED.length-1].id!==entry.id))VISITED.push({id:entry.id,title:entry.title});
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastLessonId&&$(`.item[data-id="${lastLessonId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    detail.scrollTop=0;
    if(focusEl)focusEl.focus();else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&currentId)lastLessonId=currentId;
}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});

/* ---------- Global events ---------- */
document.addEventListener('click',e=>{
  const sw=e.target.closest('[role="switch"]');
  if(sw){const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',String(on));sw.dispatchEvent(new CustomEvent('toggle',{detail:on,bubbles:true}))}
  if(e.target.closest('#st-anno'))setAnno(true);
  if(e.target.closest('#nf-search'))focusSearch();
});
view.addEventListener('change',e=>{
  if(e.target.id!=='learned-cb'||!BY_ID[currentId])return;
  const l=BY_ID[currentId];
  if(e.target.checked)learned.add(l.id);else learned.delete(l.id);
  store.set('learned',[...learned]);renderList();updateProgress();
  toast(e.target.checked?{msg:tx(`„${l.title}“ als gelernt markiert – ${learned.size} von ${LESSONS.length}.`,`“${l.title}” marked as learned – ${learned.size} of ${LESSONS.length}.`),type:'success',duration:3500}:{msg:tx('Markierung entfernt.','Mark removed.'),duration:3000});
});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
$('#brand-select').addEventListener('change',e=>applyBrand(e.target.value,true));
const annoSwitch=$('#anno-switch');
function setAnno(on){document.body.classList.toggle('anno',on);annoSwitch.setAttribute('aria-checked',String(on));store.set('anno',on)}
annoSwitch.addEventListener('toggle',e=>{setAnno(e.detail);toast({msg:e.detail?tx('Bauteile werden beschriftet.','Components are labelled.'):tx('Beschriftung ausgeblendet.','Labels hidden.'),duration:2500})});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
const typing=el=>el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!typing(e.target)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!document.querySelector('dialog[open]')){e.preventDefault();focusSearch()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&activeUndo&&!typing(e.target)){e.preventDefault();activeUndo.run()}
});

/* ---------- Sprachumschalter ----------
   Ein Link, kein Button: er führt zu einer anderen Adresse (?lang=…) und behält den Hash. Beschriftet in der
   Zielsprache selbst, mit lang-Attribut, damit Screenreader „English“ englisch aussprechen (WCAG 3.1.2). */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}

/* ---------- Boot ---------- */
updateLangLink();
applyBrand(store.get('brand','fjord'),false);
if(themeMode!=='auto')applyTheme(themeMode);
setAnno(!!store.get('anno',false));
updateProgress();
renderList();
route(false);
})();
</script>
</body>
