    </form>
    <aside class="bad-field" aria-label="${tx('Schlechtes Beispiel','Bad example')}">
      <p class="tag tag-bad">${ic('xc')} ${tx('Falsch: Placeholder als Label','Don’t: placeholder as label')}</p>
      <input class="input" placeholder="${tx('E-Mail-Adresse','Email address')}" aria-label="${tx('Schlechtes Beispiel, nur Placeholder','Bad example, placeholder only')}" id="f-bad">
      <p class="demo-note">${tx('Tipp etwas ein. Wo ist jetzt die Beschriftung? Außerdem hat das helle Grau nur etwa 2,5 : 1 Kontrast.','Type something. Where did the label go? On top of that, the light gray has a contrast of only about 2.5:1.')}</p>
    </aside>
  </div>`,
  init(root){
    const F={
      name:v=>v.trim().length<2?tx('Gib deinen Namen ein – so, wie er auf der Rechnung stehen soll.','Enter your name – the way it should appear on the invoice.'):'',
      email:v=>!v.trim()?tx('Gib deine E-Mail-Adresse ein.','Enter your email address.'):!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?tx('Die Adresse braucht ein @ und eine Domain, z. B. name@beispiel.at.','The address needs an @ and a domain, e.g. name@example.com.'):'',
      pw:v=>v.length<12?tx(`Das Passwort braucht mindestens 12 Zeichen – es fehlen noch ${12-v.length}.`,`The password needs at least 12 characters – ${12-v.length} to go.`):'',
      plz:v=>v.trim()&&!/^\d{4,5}$/.test(v.trim())?tx('Die Postleitzahl hat 4 oder 5 Ziffern, z. B. 8010.','The ZIP code has 4 or 5 digits, e.g. 8010.'):''
    };
    const L=tx({name:'Vollständiger Name',email:'E-Mail-Adresse',pw:'Passwort',plz:'Postleitzahl'},{name:'Full name',email:'Email address',pw:'Password',plz:'ZIP code'});
    const show=(k,msg)=>{
      const inp=$('#f-'+k,root),err=$('#f-'+k+'-err',root);
      if(msg){inp.setAttribute('aria-invalid','true');err.innerHTML=ic('alert')+'<span></span>';err.lastChild.textContent=msg;err.hidden=false}
      else{inp.removeAttribute('aria-invalid');err.hidden=true;err.textContent=''}
    };
    Object.keys(F).forEach(k=>{
      const inp=$('#f-'+k,root);
      inp.addEventListener('blur',()=>{if(inp.value!=='')show(k,F[k](inp.value))});
      inp.addEventListener('input',()=>{if(inp.getAttribute('aria-invalid')==='true')show(k,F[k](inp.value))});
    });
    const pw=$('#f-pw',root),meter=$('#f-pw-meter',root);
    const upd=()=>{const n=pw.value.length;meter.textContent=n>=12?tx(`${n} Zeichen – passt.`,`${n} characters – good.`):tx(`${n} von 12 Zeichen`,`${n} of 12 characters`);meter.classList.toggle('ok',n>=12)};
    pw.addEventListener('input',upd);
    const tg=$('#f-pw-toggle',root);
    tg.addEventListener('click',()=>{const on=tg.getAttribute('aria-pressed')!=='true';tg.setAttribute('aria-pressed',String(on));pw.type=on?'text':'password';tg.textContent=on?tx('Verbergen','Hide'):tx('Anzeigen','Show')});
    const form=$('#fm',root),sum=$('#fm-sum',root),list=$('#fm-sum-list',root);
    list.addEventListener('click',e=>{const a=e.target.closest('a[data-focus]');if(!a)return;e.preventDefault();$('#'+a.dataset.focus,root).focus()});
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const errs=[];
      Object.keys(F).forEach(k=>{const m=F[k]($('#f-'+k,root).value);show(k,m);if(m)errs.push([k,m])});
      if(errs.length){
        $('#fm-sum-h span',root).textContent=errs.length===1?tx('Bitte prüfe 1 Angabe','Please check 1 field'):tx(`Bitte prüfe ${errs.length} Angaben`,`Please check ${errs.length} fields`);
        list.innerHTML=errs.map(([k,m])=>`<li><a href="#f-${k}" data-focus="f-${k}">${L[k]}: ${esc(m)}</a></li>`).join('');
        sum.hidden=false;sum.focus();
      }else{
        sum.hidden=true;
        toast({msg:tx(`Konto für ${$('#f-email',root).value.trim()} erstellt (nur Demo).`,`Account for ${$('#f-email',root).value.trim()} created (demo only).`),type:'success'});
        form.reset();upd();tg.setAttribute('aria-pressed','false');pw.type='password';tg.textContent=tx('Anzeigen','Show');
      }
    });
  },
  do:tx([`Optionale Felder mit „(optional)“ kennzeichnen – oder Pflichtfelder mit „(Pflicht)“, je nachdem, was seltener ist. Ein Sternchen allein erklärt nichts.`,`Fehlermeldung = Was ist falsch + wie behebe ich es + Beispiel.`,`Beim Absenden eine Fehlerübersicht mit Sprunglinks zu den Feldern.`],[`Mark optional fields with “(optional)” – or required fields with “(required)”, whichever is rarer. An asterisk alone explains nothing.`,`Error message = what’s wrong + how to fix it + an example.`,`On submit, show an error summary with jump links to the fields.`]),
  dont:tx([`Placeholder als Label: verschwindet beim Tippen, hat oft zu wenig Kontrast.`,`Bei jedem Tastendruck validieren, bevor jemand fertig ist („Ungültige E-Mail“ nach dem ersten Buchstaben).`,`Das Formular leeren, wenn ein Fehler auftritt.`],[`Placeholder as label: it disappears when you type and often has too little contrast.`,`Validating on every keystroke before someone is done (“Invalid email” after the first letter).`,`Clearing the form when an error occurs.`]),
  why:tx(`<p>Formulare sind die Stelle, an der Nutzer abspringen. Jede Unklarheit – Was gehört hier hinein? Was war falsch? – kostet Abschlüsse.</p><p>Fehler erst beim Verlassen des Feldes zu zeigen, verhindert, dass jemand beim ersten Buchstaben angeschrien wird. Ist ein Fehler aber sichtbar, soll er beim Korrigieren sofort verschwinden. Das ist die Belohnung.</p><p>Für Screenreader verbindet <code>aria-describedby</code> Hinweis und Fehlertext mit dem Feld, <code>aria-invalid="true"</code> meldet den Fehlerzustand. <code>autocomplete</code> lässt Browser und Passwortmanager ausfüllen, das hilft allen und ist WCAG 1.3.5.</p>`,`<p>Forms are where users drop off. Every bit of confusion – What goes in here? What went wrong? – costs conversions.</p><p>Showing errors only when someone leaves the field keeps them from being yelled at after the first letter. But once an error is visible, it should vanish the moment it’s corrected. That’s the reward.</p><p>For screen readers, <code>aria-describedby</code> connects the hint and error text to the field, and <code>aria-invalid="true"</code> announces the error state. <code>autocomplete</code> lets browsers and password managers fill things in – that helps everyone and is WCAG 1.3.5.</p>`),
  here:tx(`Das Suchfeld links hat ein sichtbares Label und <code>type="search"</code>. Auf dem Handy erscheint dadurch eine „Suchen“-Taste statt „Enter“.`,`The search field on the left has a visible label and <code>type="search"</code>. On phones, that shows a “Search” key instead of “Enter”.`)
},
{
  id:'toast',cat:'Feedback',title:tx('Toasts & Snackbars','Toasts & snackbars'),
  short:tx('Kurze Rückmeldung, die von selbst geht – mit „Rückgängig“ statt Rückfrage.','Brief feedback that goes away on its own – with “Undo” instead of a confirmation.'),
  keys:'snackbar benachrichtigung meldung undo rückgängig live region notification toast message feedback undo auto dismiss',
  refs:['WCAG 4.1.3 · AA','WCAG 2.2.1 · A','Material 3: Snackbar'],
  rule:tx(`Ein Toast bestätigt eine erledigte Aktion kurz und unaufdringlich. Er blockiert nichts, verschwindet von selbst und bietet höchstens <strong>eine</strong> Aktion – meist „Rückgängig“.`,`A toast confirms a completed action briefly and unobtrusively. It blocks nothing, disappears on its own and offers at most <strong>one</strong> action – usually “Undo”.`),
  numbers:tx([['4–10 s','Anzeigedauer, länger mit Aktion'],['max. 1 Aktion','z. B. „Rückgängig“'],['≤ 2 Zeilen','Text – mehr ist kein Toast mehr'],['Pause','bei Hover und Tastaturfokus']],[['4–10 s','display time, longer with an action'],['max. 1 action','e.g. “Undo”'],['≤ 2 lines','of text – any more and it’s not a toast'],['Pause','on hover and keyboard focus']]),
  demo:`
  <div>
    <h3>${tx('Löschen mit „Rückgängig“','Delete with “Undo”')}</h3>
    <ul class="files" id="tf-list"></ul>
    <p class="demo-note">${tx('Lösch eine Datei. Statt „Wirklich löschen?“ kommt ein Toast mit „Rückgängig“ – oder drück <kbd>Strg</kbd> + <kbd>Z</kbd>.','Delete a file. Instead of “Really delete?” you get a toast with “Undo” – or press <kbd>Ctrl</kbd> + <kbd>Z</kbd>.')}</p>
  </div>
  <div>
    <h3>${tx('Varianten','Variants')}</h3>
    <div class="btn-row"><button type="button" class="btn btn-secondary" data-t="success">${tx('Erfolg','Success')}</button><button type="button" class="btn btn-secondary" data-t="info">Info</button><button type="button" class="btn btn-secondary" data-t="error">${tx('Fehler als Toast (Anti-Pattern)','Error as a toast (anti-pattern)')}</button></div>
    <p class="demo-note" id="tf-note" aria-live="polite"></p>
  </div>`,
  init(root){
    const START=tx(['Rechnung_März.pdf','Angebot_Müller_GmbH.docx','Logo_final_final2.svg'],['Invoice_March.pdf','Quote_Miller_Inc.docx','Logo_final_final2.svg']);
    let files=[...START];const list=$('#tf-list',root);
    const render=()=>{
      list.innerHTML=files.length?files.map((f,i)=>`<li class="file">${ic('file')}<span>${esc(f)}</span><button type="button" class="icon-btn" data-i="${i}" aria-label="${tx(`„${esc(f)}“ löschen`,`Delete “${esc(f)}”`)}">${ic('trash')}</button></li>`).join('')
        :`<li class="file-empty"><p><b>${tx('Alle Dateien gelöscht.','All files deleted.')}</b></p><p class="hint">${tx('Das ist ein Empty State: Er sagt, warum es leer ist, und bietet einen Ausweg.','This is an empty state: it says why it’s empty and offers a way out.')}</p><button type="button" class="btn btn-ghost" id="tf-restore">${tx('Beispieldateien wiederherstellen','Restore sample files')}</button></li>`;
    };
    render();
    list.addEventListener('click',e=>{
      if(e.target.closest('#tf-restore')){files=[...START];render();list.querySelector('button')?.focus();return}
      const b=e.target.closest('button[data-i]');if(!b)return;
      const i=+b.dataset.i,removed=files.splice(i,1)[0];render();
      (list.querySelectorAll('button[data-i]')[Math.min(i,files.length-1)]||$('#tf-restore',root))?.focus();
      toast({msg:tx(`„${removed}“ gelöscht.`,`“${removed}” deleted.`),action:{label:tx('Rückgängig','Undo'),fn:()=>{files.splice(Math.min(i,files.length),0,removed);render();toast({msg:tx(`„${removed}“ wiederhergestellt.`,`“${removed}” restored.`),type:'success',duration:3000})}}});
    });
    const note=$('#tf-note',root);
    $$('[data-t]',root).forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.t;
      if(t==='success'){toast({msg:tx('Profil gespeichert.','Profile saved.'),type:'success'});note.textContent=''}
      if(t==='info'){toast({msg:tx('Neue Version verfügbar – sie wird beim nächsten Start geladen.','New version available – it will load the next time you start the app.')});note.textContent=''}
      if(t==='error'){toast({msg:tx('Zahlung fehlgeschlagen: Karte abgelaufen.','Payment failed: card expired.'),type:'error'});note.textContent=tx('Siehst du das Problem? Die Meldung verlangt eine Handlung (neue Karte eingeben), ist aber nach 5 Sekunden weg. So ein Fehler gehört als Inline-Fehler direkt an das Zahlungsfeld.','See the problem? The message requires action (enter a new card), but it’s gone after 5 seconds. An error like this belongs inline, right at the payment field.')}
    }));
  },
  do:tx([`Undo-Toast statt „Wirklich löschen?“-Dialog bei allem, was sich rückgängig machen lässt.`,`Über eine Live-Region (<code>role="status"</code>) ansagen, damit Screenreader ihn hören.`,`Timer anhalten, solange Maus oder Fokus auf dem Toast liegen.`],[`An undo toast instead of a “Really delete?” dialog for anything that can be undone.`,`Announce it via a live region (<code>role="status"</code>) so screen readers hear it.`,`Pause the timer while the mouse or focus is on the toast.`]),
  dont:tx([`Fehler, die eine Handlung erfordern, als Toast. Dafür gibt es Inline-Fehler oder ein Banner.`,`Toasts stapeln, bis der Bildschirm voll ist (hier: maximal 3).`,`Eine wichtige Aktion <em>nur</em> im Toast anbieten – er ist flüchtig.`],[`Errors that require action shown as a toast. That’s what inline errors or a banner are for.`,`Stacking toasts until the screen is full (here: 3 at most).`,`Offering an important action <em>only</em> in the toast – it’s fleeting.`]),
  why:tx(`<p>Jede Aktion braucht eine Rückmeldung, sonst klickt man noch einmal. Ein Toast gibt sie, ohne den Arbeitsfluss zu unterbrechen. Genau deshalb ist er falsch für alles Wichtige: Er ist flüchtig und liegt oft außerhalb des Blickfelds.</p><p>Der Undo-Toast ist die freundlichere Alternative zum Bestätigungsdialog. Statt jedes Mal „Wirklich?“ zu fragen, wird sofort ausgeführt, und wer sich vertan hat, macht es rückgängig. Das spart der Mehrheit einen Klick und schützt die Minderheit.</p><p>Screenreader bekommen den Toast über eine <strong>Live-Region</strong> angesagt, ohne dass der Fokus springt (WCAG 4.1.3). Wer langsamer liest, braucht Zeit: Hover oder Fokus hält den Timer an (WCAG 2.2.1).</p>`,`<p>Every action needs feedback, or people click again. A toast provides it without interrupting the flow. That’s exactly why it’s wrong for anything important: it’s fleeting and often outside your field of view.</p><p>The undo toast is the friendlier alternative to a confirmation dialog. Instead of asking “Really?” every time, the action runs immediately, and anyone who made a mistake undoes it. That saves the majority a click and protects the minority.</p><p>Screen readers announce the toast through a <strong>live region</strong> without moving focus (WCAG 4.1.3). Slower readers need time: hover or focus pauses the timer (WCAG 2.2.1).</p>`),
  here:tx(`Alle Toasts laufen durch eine einzige Funktion und landen unten in einer Region. Beachte den dünnen Zeitbalken: Er stoppt, wenn du mit der Maus darüberfährst. Auf dem Desktop sitzen Toasts unten rechts, auf dem Handy unten in der Mitte.`,`All toasts go through a single function and land in one region at the bottom. Notice the thin timer bar: it stops when you hover over it. On desktop, toasts sit at the bottom right; on phones, at the bottom center.`)
},
{
  id:'loading',cat:'Feedback',title:tx('Ladezustände: Skeleton, Spinner, Fortschritt','Loading states: skeleton, spinner, progress'),
  short:tx('Welcher Indikator bei welcher Wartezeit – nach den Nielsen-Grenzen.','Which indicator for which wait time – based on Nielsen’s limits.'),
  keys:'laden spinner skeleton progress fortschritt wartezeit optimistic aria-busy loading progress bar wait time response time optimistic ui skeleton screen',
  refs:[tx('Nielsen: 0,1 / 1 / 10 s','Nielsen: 0.1 / 1 / 10 s'),'WCAG 4.1.3 · AA'],
  rule:tx(`Die Wartezeit bestimmt den Indikator: unter etwa 300 ms <strong>nichts</strong>, bis etwa 10 s ein <strong>Skeleton</strong> (für Inhalt) oder Spinner (für Aktionen), darüber ein <strong>Fortschrittsbalken</strong> mit Restzeit und „Abbrechen“.`,`The wait time determines the indicator: under about 300 ms, <strong>nothing</strong>; up to about 10 s, a <strong>skeleton</strong> (for content) or spinner (for actions); beyond that, a <strong>progress bar</strong> with time remaining and “Cancel”.`),
  numbers:tx([['0,1 s','fühlt sich sofort an'],['1 s','Gedankenfluss bleibt erhalten'],['10 s','Aufmerksamkeit ist weg'],['~300 ms','Verzögerung, bevor ein Indikator erscheint']],[['0.1 s','feels instant'],['1 s','flow of thought stays intact'],['10 s','attention is gone'],['~300 ms','delay before an indicator appears']]),
  demo:`
  <fieldset class="seg"><legend>${tx('Simulierte Wartezeit','Simulated wait time')}</legend><div class="seg-opts">
    <label><input type="radio" name="ld-dur" value="200">${tx('0,2 s','0.2 s')}</label>
    <label><input type="radio" name="ld-dur" value="2500" checked>${tx('2,5 s','2.5 s')}</label>
    <label><input type="radio" name="ld-dur" value="12000">12 s</label>
  </div></fieldset>
  <div class="btn-row"><button type="button" class="btn btn-primary" id="ld-go">${tx('Kontoauszüge laden','Load statements')}</button></div>
  <div class="ld-out" id="ld-out" aria-live="polite" aria-busy="false"><p class="demo-note" style="margin:0">${tx('Noch nichts geladen.','Nothing loaded yet.')}</p></div>
  <p class="ld-why" id="ld-why"></p>`,
  init(root){
    const out=$('#ld-out',root),why=$('#ld-why',root);let timers=[],iv=null;
    const stop=()=>{timers.forEach(clearTimeout);timers=[];clearInterval(iv);iv=null};
    const rows=()=>tx(['Juli 2026','Juni 2026','Mai 2026'],['July 2026','June 2026','May 2026']).map((m,i)=>`<div class="ld-row"><span class="ld-ic">${ic('file')}</span><p><b>${tx(`Kontoauszug ${m}`,`Statement ${m}`)}</b><br><small>PDF · ${[84,91,77][i]} KB</small></p></div>`).join('');
    const skel=()=>Array.from({length:3},()=>`<div class="ld-row" aria-hidden="true"><span class="skel" style="width:36px;height:36px;flex:none"></span><span class="skel-lines"><span class="skel" style="height:12px;width:60%;display:block"></span><span class="skel" style="height:10px;width:35%;display:block"></span></span></div>`).join('');
    const done=()=>{stop();out.innerHTML=rows();out.setAttribute('aria-busy','false')};
    function run(d){
      stop();out.setAttribute('aria-busy','true');out.innerHTML='';why.innerHTML='';
      const t0=Date.now();
      if(d<=300) why.innerHTML=tx('<strong>Unter ~300 ms:</strong> kein Indikator. Ein Spinner, der kurz aufblitzt, wirkt langsamer als gar keiner.','<strong>Under ~300 ms:</strong> no indicator. A spinner that flashes briefly feels slower than none at all.');
      timers.push(setTimeout(()=>{
        if(d>300&&d<=10000){out.innerHTML=skel();why.innerHTML=tx('<strong>~0,3–10 s:</strong> Skeleton in der Form des echten Inhalts. Die Struktur steht schon, das Layout springt nicht, die Wartezeit fühlt sich kürzer an.','<strong>~0.3–10 s:</strong> a skeleton shaped like the real content. The structure is already in place, the layout doesn’t jump, and the wait feels shorter.')}
        else if(d>10000){
          out.innerHTML=`<div class="ld-prog"><div class="ld-prog-row"><span id="ld-pct">${tx('0 %','0%')}</span><span id="ld-rest">${tx(`noch ca. ${Math.round(d/1000)} s`,`about ${Math.round(d/1000)} s left`)}</span></div><div class="bar" role="progressbar" aria-label="${tx('Ladefortschritt','Loading progress')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ld-bar"><span></span></div><button type="button" class="btn btn-secondary" id="ld-cancel">${tx('Abbrechen','Cancel')}</button></div>`;
          why.innerHTML=tx('<strong>Über ~10 s:</strong> Fortschrittsbalken mit Prozent, Restzeit und „Abbrechen“. Ohne das glauben Nutzer, die App hängt.','<strong>Over ~10 s:</strong> a progress bar with percentage, time remaining and “Cancel”. Without it, users think the app has frozen.');
          const bar=$('#ld-bar',out);
          iv=setInterval(()=>{const p=Math.min(100,Math.round((Date.now()-t0)/d*100));$('#ld-pct',out).textContent=p+tx(' %','%');$('#ld-rest',out).textContent=tx(`noch ca. ${Math.max(0,Math.ceil((d-(Date.now()-t0))/1000))} s`,`about ${Math.max(0,Math.ceil((d-(Date.now()-t0))/1000))} s left`);bar.style.setProperty('--p',p+'%');bar.setAttribute('aria-valuenow',p)},250);
          $('#ld-cancel',out).addEventListener('click',()=>{
            stop();out.setAttribute('aria-busy','false');
            out.innerHTML=tx('<div class="ld-prog"><p style="margin:0"><b>Laden abgebrochen.</b> Es wurde nichts geändert.</p><button type="button" class="btn btn-secondary" id="ld-retry">Erneut versuchen</button></div>','<div class="ld-prog"><p style="margin:0"><b>Loading canceled.</b> Nothing was changed.</p><button type="button" class="btn btn-secondary" id="ld-retry">Try again</button></div>');
            const r=$('#ld-retry',out);r.addEventListener('click',()=>run(d));r.focus();
          });
        }
      },300));
      timers.push(setTimeout(done,d));
    }
    $('#ld-go',root).addEventListener('click',()=>run(+$('input[name="ld-dur"]:checked',root).value));
    return stop;
  },
  do:tx([`Skeleton in der Form des echten Inhalts – das Layout springt nicht, wenn die Daten kommen.`,`<strong>Optimistic UI:</strong> Bei fast sicher erfolgreichen Aktionen (Like, Abhaken) sofort das Ergebnis zeigen und im Fehlerfall zurückrollen.`,`Bei langen Vorgängen: Prozent, Restzeit, Abbrechen.`],[`A skeleton shaped like the real content – the layout doesn’t jump when the data arrives.`,`<strong>Optimistic UI:</strong> for actions that almost always succeed (like, check off), show the result immediately and roll back if it fails.`,`For long operations: percentage, time remaining, cancel.`]),
  dont:tx([`Vollbild-Spinner, der die ganze App blockiert, wenn nur ein Bereich lädt.`,`Ein Spinner, der 100 ms aufblitzt.`,`Endlos-Spinner ohne Timeout und ohne Fehlermeldung.`],[`A full-screen spinner that blocks the whole app when only one section is loading.`,`A spinner that flashes for 100 ms.`,`An endless spinner with no timeout and no error message.`]),
  why:tx(`<p>Jakob Nielsens Antwortzeit-Grenzen gelten seit Jahrzehnten: 0,1 s fühlt sich sofort an, bis 1 s bleibt der Gedankenfluss erhalten, ab 10 s wandert die Aufmerksamkeit ab. Der Indikator muss zur Wartezeit passen.</p><p>Ein Skeleton ist mehr als Deko. Es zeigt, <em>was</em> gleich kommt, und reserviert den Platz. Wenn die Daten da sind, springt nichts (weniger <em>Layout Shift</em>).</p><p>Für Screenreader markiert <code>aria-busy="true"</code> den Bereich als „wird gerade aktualisiert“. Erst danach wird der neue Inhalt angesagt.</p>`,`<p>Jakob Nielsen’s response time limits have held for decades: 0.1 s feels instant, up to 1 s keeps the flow of thought intact, and from 10 s on, attention wanders. The indicator has to match the wait time.</p><p>A skeleton is more than decoration. It shows <em>what</em> is coming and reserves the space. When the data arrives, nothing jumps (less <em>layout shift</em>).</p><p>For screen readers, <code>aria-busy="true"</code> marks the region as “being updated”. The new content is announced only after that.</p>`),
  here:tx(`Diese App lädt nichts nach, darum gibt es hier nur die Demo. Der Ergebnisbereich trägt während des Ladens <code>aria-busy="true"</code>, und nach „Abbrechen“ springt der Fokus auf „Erneut versuchen“, weil der Abbrechen-Button verschwindet.`,`This app doesn’t load anything later, so there’s only the demo here. The result area carries <code>aria-busy="true"</code> while loading, and after “Cancel”, focus moves to “Try again” because the cancel button disappears.`)
},
{
  id:'empty-states',cat:'Feedback',title:tx('Empty States','Empty states'),
  short:tx('Leere Ansichten erklären, warum sie leer sind, und was als Nächstes kommt.','Empty views explain why they’re empty and what comes next.'),
  keys:'leer keine daten treffer onboarding erster start leerer zustand empty state no data no results zero state first run blank slate',
  refs:[tx('UX-Muster','UX pattern'),'Onboarding'],
  rule:tx(`Ein leerer Zustand ist nie nur „Keine Daten“. Er sagt, <strong>warum</strong> hier nichts ist, und bietet genau die Aktion an, die das ändert.`,`An empty state is never just “No data”. It says <strong>why</strong> there’s nothing here and offers exactly the action that changes that.`),
  numbers:tx([['4 Arten','Erste Nutzung · Keine Treffer · Alles erledigt · Fehler'],['1 Aktion','der passende nächste Schritt'],['1–2 Sätze','Erklärung, nicht mehr'],['„Keine Daten.“','ist nie genug']],[['4 types','First use · No results · All done · Error'],['1 action','the fitting next step'],['1–2 sentences','of explanation, no more'],['“No data.”','is never enough']]),
  demo:`
  <div class="es-controls">
    <fieldset class="seg"><legend>Situation</legend><div class="seg-opts">
      <label><input type="radio" name="es-kind" value="first" checked>${tx('Erste Nutzung','First use')}</label>
      <label><input type="radio" name="es-kind" value="search">${tx('Keine Treffer','No results')}</label>
      <label><input type="radio" name="es-kind" value="done">${tx('Alles erledigt','All done')}</label>
      <label><input type="radio" name="es-kind" value="error">${tx('Fehler','Error')}</label>
    </div></fieldset>
    <button type="button" class="switch" role="switch" aria-checked="false" id="es-bad"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('Schlechte Version zeigen','Show bad version')}</span></button>
  </div>
  <div class="es-stage" id="es-stage" aria-live="polite"></div>`,
  init(root){
    const stage=$('#es-stage',root);let bad=false,filled=false;
    const S={
      first:{ic:'inbox',h:tx('Noch keine Aufgaben','No tasks yet'),p:tx('Hier landen alle Aufgaben, die du dir oder deinem Team zuweist. Leg die erste an – das dauert zehn Sekunden.','All tasks you assign to yourself or your team end up here. Create the first one – it takes ten seconds.'),b:tx('Erste Aufgabe anlegen','Create first task'),c:'btn-primary'},
      search:{ic:'search',h:tx('Keine Treffer für „Steuererklärung 2019“','No results for “tax return 2019”'),p:tx('Gesucht wurde nur in der Liste „Privat“. Prüfe die Schreibweise oder such in allen Listen.','Only the “Personal” list was searched. Check the spelling or search all lists.'),b:tx('In allen Listen suchen','Search all lists'),c:'btn-secondary'},
      done:{ic:'ok',h:tx('Alles erledigt','All done'),p:tx('Für heute steht nichts mehr an. Neue Aufgaben erscheinen hier automatisch.','Nothing else is due today. New tasks will show up here automatically.'),b:tx('Aufgabe für morgen planen','Plan a task for tomorrow'),c:'btn-ghost'},
      error:{ic:'alert',h:tx('Aufgaben konnten nicht geladen werden','Tasks couldn’t be loaded'),p:tx('Keine Verbindung zum Server. Deine Daten sind sicher – nur die Anzeige klappt gerade nicht.','No connection to the server. Your data is safe – it just can’t be displayed right now.'),b:tx('Erneut versuchen','Try again'),c:'btn-secondary'}
    };
    const render=()=>{
      const k=$('input[name="es-kind"]:checked',root).value,s=S[k];
      if(filled){stage.innerHTML=`<div class="es-filled"><ul class="es-list"><li>${ic('circle')}${tx('Angebot an Müller GmbH schicken','Send quote to Miller Inc.')}</li><li>${ic('circle')}${tx('Logo in drei Größen exportieren','Export logo in three sizes')}</li><li>${ic('circle')}${tx('Design-Review vorbereiten','Prepare design review')}</li></ul><button type="button" class="btn btn-ghost" id="es-reset">${tx('Zurück zum leeren Zustand','Back to the empty state')}</button></div>`;return}
      if(bad){stage.innerHTML=tx('<p class="es-bad">Keine Daten.</p>','<p class="es-bad">No data.</p>');return}
      stage.innerHTML=`<div class="es ${k}">${ic(s.ic)}<h3>${s.h}</h3><p>${s.p}</p><button type="button" class="btn ${s.c}" id="es-act">${s.b}</button></div>`;
    };
    render();
    $$('input[name="es-kind"]',root).forEach(r=>r.addEventListener('change',()=>{filled=false;render()}));
    $('#es-bad',root).addEventListener('toggle',e=>{bad=e.detail;filled=false;render()});
    stage.addEventListener('click',e=>{
      if(e.target.closest('#es-act')){filled=true;render();$('#es-reset',root).focus()}
      if(e.target.closest('#es-reset')){filled=false;render();$('#es-act',root)?.focus()}
    });
  },
  do:tx([`Bei „keine Treffer“ den Suchbegriff zeigen und einen Ausweg anbieten.`,`Bei der ersten Nutzung erklären, was hier später steht – ein Mini-Onboarding.`,`„Alles erledigt“ darf sich wie ein Erfolg anfühlen.`],[`For “no results”, show the search term and offer a way out.`,`On first use, explain what will appear here later – a mini onboarding.`,`“All done” should feel like a success.`]),
  dont:tx([`„Keine Daten.“ ohne Grund und Ausweg.`,`Eine leere Tabelle mit Spaltenköpfen und nichts darunter.`,`Fehler als leeren Zustand tarnen („Keine Einträge“, obwohl der Server nicht erreichbar war).`],[`“No data.” with no reason and no way out.`,`An empty table with column headers and nothing below.`,`Disguising errors as an empty state (“No entries” even though the server was unreachable).`]),
  why:tx(`<p>Leere Zustände sieht man genau dann, wenn man am unsichersten ist: beim ersten Start, nach einer erfolglosen Suche, nach einem Fehler. „Keine Daten“ lässt einen allein. Ein guter Empty State beantwortet drei Fragen: Was ist das hier? Warum ist es leer? Was kann ich tun?</p><p>Fehler dürfen nie als Leere getarnt werden. „Keine Einträge“ bei einem Serverausfall lässt Nutzer glauben, ihre Daten seien weg.</p>`,`<p>You see empty states exactly when you’re least sure of yourself: on first launch, after a failed search, after an error. “No data” leaves you on your own. A good empty state answers three questions: What is this? Why is it empty? What can I do?</p><p>Errors must never be disguised as emptiness. “No entries” during a server outage makes users think their data is gone.</p>`),
  here:tx(`Tipp links in die Suche etwas Unsinniges wie „xyz“: Die Liste zeigt einen Empty State mit deinem Suchbegriff und „Suche zurücksetzen“. Auch die Datei-Demo bei „Toasts“ hat einen, wenn du alles löschst.`,`Type something nonsensical like “xyz” into the search on the left: the list shows an empty state with your search term and “Clear search”. The file demo under “Toasts” has one too, once you delete everything.`)
},
{
  id:'dialog',cat:'Feedback',title:tx('Modal-Dialoge','Modal dialogs'),
  short:tx('Nur für Entscheidungen, die den Ablauf wirklich unterbrechen müssen.','Only for decisions that truly need to interrupt the flow.'),
  keys:'modal dialog popup overlay bestätigung confirm fokus falle escape confirmation focus trap modal window alert dialog',
  refs:['WCAG 2.1.2 · A','WCAG 2.4.3 · A','ARIA APG: Dialog'],
  rule:tx(`Ein Modal unterbricht bewusst. Nur für Entscheidungen, die nicht rückgängig zu machen sind oder ohne die es nicht weitergeht. <strong>Fokus hinein, Escape hinaus, Fokus zurück zum Auslöser.</strong>`,`A modal interrupts on purpose. Use it only for decisions that can’t be undone or without which you can’t continue. <strong>Focus in, Escape out, focus back to the trigger.</strong>`),
  numbers:tx([['1','Dialog gleichzeitig – nie stapeln'],['Esc','schließt immer'],['Fokus','startet auf der sichersten Option'],['…','Button-Text endet mit Ellipse, wenn ein Dialog folgt']],[['1','dialog at a time – never stack them'],['Esc','always closes'],['Focus','starts on the safest option'],['…','button text ends with an ellipsis when a dialog follows']]),
  demo:`
  <div>
    <div class="proj" id="dg-proj"></div>
    <p class="demo-note">${tx('Die drei Punkte im Button kündigen an: Es kommt noch eine Rückfrage, es passiert noch nichts.','The three dots in the button signal: there’s a confirmation coming, nothing happens yet.')}</p>
  </div>
  <dialog id="dg" aria-labelledby="dg-title" aria-describedby="dg-desc">
    <form method="dialog" class="dlg-in">
      <h3 id="dg-title">${tx('Projekt „Alpha“ löschen?','Delete project “Alpha”?')}</h3>
      <p id="dg-desc">${tx('Alle 24 Dateien werden endgültig entfernt. Das lässt sich nicht rückgängig machen.','All 24 files will be permanently removed. This can’t be undone.')}</p>
      <div class="btn-row dlg-actions"><button class="btn btn-secondary" value="cancel" autofocus>${tx('Abbrechen','Cancel')}</button><button class="btn btn-danger" value="delete">${tx('Projekt endgültig löschen','Delete project permanently')}</button></div>
    </form>
  </dialog>
  <div>
    <h3>${tx('Probier mit der Tastatur','Try it with the keyboard')}</h3>
    <ul class="tips">${tx('<li><kbd>Tab</kbd> bleibt im Dialog, der Hintergrund ist gesperrt.</li><li><kbd>Esc</kbd> oder ein Klick daneben schließt ohne zu löschen.</li><li>Danach steht der Fokus wieder auf dem Button, der den Dialog geöffnet hat.</li>','<li><kbd>Tab</kbd> stays inside the dialog; the background is locked.</li><li><kbd>Esc</kbd> or a click outside closes it without deleting.</li><li>Afterwards, focus is back on the button that opened the dialog.</li>')}</ul>
  </div>`,
  init(root){
    const proj=$('#dg-proj',root),dg=$('#dg',root);
    const renderProj=()=>{proj.innerHTML=`<span class="proj-ic">${ic('file')}</span><div class="proj-text"><p class="proj-name">${tx('Projekt „Alpha“','Project “Alpha”')}</p><p class="hint">${tx('24 Dateien · zuletzt geändert heute','24 files · last modified today')}</p></div><button type="button" class="btn btn-danger" id="dg-open">${tx('Projekt löschen …','Delete project …')}</button>`};
    renderProj();
    proj.addEventListener('click',e=>{
      if(e.target.closest('#dg-open')){dg.returnValue='';dg.showModal()}
      if(e.target.closest('#dg-restore')){renderProj();$('#dg-open',root).focus()}
    });
    dg.addEventListener('click',e=>{if(e.target===dg)dg.close('cancel')});
    dg.addEventListener('close',()=>{
      if(dg.returnValue==='delete'){
        proj.innerHTML=`<span class="proj-ic">${ic('trash')}</span><div class="proj-text"><p class="proj-name">${tx('Projekt „Alpha“ wurde gelöscht.','Project “Alpha” was deleted.')}</p><p class="hint">${tx('Kein Undo möglich – genau deshalb gab es die Rückfrage.','No undo possible – that’s exactly why you were asked to confirm.')}</p></div><button type="button" class="btn btn-secondary" id="dg-restore">${tx('Demo zurücksetzen','Reset demo')}</button>`;
        $('#dg-restore',root).focus();
        toast({msg:tx('Projekt „Alpha“ gelöscht.','Project “Alpha” deleted.'),type:'success'});
      }else $('#dg-open',root)?.focus();
    });
    return()=>{if(dg.open)dg.close()};
  },
  do:tx([`Natives <code>&lt;dialog&gt;</code> mit <code>showModal()</code>: Hintergrund wird inert, Esc funktioniert, liegt im Top Layer.`,`Titel als Frage mit Objekt: „Projekt „Alpha“ löschen?“`,`Den destruktiven Button eindeutig benennen und rot markieren – aber nicht vorfokussieren.`],[`Native <code>&lt;dialog&gt;</code> with <code>showModal()</code>: the background becomes inert, Esc works, and it sits in the top layer.`,`Title as a question with an object: “Delete project ‘Alpha’?”`,`Label the destructive button clearly and mark it red – but don’t focus it by default.`]),
  dont:tx([`Modals für Infos, die auch inline stehen könnten („Wussten Sie schon …?“).`,`Ein Dialog, der sich nur über ein winziges × schließen lässt.`,`Bestätigungsdialog für Dinge, die man rückgängig machen kann – dann lieber Undo-Toast.`],[`Modals for info that could just as well be inline (“Did you know …?”).`,`A dialog that can only be closed with a tiny ×.`,`A confirmation dialog for things that can be undone – use an undo toast instead.`]),
  why:tx(`<p>Ein Modal nimmt den Rest der Oberfläche aus dem Spiel. Das ist gewollt, wenn eine Entscheidung wirklich erst getroffen werden muss, und ärgerlich in allen anderen Fällen.</p><p>Für Tastatur- und Screenreader-Nutzer gilt: Der Fokus muss in den Dialog springen, darf ihn nicht versehentlich verlassen und muss nach dem Schließen zurück zum Auslöser. Sonst landet man am Seitenanfang und sucht. Das native <code>&lt;dialog&gt;</code> mit <code>showModal()</code> erledigt das meiste davon.</p><p>Der Fokus startet auf „Abbrechen“: Wer reflexartig Enter drückt, soll nichts zerstören.</p>`,`<p>A modal takes the rest of the interface out of play. That’s intended when a decision really has to be made first, and annoying in every other case.</p><p>For keyboard and screen reader users: focus has to jump into the dialog, must not leave it by accident, and has to return to the trigger after closing. Otherwise you end up at the top of the page, searching. The native <code>&lt;dialog&gt;</code> with <code>showModal()</code> handles most of this.</p><p>Focus starts on “Cancel”: anyone who hits Enter by reflex shouldn’t destroy anything.</p>`),
  here:tx(`Diese App hat genau einen Dialog – den in der Demo. Alles andere ist harmlos oder rückgängig machbar und braucht deshalb keine Rückfrage.`,`This app has exactly one dialog – the one in the demo. Everything else is harmless or can be undone, so it doesn’t need a confirmation.`)
},
{
  id:'deep-linking',cat:'Navigation',title:tx('Deep Linking','Deep linking'),
  short:tx('Jeder teilbare Zustand hat eine eigene URL – und „Zurück“ funktioniert.','Every shareable state has its own URL – and “Back” works.'),
  keys:'url link teilen bookmark history zurück back routing hash universal links app links deep link share permalink back button single page app spa',
  refs:['WCAG 2.4.2 · A','Universal Links / App Links',tx('UX-Grundregel','UX principle')],
  rule:tx(`Alles, was man teilen, bookmarken oder wiederfinden möchte, bekommt eine eigene Adresse: die geöffnete Lektion, der gewählte Tab, ein Filter. Wer den Link öffnet, landet <strong>genau dort</strong>.`,`Anything people want to share, bookmark or find again gets its own address: the open lesson, the selected tab, a filter. Whoever opens the link lands <strong>exactly there</strong>.`),
  numbers:tx([['1 URL','pro teilbarem Zustand'],['Zurück','führt zum vorherigen Zustand'],['Titel','document.title passt zur Ansicht'],['Fokus','nach dem Wechsel auf die neue Überschrift']],[['1 URL','per shareable state'],['Back','returns to the previous state'],['Title','document.title matches the view'],['Focus','moves to the new heading after the change']]),
  demo:`
  <div>
    <p class="hint">${tx('Adresse dieser Ansicht','Address of this view')}</p>
    <div class="dl-url"><code id="dl-hash">#deep-linking</code><button type="button" class="btn btn-secondary" id="dl-copy">${ic('copy')} ${tx('Anker kopieren','Copy anchor')}</button></div>
    <p class="demo-note">${tx('In einer echten App stünde hier ein Pfad wie <code>https://app.beispiel.at/lektionen/deep-linking</code>.','In a real app, this would be a path like <code>https://app.example.com/lessons/deep-linking</code>.')}</p>
  </div>
  <div>
    <h3>${tx('Direkt hinspringen','Jump straight there')}</h3>
    <ul class="dl-links"><li><a href="#contrast">#contrast</a> ${tx('öffnet die Kontrast-Lektion','opens the contrast lesson')}</li><li><a href="#dialog">#dialog</a> ${tx('öffnet die Dialog-Lektion','opens the dialog lesson')}</li><li><a href="#gibt-es-nicht">#gibt-es-nicht</a> ${tx('zeigt eine hilfreiche 404-Seite','shows a helpful 404 page')}</li></ul>
    <p class="demo-note">${tx('Danach mit dem Zurück-Button des Browsers (oder <kbd>Alt</kbd> + <kbd>←</kbd>) wieder hierher.','Then use the browser’s back button (or <kbd>Alt</kbd> + <kbd>←</kbd>) to come back here.')}</p>
  </div>
  <div>
    <h3>${tx('Dein Verlauf in dieser Sitzung','Your history in this session')}</h3>
    <ol class="dl-hist" id="dl-hist"></ol>
  </div>`,
  init(root){
    $('#dl-hist',root).innerHTML=VISITED.map(v=>`<li><a href="#${v.id}">${esc(v.title)}</a></li>`).join('');
    const code=$('#dl-hash',root);
    $('#dl-copy',root).addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(code.textContent);toast({msg:tx(`Anker „${code.textContent}“ kopiert.`,`Anchor “${code.textContent}” copied.`),type:'success',duration:3000})}
      catch(e){const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);toast({msg:tx('Kopieren ist hier nicht erlaubt. Der Text ist markiert – drück Strg + C.','Copying isn’t allowed here. The text is selected – press Ctrl + C.'),duration:6000})}
    });
  },
  do:tx([`Nach einem Wechsel in einer Single-Page-App: Titel aktualisieren und Fokus auf die neue <code>h1</code> setzen, sonst merkt ein Screenreader nichts.`,`Alte Links nicht brechen: weiterleiten oder eine hilfreiche 404 zeigen.`,`In Native Apps: Universal Links (iOS) bzw. App Links (Android), damit ein Web-Link direkt in die App führt.`],[`After a view change in a single-page app: update the title and move focus to the new <code>h1</code>, or a screen reader won’t notice anything.`,`Don’t break old links: redirect or show a helpful 404.`,`In native apps: Universal Links (iOS) or App Links (Android), so a web link opens the app directly.`]),
  dont:tx([`Zustand nur im Arbeitsspeicher – Reload, und alles ist weg.`,`Jeden Tastendruck als eigenen Verlaufseintrag speichern. Für Filter und Suche gibt es <code>history.replaceState</code>.`,`„Link kopieren“, der immer nur die Startseite liefert.`],[`State kept only in memory – reload, and everything is gone.`,`Saving every keystroke as its own history entry. For filters and search, there’s <code>history.replaceState</code>.`,`A “Copy link” that always gives you just the home page.`]),
  why:tx(`<p>Links sind das Gedächtnis des Webs. Bildet eine App ihren Zustand nicht in der URL ab, kann niemand eine Stelle teilen („schau dir mal Lektion 11 an“), bookmarken oder nach einem Reload wiederfinden.</p><p>Single-Page-Apps wechseln Inhalte ohne Seiten-Reload. Für Screenreader passiert dann scheinbar nichts. Deshalb setzt diese App nach jedem Wechsel den Fokus auf die neue Überschrift und aktualisiert den Seitentitel (WCAG 2.4.2).</p>`,`<p>Links are the web’s memory. If an app doesn’t reflect its state in the URL, nobody can share a spot (“take a look at lesson 11”), bookmark it or find it again after a reload.</p><p>Single-page apps swap content without a page reload. For screen readers, nothing seems to happen. That’s why this app moves focus to the new heading after every change and updates the page title (WCAG 2.4.2).</p>`),
  here:tx(`Jede Lektion hat einen Anker wie <code>#toast</code>. In einer echten App wäre das ein Pfad über die History API – diese Vorschau erlaubt nur einfache Anker. Der Tab-Titel deines Browsers wechselt mit jeder Lektion.`,`Every lesson has an anchor like <code>#toast</code>. In a real app, this would be a path via the History API – this preview only allows simple anchors. Your browser’s tab title changes with every lesson.`)
},
{
  id:'master-detail',cat:'Navigation',title:tx('Master-Detail','Master-detail'),
  short:tx('Liste und Detail nebeneinander – auf dem Handy nacheinander.','List and detail side by side – one after the other on phones.'),
  keys:'list detail split view zwei spalten container query responsive postfach master detail two columns two pane inbox back navigation',
  refs:['Material 3: List-Detail','Apple: Split View','WCAG 1.4.10 · AA'],
  rule:tx(`Die Liste (Master) und der gewählte Eintrag (Detail) stehen auf breiten Bildschirmen nebeneinander. Auf schmalen werden sie zum Vor-und-zurück: Liste → Detail → zurück zur Liste, <strong>an dieselbe Stelle</strong>.`,`On wide screens, the list (master) and the selected entry (detail) sit side by side. On narrow ones, they become a back-and-forth: list → detail → back to the list, <strong>at the same spot</strong>.`),
  numbers:tx([['~ 600–840 px','Breite, ab der beide Spalten passen'],['280–360 px','typische Breite der Master-Spalte'],['aria-current','markiert den aktiven Eintrag'],['Scroll + Fokus','bleiben beim Zurückgehen erhalten']],[['~ 600–840 px','width at which both columns fit'],['280–360 px','typical width of the master column'],['aria-current','marks the active entry'],['Scroll + focus','are preserved when going back']]),
  demo:`
  <div class="md-ctl"><label for="md-w">${tx('Breite der Vorschau:','Preview width:')} <output id="md-wout">640 px</output></label><input type="range" id="md-w" min="280" max="720" step="10" value="640"></div>
  <div class="md-frame" id="md-frame" style="--w:640px">
    <div class="md" id="md" data-view="list">
      <ul class="md-list" id="md-list" aria-label="${tx('Posteingang (Beispiel)','Inbox (example)')}"></ul>
      <div class="md-detail"><button type="button" class="md-back" id="md-back">${ic('back')} ${tx('Posteingang','Inbox')}</button><div id="md-content"></div></div>
    </div>
  </div>
  <p class="md-state" id="md-state" aria-live="polite"></p>`,
  init(root){
    const M=tx([
      {from:'Lena Hofer',subj:'Entwurf für die Startseite',body:'Ich habe die Startseite überarbeitet: weniger Text, dafür ein klarer Primary-Button. Schaust du bis Freitag drüber?',time:'09:14'},
      {from:'Build-Server',subj:'Deployment erfolgreich',body:'Version 2.4.0 ist live. 0 Fehler, 3 Warnungen.',time:'08:02'},
      {from:'Tom Berger',subj:'Frage zu Farben',body:'Reicht unser Hellgrau (#9AA0A6) auf Weiß für Hilfetexte? Ich glaube, das ist zu schwach. (Er hat recht: 2,6 : 1.)',time:'Gestern'},
      {from:'Kalender',subj:'Design-Review um 14 Uhr',body:'Raum 2.13 oder per Video. Agenda: Toasts, Empty States, Dark Mode.',time:'Gestern'}
    ],[
      {from:'Lena Hofer',subj:'Draft for the home page',body:'I reworked the home page: less text, but a clear primary button. Could you take a look by Friday?',time:'9:14 AM'},
      {from:'Build server',subj:'Deployment successful',body:'Version 2.4.0 is live. 0 errors, 3 warnings.',time:'8:02 AM'},
      {from:'Tom Berger',subj:'Question about colors',body:'Is our light gray (#9AA0A6) on white enough for help text? I think it’s too weak. (He’s right: 2.6:1.)',time:'Yesterday'},
      {from:'Calendar',subj:'Design review at 2 p.m.',body:'Room 2.13 or via video. Agenda: toasts, empty states, dark mode.',time:'Yesterday'}
    ]);
    const md=$('#md',root),list=$('#md-list',root),content=$('#md-content',root),frame=$('#md-frame',root),state=$('#md-state',root);let sel=0;
    list.innerHTML=M.map((m,i)=>`<li><button type="button" class="md-item" data-i="${i}"><b>${esc(m.subj)}</b><span>${esc(m.from)} · ${m.time}</span></button></li>`).join('');
    const wide=()=>frame.clientWidth>=520;
    const show=(i,focus)=>{
      sel=i;
      $$('.md-item',list).forEach((b,j)=>{if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
      const m=M[i];content.innerHTML=`<h3 tabindex="-1">${esc(m.subj)}</h3><p class="hint">${tx('Von','From')} ${esc(m.from)} · ${m.time}</p><p>${esc(m.body)}</p>`;
      md.dataset.view='detail';if(focus&&!wide())$('h3',content).focus();
    };
    const upd=()=>{state.textContent=wide()?tx(`Container ${frame.clientWidth} px ≥ 520 px → nebeneinander`,`Container ${frame.clientWidth} px ≥ 520 px → side by side`):tx(`Container ${frame.clientWidth} px < 520 px → nacheinander (${md.dataset.view==='list'?'Liste':'Detail'})`,`Container ${frame.clientWidth} px < 520 px → one after the other (${md.dataset.view==='list'?'list':'detail'})`)};
    show(0,false);md.dataset.view='list';upd();
    list.addEventListener('click',e=>{const b=e.target.closest('.md-item');if(b){show(+b.dataset.i,true);upd()}});
    $('#md-back',root).addEventListener('click',()=>{md.dataset.view='list';upd();$$('.md-item',list)[sel].focus()});
    $('#md-w',root).addEventListener('input',e=>{frame.style.setProperty('--w',e.target.value+'px');$('#md-wout',root).textContent=e.target.value+' px';requestAnimationFrame(upd)});
    const ro=new ResizeObserver(upd);ro.observe(frame);
    return()=>ro.disconnect();
  },
  do:tx([`Den aktiven Eintrag deutlich markieren – mit Form (Balken, Fläche), nicht nur mit Farbe.`,`Auf breiten Screens ein sinnvolles Detail vorauswählen oder einen hilfreichen Platzhalter zeigen.`,`Beim Zurück: Scrollposition und Fokus auf dem zuletzt geöffneten Eintrag.`],[`Mark the active entry clearly – with shape (bar, fill), not just color.`,`On wide screens, preselect a sensible detail or show a helpful placeholder.`,`On back: keep the scroll position and put focus on the last opened entry.`]),
  dont:tx([`Auf dem Handy beide Spalten auf je 50 % quetschen.`,`Nach „Zurück“ wieder ganz oben in der Liste landen.`,`Das Detail in einem Modal öffnen – dann fehlt die URL.`],[`Squeezing both columns to 50% each on a phone.`,`Landing back at the very top of the list after “Back”.`,`Opening the detail in a modal – then there’s no URL.`]),
  why:tx(`<p>Master-Detail spart Wege: Auf großen Screens sieht man Überblick und Einzelheit gleichzeitig und kann durch Einträge blättern, ohne hin und her zu navigieren.</p><p>Auf kleinen Screens wäre das Nebeneinander unlesbar, also wird es zur Abfolge. Wichtig ist dann das Zurück: Wer aus Eintrag 40 zurückkommt, will bei Eintrag 40 weitermachen.</p><p>Die Demo nutzt <strong>Container Queries</strong>: Das Mini-Postfach reagiert auf die Breite seines Containers, nicht auf die des Fensters. So funktioniert dieselbe Komponente in einer schmalen Sidebar und im breiten Hauptbereich.</p>`,`<p>Master-detail saves trips: on large screens, you see the overview and the details at the same time and can flip through entries without navigating back and forth.</p><p>On small screens, side by side would be unreadable, so it becomes a sequence. What matters then is going back: if you return from entry 40, you want to continue at entry 40.</p><p>The demo uses <strong>container queries</strong>: the mini inbox responds to the width of its container, not the window. That way, the same component works in a narrow sidebar and in the wide main area.</p>`),
  here:tx(`Die ganze App ist ein Master-Detail. Mach das Fenster schmaler als 800 px: Liste und Lektion werden zu zwei Ansichten mit „Alle Lektionen“ als Zurück-Link – und beim Zurückgehen steht der Fokus auf der Lektion, aus der du kommst.`,`The whole app is a master-detail. Make the window narrower than 800 px: the list and the lesson become two views with “All lessons” as the back link – and when you go back, focus is on the lesson you came from.`)
},
{
  id:'navigation',cat:'Navigation',title:tx('Navigation & Orientierung','Navigation & orientation'),
  short:tx('Wo bin ich, wo kann ich hin – Tab Bar, Breadcrumb, aria-current.','Where am I, where can I go – tab bar, breadcrumb, aria-current.'),
  keys:'tab bar bottom navigation hamburger breadcrumb menü menu aria-current badge navigation orientation wayfinding nav bar current page',
  refs:['WCAG 3.2.3 · AA','WCAG 2.4.8 · AAA','Apple HIG: Tab Bars'],
  rule:tx(`Nutzer müssen jederzeit sehen, wo sie sind und wohin sie können. Die Hauptnavigation bleibt an derselben Stelle, zeigt den aktuellen Ort und hat <strong>Icons mit Text</strong>.`,`Users must always be able to see where they are and where they can go. The main navigation stays in the same place, shows the current location and has <strong>icons with text</strong>.`),
  numbers:tx([['3–5','Ziele in einer Bottom Tab Bar'],['Icon + Text','Icons allein sind mehrdeutig'],['aria-current','„page“ für den aktuellen Ort'],['gleiche Stelle','auf jeder Seite (WCAG 3.2.3)']],[['3–5','destinations in a bottom tab bar'],['Icon + text','icons alone are ambiguous'],['aria-current','“page” for the current location'],['Same place','on every page (WCAG 3.2.3)']]),
  demo:`
  <div class="phones">
    <figure class="phone">
      <div class="phone-frame">
        <div class="phone-screen"><p class="phone-title" id="nv-title">${tx('Start','Home')}</p><p id="nv-text">${tx('Deine Übersicht mit den wichtigsten Zahlen.','Your overview with the key numbers.')}</p></div>
        <div class="tabbar" role="group" aria-label="${tx('Hauptnavigation (Beispiel)','Main navigation (example)')}" id="nv-bar">
          <button type="button" class="tab" data-t="${tx('Start','Home')}" aria-current="page">${ic('home')}${tx('Start','Home')}</button>
          <button type="button" class="tab" data-t="${tx('Suche','Search')}">${ic('search')}${tx('Suche','Search')}</button>
          <button type="button" class="tab" data-t="${tx('Nachrichten','Messages')}">${ic('mail')}${tx('Nachrichten','Messages')}<span class="nbadge" aria-hidden="true">3</span><span class="sr-only">${tx(', 3 ungelesen',', 3 unread')}</span></button>
          <button type="button" class="tab" data-t="${tx('Profil','Profile')}">${ic('user')}${tx('Profil','Profile')}</button>
        </div>
      </div>
      <figcaption class="tag tag-good">${ic('ok')} ${tx('4 Ziele, Icon + Text, Badge mit Zahl','4 destinations, icon + text, badge with a number')}</figcaption>
    </figure>
    <figure class="phone">
      <div class="phone-frame" inert>
        <div class="phone-screen"><p class="phone-title">???</p><p>${tx('Welches Icon war nochmal „Favoriten“ und welches „Gesundheit“?','Which icon was “Favorites” again, and which one was “Health”?')}</p></div>
        <div class="tabbar bad"><span class="tab">${ic('home')}</span><span class="tab">${ic('search')}</span><span class="tab">${ic('heart')}</span><span class="tab">${ic('star')}</span><span class="tab">${ic('bell')}</span><span class="tab">${ic('tag')}</span><span class="tab">${ic('gear')}</span></div>
      </div>
      <figcaption class="tag tag-bad">${ic('xc')} ${tx('7 Ziele, nur Icons, zu klein','7 destinations, icons only, too small')}</figcaption>
    </figure>
  </div>
  <div>
    <h3>Breadcrumb</h3>
    <nav class="crumbs" aria-label="${tx('Brotkrümelnavigation (Beispiel)','Breadcrumb (example)')}"><ol><li><a href="#navigation">${tx('Start','Home')}</a></li><li><a href="#navigation">${tx('Einstellungen','Settings')}</a></li><li><span aria-current="page">${tx('Benachrichtigungen','Notifications')}</span></li></ol></nav>
    <p class="demo-note">${tx('Die letzte Station ist kein Link – man ist ja schon dort. Sie trägt <code>aria-current="page"</code>.','The last step isn’t a link – you’re already there. It carries <code>aria-current="page"</code>.')}</p>
  </div>`,
  init(root){
    const T=tx({Start:'Deine Übersicht mit den wichtigsten Zahlen.',Suche:'Suche über alle Inhalte.',Nachrichten:'3 ungelesene Nachrichten.',Profil:'Konto, Einstellungen, Abmelden.'},{Home:'Your overview with the key numbers.',Search:'Search across all content.',Messages:'3 unread messages.',Profile:'Account, settings, sign out.'});
    $('#nv-bar',root).addEventListener('click',e=>{
      const b=e.target.closest('.tab');if(!b)return;
      $$('.tab',$('#nv-bar',root)).forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
      $('#nv-title',root).textContent=b.dataset.t;$('#nv-text',root).textContent=T[b.dataset.t];
    });
  },
  do:tx([`Auf dem Handy: Bottom Tab Bar für die 3–5 wichtigsten Bereiche – dort, wo der Daumen ist.`,`Breadcrumbs bei tiefer Hierarchie (Start › Einstellungen › Benachrichtigungen).`,`Badges sparsam, mit Zahl und Text für Screenreader.`],[`On phones: a bottom tab bar for the 3–5 most important sections – right where your thumb is.`,`Breadcrumbs for deep hierarchies (Home › Settings › Notifications).`,`Use badges sparingly, with a number and text for screen readers.`]),
  dont:tx([`Alle Ziele hinter einem Hamburger-Menü verstecken.`,`Die Reihenfolge der Navigation von Seite zu Seite ändern.`,`Den aktuellen Ort nur durch eine andere Farbe markieren.`],[`Hiding all destinations behind a hamburger menu.`,`Changing the order of the navigation from page to page.`,`Marking the current location only with a different color.`]),
  why:tx(`<p>Orientierung ist die Grundfrage jeder Oberfläche: Wo bin ich? Wo kann ich hin? Wie komme ich zurück? Eine gute Navigation beantwortet alle drei ohne Nachdenken.</p><p>Versteckte Navigation (Hamburger-Menü) wird messbar seltener genutzt – was man nicht sieht, vergisst man. Auf dem Handy ist die Bottom Tab Bar deshalb Standard: sichtbar und in Daumenreichweite.</p><p>Icons allein sind mehrdeutig. Ist das Herz „Favoriten“ oder „Gesundheit“? Mit Text gibt es kein Rätselraten.</p>`,`<p>Orientation is the basic question of every interface: Where am I? Where can I go? How do I get back? Good navigation answers all three without thinking.</p><p>Hidden navigation (hamburger menu) is measurably used less – out of sight, out of mind. That’s why the bottom tab bar is standard on phones: visible and within thumb reach.</p><p>Icons alone are ambiguous. Is the heart “Favorites” or “Health”? With text, there’s no guessing.</p>`),
  here:tx(`In der Liste trägt der aktive Eintrag <code>aria-current="page"</code> und einen Balken links. Screenreader sagen dann „aktuelle Seite“. Die Liste steht immer an derselben Stelle.`,`In the list, the active entry carries <code>aria-current="page"</code> and a bar on the left. Screen readers then announce “current page”. The list always stays in the same place.`)
},
{
  id:'contrast',cat:'Barrierefreiheit',title:tx('Farbkontrast','Color contrast'),
  short:tx('4,5 : 1 für Text, 3 : 1 für große Schrift und Bedienelemente – live prüfen.','4.5:1 for text, 3:1 for large text and controls – test it live.'),
  keys:'kontrast farbe lesbarkeit wcag aa aaa grau contrast ratio color readability gray grey large text',
  refs:['WCAG 1.4.3 · AA','WCAG 1.4.6 · AAA','WCAG 1.4.11 · AA'],
  rule:tx(`Normaler Text braucht mindestens <strong>4,5 : 1</strong> Kontrast zum Hintergrund, große Schrift <strong>3 : 1</strong>. Rahmen von Eingabefeldern, Icons und Fokusringe brauchen ebenfalls 3 : 1.`,`Normal text needs a contrast of at least <strong>4.5:1</strong> against its background, large text <strong>3:1</strong>. Input borders, icons and focus rings need 3:1 as well.`),
  numbers:tx([['4,5 : 1','Fließtext (AA)'],['3 : 1','große Schrift ab 24 px bzw. 18,66 px fett'],['3 : 1','UI-Grafik: Feldrahmen, Icons, Fokus'],['7 : 1','Fließtext (AAA)']],[['4.5:1','Body text (AA)'],['3:1','large text from 24 px, or 18.66 px bold'],['3:1','UI graphics: field borders, icons, focus'],['7:1','Body text (AAA)']]),
  demo:`
  <div class="ct">
    <div class="ct-inputs">
      <div class="field"><label for="ct-fg">${tx('Textfarbe','Text color')}</label><div class="ct-pick"><input type="color" id="ct-fg" value="#767676"><output id="ct-fg-hex" for="ct-fg">#767676</output></div></div>
      <div class="field"><label for="ct-bg">${tx('Hintergrund','Background')}</label><div class="ct-pick"><input type="color" id="ct-bg" value="#ffffff"><output id="ct-bg-hex" for="ct-bg">#FFFFFF</output></div></div>
      <div><p class="hint" style="margin-bottom:6px">${tx('Beispiele','Examples')}</p><div class="ct-presets">
        <button type="button" class="btn btn-secondary" data-fg="#a3a3a3" data-bg="#ffffff">${tx('Placeholder-Grau','Placeholder gray')}</button>
        <button type="button" class="btn btn-secondary" data-fg="#ffffff" data-bg="#f5c400">${tx('Weiß auf Gelb','White on yellow')}</button>
        <button type="button" class="btn btn-secondary" data-fg="#767676" data-bg="#ffffff">${tx('Gerade so AA','Just passes AA')}</button>
        <button type="button" class="btn btn-secondary" data-brand="1">${tx('Markenfarbe','Brand color')}</button>
      </div></div>
    </div>
    <div style="display:grid;gap:14px">
      <div class="ct-preview" id="ct-preview"><p class="ct-normal">${tx('Normaler Text, 16 px. So liest sich Fließtext.','Normal text, 16 px. This is how body text reads.')}</p><p class="ct-large">${tx('Große Schrift, 24 px','Large text, 24 px')}</p><span class="ct-ui">${tx('Feldrahmen / Icon','Field border / icon')}</span></div>
      <p class="ct-ratio"><output id="ct-ratio" aria-live="polite">${tx('4,54 : 1','4.54:1')}</output></p>
      <ul class="ct-results" id="ct-results"></ul>
    </div>
  </div>`,
  init(root){
    const fg=$('#ct-fg',root),bg=$('#ct-bg',root);
    const upd=()=>{
      const r=ratio(fg.value,bg.value),pv=$('#ct-preview',root);
      pv.style.color=fg.value;pv.style.background=bg.value;
      $('#ct-fg-hex',root).textContent=fg.value.toUpperCase();$('#ct-bg-hex',root).textContent=bg.value.toUpperCase();
      $('#ct-ratio',root).textContent=fmt(r)+tx(' : 1',':1');
      const C=tx([['Fließtext AA',4.5],['Große Schrift AA',3],['UI-Elemente AA',3],['Fließtext AAA',7]],[['Body text AA',4.5],['Large text AA',3],['UI elements AA',3],['Body text AAA',7]]);
      $('#ct-results',root).innerHTML=C.map(([n,min])=>{const ok=r>=min;return`<li>${ic(ok?'ok':'xc')}<span><span class="${ok?'pass':'fail'}">${ok?tx('bestanden','pass'):tx('nicht bestanden','fail')}</span> – ${n} (${tx('mind.','min.')} ${tx(String(min).replace('.',','),String(min))}${tx(' : 1',':1')})</span></li>`}).join('');
      $$('#ct-results .ic',root).forEach(i=>i.style.color=i.nextElementSibling.firstElementChild.classList.contains('pass')?'var(--success)':'var(--danger)');
    };
    fg.addEventListener('input',upd);bg.addEventListener('input',upd);
    $$('.ct-presets .btn',root).forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.brand){fg.value='#ffffff';bg.value=cssVar('--brand-l').toLowerCase()}else{fg.value=b.dataset.fg;bg.value=b.dataset.bg}
      upd();
    }));
    upd();
  },
  do:tx([`Kontrast schon beim Anlegen der Farbtokens prüfen – für Hell und Dunkel.`,`Placeholder und „ausgegrauten“ Hilfetext mitprüfen, das sind die Klassiker.`,`Bei White-Label: jede Kundenfarbe automatisch testen.`],[`Check contrast as soon as you create the color tokens – for light and dark.`,`Also check placeholders and “grayed-out” helper text – those are the classic offenders.`,`For white-label: test every customer color automatically.`]),
  dont:tx([`Hellgrauer Text auf Weiß, „weil es eleganter aussieht“.`,`Weißer Text auf Gelb oder Hellgrün.`,`Text über Fotos ohne abdunkelndes Overlay.`],[`Light gray text on white “because it looks more elegant.”`,`White text on yellow or light green.`,`Text over photos without a darkening overlay.`]),
  why:tx(`<p>Kontrast hilft nicht nur Menschen mit Sehschwäche, sondern allen im Sonnenlicht, auf billigen Displays oder mit gedimmtem Bildschirm.</p><p>Das Verhältnis wird aus der <em>relativen Leuchtdichte</em> beider Farben berechnet: (L<sub>hell</sub> + 0,05) / (L<sub>dunkel</sub> + 0,05). Schwarz auf Weiß ergibt 21 : 1, gleiche Farben 1 : 1. Grün trägt dabei am meisten zur Helligkeit bei, Blau am wenigsten – deshalb wirkt Gelb so hell.</p>`,`<p>Contrast doesn’t just help people with low vision – it helps everyone in bright sunlight, on cheap displays or with a dimmed screen.</p><p>The ratio is calculated from the <em>relative luminance</em> of both colors: (L<sub>lighter</sub> + 0.05) / (L<sub>darker</sub> + 0.05). Black on white gives 21:1, identical colors 1:1. Green contributes the most to brightness and blue the least – that’s why yellow looks so bright.</p>`),
  here:tx(`Jede Markenfarbe dieser App wurde gegen ihre Textfarbe geprüft, im hellen und im dunklen Theme. In der Lektion „White-Label“ läuft die Prüfung live, sobald du die Marke wechselst.`,`Every brand color in this app was checked against its text color, in both the light and the dark theme. In the “White label” lesson, the check runs live as soon as you switch brands.`)
},
{
  id:'focus',cat:'Barrierefreiheit',title:tx('Tastatur & sichtbarer Fokus','Keyboard & visible focus'),
  short:tx('Alles per Tab erreichbar, Fokus immer sichtbar, Reihenfolge logisch.','Everything reachable with Tab, focus always visible, logical order.'),
  keys:'tastatur keyboard fokus focus outline tab skip link tabindex focus ring focus-visible keyboard navigation tab order shortcuts',
  refs:['WCAG 2.1.1 · A','WCAG 2.4.3 · A','WCAG 2.4.7 · AA','WCAG 2.4.11 · AA'],
  rule:tx(`Alles, was mit der Maus geht, muss auch mit der Tastatur gehen. Das fokussierte Element ist <strong>immer deutlich sichtbar</strong>, und die Tab-Reihenfolge folgt der Lesereihenfolge.`,`Everything you can do with a mouse must also work with a keyboard. The focused element is <strong>always clearly visible</strong>, and the tab order follows the reading order.`),
  numbers:tx([['≥ 2 px','Dicke des Fokusrings'],['3 : 1','Kontrast des Fokusrings'],[':focus-visible','Ring bei Tastatur, nicht nach Mausklick'],['Tab / Shift+Tab','vor und zurück']],[['≥ 2 px','focus ring thickness'],['3:1','focus ring contrast'],[':focus-visible','ring for keyboard, not after a mouse click'],['Tab / Shift+Tab','forward and back']]),
  demo:`
  <div>
    <div class="fd">
      <div class="fd-col"><p class="tag tag-bad">${ic('xc')} ${tx('Ohne Fokusring','Without focus ring')}</p><div class="btn-row nofocus"><button type="button" class="btn btn-secondary">${tx('Eins','One')}</button><button type="button" class="btn btn-secondary">${tx('Zwei','Two')}</button><button type="button" class="btn btn-secondary">${tx('Drei','Three')}</button></div></div>
      <div class="fd-col"><p class="tag tag-good">${ic('ok')} ${tx('Mit Fokusring','With focus ring')}</p><div class="btn-row"><button type="button" class="btn btn-secondary">${tx('Eins','One')}</button><button type="button" class="btn btn-secondary">${tx('Zwei','Two')}</button><button type="button" class="btn btn-secondary">${tx('Drei','Three')}</button></div></div>
    </div>
    <p class="demo-note">${tx('Klick auf „Live-Beispiel“ oben und drück dann mehrmals <kbd>Tab</kbd>. Wo bist du gerade – links?','Click “Live example” above, then press <kbd>Tab</kbd> a few times. Where are you right now – on the left?')}</p>
  </div>
  <div>
    <h3>${tx('Echter Button vs.','Real button vs.')} <code>div</code></h3>
    <div class="btn-row"><div class="fake-btn" id="fd-fake">${tx('Speichern','Save')} (div)</div><button type="button" class="btn btn-primary" id="fd-real">${tx('Speichern','Save')} (button)</button></div>
    <p class="demo-note" id="fd-log" aria-live="polite">${tx('Versuch, beide nur mit der Tastatur auszulösen.','Try to trigger both using only the keyboard.')}</p>
  </div>
  <div>
    <h3>${tx('Tastenkürzel dieser App','Keyboard shortcuts in this app')}</h3>
    <div class="table-wrap"><table class="kb-table"><tbody>
      <tr><th scope="row"><kbd>Tab</kbd> / <kbd>Shift</kbd> + <kbd>Tab</kbd></th><td>${tx('Zum nächsten / vorherigen Bedienelement','To the next / previous control')}</td></tr>
      <tr><th scope="row"><kbd>Enter</kbd> / <kbd>${tx('Leertaste','Space')}</kbd></th><td>${tx('Button oder Link auslösen, Checkbox umschalten','Activate a button or link, toggle a checkbox')}</td></tr>
      <tr><th scope="row"><kbd>←</kbd> <kbd>→</kbd></th><td>${tx('Innerhalb einer Radio-Gruppe wechseln (z. B. Wartezeit)','Move within a radio group (e.g. wait time)')}</td></tr>
      <tr><th scope="row"><kbd>/</kbd></th><td>${tx('In die Lektionssuche springen','Jump to the lesson search')}</td></tr>
      <tr><th scope="row"><kbd>Esc</kbd></th><td>${tx('Dialog schließen','Close dialog')}</td></tr>
      <tr><th scope="row"><kbd>${tx('Strg','Ctrl')}</kbd> + <kbd>Z</kbd></th><td>${tx('Letztes Löschen rückgängig (solange der Toast sichtbar ist)','Undo the last delete (while the toast is visible)')}</td></tr>
    </tbody></table></div>
  </div>`,
  init(root){
    const log=$('#fd-log',root);
    $('#fd-fake',root).addEventListener('click',()=>{log.textContent=tx('Das div hat reagiert – aber nur auf die Maus. Per Tab kommst du gar nicht hin, und ein Screenreader sagt nicht „Schaltfläche“.','The div responded – but only to the mouse. You can’t reach it with Tab at all, and a screen reader doesn’t announce “button.”')});
    $('#fd-real',root).addEventListener('click',e=>{log.textContent=e.detail===0?tx('Button per Tastatur ausgelöst. Das gibt es bei <button> gratis.','Button triggered by keyboard. You get that for free with <button>.'):tx('Button per Maus ausgelöst. Probier es auch mit Tab + Enter.','Button triggered by mouse. Try it with Tab + Enter too.')});
  },
  do:tx([`Echte <code>&lt;button&gt;</code> und <code>&lt;a href&gt;</code> verwenden – die sind automatisch fokussierbar und reagieren auf Enter und Leertaste.`,`Skip Link als erstes Element: „Zum Inhalt springen“.`,`Fokus nie hinter Sticky Headern oder Cookie-Bannern verstecken (WCAG 2.4.11, neu in 2.2).`],[`Use real <code>&lt;button&gt;</code> and <code>&lt;a href&gt;</code> elements – they’re focusable automatically and respond to Enter and Space.`,`A skip link as the first element: “Skip to content.”`,`Never hide focus behind sticky headers or cookie banners (WCAG 2.4.11, new in 2.2).`]),
  dont:tx([`<code>outline: none</code> ohne Ersatz.`,`<code>&lt;div onclick&gt;</code> als Button.`,`Positiver <code>tabindex</code> (1, 2, 3 …) – zerstört die natürliche Reihenfolge.`],[`<code>outline: none</code> without a replacement.`,`<code>&lt;div onclick&gt;</code> as a button.`,`Positive <code>tabindex</code> (1, 2, 3 …) – it wrecks the natural order.`]),
  why:tx(`<p>Viele Menschen bedienen ohne Maus: mit Tastatur, Schaltern, Sprachsteuerung oder Screenreader. Auch Power-User sind mit der Tastatur schneller. Ohne sichtbaren Fokus ist das, als würde man mit einem unsichtbaren Mauszeiger arbeiten.</p><p><code>:focus-visible</code> löst den alten Streit zwischen Design und Barrierefreiheit: Der Browser zeigt den Ring nur, wenn er sinnvoll ist – bei Tastaturbedienung, nicht nach jedem Mausklick.</p>`,`<p>Many people don’t use a mouse: they use a keyboard, switches, voice control or a screen reader. Power users are faster with the keyboard, too. Without visible focus, it’s like working with an invisible mouse pointer.</p><p><code>:focus-visible</code> settles the old argument between design and accessibility: the browser shows the ring only when it makes sense – during keyboard use, not after every mouse click.</p>`),
  here:tx(`Lade die Seite neu und drück sofort <kbd>Tab</kbd>: Oben links erscheint der Skip Link „Zum Inhalt springen“. Taste <kbd>/</kbd> springt jederzeit in die Suche.`,`Reload the page and press <kbd>Tab</kbd> right away: the “Skip to content” skip link appears in the top left. The <kbd>/</kbd> key jumps to the search at any time.`)
},
{
  id:'color-alone',cat:'Barrierefreiheit',title:tx('Farbe nie als einziges Signal','Never use color alone'),
  short:tx('Status und Fehler zusätzlich mit Icon, Text oder Form zeigen.','Show status and errors with an icon, text or shape as well.'),
  keys:'farbenblind farbsehschwäche rot grün status icon unterstrichen links color blind color blindness color vision deficiency red green underlined links use of color',
  refs:['WCAG 1.4.1 · A','WCAG 1.4.11 · AA'],
  rule:tx(`Information darf nie <strong>nur</strong> über Farbe transportiert werden. Rot für Fehler ist gut – aber erst mit Icon und Text ist es für alle verständlich.`,`Information must never be conveyed <strong>only</strong> through color. Red for errors is fine – but only with an icon and text does everyone understand it.`),
  numbers:tx([['~ 8 %','der Männer mit Farbsehschwäche (meist Rot-Grün)'],['~ 0,5 %','der Frauen'],['2 Signale','Farbe + Icon, Text, Form oder Vorzeichen'],['Level A','die Grundstufe – also Pflicht']],[['~8%','of men have a color vision deficiency (mostly red-green)'],['~0.5%','of women'],['2 signals','color + icon, text, shape or sign'],['Level A','the base level – so it’s mandatory']]),
  demo:`
  <p style="margin:0"><button type="button" class="switch" role="switch" aria-checked="false" id="ca-gray"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('Farbe entfernen (Graustufen)','Remove color (grayscale)')}</span></button></p>
  <div class="compare ca" id="ca">
    <figure>
      <figcaption class="tag tag-bad">${ic('xc')} ${tx('Nur Farbe','Color only')}</figcaption>
      <div inert>
        <div class="field ca-field"><label>IBAN</label><input class="input" value="AT61 1904 3002 3457 32"></div>
        <ul class="status-list"><li><span class="dot dot-g"></span>Server A</li><li><span class="dot dot-r"></span>Server B</li></ul>
        <div class="pl"><span class="up">${tx('2,4 %','2.4%')}</span><span class="down">${tx('1,1 %','1.1%')}</span></div>
        <p>${tx('Details in der','Details in the')} <a class="nolink" href="#color-alone">${tx('Anleitung','guide')}</a>.</p>
      </div>
    </figure>
    <figure>
      <figcaption class="tag tag-good">${ic('ok')} ${tx('Farbe + zweites Signal','Color + a second signal')}</figcaption>
      <div inert>
        <div class="field ca-field"><label>IBAN</label><input class="input" value="AT61 1904 3002 3457 32"><p class="err" style="color:#D93025">${ic('alert')}<span>${tx('Eine Ziffer fehlt: Österreichische IBANs haben 20 Stellen.','A digit is missing: Austrian IBANs have 20 characters.')}</span></p></div>
        <ul class="status-list"><li><span class="dot dot-g"></span>Server A – online</li><li><span class="dot dot-hollow"></span>Server B – offline</li></ul>
        <div class="pl"><span class="up">▲ ${tx('+2,4 %','+2.4%')}</span><span class="down">▼ ${tx('−1,1 %','−1.1%')}</span></div>
        <p>${tx('Details in der','Details in the')} <a href="#color-alone">${tx('Anleitung','guide')}</a>.</p>
      </div>
    </figure>
  </div>
  <p class="demo-note" style="margin:0">${tx('Graustufen sind nur eine grobe Näherung an Farbsehschwäche – aber sie zeigen sofort, welche Information allein an der Farbe hängt.','Grayscale is only a rough approximation of color blindness – but it shows you right away which information depends on color alone.')}</p>`,
  init(root){$('#ca-gray',root).addEventListener('toggle',e=>$('#ca',root).classList.toggle('gray',e.detail))},
  do:tx([`Fehler: rote Umrandung + Icon + Fehlertext.`,`Status-Punkte mit Text („online“) und unterschiedlicher Form ergänzen.`,`Links im Fließtext unterstreichen.`],[`Errors: red border + icon + error text.`,`Add text (“online”) and different shapes to status dots.`,`Underline links in body text.`]),
  dont:tx([`Diagrammlinien nur farblich unterscheiden.`,`„Pflichtfelder sind rot markiert.“`,`Grün/Rot als einzige Unterscheidung von Gewinn und Verlust – Vorzeichen und Pfeile kosten nichts.`],[`Telling chart lines apart by color only.`,`“Required fields are marked in red.”`,`Green/red as the only way to tell gains from losses – signs and arrows cost nothing.`]),
  why:tx(`<p>Rund jeder zwölfte Mann unterscheidet Rot und Grün schlecht. Dazu kommen Graustufen-Displays, Sonnenlicht, Ausdrucke und Nachtmodi. Wer Status nur über Farbe kommuniziert, schließt viele aus, oft ohne es zu merken.</p><p>Die Lösung ist Redundanz: Farbe <em>plus</em> ein zweites Signal. Die Farbe darf bleiben – sie beschleunigt das Erkennen für alle, die sie sehen.</p>`,`<p>About one in twelve men has trouble telling red from green. Add grayscale displays, sunlight, printouts and night modes. If you communicate status through color alone, you exclude a lot of people, often without noticing.</p><p>The solution is redundancy: color <em>plus</em> a second signal. The color can stay – it speeds up recognition for everyone who can see it.</p>`),
  here:tx(`Gelernte Lektionen in der Liste haben ein Häkchen <em>und</em> das Wort „gelernt“. Der aktive Eintrag hat einen Balken, nicht nur eine andere Hintergrundfarbe. Links im Text sind unterstrichen.`,`Learned lessons in the list have a checkmark <em>and</em> the word “learned.” The active item has a bar, not just a different background color. Links in the text are underlined.`)
},
{
  id:'semantics',cat:'Barrierefreiheit',title:tx('Semantisches HTML & Screenreader','Semantic HTML & screen readers'),
  short:tx('Das richtige Element sagt dem Screenreader, was etwas ist.','The right element tells the screen reader what something is.'),
  keys:'html semantik screenreader aria label alt text überschrift heading landmark accessibility tree semantics screen reader headings outline landmarks accessible name link text',
  refs:['WCAG 1.1.1 · A','WCAG 1.3.1 · A','WCAG 4.1.2 · A'],
  rule:tx(`Nimm das HTML-Element, das zur Bedeutung passt: <code>button</code> für Aktionen, <code>a</code> für Navigation, Überschriften in richtiger Reihenfolge, Landmarks für Bereiche. <strong>ARIA nur dort, wo HTML nicht reicht.</strong>`,`Use the HTML element that matches the meaning: <code>button</code> for actions, <code>a</code> for navigation, headings in the right order, landmarks for regions. <strong>Use ARIA only where HTML isn’t enough.</strong>`),
  numbers:tx([['1','h1 pro Seite bzw. Ansicht'],['keine Sprünge','h2 → h3, nicht h2 → h4'],['alt=""','für rein dekorative Bilder'],['aria-label','für Buttons, die nur ein Icon haben']],[['1','h1 per page or view'],['no skipping','h2 → h3, not h2 → h4'],['alt=""','for purely decorative images'],['aria-label','for buttons that only have an icon']]),
  demo:`
  <div class="table-wrap"><table class="sem">
    <caption>${tx('Was ein Screenreader aus deinem Code macht','What a screen reader makes of your code')}</caption>
    <thead><tr><th scope="col">${tx('Bewertung','Verdict')}</th><th scope="col">Code</th><th scope="col">${tx('Ansage','Announcement')}</th></tr></thead>
    <tbody>
      <tr><td><span class="tag tag-bad">${ic('xc')} ${tx('Falsch','Don’t')}</span></td><td><code>&lt;button&gt;&lt;svg …/&gt;&lt;/button&gt;</code></td><td>${tx('„Schaltfläche“ – wofür?','“Button” – for what?')}</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} ${tx('Richtig','Do')}</span></td><td><code>&lt;button aria-label="${tx('Suchen','Search')}"&gt;&lt;svg aria-hidden="true" …/&gt;&lt;/button&gt;</code></td><td>${tx('„Suchen, Schaltfläche“','“Search, button”')}</td></tr>
      <tr><td><span class="tag tag-bad">${ic('xc')} ${tx('Falsch','Don’t')}</span></td><td><code>&lt;div class="btn" onclick="save()"&gt;${tx('Speichern','Save')}&lt;/div&gt;</code></td><td>${tx('„Speichern“ – kein Hinweis, dass man klicken kann; per Tab nicht erreichbar','“Save” – no hint that you can click it; not reachable with Tab')}</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} ${tx('Richtig','Do')}</span></td><td><code>&lt;button type="button"&gt;${tx('Speichern','Save')}&lt;/button&gt;</code></td><td>${tx('„Speichern, Schaltfläche“','“Save, button”')}</td></tr>
      <tr><td><span class="tag tag-bad">${ic('xc')} ${tx('Falsch','Don’t')}</span></td><td><code>&lt;img src="q3.png"&gt;</code></td><td>${tx('„q3.png, Bild“','“q3.png, image”')}</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} ${tx('Richtig','Do')}</span></td><td><code>&lt;img src="q3.png" alt="${tx('Umsatz Q3: plus 12 % zum Vorjahr','Q3 revenue: up 12% year over year')}"&gt;</code></td><td>${tx('„Umsatz Q3: plus 12 % zum Vorjahr, Bild“','“Q3 revenue: up 12% year over year, image”')}</td></tr>
      <tr><td><span class="tag tag-bad">${ic('xc')} ${tx('Falsch','Don’t')}</span></td><td><code>&lt;a href="/${tx('preise','prices')}.pdf"&gt;${tx('hier','here')}&lt;/a&gt;</code></td><td>${tx('„hier, Link“','“here, link”')}</td></tr>
      <tr><td><span class="tag tag-good">${ic('ok')} ${tx('Richtig','Do')}</span></td><td><code>&lt;a href="/${tx('preise','prices')}.pdf"&gt;${tx('Preisliste (PDF, 2 MB)','Price list (PDF, 2 MB)')}&lt;/a&gt;</code></td><td>${tx('„Preisliste (PDF, 2 MB), Link“','“Price list (PDF, 2 MB), link”')}</td></tr>
    </tbody>
  </table></div>
  <div>
    <h3>${tx('Die Struktur dieser Seite, wie ein Screenreader sie sieht','The structure of this page as a screen reader sees it')}</h3>
    <div class="btn-row"><button type="button" class="btn btn-secondary" id="sm-heads">${tx('Überschriften-Gliederung anzeigen','Show heading outline')}</button><button type="button" class="btn btn-secondary" id="sm-lm">${tx('Landmarks anzeigen','Show landmarks')}</button></div>
    <div class="sm-out" id="sm-out" aria-live="polite" style="margin-top:12px"></div>
  </div>`,
  init(root){
    const out=$('#sm-out',root);
    const vis=el=>!el.closest('[hidden],dialog:not([open])')&&(el.checkVisibility?el.checkVisibility():true);
    $('#sm-heads',root).addEventListener('click',()=>{
      const hs=$$('h1,h2,h3,h4,h5,h6').filter(vis);
      out.innerHTML=`<p class="hint">${hs.length} ${tx('Überschriften. Screenreader-Nutzer springen mit der Taste H von einer zur nächsten.',(hs.length===1?'heading':'headings')+'. Screen reader users jump from one to the next with the H key.')}</p><ul>${hs.map(h=>{const l=+h.tagName[1];return`<li style="--lvl:${l}"><span class="lvl">H${l}</span>${esc(h.textContent.trim())}</li>`}).join('')}</ul>`;
    });
    $('#sm-lm',root).addEventListener('click',()=>{
      const R={HEADER:'banner',NAV:'navigation',MAIN:'main',ASIDE:'complementary',FOOTER:'contentinfo',SECTION:'region',FORM:'form'};
      const name=el=>el.getAttribute('aria-label')||(el.getAttribute('aria-labelledby')||'').split(' ').map(id=>document.getElementById(id)?.textContent.trim()).filter(Boolean).join(' ');
      const lms=$$('header,nav,main,aside,footer,section[aria-labelledby],section[aria-label]').filter(vis).filter(el=>!(el.tagName==='HEADER'&&el.closest('article,section,aside,nav,main')));
