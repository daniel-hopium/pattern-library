{id:'radio-label',grp:0,topic:'Radio-Buttons',title:'Radio-Button: Der Text gehört zur Klickfläche',lesson:'forms',
 try:'Klick auf das Wort „Express“ statt auf den kleinen Kreis.',
 bad:`<fieldset class="du-fs"><legend>Versand</legend><div class="du-plain"><input type="radio" name="{p}" checked><span>Standard, 3–5 Tage</span></div><div class="du-plain"><input type="radio" name="{p}"><span>Express, morgen da</span></div></fieldset>`,
 good:`<fieldset class="du-fs"><legend>Versand</legend><label class="du-choice"><input type="radio" name="{p}" checked>Standard, 3–5 Tage</label><label class="du-choice"><input type="radio" name="{p}">Express, morgen da</label></fieldset>`,
 why:'Ein <code>&lt;label&gt;</code> macht den Text zur Klickfläche: Aus einem 14-px-Kreis wird eine ganze Zeile. Screenreader lesen den Text als Namen des Radios vor. Hover-Hintergrund und <code>cursor: pointer</code> zeigen, dass die ganze Zeile reagiert.'},
{id:'placeholder',grp:0,topic:'Eingabefelder',title:'Der Platzhalter ist kein Label',lesson:'forms',
 try:'Tipp in beide Felder etwas ein. Weißt du danach noch, welches Feld welches war?',
 bad:`<div class="du-stack"><input class="input du-ph" placeholder="IBAN" aria-label="IBAN"><input class="input du-ph" placeholder="BIC" aria-label="BIC"></div>`,
 good:`<div class="du-stack"><div class="field"><label for="{p}-i">IBAN</label><input class="input" id="{p}-i" aria-describedby="{p}-h"><p class="hint" id="{p}-h">AT und 18 Ziffern, Leerzeichen egal</p></div><div class="field"><label for="{p}-b">BIC <span class="opt">optional</span></label><input class="input" id="{p}-b"></div></div>`,
 why:'Der Platzhalter verschwindet mit dem ersten Buchstaben – genau dann, wenn man prüfen will, ob man im richtigen Feld ist. Meist ist er auch zu hell für 4,5 : 1 und wirkt, als wäre das Feld schon ausgefüllt.'},
{id:'validation',grp:0,topic:'Validierung',title:'Fehler nicht beim ersten Tastendruck zeigen',lesson:'forms',
 try:'Tipp langsam eine E-Mail-Adresse ein und verlass dann das Feld mit Tab.',
 bad:`<div class="field"><label for="{p}">E-Mail</label><input class="input" id="{p}" type="email" autocomplete="off"><p class="du-red" hidden>Ungültige E-Mail-Adresse!</p></div>`,
 good:`<div class="field"><label for="{p}">E-Mail</label><input class="input" id="{p}" type="email" autocomplete="off" aria-describedby="{p}-e"><p class="err" id="{p}-e" hidden></p></div>`,
 init:{bad(el){const i=$('input',el),e=$('.du-red',el);i.addEventListener('input',()=>{e.hidden=!i.value||duValid(i.value)})},
  good(el){const i=$('input',el),e=$('.err',el);
   const show=()=>{const v=i.value.trim();if(!v||duValid(v)){e.hidden=true;i.removeAttribute('aria-invalid');return}
     e.innerHTML=ic('alert')+(v.includes('@')?'Nach dem @ fehlt noch die Domain, etwa firma.at.':'Es fehlt das @, etwa name@firma.at.');e.hidden=false;i.setAttribute('aria-invalid','true')};
   i.addEventListener('blur',show);i.addEventListener('input',()=>{if(!e.hidden)show()})}},
 why:'„Früh loben, spät tadeln“: Fehler erst zeigen, wenn jemand das Feld verlässt – einen behobenen Fehler aber sofort wegnehmen. Wer beim ersten Buchstaben angemeckert wird, ist noch gar nicht fertig. Und die Meldung sagt, was fehlt.'},
{id:'few-options',grp:0,topic:'Auswahl',title:'Zwei, drei Optionen nicht im Dropdown verstecken',lesson:'forms',
 try:'Wähl in beiden eine Zahlungsart und zähl die Klicks.',
 bad:`<div class="field"><label for="{p}">Zahlungsart</label><select id="{p}"><option>Bitte wählen …</option><option>Rechnung</option><option>Kreditkarte</option></select></div>`,
 good:`<fieldset class="seg"><legend>Zahlungsart</legend><div class="seg-opts"><label><input type="radio" name="{p}">Rechnung</label><label><input type="radio" name="{p}">Kreditkarte</label></div></fieldset>`,
 why:'Ein Dropdown versteckt die Optionen hinter einem Klick und braucht einen zweiten zum Wählen. Bis etwa fünf Optionen sind sichtbare Radios oder ein Segmented Control schneller – und man sieht auf einen Blick, was es gibt.'},
{id:'custom-checkbox',grp:0,topic:'Eigene Checkbox',title:'Eigene Checkbox: das Input nie mit display: none verstecken',lesson:'focus',
 try:'Spring mit Tab zu den Checkboxen und drück die Leertaste.',
 bad:`<label class="du-cbx"><input type="checkbox" class="du-hide-bad"><span class="du-box" aria-hidden="true"></span>Newsletter abonnieren</label>`,
 good:`<label class="du-cbx"><input type="checkbox" class="du-hide-good"><span class="du-box" aria-hidden="true"></span>Newsletter abonnieren</label>`,
 why:'<code>display: none</code> nimmt das Input aus der Tab-Reihenfolge und aus dem Accessibility Tree – mit der Maus geht es, mit Tastatur und Screenreader nicht. Richtig: das Input nur optisch verstecken (oder <code>appearance: none</code> und selbst gestalten) und den Fokusring an die eigene Box hängen.'},
{id:'field-width',grp:0,topic:'Adressformular',title:'Die Feldbreite verrät die erwartete Länge',lesson:'forms',
 try:'Nur hinschauen: Wo erkennst du schneller, was wohin gehört?',
 bad:`<div class="du-stack"><div class="field"><label for="{p}-1">Straße</label><input class="input" id="{p}-1"></div><div class="field"><label for="{p}-2">Hausnummer</label><input class="input" id="{p}-2"></div><div class="field"><label for="{p}-3">PLZ</label><input class="input" id="{p}-3"></div><div class="field"><label for="{p}-4">Ort</label><input class="input" id="{p}-4"></div></div>`,
 good:`<div class="du-stack"><div class="du-row2"><div class="field du-grow"><label for="{p}-1">Straße</label><input class="input" id="{p}-1" autocomplete="address-line1"></div><div class="field du-w5"><label for="{p}-2">Nr.</label><input class="input" id="{p}-2"></div></div><div class="du-row2"><div class="field du-w6"><label for="{p}-3">PLZ</label><input class="input" id="{p}-3" inputmode="numeric" autocomplete="postal-code"></div><div class="field du-grow"><label for="{p}-4">Ort</label><input class="input" id="{p}-4" autocomplete="address-level2"></div></div></div>`,
 why:'Die Breite ist ein stiller Hinweis: Ein kurzes Feld sagt „hier kommt wenig hin“. Vier gleich breite Felder zwingen dazu, jedes Label zu lesen – und brauchen doppelt so viel Höhe. Aber nie so schmal, dass die Eingabe abgeschnitten wird.'},

{id:'clickable-card',grp:1,topic:'Klickbare Karte',title:'Was klickbar ist, sieht klickbar aus',lesson:'buttons',
 try:'Fahr mit der Maus über beide Karten, klick drauf – oder spring mit Tab hin.',
 bad:`<div class="du-card-bad"><b>Projekt Alpha</b><span>3 offene Aufgaben</span></div>`,
 good:`<button type="button" class="du-card-good"><b>Projekt Alpha</b><span>3 offene Aufgaben</span></button>`,
 init:{bad(el){$('.du-card-bad',el).addEventListener('click',()=>toast({msg:'Projekt Alpha geöffnet – hättest du gewusst, dass das geht?',duration:3000}))},
  good(el){$('.du-card-good',el).addEventListener('click',()=>toast({msg:'Projekt Alpha geöffnet.',duration:3000}))}},
 why:'Affordance heißt: Ein Element zeigt, was man damit tun kann. Hover-Zustand, Zeiger und Fokusring sind die Signale fürs Klicken. Die schlechte Karte reagiert zwar, verrät es aber nicht – und mit der Tastatur kommt man gar nicht hin.',
 note:'Streitfall <code>cursor: pointer</code>: Browser geben die Hand nur Links. Viele Design-Systeme setzen sie auch auf Buttons, native Apps von Apple und Microsoft nicht. Beides ist vertretbar. Falsch ist nur, wenn Klickbares gar kein Signal gibt – oder Nicht-Klickbares eine Hand zeigt.'},
{id:'disabled-button',grp:1,topic:'Absende-Button',title:'Kein grauer Button ohne Grund',lesson:'buttons',
 try:'Tipp „Al“ ein und versuch abzuschicken.',
 bad:`<div class="du-stack"><div class="field"><label for="{p}">Benutzername</label><input class="input" id="{p}" autocomplete="off"></div><div><button type="button" class="btn du-dis" disabled>Registrieren</button></div></div>`,
 good:`<div class="du-stack"><div class="field"><label for="{p}">Benutzername</label><input class="input" id="{p}" autocomplete="off" aria-describedby="{p}-e"><p class="err" id="{p}-e" hidden></p></div><div><button type="button" class="btn btn-primary">Registrieren</button></div></div>`,
 init:{bad(el){const i=$('input',el),b=$('button',el);i.addEventListener('input',()=>{b.disabled=i.value.trim().length<3})},
  good(el){const i=$('input',el),e=$('.err',el);
   $('button',el).addEventListener('click',()=>{const n=i.value.trim().length;
     if(n<3){e.innerHTML=ic('alert')+`Mindestens 3 Zeichen – bisher ${n}.`;e.hidden=false;i.setAttribute('aria-invalid','true');i.focus()}
     else{e.hidden=true;i.removeAttribute('aria-invalid');toast({msg:'Registriert.',type:'success',duration:2500})}});
   i.addEventListener('input',()=>{if(!e.hidden&&i.value.trim().length>=3){e.hidden=true;i.removeAttribute('aria-invalid')}})}},
 why:'Ein grauer Button sagt „geht nicht“, aber nicht warum. Aktiv lassen und beim Klick zeigen, was fehlt, führt direkt zur Lösung. Dazu kommt: <code>disabled</code> ist nicht fokussierbar, Screenreader-Nutzer finden ihn oft gar nicht, und das Grau hat selten genug Kontrast.'},
{id:'double-submit',grp:1,topic:'Bestell-Button',title:'Ein Doppelklick bestellt doppelt',lesson:'loading',
 try:'Doppelklick auf „Bestellen“.',
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">Bestellen</button><span class="du-out" role="status"></span></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary du-keep"><span class="du-lbl">Bestellen</span><span class="du-spin" hidden></span></button><span class="du-out" role="status"></span></div>`,
 init:{bad(el){let n=0;const o=$('.du-out',el);$('button',el).addEventListener('click',()=>{n++;setTimeout(()=>{o.textContent=n===1?'1 Bestellung ausgelöst.':`${n} Bestellungen ausgelöst – ${n}-mal abgebucht.`},700)})},
  good(el){let busy=false;const b=$('button',el),l=$('.du-lbl',el),s=$('.du-spin',el),o=$('.du-out',el);
   b.addEventListener('click',()=>{if(busy)return;busy=true;b.setAttribute('aria-disabled','true');l.style.visibility='hidden';s.hidden=false;o.textContent='Wird bestellt …';
     setTimeout(()=>{l.style.visibility='';s.hidden=true;o.textContent='Genau 1 Bestellung ausgelöst.';
       setTimeout(()=>{busy=false;b.removeAttribute('aria-disabled')},1500)},1200)})}},
 why:'Netzwerk dauert. Wer nichts sieht, klickt noch einmal. Den Button sofort in einen Ladezustand setzen und weitere Klicks ignorieren – und im Backend trotzdem mit einem Idempotency Key absichern, denn Nutzer finden immer einen Weg.'},
{id:'loading-width',grp:1,topic:'Speichern-Button',title:'Ladezustand ohne springende Breite',lesson:'loading',
 try:'Klick auf „Speichern“ und schau, wo „Abbrechen“ danach steht.',
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">Speichern</button><button type="button" class="btn btn-secondary">Abbrechen</button></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary du-keep"><span class="du-lbl">Speichern</span><span class="du-spin" hidden></span></button><button type="button" class="btn btn-secondary">Abbrechen</button><span class="sr-only" role="status"></span></div>`,
 init:{bad(el){const [b,c]=$$('button',el);b.addEventListener('click',()=>{b.textContent='Wird gespeichert, bitte warten …';setTimeout(()=>{b.textContent='Speichern'},1600)});
   c.addEventListener('click',()=>toast({msg:'Abgebrochen – deine Änderung ist weg.',type:'error',duration:3000}))},
  good(el){const [b,c]=$$('button',el),l=$('.du-lbl',el),s=$('.du-spin',el),st=$('[role=status]',el);
   b.addEventListener('click',()=>{if(b.getAttribute('aria-busy'))return;b.setAttribute('aria-busy','true');l.style.visibility='hidden';s.hidden=false;st.textContent='Wird gespeichert';
     setTimeout(()=>{b.removeAttribute('aria-busy');l.style.visibility='';s.hidden=true;st.textContent='Gespeichert'},1600)});
   c.addEventListener('click',()=>toast({msg:'Abgebrochen.',duration:2500}))}},
 why:'Ändert sich die Breite, springt alles daneben – und der nächste Klick landet womöglich auf „Abbrechen“. Breite halten, Spinner in den Button, den Status für Screenreader separat ansagen.'},
{id:'icon-hit',grp:1,topic:'Chip entfernen',title:'Kleines Icon, große Klickfläche',lesson:'touch-targets',
 try:'Entferne alle Städte über das ×. Am besten am Handy oder mit dem Touchpad.',
 bad:`<div class="du-chips"></div>`,
 good:`<div class="du-chips"></div>`,
 init:{bad(el){duChips(el,false)},good(el){duChips(el,true)}},
 why:'Das Icon darf klein sein, die Klickfläche nicht. Padding vergrößert das Ziel, ohne die Optik zu ändern. WCAG 2.5.8 verlangt mindestens 24 × 24 px, bequem sind 44.'},
{id:'button-labels',grp:1,topic:'Bestätigungsdialog',title:'Buttons sagen, was passiert',lesson:'buttons',
 try:'Lies nur die Buttons, nicht den Text darüber. Was passiert bei „Abbrechen“?',
 bad:`<div class="du-dlg"><p><b>Möchtest du wirklich abbrechen?</b> Nicht gespeicherte Änderungen gehen verloren.</p><div class="btn-row du-end"><button type="button" class="btn btn-secondary">Abbrechen</button><button type="button" class="btn btn-primary">OK</button></div></div>`,
 good:`<div class="du-dlg"><p><b>Änderungen verwerfen?</b> Drei Felder sind noch nicht gespeichert.</p><div class="btn-row du-end"><button type="button" class="btn btn-secondary">Weiter bearbeiten</button><button type="button" class="btn btn-danger">Verwerfen</button></div></div>`,
 why:'„OK / Abbrechen“ zwingt dazu, die Frage zu lesen – und „Abbrechen“ kann hier beides heißen: den Dialog oder die Bearbeitung. Verben, die das Ergebnis beschreiben, versteht man auch beim Überfliegen.'},

{id:'silent-save',grp:2,topic:'Speichern',title:'Kein Klick ohne Rückmeldung',lesson:'toast',
 try:'Klick in beiden auf „Speichern“. Hat es geklappt?',
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">Speichern</button></div>`,
 good:`<div class="btn-row"><button type="button" class="btn btn-primary">Speichern</button><span class="du-ok" role="status"></span></div>`,
 init:{good(el){const s=$('.du-ok',el);$('button',el).addEventListener('click',()=>{s.innerHTML=`${ic('check')} Gespeichert um ${duTime()}`})}},
 why:'Ohne Rückmeldung weiß niemand, ob es geklappt hat – also wird noch einmal geklickt oder die Seite neu geladen. Die Bestätigung gehört dorthin, wo man gerade hinschaut: direkt neben den Button.'},
{id:'confirm-undo',grp:2,topic:'Löschen',title:'Rückgängig schlägt Nachfrage',lesson:'toast',
 try:'Lösch in beiden drei Einträge hintereinander.',
 bad:`<ul class="du-rows"></ul>`,
 good:`<ul class="du-rows"></ul>`,
 init:{bad(el){duList(el,['Einkaufsliste','Urlaubsfotos','Steuer 2025','Alte Notizen'],true)},good(el){duList(el,['Einkaufsliste','Urlaubsfotos','Steuer 2025','Alte Notizen'],false)}},
 why:'Wer zehnmal „Wirklich?“ gefragt wird, klickt irgendwann blind auf „Ja“ – die Nachfrage schützt dann nicht mehr. Sofort löschen und ein paar Sekunden „Rückgängig“ anbieten ist schneller und sicherer. Nachfragen nur, wenn es wirklich endgültig ist.'},
{id:'error-place',grp:2,topic:'Formularfehler',title:'Fehler dort zeigen, wo sie sind',lesson:'forms',
 try:'Schick beide Formulare leer ab.',
 bad:`<form class="du-stack" novalidate><p class="du-banner" hidden>Das Formular enthält Fehler.</p><div class="field"><label for="{p}-a">Vorname</label><input class="input" id="{p}-a"></div><div class="field"><label for="{p}-b">Telefon</label><input class="input" id="{p}-b"></div><div><button class="btn btn-primary">Absenden</button></div></form>`,
 good:`<form class="du-stack" novalidate><div class="field"><label for="{p}-a">Vorname</label><input class="input" id="{p}-a" aria-describedby="{p}-ae" autocomplete="given-name"><p class="err" id="{p}-ae" hidden></p></div><div class="field"><label for="{p}-b">Telefon</label><input class="input" id="{p}-b" aria-describedby="{p}-be" type="tel" autocomplete="tel"><p class="err" id="{p}-be" hidden></p></div><div><button class="btn btn-primary">Absenden</button></div></form>`,
 init:{bad(el){const f=$('form',el);f.addEventListener('submit',e=>{e.preventDefault();$('.du-banner',el).hidden=$$('input',el).every(i=>i.value.trim())})},
  good(el){const f=$('form',el),msg=['Bitte deinen Vornamen eingeben.','Bitte eine Telefonnummer eingeben, etwa 0664 123 45 67.'];
   f.addEventListener('submit',e=>{e.preventDefault();let first=null;
     $$('input',el).forEach((i,k)=>{const er=$('#'+i.getAttribute('aria-describedby'),el),bad=!i.value.trim();er.hidden=!bad;er.innerHTML=bad?ic('alert')+msg[k]:'';
       if(bad){i.setAttribute('aria-invalid','true');first??=i}else i.removeAttribute('aria-invalid')});
     if(first)first.focus();else toast({msg:'Abgeschickt.',type:'success',duration:2500})})}},
 why:'Ein Banner oben sagt nur „irgendwo ist was falsch“ – suchen muss man selbst, und mit Screenreader findet man es kaum. Die Meldung gehört ans Feld, mit <code>aria-invalid</code> verknüpft, und der Fokus springt zum ersten Fehler.'},
{id:'hover-only',grp:2,topic:'Zeilen-Aktionen',title:'Aktionen nicht nur beim Hover zeigen',lesson:'gestures',
 try:'Wie löschst du eine Zeile? Probier es dann nur mit Tab – oder am Handy.',
 bad:`<ul class="du-rows du-hov-bad"><li><span>Rechnung März</span><button type="button" class="icon-btn" aria-label="Rechnung März löschen">${ic('trash')}</button></li><li><span>Rechnung April</span><button type="button" class="icon-btn" aria-label="Rechnung April löschen">${ic('trash')}</button></li></ul>`,
 good:`<ul class="du-rows du-hov-good"><li><span>Rechnung März</span><button type="button" class="icon-btn" aria-label="Rechnung März löschen">${ic('trash')}</button></li><li><span>Rechnung April</span><button type="button" class="icon-btn" aria-label="Rechnung April löschen">${ic('trash')}</button></li></ul>`,
 init:{bad(el){el.addEventListener('click',e=>{if(e.target.closest('button'))toast({msg:'Gelöscht (Demo).',duration:2000})})},good(el){el.addEventListener('click',e=>{if(e.target.closest('button'))toast({msg:'Gelöscht (Demo).',duration:2000})})}},
 why:'Touch kennt kein Hover, die Tastatur auch nicht. Was nur beim Drüberfahren erscheint, gibt es für viele gar nicht – links fokussierst du mit Tab einen unsichtbaren Button. Mindestens <code>:focus-within</code> mitnehmen und bei <code>@media (hover: none)</code> immer zeigen.'},
{id:'destructive',grp:2,topic:'Speichern & Löschen',title:'Löschen gehört nicht direkt neben Speichern',lesson:'buttons',
 try:'Klick schnell den zweiten Button, ohne genau hinzusehen.',
 bad:`<div class="btn-row"><button type="button" class="btn btn-primary">Speichern</button><button type="button" class="btn btn-primary">Löschen</button></div>`,
 good:`<div class="du-split"><button type="button" class="btn btn-ghost du-danger">Projekt löschen …</button><button type="button" class="btn btn-primary">Speichern</button></div>`,
 init:{bad(el){const [s,d]=$$('button',el);s.addEventListener('click',()=>toast({msg:'Gespeichert.',type:'success',duration:2000}));d.addEventListener('click',()=>toast({msg:'Projekt gelöscht. Ups.',type:'error',duration:3000}))},
  good(el){const [d,s]=$$('button',el);s.addEventListener('click',()=>toast({msg:'Gespeichert.',type:'success',duration:2000}));d.addEventListener('click',()=>toast({msg:'Hier käme jetzt eine Bestätigung – Löschen ist endgültig.',duration:3000}))}},
 why:'Gleich aussehende Buttons nebeneinander werden verwechselt, besonders unter Zeitdruck. Die gefährliche Aktion bekommt eine andere Optik, Abstand und – wenn sie endgültig ist – eine Bestätigung. Die Auslassungspunkte im Text kündigen an, dass noch ein Schritt folgt.'},
{id:'layout-shift',grp:2,topic:'Nachladender Inhalt',title:'Inhalt springt nicht unter dem Finger weg',lesson:'performance',
 try:'Klick auf „Artikel lesen“, sobald du ihn siehst. Mit „Nochmal“ startet es neu.',
 bad:`<div class="du-feed"><div class="du-slot"></div><p class="du-lead">Neue Studie: Warum wir Buttons verfehlen.</p><button type="button" class="btn btn-secondary du-read">Artikel lesen</button></div><button type="button" class="linkbtn du-replay">Nochmal</button>`,
 good:`<div class="du-feed"><div class="du-slot du-slot-fix"><span class="hint">Anzeige wird geladen …</span></div><p class="du-lead">Neue Studie: Warum wir Buttons verfehlen.</p><button type="button" class="btn btn-secondary du-read">Artikel lesen</button></div><button type="button" class="linkbtn du-replay">Nochmal</button>`,
 init:{bad(el){duShift(el)},good(el){duShift(el)}},
 why:'Lädt etwas über dem Inhalt nach, rutscht alles nach unten – der Klick trifft, was jetzt dort liegt. Das misst Google als Cumulative Layout Shift. Lösung: den Platz vorher reservieren, mit fester Höhe oder <code>aspect-ratio</code>.'},

{id:'line-length',grp:3,topic:'Fließtext',title:'Zeilenlänge: 45 bis 75 Zeichen',lesson:'typography',wide:true,
 try:'Lies beide Absätze. Bei welchem findest du leichter in die nächste Zeile?',
 bad:`<p class="du-long">Das Auge springt am Zeilenende zurück an den Anfang der nächsten Zeile. Ist die Zeile zu lang, verfehlt es sie und liest dieselbe Zeile noch einmal oder überspringt eine. Ist sie zu kurz, zerhackt sie den Satz und das Auge springt ständig. Seit dem Buchdruck gelten deshalb 45 bis 75 Zeichen pro Zeile als angenehm.</p>`,
 good:`<p class="du-measure">Das Auge springt am Zeilenende zurück an den Anfang der nächsten Zeile. Ist die Zeile zu lang, verfehlt es sie und liest dieselbe Zeile noch einmal oder überspringt eine. Ist sie zu kurz, zerhackt sie den Satz und das Auge springt ständig. Seit dem Buchdruck gelten deshalb 45 bis 75 Zeichen pro Zeile als angenehm.</p>`,
 why:'Im Web begrenzt <code>max-width: 65ch</code> die Zeile auf rund 65 Zeichen der aktuellen Schrift – egal wie breit der Bildschirm ist. Dazu eine Zeilenhöhe von etwa 1,5.'},
{id:'centered',grp:3,topic:'Textausrichtung',title:'Lange Texte nicht zentrieren',lesson:'typography',
 try:'Lies beide Absätze bis zum Ende.',
 bad:`<p class="du-center">Zentrierter Fließtext hat links und rechts einen unruhigen Rand. Das Auge findet den Anfang der nächsten Zeile nicht an derselben Stelle wieder, sondern muss ihn jedes Mal neu suchen.</p>`,
 good:`<p>Linksbündiger Text hat eine feste Kante, an der jede Zeile beginnt. Das Auge springt immer an dieselbe Stelle zurück. Zentrieren ist für eine kurze Überschrift in Ordnung, für Absätze nicht.</p>`,
 why:'Leserichtung braucht einen festen Startpunkt. Bei zentriertem Text beginnt jede Zeile woanders, das bremst ab der zweiten Zeile spürbar – bei Legasthenie noch mehr.'},
{id:'text-image',grp:3,topic:'Text auf Bild',title:'Text auf einem Bild braucht einen Schleier',lesson:'contrast',
 try:'Kannst du Titel und Uhrzeit in beiden sofort lesen?',
 bad:`<div class="du-img"><div class="du-img-txt"><b>Wanderung am Dachstein</b><span>Samstag, 9 Uhr</span></div></div>`,
 good:`<div class="du-img du-scrim"><div class="du-img-txt"><b>Wanderung am Dachstein</b><span>Samstag, 9 Uhr</span></div></div>`,
 why:'Ein Foto hat helle und dunkle Stellen – weißer Text ist irgendwo immer unlesbar, und der Kontrast ändert sich mit jedem Bild. Ein dunkler Verlauf hinter dem Text macht ihn unabhängig vom Motiv lesbar.'},

  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">Gut &amp; Schlecht</p>
  <h1 id="lesson-title" tabindex="-1">Quiz: Was ist besser?</h1>
  <p class="rule">Zehn zufällige Paare, ohne Etikett und in zufälliger Reihenfolge. Probier beide Varianten aus und entscheide dann. Nach jeder Antwort kommt die Begründung.</p>

</article>`;
}
function duQuizInit(root){
  const box=$('#du-quiz',root),live=$('#du-live',root);
  let round,i,score,missed;
  const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  function start(){round=shuffle(DUELS).slice(0,10).map(d=>({d,goodFirst:Math.random()<.5}));i=0;score=0;missed=[];ask(false)}
  function ask(focus){
    const {d,goodFirst}=round[i];
    const panes=goodFirst?[true,false]:[false,true];
    box.innerHTML=`<div class="du-qhead"><h2 id="du-q" tabindex="-1">Frage ${i+1} von ${round.length}: ${d.topic}</h2><span class="du-score">${score} richtig</span></div>
    <div class="bar du-qbar" data-anno="Progress Bar" role="progressbar" aria-label="Fortschritt im Quiz" aria-valuemin="0" aria-valuemax="${round.length}" aria-valuenow="${i}" style="--p:${i/round.length*100}%"><span></span></div>
    <p class="du-try">${ic('keyboard')}<span><b>Probier:</b> ${d.try}</span></p>
    <div class="du-pair${d.wide?' du-wide':''}">${panes.map((g,k)=>duPane(d,g,`Variante ${'AB'[k]}`,`du-q${i}-${k}`)).join('')}</div>
    <div class="btn-row du-answer" data-anno="Buttons (Antwort)"><button type="button" class="btn btn-secondary" data-pick="0">A ist besser</button><button type="button" class="btn btn-secondary" data-pick="1">B ist besser</button></div>
    <div id="du-result"></div>`;
    duInit(d,box);
    if(focus)$('#du-q',box).focus();
  }
  function answer(k){
    const {d,goodFirst}=round[i],right=(k===0)===goodFirst;
    if(right)score++;else missed.push(d);
    $$('[data-pick]',box).forEach(b=>b.disabled=true);
    $$('.du-pane',box).forEach((p,n)=>{const g=(n===0)===goodFirst;p.classList.add(g?'du-good':'du-bad');$('.du-cap',p).innerHTML=`${ic(g?'ok':'xc')}Variante ${'AB'[n]} · ${g?'Gut':'Schlecht'}`});
    const last=i===round.length-1;
    $('#du-result',box).innerHTML=`<div class="du-result ${right?'du-right':'du-wrong'}" data-anno="Feedback-Box"><h3 id="du-r" tabindex="-1">${ic(right?'ok':'xc')}${right?'Richtig!':`Leider nein – Variante ${goodFirst?'A':'B'} ist besser.`}</h3><p><b>${d.title}.</b> ${d.why}</p><div class="btn-row"><button type="button" class="btn btn-primary" id="du-next">${last?'Auswertung':'Nächstes Paar'} ${ic('fwd')}</button><a href="#details/${d.id}">In der Galerie ansehen</a></div></div>`;
    live.textContent=right?'Richtig.':'Leider falsch.';
    $('#du-r',box).focus();
  }
  function finish(){
    const best=Math.max(score,store.get('duell-best',0));store.set('duell-best',best);
    box.innerHTML=`<div class="du-end-card" data-anno="Card (Auswertung)"><h2 id="du-q" tabindex="-1">${score} von ${round.length} richtig</h2><p>${score===round.length?'Alles richtig – dir entgeht kein Detail.':score>=7?'Stark. Die paar Ausreißer unten lohnen einen zweiten Blick.':'Die Paare unten lohnen einen zweiten Blick – in der Galerie siehst du beide Varianten mit Etikett.'} Dein Bestwert: ${best} von ${round.length}.</p>
    ${missed.length?`<h3>Nochmal ansehen</h3><ul>${missed.map(d=>`<li><a href="#details/${d.id}">${d.title}</a></li>`).join('')}</ul>`:''}
    <div class="btn-row"><button type="button" class="btn btn-primary" id="du-again">Neue Runde</button><a class="btn btn-secondary" href="#details">Zur Galerie</a></div></div>`;
    $('#du-q',box).focus();
  }
  box.addEventListener('click',e=>{
    const p=e.target.closest('[data-pick]');if(p){answer(+p.dataset.pick);return}
    if(e.target.closest('#du-next')){i++;if(i<round.length)ask(true);else finish();return}
    if(e.target.closest('#du-again'))start(),$('#du-q',box).focus();
  });
  start();
}

  <h2>Die Kapitel</h2>
  <ul class="chapters">${CATS.map(c=>`<li><a href="#${firstOf(c).id}">${c}<span>${LESSONS.filter(l=>l.cat===c).length} Lektionen</span></a></li>`).join('')}</ul>
  <p style="margin-top:28px"><a class="btn btn-primary" href="#${LESSONS[0].id}">Mit Lektion 1 starten ${ic('fwd')}</a></p>
</article>`;
}
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">Diese Seite gibt es nicht</h1>
  <p style="margin:0;max-width:60ch">Unter <code>#${esc(id)}</code> ist keine Lektion. Vielleicht wurde sie umbenannt, oder der Link hat einen Tippfehler.</p>
  <p class="hint" style="max-width:60ch">Das hier ist eine hilfreiche 404: Sie sagt, was passiert ist, und bietet zwei Auswege. Mit „Zurück“ im Browser kommst du dorthin, wo du warst.</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">Zur Startseite</a><button type="button" class="btn btn-secondary" id="nf-search">Lektion suchen</button></div>
  </div></article>`;
}

function updateTitle(){
  const b=BRANDS[document.documentElement.dataset.brand||'fjord'];
  const k=VIEWS[currentId];
  if(k){document.title=`${k.docTitle?.(kSub)||k.title} · ${b.app}`;return}
  const l=BY_ID[currentId]||(currentId==='start'?START:null);
  document.title=l?`${l.title} · ${b.app}`:`Nicht gefunden · ${b.app}`;
}

let lastLessonId=null,masterScroll=0,kSub='';
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  // Kompass-Adressen: #wcag-bauteile/modal, #wcag-kriterien/2.4.7, #wcag-kriterien?stufe=AA
  const [path,qs='']=id.split('?'),[base,sub='']=path.split(/\/(.*)/);
  shell.dataset.view=overview?'master':'detail';
  let entry,focusEl=null;
  if(overview||id==='start'){currentId='start';view.innerHTML=startHTML();entry=START}
  else if(BY_ID[id]){
    currentId=id;entry=BY_ID[id];view.innerHTML=lessonHTML(entry);
    const c=entry.init?.(view);if(typeof c==='function')cleanup=c;
    $$('.bad-show',view).forEach(el=>BAD[id]?.[+el.dataset.bad]?.init?.(el));
  }
  else if(VIEWS[base]){
    currentId=base;kSub=sub;entry=VIEWS[base];view.innerHTML=entry.render(sub);
    const c=entry.init?.(view,sub,new URLSearchParams(qs));if(typeof c==='function')cleanup=c;
    focusEl=entry.focus?.(view,sub)||null;
  }
  else{currentId=null;view.innerHTML=notFoundHTML(id)}
  markActive(currentId);updateTitle();
  if(entry&&(!VISITED.length||VISITED[VISITED.length-1].id!==entry.id))VISITED.push({id:entry.id,title:entry.title});
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastLessonId&&$(`.item[data-id="${lastLessonId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    detail.scrollTop=0;
    if(focusEl)focusEl.focus();else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&currentId)lastLessonId=currentId;
}
window.addEventListener('hashchange',()=>route(true));

/* ---------- Global events ---------- */
document.addEventListener('click',e=>{
  const sw=e.target.closest('[role="switch"]');
  if(sw){const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',String(on));sw.dispatchEvent(new CustomEvent('toggle',{detail:on,bubbles:true}))}
  if(e.target.closest('#st-anno'))setAnno(true);
  if(e.target.closest('#nf-search'))focusSearch();
});
view.addEventListener('change',e=>{
  if(e.target.id!=='learned-cb'||!BY_ID[currentId])return;
  const l=BY_ID[currentId];
  if(e.target.checked)learned.add(l.id);else learned.delete(l.id);
  store.set('learned',[...learned]);renderList();updateProgress();
  toast(e.target.checked?{msg:`„${l.title}“ als gelernt markiert – ${learned.size} von ${LESSONS.length}.`,type:'success',duration:3500}:{msg:'Markierung entfernt.',duration:3000});
});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
$('#brand-select').addEventListener('change',e=>applyBrand(e.target.value,true));
const annoSwitch=$('#anno-switch');
function setAnno(on){document.body.classList.toggle('anno',on);annoSwitch.setAttribute('aria-checked',String(on));store.set('anno',on)}
annoSwitch.addEventListener('toggle',e=>{setAnno(e.detail);toast({msg:e.detail?'Bauteile werden beschriftet.':'Beschriftung ausgeblendet.',duration:2500})});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
const typing=el=>el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!typing(e.target)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!document.querySelector('dialog[open]')){e.preventDefault();focusSearch()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&activeUndo&&!typing(e.target)){e.preventDefault();activeUndo.run()}
});

/* ---------- Boot ---------- */
document.documentElement.lang='de';
applyBrand(store.get('brand','fjord'),false);
if(themeMode!=='auto')applyTheme(themeMode);
setAnno(!!store.get('anno',false));
updateProgress();
renderList();
route(false);
})();
</script>
</body>
</html>
